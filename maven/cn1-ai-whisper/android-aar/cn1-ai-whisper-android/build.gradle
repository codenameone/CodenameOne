plugins {
    id 'com.android.library'
}

def whisperCppDir = project.findProperty('whisperCppDir') ?: System.getenv('WHISPER_CPP_DIR')
def whisperPrebuiltDir = project.findProperty('whisperPrebuiltDir') ?: System.getenv('WHISPER_PREBUILT_DIR')
def whisperIncludeDir = project.findProperty('whisperIncludeDir') ?: System.getenv('WHISPER_INCLUDE_DIR')

android {
    namespace 'com.codename1.ai.whisper.android'
    compileSdk 33
    // NDK r28 is the first release that links shared libraries with 16 KB
    // aligned PT_LOAD segments by default, which Google Play requires of every
    // 64-bit native library (API 35+ uploads since 2025-11-01, Wear OS from
    // 2026-09-15). The requirement covers libc++_shared.so and libomp.so too,
    // and those are NDK *prebuilts* -- no linker flag applied to this project
    // can realign them, so moving the NDK forward is the only fix rather than
    // one option among several. scripts/check-16k-page-alignment.py gates the
    // staged AAR.
    ndkVersion '28.2.13676358'

    defaultConfig {
        // 21 is what the native code has always actually required: the NDK's
        // own floor has been API 21 since r26 (meta/platforms.json "min": 21),
        // so the previous `minSdk 19` was a manifest claim the .so files never
        // honoured -- every shipped slice, 32-bit included, carries API 21 in
        // its .note.android.ident. Declaring it makes the AAR honest instead
        // of letting an API 19 install fail at System.loadLibrary.
        // PlatformFeatureCatalog raises a consuming app's
        // android.min_sdk_version to match, so the manifest merge still
        // succeeds for a default (19) project.
        minSdk 21
        externalNativeBuild {
            cmake {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                arguments '-DANDROID_STL=c++_shared'
                if (whisperCppDir != null && whisperCppDir.trim().length() > 0) {
                    arguments "-DWHISPER_CPP_DIR=${file(whisperCppDir).absolutePath}"
                }
                if (whisperPrebuiltDir != null && whisperPrebuiltDir.trim().length() > 0) {
                    arguments "-DWHISPER_PREBUILT_DIR=${file(whisperPrebuiltDir).absolutePath}"
                }
                if (whisperIncludeDir != null && whisperIncludeDir.trim().length() > 0) {
                    arguments "-DWHISPER_INCLUDE_DIR=${file(whisperIncludeDir).absolutePath}"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            if (whisperPrebuiltDir != null && whisperPrebuiltDir.trim().length() > 0) {
                jniLibs.srcDirs += file(whisperPrebuiltDir)
            }
        }
    }
}
