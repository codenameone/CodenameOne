# Native dependencies for cn1-unity-levelplay (Unity LevelPlay / ironSource),
# applied automatically when this library is on the project classpath.
#
# LevelPlay identifies the app by an app key. It differs per app, so set it in
# your project's codenameone_settings.properties with the standard build hints:
#   codename1.arg.android.xapplication=<meta-data android:name="levelplay.app.key" android:value="YOUR_APP_KEY"/>
#   codename1.arg.ios.plistInject=<key>LevelPlayAppKey</key><string>YOUR_APP_KEY</string>
#
# iOS: Unity LevelPlay (ironSource) SDK, pinned to a major version. Unity ships
# the unified LevelPlay API (LPMInterstitialAd / LPMRewardedAd /
# LPMBannerAdView) from 9.x and removed the singleton ironSource entry points
# this library used to call, so an unpinned pod silently changes which API the
# native sources are compiled against. The check in
# .github/workflows/ad-cn1lib-ios-native-check.yml compiles them against this
# same constraint, and the Android pin below is the same SDK generation.
codename1.arg.ios.pods=IronSourceSDK ~> 9.6
# Android: Unity LevelPlay mediation SDK. Verified by
# scripts/check-cn1lib-android-api.py, which compiles the Android sources
# against exactly this artifact.
codename1.arg.android.gradleDep=implementation 'com.unity3d.ads-mediation:mediation-sdk:9.6.0'
# AndroidGradleBuilder supplies INTERNET for every Android build.
