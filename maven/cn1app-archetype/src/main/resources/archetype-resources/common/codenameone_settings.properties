# Build hints are now declared as annotations on the main class, where the
# compiler checks them -- see the @Ios / @Android / @Desktop / @Build
# annotations on ${mainName}. Setting the same hint here as well is a build
# error, so move a hint rather than copying it.
#
# java.version stays here on purpose: it selects the toolchain that compiles
# the very class the annotations live on, and the project generator resolves it
# before any code is compiled.
