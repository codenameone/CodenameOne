#App Intents sample build hints
# Nothing is required to use this feature: referencing com.codename1.intents is what makes the
# build inject the native plumbing, and an app that declares no intent pays nothing at all.
#
# Declaring an @AppIntent brings in Apple's App Intents framework, which needs a newer iOS than
# the default floor. Uncomment either line below to control what that costs:
#
# Contribute a different floor (empty means contribute none, and let the availability-guarded
# declarations simply be absent on older devices):
#codename1.arg.ios.intents.minDeploymentTarget=16.0
#
# Keep Spotlight indexing and shortcut donation while suppressing App Intents generation
# entirely, so the deployment target is untouched:
#codename1.arg.ios.intents.appIntents=false
