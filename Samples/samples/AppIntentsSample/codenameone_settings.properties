#App Intents sample build hints
# Nothing is required to use this feature: referencing com.codename1.intents is what makes the
# build inject the native plumbing, and an app that declares no intent pays nothing at all.
#
# Declaring an @AppIntent does not raise your deployment target either. The generated Swift is
# availability-fenced and Xcode emits its App Intents metadata for a lower target anyway, so the
# intents ship and are simply not offered on devices too old to run them. Uncomment to contribute
# a floor regardless, if you would rather not ship a build whose intents are inert for part of
# your audience:
#codename1.arg.ios.intents.minDeploymentTarget=16.0
#
# Keep Spotlight indexing and shortcut donation while suppressing App Intents generation
# entirely:
#codename1.arg.ios.intents.appIntents=false
