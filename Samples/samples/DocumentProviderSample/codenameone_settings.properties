#Document provider sample build hints
# Declares that this project publishes documents to the system file browser. The build detects the
# reference to com.codename1.documents on its own; the hint is what lets the Certificate Wizard and
# the signing preflight know the CN1Documents extension will be generated.
codename1.arg.ios.documentProvider.enabled=true
# The app and the generated extension share the published tree through an App Group. It defaults to
# "group." followed by the package name; uncomment to override.
#codename1.arg.ios.documentProvider.appGroup=group.com.codename1.samples
# The name the location carries in the file browser; defaults to the app's display name.
#codename1.arg.ios.documentProvider.displayName=Sample Notes
