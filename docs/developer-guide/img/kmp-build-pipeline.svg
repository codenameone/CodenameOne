<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker></defs>
  <text x="440.0" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">What the build does with Kotlin Multiplatform sources</text>
  <text x="440.0" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">kotlinc compiles commonMain for the JVM with the Compose compiler plugin, exactly as an Android build would.</text>
  <text x="440.0" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">The classes, the unmodified Compose runtime and kotlinx.coroutines are then translated like any other Codename One code.</text>
  <text x="30" y="92" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#333333">Your module</text>
  <rect x="30" y="102" width="190" height="46" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="125.0" y="121.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">commonMain</text>
  <text x="125.0" y="136.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">shared Kotlin, @Composable UI</text>
  <rect x="30" y="158" width="190" height="46" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="125.0" y="177.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">jvmMain / desktopMain</text>
  <text x="125.0" y="192.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">minus the file that opens a window</text>
  <rect x="30" y="214" width="190" height="46" rx="4" fill="#f6f6f6" stroke="#666666" stroke-width="1.5"/>
  <text x="125.0" y="233.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#666666">common/src/main/java</text>
  <text x="125.0" y="248.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">generated main class</text>
  <text x="30" y="290" font-family="Arial, sans-serif" font-size="9.5" text-anchor="start" fill="#333333">cn1:import-kmp-project copies the</text>
  <text x="30" y="304" font-family="Arial, sans-serif" font-size="9.5" text-anchor="start" fill="#333333">first two into common/src/main/kmp</text>
  <text x="260" y="92" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#333333">Compile</text>
  <rect x="260" y="130" width="200" height="70" rx="4" fill="#f2f8f3" stroke="#3c8a4e" stroke-width="1.5"/>
  <text x="360.0" y="154.0" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#3c8a4e">kotlinc + Compose plugin</text>
  <text x="360.0" y="169.0" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">JVM target 11</text>
  <text x="360.0" y="184.0" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">against compose-compat</text>
  <line x1="220" y1="125" x2="258" y2="165" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="220" y1="181" x2="258" y2="165" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="220" y1="237" x2="258" y2="165" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="500" y="92" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#333333">Classes that ship</text>
  <rect x="500" y="102" width="170" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="585.0" y="126.0" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">your classes</text>
  <rect x="500" y="150" width="170" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="585.0" y="166.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Compose runtime</text>
  <text x="585.0" y="181.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">unmodified jar</text>
  <rect x="500" y="198" width="170" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="585.0" y="214.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">kotlinx.coroutines</text>
  <text x="585.0" y="229.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">unmodified jar</text>
  <rect x="500" y="246" width="170" height="40" rx="4" fill="#fbf4ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="585.0" y="262.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#b5651d">compose-compat</text>
  <text x="585.0" y="277.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">the UI layer, ours</text>
  <line x1="460" y1="165" x2="498" y2="122" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="460" y1="165" x2="498" y2="170" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="260" y="246" width="200" height="40" rx="4" fill="#f6f6f6" stroke="#666666" stroke-width="1.5"/>
  <text x="360.0" y="262.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#666666">bytecode-compliance</text>
  <text x="360.0" y="277.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">unsupported API = build error</text>
  <line x1="585" y1="286" x2="585" y2="318" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="360" y1="200" x2="360" y2="244" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="460" y1="280" x2="520" y2="318" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="710" y="92" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#333333">Targets</text>
  <rect x="400" y="320" width="370" height="46" rx="4" fill="#f2f8f3" stroke="#3c8a4e" stroke-width="1.5"/>
  <text x="585.0" y="347.0" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#3c8a4e">ParparVM: bytecode to C, Xcode / native toolchain</text>
  <rect x="400" y="400" width="85" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="442.5" y="424.0" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">iOS</text>
  <line x1="585" y1="366" x2="442" y2="398" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="495" y="400" width="85" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="537.5" y="424.0" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">watchOS / tvOS</text>
  <line x1="585" y1="366" x2="537" y2="398" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="590" y="400" width="85" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="632.5" y="416.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Windows / Linux</text>
  <text x="632.5" y="431.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">no JVM</text>
  <line x1="585" y1="366" x2="632" y2="398" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="685" y="400" width="85" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="727.5" y="424.0" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">macOS</text>
  <line x1="585" y1="366" x2="727" y2="398" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="700" y="102" width="150" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="775.0" y="118.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Android</text>
  <text x="775.0" y="133.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">classes run on ART</text>
  <line x1="670" y1="122" x2="698" y2="122" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="700" y="158" width="150" height="40" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="775.0" y="174.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Simulator / desktop</text>
  <text x="775.0" y="189.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">classes run on the JVM</text>
  <line x1="670" y1="170" x2="698" y2="176" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="330" width="330" height="110" rx="4" fill="#f6f6f6" stroke="#666666" stroke-width="1.5"/>
  <text x="195.0" y="359.0" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#666666">One Compose source, one app</text>
  <text x="195.0" y="374.0" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">Gradle or Maven, the same plugin goals</text>
  <text x="195.0" y="389.0" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">Dispatchers.Main is the EDT</text>
  <text x="195.0" y="404.0" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">no Skia, no Kotlin/Native runtime</text>
  <text x="195.0" y="419.0" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">native theme, native text input</text>
</svg>
