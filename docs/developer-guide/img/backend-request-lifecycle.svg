<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker></defs>
  <text x="440" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">The life of one request</text>
  <text x="440" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">Handlers are asked in a fixed order and the first one that answers wins. The wrapper around them</text>
  <text x="440" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">is where metrics, the session cookie and request-scoped beans are taken care of.</text>
  <rect x="24" y="84" width="150" height="56" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="99" y="101" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Connection</text>
  <text x="99" y="116" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">its own virtual thread,</text>
  <text x="99" y="131" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">or a pool worker</text>
  <line x1="174" y1="112" x2="210" y2="112" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="214" y="84" width="150" height="56" rx="4" fill="#f7f7f9" stroke="#888888" stroke-width="1.5"/>
  <text x="289" y="101" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#888888">Upgrade?</text>
  <text x="289" y="116" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">WebSocket routes are</text>
  <text x="289" y="131" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">matched before the chain</text>
  <line x1="364" y1="112" x2="400" y2="112" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="404" y="74" width="452" height="320" rx="4" fill="#fffdfa" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="418" y="94" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a56a3a">Request wrapper</text>
  <text x="418" y="110" font-family="Arial, sans-serif" font-size="9.5" fill="#444444">start the clock; note the current request</text>
  <rect x="430" y="122" width="250" height="36" rx="4" fill="#f7f7f9" stroke="#888888" stroke-width="1.5"/>
  <text x="442" y="137" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888888">1  MCP endpoint</text>
  <text x="442" y="151" font-family="Arial, sans-serif" font-size="9.5" fill="#444444">/mcp, when enabled</text>
  <line x1="555" y1="158" x2="555" y2="166" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="144" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">null: next</text>
  <rect x="430" y="166" width="250" height="36" rx="4" fill="#f7f7f9" stroke="#888888" stroke-width="1.5"/>
  <text x="442" y="181" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888888">2  Trace relay</text>
  <text x="442" y="195" font-family="Arial, sans-serif" font-size="9.5" fill="#444444">/otel/v1/traces, when enabled</text>
  <line x1="555" y1="202" x2="555" y2="210" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="188" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">null: next</text>
  <rect x="430" y="210" width="250" height="36" rx="4" fill="#f7f7f9" stroke="#888888" stroke-width="1.5"/>
  <text x="442" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888888">3  Management</text>
  <text x="442" y="239" font-family="Arial, sans-serif" font-size="9.5" fill="#444444">/manage/..., when enabled</text>
  <line x1="555" y1="246" x2="555" y2="254" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="232" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">null: next</text>
  <rect x="430" y="254" width="250" height="36" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="442" y="269" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4a6fa5">4  Your routes</text>
  <text x="442" y="283" font-family="Arial, sans-serif" font-size="9.5" fill="#444444">generated routers, handler() ones</text>
  <line x1="555" y1="290" x2="555" y2="298" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="276" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">null: next</text>
  <rect x="430" y="298" width="250" height="36" rx="4" fill="#f7f7f9" stroke="#888888" stroke-width="1.5"/>
  <text x="442" y="313" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888888">5  Static files</text>
  <text x="442" y="327" font-family="Arial, sans-serif" font-size="9.5" fill="#444444">cn1.static.root, always last</text>
  <text x="690" y="320" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">null: 404</text>
  <text x="418" y="358" font-family="Arial, sans-serif" font-size="9.5" fill="#444444">then: record duration, route and status; save the session and</text>
  <text x="418" y="372" font-family="Arial, sans-serif" font-size="9.5" fill="#444444">add its cookie; destroy the request-scoped beans</text>
  <text x="418" y="386" font-family="Arial, sans-serif" font-size="9.5" fill="#a33a3a">a handler that throws is answered 500 and logged</text>
  <line x1="630" y1="394" x2="630" y2="420" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="520" y="420" width="220" height="34" rx="4" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="630" y="441" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">Response</text>
  <rect x="24" y="170" width="340" height="220" rx="4" fill="#f7f7f9" stroke="#cccccc" stroke-width="1"/>
  <text x="38" y="192" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#222222">What a route does with the request:</text>
  <text x="38" y="209" font-family="Arial, sans-serif" font-size="10" fill="#222222"></text>
  <text x="38" y="226" font-family="Arial, sans-serif" font-size="10" fill="#222222">the router compares path bytes, so no</text>
  <text x="38" y="243" font-family="Arial, sans-serif" font-size="10" fill="#222222">String is built for the target;</text>
  <text x="38" y="260" font-family="Arial, sans-serif" font-size="10" fill="#222222">path, query, header and body values are</text>
  <text x="38" y="277" font-family="Arial, sans-serif" font-size="10" fill="#222222">bound and converted; a missing required</text>
  <text x="38" y="294" font-family="Arial, sans-serif" font-size="10" fill="#222222">one is answered 400 before your method runs;</text>
  <text x="38" y="311" font-family="Arial, sans-serif" font-size="10" fill="#222222">the return value becomes text, JSON or</text>
  <text x="38" y="328" font-family="Arial, sans-serif" font-size="10" fill="#222222">your own Response; null is a 404;</text>
  <text x="38" y="345" font-family="Arial, sans-serif" font-size="10" fill="#222222">void is 204 unless @ResponseStatus says</text>
  <text x="38" y="362" font-family="Arial, sans-serif" font-size="10" fill="#222222">otherwise.</text>
</svg>
