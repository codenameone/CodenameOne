<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker></defs>
  <text x="440" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">What the build does with a backend module</text>
  <text x="440" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">The annotations are read from the compiled classes after javac runs, and everything they ask for</text>
  <text x="440" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">is written out as plain code before the translator sees the module. Nothing is decided at run time.</text>
  <text x="30" y="88" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#333333">Your sources</text>
  <rect x="30" y="98" width="190" height="42" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="125" y="115.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">@RestController</text>
  <text x="125" y="130.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">controllers</text>
  <rect x="30" y="150" width="190" height="42" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="125" y="167.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">@Service  @Component</text>
  <text x="125" y="182.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">beans</text>
  <rect x="30" y="202" width="190" height="42" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="125" y="219.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">@Configuration + @Bean</text>
  <text x="125" y="234.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">factory methods</text>
  <rect x="30" y="254" width="190" height="42" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="125" y="271.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">@Transactional  @Async</text>
  <text x="125" y="286.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">aspects</text>
  <rect x="30" y="306" width="190" height="42" rx="4" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="125" y="323.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">@Scheduled  @McpTool</text>
  <text x="125" y="338.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">jobs and tools</text>
  <line x1="220" y1="225" x2="262" y2="225" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="266" y="190" width="80" height="70" rx="4" fill="#f7f7f9" stroke="#888888" stroke-width="1.5"/>
  <text x="306" y="221.5" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#888888">javac</text>
  <text x="306" y="236.5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#444444">bytecode</text>
  <line x1="346" y1="225" x2="388" y2="225" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="392" y="88" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#333333">process-classes</text>
  <rect x="392" y="98" width="210" height="78" rx="4" fill="#fbf6f1" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="497" y="118.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">Resolve the bean graph</text>
  <text x="497" y="133.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">constructors, injection points,</text>
  <text x="497" y="148.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">scopes and conditions: a missing</text>
  <text x="497" y="163.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">or ambiguous bean fails here</text>
  <rect x="392" y="186" width="210" height="78" rx="4" fill="#fbf6f1" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="497" y="206.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">Rewrite annotated methods</text>
  <text x="497" y="221.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">the body moves to name$cn1body;</text>
  <text x="497" y="236.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">the method keeps its name and</text>
  <text x="497" y="251.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">calls the aspect around it</text>
  <rect x="392" y="274" width="210" height="78" rx="4" fill="#fbf6f1" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="497" y="294.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">Compile routes and schedules</text>
  <text x="497" y="309.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">each route becomes byte[] tests;</text>
  <text x="497" y="324.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">each literal cron becomes six</text>
  <text x="497" y="339.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">bit masks, checked here</text>
  <line x1="602" y1="225" x2="644" y2="225" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="648" y="88" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#333333">Generated beside your classes</text>
  <rect x="648" y="98" width="210" height="42" rx="4" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="753" y="115.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">BackendApplication</text>
  <text x="753" y="130.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">the main</text>
  <rect x="648" y="150" width="210" height="42" rx="4" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="753" y="167.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">BackendWiring</text>
  <text x="753" y="182.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">every new, in dependency order</text>
  <rect x="648" y="202" width="210" height="42" rx="4" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="753" y="219.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">&lt;Controller&gt;Router</text>
  <text x="753" y="234.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">one per controller</text>
  <rect x="648" y="254" width="210" height="42" rx="4" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="753" y="271.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">&lt;Class&gt;Cn1Aspects</text>
  <text x="753" y="286.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">begin/commit, submit, timing</text>
  <rect x="648" y="306" width="210" height="42" rx="4" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="753" y="323.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">&lt;Bean&gt;Cn1Scoped, Cn1Lazy</text>
  <text x="753" y="338.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">stand-ins for scoped beans</text>
  <line x1="753" y1="360" x2="753" y2="392" stroke="#555555" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="560" y="396" width="298" height="40" rx="4" fill="#f7f7f9" stroke="#888888" stroke-width="1.5"/>
  <text x="709" y="412.5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#888888">ParparVM, then clang</text>
  <text x="709" y="427.5" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#444444">or the JVM, for cn1:backend</text>
  <rect x="16" y="450" width="848" height="36" rx="4" fill="#f7f7f9" stroke="#cccccc" stroke-width="1"/>
  <text x="440" y="469" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">A failed injection, a cron typo and a route clash are build errors that name the class and member.</text>
</svg>
