<svg xmlns="http://www.w3.org/2000/svg" width="740" height="534" viewBox="0 0 740 534">
  <rect x="0" y="0" width="740" height="534" fill="#ffffff"/>
  <text x="370" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">The life of a BackgroundWork, and why the worker never remembers anything</text>
  <text x="370" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">You schedule a class name and some input data, never an object, and the scheduler constructs a fresh worker for</text>
  <text x="370" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">every single run. Nothing you set on a field survives to reach it. That is the thing to know before writing one.</text>
  <rect x="56" y="66" width="668" height="68" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <circle cx="34" cy="100" r="13" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="34" y="104" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">1</text>
  <text x="68" y="85" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#4a6fa5">You schedule</text>
  <text x="268" y="85" font-family="Arial, sans-serif" font-size="9" fill="#777777">WorkRequest.builder(id, Worker.class)</text>
  <text x="68" y="105" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">The request records the worker's class name, the input data and the constraints. On iOS the identifier</text>
  <text x="68" y="120" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">has to be declared at build time with ios.usesBackgroundProcessing or ios.backgroundProcessingIds.</text>
  <path d="M 34 134 L 34 143" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 29 137 L 34 143 L 39 137" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="56" y="143" width="668" height="68" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <circle cx="34" cy="177" r="13" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="34" y="181" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">2</text>
  <text x="68" y="162" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#4a6fa5">The system waits</text>
  <text x="268" y="162" font-family="Arial, sans-serif" font-size="9" fill="#777777">your process may be killed</text>
  <text x="68" y="182" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">On a device the request outlives the app and the process may be gone entirely. In the simulator the queue</text>
  <text x="68" y="197" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">is a Timer inside this process, so it survives nothing: that stage is the one you cannot rehearse there.</text>
  <path d="M 34 211 L 34 220" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 29 214 L 34 220 L 39 214" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="56" y="220" width="668" height="68" rx="4" fill="#ffffff" stroke="#a33a3a" stroke-width="1.5"/>
  <circle cx="34" cy="254" r="13" fill="#ffffff" stroke="#a33a3a" stroke-width="1.5"/>
  <text x="34" y="258" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a33a3a">3</text>
  <text x="68" y="239" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a33a3a">A fresh worker is built</text>
  <text x="268" y="239" font-family="Arial, sans-serif" font-size="9" fill="#777777">Class.forName(name).newInstance()</text>
  <text x="68" y="259" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Every run constructs a new instance through the public no-argument constructor, cold launch or not. Its</text>
  <text x="68" y="274" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">fields are always at their defaults, so what the work needs has to arrive in the input data.</text>
  <path d="M 34 288 L 34 297" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 29 291 L 34 297 L 39 291" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="56" y="297" width="668" height="68" rx="4" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <circle cx="34" cy="331" r="13" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="34" y="335" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">4</text>
  <text x="68" y="316" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#4a7a3d">run executes</text>
  <text x="268" y="316" font-family="Arial, sans-serif" font-size="9" fill="#777777">with a time budget</text>
  <text x="68" y="336" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Re-check the conditions you actually care about at the top, because the constraints you asked for are</text>
  <text x="68" y="351" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">not all honoured everywhere: requiresIdle does nothing on iOS.</text>
  <path d="M 34 365 L 34 374" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 29 368 L 34 374 L 39 368" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="56" y="374" width="668" height="68" rx="4" fill="#ffffff" stroke="#a56a3a" stroke-width="1.5"/>
  <circle cx="34" cy="408" r="13" fill="#ffffff" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="34" y="412" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">5</text>
  <text x="68" y="393" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a56a3a">You report a result</text>
  <text x="268" y="393" font-family="Arial, sans-serif" font-size="9" fill="#777777">Android reads it, iOS does not</text>
  <text x="68" y="413" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">On Android the completion value decides whether the work is retried. On iOS it is ignored, which is</text>
  <text x="68" y="428" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">why the periodic story below diverges.</text>
  <rect x="16" y="456" width="708" height="62" rx="4" fill="#fbf6f6" stroke="#a33a3a" stroke-width="1.5"/>
  <text x="30" y="476" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a33a3a">A periodic request on iOS is an approximation, and a loose one</text>
  <text x="30" y="494" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">When a run finishes the port resubmits the task one minute out with the network and power requirements cleared, so it can</text>
  <text x="30" y="509" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">recur far more often than the period you asked for and outside the constraints you set. Read it as "sometime after the app is backgrounded."</text>
</svg>
