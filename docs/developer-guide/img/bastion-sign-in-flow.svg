<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c8d5a"/></marker></defs>
  <rect x="0" y="0" width="880" height="600" fill="#ffffff"/>
  <text xml:space="preserve" x="440" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Signing in: password, code, PKCE -- or a passkey</text>
  <text xml:space="preserve" x="440" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">The app never sees a token it did not ask for with its own code_verifier. Each access token's amr claim says how the</text>
  <text xml:space="preserve" x="440" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">sign-in was made, and the server reads it when the device registers its signing key.</text>
  <rect x="60" y="74" width="180" height="40" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text xml:space="preserve" x="150" y="92" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">App</text>
  <text xml:space="preserve" x="150" y="108" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">net/Session.java</text>
  <line x1="150" y1="114" x2="150" y2="585" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="5,4"/>
  <rect x="610" y="74" width="180" height="40" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text xml:space="preserve" x="700" y="92" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Server</text>
  <text xml:space="preserve" x="700" y="108" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">SecurityConfig.java</text>
  <line x1="700" y1="114" x2="700" y2="585" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="154" y1="146" x2="696" y2="146" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="140" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">1. POST /login  e-mail + password</text>
  <text xml:space="preserve" x="425" y="159" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">SignInGuard counts failures per account</text>
  <line x1="696" y1="190" x2="154" y2="190" stroke="#333333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="184" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">2. 302  /login/mfa</text>
  <text xml:space="preserve" x="425" y="203" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">the account has an authenticator app</text>
  <line x1="154" y1="234" x2="696" y2="234" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="228" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">3. POST /login/mfa  six-digit code</text>
  <text xml:space="preserve" x="425" y="247" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">TOTP, or one recovery code</text>
  <line x1="154" y1="278" x2="696" y2="278" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="272" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">4. GET /oauth2/authorize  code_challenge (S256)</text>
  <text xml:space="preserve" x="425" y="291" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">verifier is 32 random bytes kept in memory</text>
  <line x1="696" y1="322" x2="154" y2="322" stroke="#333333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="316" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">5. 302  ?code=...  (in a browser: /signin/code)</text>
  <text xml:space="preserve" x="425" y="335" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">single-use authorization code</text>
  <line x1="154" y1="366" x2="696" y2="366" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="360" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">6. POST /oauth2/token  code + code_verifier</text>
  <text xml:space="preserve" x="425" y="379" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">server hashes the verifier and compares</text>
  <line x1="696" y1="410" x2="154" y2="410" stroke="#333333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="404" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">7. access token (5 min), refresh token (12 h)</text>
  <text xml:space="preserve" x="425" y="423" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">amr: pwd, otp, mfa</text>
  <rect x="40" y="442" width="800" height="128" rx="4" fill="#eef3fa" stroke="#4a6fa5" stroke-dasharray="4,3"/>
  <text xml:space="preserve" x="52" y="458" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#4a6fa5">Or, with a passkey, steps 1-3 become:</text>
  <line x1="154" y1="482" x2="696" y2="482" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="476" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">1' GET /webauthn/authenticate/options</text>
  <text xml:space="preserve" x="425" y="495" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">a challenge for this sign-in</text>
  <line x1="154" y1="522" x2="696" y2="522" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
  <text xml:space="preserve" x="425" y="516" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#333333">2' POST /login/webauthn  signed assertion</text>
  <text xml:space="preserve" x="425" y="535" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">the platform authenticator asks for a face, finger or PIN</text>
  <text xml:space="preserve" x="440" y="558" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#3c8d5a">then steps 4-7 as above, with amr: hwk -- enough to register a device without the password</text>
</svg>
