<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="380" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Four hierarchies, one tree</text>
  <text x="380" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">Each format nests layers its own way. The readers rebuild all of them as one ArtDocument tree, so rendering,</text>
  <text x="380" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">editing and writing never need to know where a document came from.</text>

  <!-- PSD -->
  <rect x="12" y="72" width="176" height="186" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="22" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">Photoshop PSD</text>
  <text x="22" y="108" font-family="Arial, sans-serif" font-size="9.5" fill="#777777">a flat list, stored bottom to top</text>
  <g font-family="Courier New, monospace" font-size="9.5" fill="#333333">
    <text x="22" y="128">layer  "Background"</text>
    <text x="22" y="143">divider  (lsct 3)</text>
    <text x="34" y="158">layer  "Shape"</text>
    <text x="34" y="173">layer  clipping=1</text>
    <text x="34" y="188">adjustment  curv</text>
    <text x="22" y="203">group  "Card"</text>
  </g>
  <text x="22" y="224" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">A divider opens a group and the</text>
  <text x="22" y="237" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">group record closes it; a clipping</text>
  <text x="22" y="250" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">layer is masked by the one below.</text>

  <!-- Sketch -->
  <rect x="198" y="72" width="176" height="186" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="208" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">Sketch</text>
  <text x="208" y="108" font-family="Arial, sans-serif" font-size="9.5" fill="#777777">a ZIP of JSON files</text>
  <g font-family="Courier New, monospace" font-size="9.5" fill="#333333">
    <text x="208" y="128">pages/&lt;id&gt;.json</text>
    <text x="220" y="143">artboard</text>
    <text x="232" y="158">group / shapePath</text>
    <text x="232" y="173">symbolInstance</text>
    <text x="208" y="188">document.json</text>
    <text x="220" y="203">symbolMaster</text>
  </g>
  <text x="208" y="224" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">An instance is expanded from its</text>
  <text x="208" y="237" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">master with overrides applied; a</text>
  <text x="208" y="250" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">clipping mask masks its siblings.</text>

  <!-- Figma -->
  <rect x="384" y="72" width="176" height="186" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="394" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">Figma</text>
  <text x="394" y="108" font-family="Arial, sans-serif" font-size="9.5" fill="#777777">REST API JSON</text>
  <g font-family="Courier New, monospace" font-size="9.5" fill="#333333">
    <text x="394" y="128">DOCUMENT</text>
    <text x="406" y="143">CANVAS</text>
    <text x="418" y="158">FRAME</text>
    <text x="430" y="173">GROUP / VECTOR</text>
    <text x="430" y="188">INSTANCE</text>
    <text x="430" y="203">TEXT</text>
  </g>
  <text x="394" y="224" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">Frames clip and fill; outlines come</text>
  <text x="394" y="237" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">as SVG path strings; an isMask</text>
  <text x="394" y="250" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">node masks the siblings above it.</text>

  <!-- SVG -->
  <rect x="570" y="72" width="178" height="186" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="580" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">SVG</text>
  <text x="580" y="108" font-family="Arial, sans-serif" font-size="9.5" fill="#777777">XML elements and references</text>
  <g font-family="Courier New, monospace" font-size="9.5" fill="#333333">
    <text x="580" y="128">&lt;svg&gt;</text>
    <text x="592" y="143">&lt;defs&gt; gradients, masks</text>
    <text x="592" y="158">&lt;g filter="url(#f)"&gt;</text>
    <text x="604" y="173">&lt;path&gt; &lt;text&gt;</text>
    <text x="604" y="188">&lt;use href="#icon"&gt;</text>
    <text x="592" y="203">&lt;/g&gt;</text>
  </g>
  <text x="580" y="224" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">A use is copied where it stands;</text>
  <text x="580" y="237" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">masks, clips and filters are looked</text>
  <text x="580" y="250" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">up by id and attached to the node.</text>

  <!-- arrows -->
  <path d="M100 260 L330 300" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M286 260 L360 300" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M472 260 L400 300" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M659 260 L430 300" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- the tree -->
  <rect x="12" y="304" width="736" height="244" rx="4" fill="#f5f8fc" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="380" y="324" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a6fa5">ArtDocument</text>
  <text x="380" y="339" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#777777">size, pages, import notes, and one root group; children are drawn first to last</text>

  <g font-family="Arial, sans-serif" font-size="10.5" fill="#222222">
    <rect x="320" y="350" width="120" height="26" rx="3" fill="#ffffff" stroke="#4a6fa5"/>
    <text x="380" y="367" text-anchor="middle">GroupNode (root)</text>
    <path d="M380 376 L380 390 M90 390 L670 390 M90 390 L90 402 M235 390 L235 402 M380 390 L380 402 M525 390 L525 402 M670 390 L670 402" stroke="#4a6fa5" fill="none"/>
    <rect x="30" y="402" width="120" height="40" rx="3" fill="#ffffff" stroke="#4a6fa5"/>
    <text x="90" y="418" text-anchor="middle">GroupNode</text>
    <text x="90" y="433" text-anchor="middle" font-size="9" fill="#777777">frame, pass-through</text>
    <rect x="175" y="402" width="120" height="40" rx="3" fill="#ffffff" stroke="#4a6fa5"/>
    <text x="235" y="418" text-anchor="middle">ShapeNode</text>
    <text x="235" y="433" text-anchor="middle" font-size="9" fill="#777777">path, fills, strokes</text>
    <rect x="320" y="402" width="120" height="40" rx="3" fill="#ffffff" stroke="#4a6fa5"/>
    <text x="380" y="418" text-anchor="middle">TextNode</text>
    <text x="380" y="433" text-anchor="middle" font-size="9" fill="#777777">styled runs</text>
    <rect x="465" y="402" width="120" height="40" rx="3" fill="#ffffff" stroke="#4a6fa5"/>
    <text x="525" y="418" text-anchor="middle">RasterNode</text>
    <text x="525" y="433" text-anchor="middle" font-size="9" fill="#777777">pixels</text>
    <rect x="610" y="402" width="120" height="40" rx="3" fill="#ffffff" stroke="#4a6fa5"/>
    <text x="670" y="418" text-anchor="middle">AdjustmentNode</text>
    <text x="670" y="433" text-anchor="middle" font-size="9" fill="#777777">changes what is below</text>
  </g>

  <rect x="120" y="458" width="520" height="80" rx="3" fill="#ffffff" stroke="#4a6fa5" stroke-dasharray="4 3"/>
  <text x="380" y="476" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">What every node carries</text>
  <text x="380" y="494" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333333">id and name, visibility and lock, a transform relative to its parent, opacity and blend mode,</text>
  <text x="380" y="510" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333333">an optional clip path, an optional mask (itself a node, alpha or luminance),</text>
  <text x="380" y="526" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333333">and a list of effects applied in order. PSD clipping, Sketch and Figma masks all become this mask.</text>
</svg>
