<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <rect x="20" y="20" width="210" height="460" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="125.0" y="40" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Your app</text>
  <rect x="250" y="20" width="260" height="460" rx="6" fill="#ffffff" stroke="#4a7a3d" stroke-width="1"/>
  <text x="380.0" y="40" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">The platform's sign-in surface</text>
  <rect x="530" y="20" width="210" height="460" rx="6" fill="#ffffff" stroke="#a56a3a" stroke-width="1"/>
  <text x="635.0" y="40" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">The identity provider</text>
  <rect x="32" y="62" width="186" height="78" rx="5" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="125.0" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a6fa5">OidcClient.authorize()</text>
  <text x="125.0" y="96" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">discovery document,</text>
  <text x="125.0" y="110" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">PKCE verifier + challenge,</text>
  <text x="125.0" y="124" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">state and nonce</text>
  <rect x="262" y="62" width="236" height="78" rx="5" fill="#f7f9fc" stroke="#4a7a3d" stroke-width="1.2"/>
  <text x="380.0" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a7a3d">SystemBrowser</text>
  <text x="380.0" y="96" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">ASWebAuthenticationSession (iOS),</text>
  <text x="380.0" y="110" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">Custom Tabs (Android),</text>
  <text x="380.0" y="124" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">default browser elsewhere</text>
  <rect x="542" y="62" width="186" height="78" rx="5" fill="#f7f9fc" stroke="#a56a3a" stroke-width="1.2"/>
  <text x="635.0" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#a56a3a">Authorization endpoint</text>
  <text x="635.0" y="96" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">the user signs in here,</text>
  <text x="635.0" y="110" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">with a passkey if the</text>
  <text x="635.0" y="124" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">provider offers one</text>
  <rect x="542" y="196" width="186" height="62" rx="5" fill="#f7f9fc" stroke="#a56a3a" stroke-width="1.2"/>
  <text x="635.0" y="214" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#a56a3a">Redirect</text>
  <text x="635.0" y="230" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">code + state sent to</text>
  <text x="635.0" y="244" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">your redirect URI</text>
  <rect x="262" y="196" width="236" height="62" rx="5" fill="#f7f9fc" stroke="#4a7a3d" stroke-width="1.2"/>
  <text x="380.0" y="214" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a7a3d">Handed back to the app</text>
  <text x="380.0" y="230" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">the custom scheme or HTTPS URL</text>
  <text x="380.0" y="244" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">you registered with the OS</text>
  <rect x="32" y="196" width="186" height="62" rx="5" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="125.0" y="214" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Verify state</text>
  <text x="125.0" y="230" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">a mismatch aborts</text>
  <text x="125.0" y="244" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">before any token call</text>
  <rect x="32" y="300" width="186" height="76" rx="5" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="125.0" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Token exchange</text>
  <text x="125.0" y="334" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">code + PKCE verifier;</text>
  <text x="125.0" y="348" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">a public client sends</text>
  <text x="125.0" y="362" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">no secret</text>
  <rect x="542" y="300" width="186" height="76" rx="5" fill="#f7f9fc" stroke="#a56a3a" stroke-width="1.2"/>
  <text x="635.0" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#a56a3a">Token endpoint</text>
  <text x="635.0" y="334" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">id_token and access_token,</text>
  <text x="635.0" y="348" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">plus refresh_token only if</text>
  <text x="635.0" y="362" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">offline access was asked for</text>
  <rect x="32" y="404" width="186" height="66" rx="5" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="125.0" y="422" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a6fa5">TokenStore</text>
  <text x="125.0" y="438" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">tokens persisted;</text>
  <text x="125.0" y="452" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">refreshIfExpired renews them</text>
  <text x="125.0" y="466" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">when a refresh token came back</text>
  <path d="M 218 100 L 262 100" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M 257 96 L 262 100 L 257 104" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M 498 100 L 542 100" fill="none" stroke="#4a7a3d" stroke-width="1.5"/>
  <path d="M 537 96 L 542 100 L 537 104" fill="none" stroke="#4a7a3d" stroke-width="1.5"/>
  <path d="M 635 140 L 635 196" fill="none" stroke="#a56a3a" stroke-width="1.5"/>
  <path d="M 630 190 L 635 196 L 640 190" fill="none" stroke="#a56a3a" stroke-width="1.5"/>
  <path d="M 542 227 L 498 227" fill="none" stroke="#a56a3a" stroke-width="1.5"/>
  <path d="M 503 223 L 498 227 L 503 231" fill="none" stroke="#a56a3a" stroke-width="1.5"/>
  <path d="M 262 227 L 218 227" fill="none" stroke="#4a7a3d" stroke-width="1.5"/>
  <path d="M 223 223 L 218 227 L 223 231" fill="none" stroke="#4a7a3d" stroke-width="1.5"/>
  <path d="M 125 258 L 125 300" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M 120 294 L 125 300 L 130 294" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M 218 338 L 542 338" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M 537 334 L 542 338 L 537 342" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M 542 360 L 218 360" fill="none" stroke="#a56a3a" stroke-width="1.5"/>
  <path d="M 223 356 L 218 360 L 223 364" fill="none" stroke="#a56a3a" stroke-width="1.5"/>
  <path d="M 125 376 L 125 404" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M 120 398 L 125 404 L 130 398" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="380" y="162" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">the authorization request,</text>
  <text x="380" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">carrying the PKCE challenge</text>
  <text x="380" y="332" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">code + PKCE verifier</text>
  <text x="380" y="378" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">tokens, straight to the app --</text>
  <text x="380" y="391" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">the browser is not in this leg</text>
</svg>
