<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330"
     font-family="Helvetica, Arial, sans-serif" role="img"
     aria-label="Dart widget source is transpiled to Java at build time, compiled with the application, and rendered by the Flutter runtime library on top of Codename One's component model and ports.">
  <title>From Dart widget source to a native Codename One build</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6470"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="330" fill="#ffffff"/>

  <!-- Build time -->
  <rect x="16" y="30" width="420" height="140" rx="8"
        fill="#f4f6f8" stroke="#c9d1d9"/>
  <text x="32" y="52" font-size="13" font-weight="bold" fill="#5b6470">BUILD TIME</text>

  <rect x="36" y="66" width="120" height="78" rx="6" fill="#ffffff" stroke="#9aa4b1"/>
  <text x="96" y="97" font-size="13" text-anchor="middle" fill="#1f2328">Dart widget</text>
  <text x="96" y="115" font-size="13" text-anchor="middle" fill="#1f2328">source</text>
  <text x="96" y="133" font-size="11" text-anchor="middle" fill="#5b6470">src/main/flutter</text>

  <line x1="160" y1="105" x2="196" y2="105" stroke="#5b6470" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="200" y="66" width="130" height="78" rx="6" fill="#ffffff" stroke="#9aa4b1"/>
  <text x="265" y="97" font-size="13" text-anchor="middle" fill="#1f2328">transcode-</text>
  <text x="265" y="115" font-size="13" text-anchor="middle" fill="#1f2328">flutter</text>
  <text x="265" y="133" font-size="11" text-anchor="middle" fill="#5b6470">Maven goal</text>

  <line x1="334" y1="105" x2="370" y2="105" stroke="#5b6470" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="374" y="66" width="120" height="78" rx="6" fill="#ffffff" stroke="#9aa4b1"/>
  <text x="434" y="97" font-size="13" text-anchor="middle" fill="#1f2328">Generated</text>
  <text x="434" y="115" font-size="13" text-anchor="middle" fill="#1f2328">Java</text>
  <text x="434" y="133" font-size="11" text-anchor="middle" fill="#5b6470">target/generated</text>

  <line x1="498" y1="105" x2="534" y2="105" stroke="#5b6470" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="538" y="66" width="130" height="78" rx="6" fill="#ffffff" stroke="#9aa4b1"/>
  <text x="603" y="97" font-size="13" text-anchor="middle" fill="#1f2328">javac</text>
  <text x="603" y="115" font-size="13" text-anchor="middle" fill="#1f2328">+ app code</text>

  <line x1="672" y1="105" x2="708" y2="105" stroke="#5b6470" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="712" y="66" width="140" height="78" rx="6" fill="#eef4ff" stroke="#7b96c4"/>
  <text x="782" y="97" font-size="13" text-anchor="middle" fill="#1f2328">Native build</text>
  <text x="782" y="115" font-size="11" text-anchor="middle" fill="#5b6470">iOS, Android,</text>
  <text x="782" y="131" font-size="11" text-anchor="middle" fill="#5b6470">desktop, web</text>

  <!-- Run time -->
  <rect x="16" y="196" width="836" height="116" rx="8"
        fill="#f4f6f8" stroke="#c9d1d9"/>
  <text x="32" y="218" font-size="13" font-weight="bold" fill="#5b6470">RUN TIME</text>

  <rect x="36" y="232" width="250" height="62" rx="6" fill="#ffffff" stroke="#9aa4b1"/>
  <text x="161" y="257" font-size="13" text-anchor="middle" fill="#1f2328">Flutter runtime library</text>
  <text x="161" y="275" font-size="11" text-anchor="middle" fill="#5b6470">widgets, elements, layout</text>

  <line x1="290" y1="263" x2="326" y2="263" stroke="#5b6470" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="330" y="232" width="250" height="62" rx="6" fill="#ffffff" stroke="#9aa4b1"/>
  <text x="455" y="257" font-size="13" text-anchor="middle" fill="#1f2328">Codename One components</text>
  <text x="455" y="275" font-size="11" text-anchor="middle" fill="#5b6470">theme, EDT, accessibility</text>

  <line x1="584" y1="263" x2="620" y2="263" stroke="#5b6470" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="624" y="232" width="228" height="62" rx="6" fill="#ffffff" stroke="#9aa4b1"/>
  <text x="738" y="257" font-size="13" text-anchor="middle" fill="#1f2328">Port rendering pipeline</text>
  <text x="738" y="275" font-size="11" text-anchor="middle" fill="#5b6470">no engine, no platform view</text>
</svg>
