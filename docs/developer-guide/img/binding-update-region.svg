<svg xmlns="http://www.w3.org/2000/svg" width="900" height="398" viewBox="0 0 900 398">
  <rect x="0" y="0" width="900" height="398" fill="#ffffff"/>
  <text x="450" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">What stops a two-way binding looping, and what that guard costs</text>
  <text x="450" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">Both directions are live at once, so each one's effect is the other's trigger. The mechanism that breaks the cycle is</text>
  <text x="450" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">also the reason a setter that writes a second bound field does not reach the screen.</text>
  <rect x="56" y="74" width="300" height="96" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="206" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a6fa5">The model</text>
  <text x="206" y="122" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">your setter runs, and its</text>
  <text x="206" y="137" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">instrumented exit calls</text>
  <text x="206" y="152" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">Binders.notifyChanged(this)</text>
  <rect x="544" y="74" width="300" height="96" rx="4" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="694" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a7a3d">The component</text>
  <text x="694" y="122" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">the user types, and the</text>
  <text x="694" y="137" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">generated listener calls</text>
  <text x="694" y="152" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">your setter</text>
  <path d="M 364 104 L 536 104" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 531 100 L 536 104 L 531 108" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="450" y="98" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888888">push</text>
  <path d="M 536 142 L 364 142" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 369 138 L 364 142 L 369 146" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="450" y="158" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888888">pull</text>
  <rect x="16" y="196" width="868" height="62" rx="4" fill="#f4f8f3" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="30" y="217" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#4a7a3d">The update region is what keeps that from running forever</text>
  <text x="30" y="235" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Every framework-initiated mutation runs inside a region guarded by a thread-local depth counter. While it is positive,</text>
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">notifyChanged does nothing and component listeners short-circuit. bind, refresh and commit each enter one.</text>
  <rect x="16" y="278" width="868" height="104" rx="4" fill="#fbf6f6" stroke="#a33a3a" stroke-width="1.5"/>
  <text x="30" y="300" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a33a3a">And that is why a cross-field setter chain can fail to reach the screen</text>
  <text x="30" y="322" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">It depends on who called. An application calling setFirstName directly is not inside a region, so the nested</text>
  <text x="30" y="337" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">setFullName notifies at depth zero and its component refreshes normally. Reached from the component listener or</text>
  <text x="30" y="352" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">from commit(), the same chain runs inside a region already open, and the second field's notification is suppressed.</text>
  <text x="30" y="367" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">For that case call binding.refresh() after the chain, or move the second write out of the call frame with callSerially.</text>
</svg>
