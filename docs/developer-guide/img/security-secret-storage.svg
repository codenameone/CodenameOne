<svg xmlns="http://www.w3.org/2000/svg" width="760" height="546" viewBox="0 0 760 546">
  <rect x="0" y="0" width="760" height="546" fill="#ffffff"/>
  <text x="380" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Where a secret can live, and which attacker each place answers</text>
  <text x="380" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">Read down for what each one defends against, not as a ranking. The first two answer almost no attacker, and the</text>
  <text x="380" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">last two are not competitors at all -- Secrets caches what it fetches into SecureStorage, so they compose.</text>
  <rect x="16" y="64" width="172" height="74" rx="4" fill="#ffffff" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="102" y="92" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">Constant</text>
  <text x="102" y="107" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">obfuscation</text>
  <text x="102" y="126" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#777777">Util's xor helpers</text>
  <text x="204" y="94" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">A constant in the binary, made less greppable. Not encoding and not encryption: it</text>
  <text x="204" y="110" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">slows the decompile-and-search step and nothing else. A debugger reads the value.</text>
  <path d="M 102 138 L 102 148" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 97 142 L 102 148 L 107 142" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="16" y="148" width="172" height="74" rx="4" fill="#ffffff" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="102" y="176" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">Storage and</text>
  <text x="102" y="191" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">Preferences</text>
  <text x="102" y="210" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#777777">plaintext on disk</text>
  <text x="204" y="178" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Preferences is Storage underneath, so both are readable by anyone who can read the</text>
  <text x="204" y="194" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">app's files. Fine for state, wrong for a token.</text>
  <path d="M 102 222 L 102 232" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 97 226 L 102 232 L 107 226" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="16" y="232" width="172" height="74" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="102" y="260" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Encrypted</text>
  <text x="102" y="275" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">Storage</text>
  <text x="102" y="294" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#777777">the bouncy castle cn1lib</text>
  <text x="204" y="262" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Replaces the storage instance so entries are encrypted at rest. The key has to come</text>
  <text x="204" y="278" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">from somewhere, and it cannot come from Storage or Preferences -- they are encrypted too.</text>
  <path d="M 102 306 L 102 316" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 97 310 L 102 316 L 107 310" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="16" y="316" width="172" height="74" rx="4" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="102" y="351" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">SecureStorage</text>
  <text x="102" y="378" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#777777">backed by the platform, not everywhere</text>
  <text x="204" y="346" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Keychain Services on iOS, an AndroidKeyStore key on Android, DPAPI on Windows, the Secret</text>
  <text x="204" y="362" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Service on Linux. A browser has none of it and writes through Storage; below API 23, Base64.</text>
  <path d="M 102 390 L 102 400" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 97 394 L 102 400 L 107 394" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="16" y="400" width="172" height="74" rx="4" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="102" y="435" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">Secrets</text>
  <text x="102" y="462" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#777777">the cloud vault, fetched at runtime</text>
  <text x="204" y="430" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">The value is not in the binary, so it rotates without a new build and the vault chooses what</text>
  <text x="204" y="446" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">is served. The build key that authorises the fetch is in the binary, so this is not anti-extraction.</text>
  <rect x="16" y="486" width="728" height="44" rx="4" fill="#f7f7f9" stroke="#cccccc" stroke-width="1"/>
  <text x="380" y="504" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">A per-user token belongs in SecureStorage wherever the platform backs it; an app-wide key you rotate belongs in Secrets.</text>
  <text x="380" y="519" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">On the simulator and a local build there is no build key, so Secrets.get returns a cached value or null.</text>
</svg>
