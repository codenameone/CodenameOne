  <text x="238.0" y="96" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#333333">any tenant</text>
  <path d="M 238 110 L 238 132" fill="none" stroke="#4a6fa5" stroke-width="1.2"/>
