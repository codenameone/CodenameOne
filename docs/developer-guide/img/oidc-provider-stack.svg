<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380.0" y="26" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222222">Every provider class is a layer over the same two primitives</text>
