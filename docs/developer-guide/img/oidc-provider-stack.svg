  <text x="92.0" y="83" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#333333">system browser,</text>
  <text x="92.0" y="96" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#333333">no native SDK</text>
  <path d="M 92 110 L 92 132" fill="none" stroke="#4a6fa5" stroke-width="1.2"/>
