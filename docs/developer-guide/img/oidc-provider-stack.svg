  <rect x="608" y="46" width="136" height="64" rx="5" fill="#eef3fa" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="676.0" y="66" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">AppleSignIn</text>
  <text x="676.0" y="83" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#333333">native on iOS 13+,</text>
  <text x="676.0" y="96" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#333333">OIDC elsewhere</text>
