  <text x="380" y="238" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">OidcClient</text>
  <text x="380" y="256" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">discovery, PKCE (S256), state and nonce verification, code exchange,</text>
  <text x="380" y="270" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">the refresh-token grant, and persistence through TokenStore</text>
