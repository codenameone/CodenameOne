  <text x="602" y="165" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#a33a3a">FirebaseAuth</text>
  <text x="602" y="181" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#333333">not OpenID Connect: Identity Toolkit REST</text>
  <path d="M 392 172 L 468 172" fill="none" stroke="#a33a3a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M 463 168 L 468 172 L 463 176" fill="none" stroke="#a33a3a" stroke-width="1.4"/>
