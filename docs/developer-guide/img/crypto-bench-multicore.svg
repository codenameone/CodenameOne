<svg xmlns="http://www.w3.org/2000/svg" width="760" height="249" viewBox="0 0 760 249">
  <rect x="0" y="0" width="760" height="249" fill="#ffffff"/>
  <text x="380" y="24" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">A native batch on every core, against one call at a time</text>
  <rect x="190" y="40" width="12" height="12" fill="#2f6fb5"/>
  <text x="208" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333333">CryptoBatch, against the reference library in a loop</text>
  <text x="182" y="78" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#222222">ECDSA verify</text>
  <rect x="190" y="68" width="221.1" height="11" fill="#2f6fb5"/>
  <text x="415.1" y="77" font-family="Arial, sans-serif" font-size="10" fill="#333333">7.46x</text>
  <text x="182" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#222222">ECDSA verify, packed</text>
  <rect x="190" y="95" width="245.4" height="11" fill="#2f6fb5"/>
  <text x="439.4" y="104" font-family="Arial, sans-serif" font-size="10" fill="#333333">8.28x</text>
  <text x="182" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#222222">Ed25519 verify</text>
  <rect x="190" y="122" width="463.0" height="11" fill="#2f6fb5"/>
  <text x="657.0" y="131" font-family="Arial, sans-serif" font-size="10" fill="#333333">15.62x</text>
  <text x="182" y="159" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#222222">SHA-256 Merkle level</text>
  <rect x="190" y="149" width="201.5" height="11" fill="#2f6fb5"/>
  <text x="395.5" y="158" font-family="Arial, sans-serif" font-size="10" fill="#333333">6.80x</text>
  <text x="182" y="186" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#222222">Keccak-256 Merkle level</text>
  <rect x="190" y="176" width="209.3" height="11" fill="#2f6fb5"/>
  <text x="403.3" y="185" font-family="Arial, sans-serif" font-size="10" fill="#333333">7.06x</text>
  <line x1="190" y1="64" x2="190" y2="195" stroke="#888888"/>
  <line x1="219.6" y1="64" x2="219.6" y2="195" stroke="#c4473d" stroke-dasharray="4 3"/>
  <text x="219.6" y="209" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c4473d">parity</text>
  <text x="440" y="227" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555555">times the reference library's throughput</text>
</svg>
