<svg xmlns="http://www.w3.org/2000/svg" width="900" height="426" viewBox="0 0 900 426">
  <rect x="0" y="0" width="900" height="426" fill="#ffffff"/>
  <text x="450" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">One coin definition, many coins: which edit changes which</text>
  <text x="450" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">The distinction that decides what an edit does. An asset is the shared template and a placed element is one instance,</text>
  <text x="450" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">and the properties are copied at the moment you drop it, not shared from then on.</text>
  <rect x="16" y="74" width="258" height="86" rx="4" fill="#ffffff" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="145" y="102" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a56a3a">AssetCatalog</text>
  <text x="145" y="124" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">def(id) and image(id)</text>
  <text x="145" y="142" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#999999">holds the packs, answers by id</text>
  <path d="M 278 117 L 300 117" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 295 113 L 300 117 L 295 121" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="304" y="74" width="258" height="86" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="433" y="102" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a6fa5">AssetPack -&gt; AssetDef</text>
  <text x="433" y="124" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">the template</text>
  <text x="433" y="142" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#999999">exactly one coin definition</text>
  <path d="M 566 117 L 588 117" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 583 113 L 588 117 L 583 121" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="592" y="74" width="258" height="86" rx="4" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="721" y="102" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a7a3d">GameElement</text>
  <text x="721" y="124" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">the instance</text>
  <text x="721" y="142" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#999999">its own position, size, properties</text>
  <text x="577" y="109" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#888888">by id</text>
  <rect x="16" y="186" width="424" height="112" rx="4" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="30" y="208" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#4a7a3d">Changing one placed element</text>
  <text x="30" y="224" font-family="Arial, sans-serif" font-size="9" fill="#888888">affects that one only</text>
  <text x="30" y="244" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Dropping a coin copies the template's defaultProperties()</text>
  <text x="30" y="259" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">into the element's own bag, so tweaking that coin's value</text>
  <text x="30" y="274" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">leaves the template and every other coin alone.</text>
  <rect x="460" y="186" width="424" height="112" rx="4" fill="#ffffff" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="474" y="208" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a56a3a">Changing the asset</text>
  <text x="474" y="224" font-family="Arial, sans-serif" font-size="9" fill="#888888">depends which part you change</text>
  <text x="474" y="244" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Size and artwork are read when an element is realized, so</text>
  <text x="474" y="259" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">editing them redraws every instance, placed ones included.</text>
  <text x="474" y="274" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Defaults are copied at creation only: editing them changes</text>
  <text x="474" y="289" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">future placements and leaves existing elements alone.</text>
  <rect x="16" y="318" width="868" height="92" rx="4" fill="#f7f7f9" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">Art arrives by type. A static image comes from setImage; a sheet asset is built by resolveArt, after which image(id)</text>
  <text x="450" y="355" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">answers its first frame with no setImage involved; a mesh asset is bytes from meshData and never goes through image at all.</text>
  <text x="450" y="370" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">Only an image asset with nothing loaded falls back to a solid-colour placeholder sized from the definition, so a missing</text>
  <text x="450" y="385" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">image is not an error anybody reports -- it is a coloured rectangle.</text>
</svg>
