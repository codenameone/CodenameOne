<svg xmlns="http://www.w3.org/2000/svg" width="770" height="430" viewBox="0 0 770 430">
  <rect x="0" y="0" width="770" height="430" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker></defs>
  <text x="385" y="24" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">How a request is served</text>
  <text x="24" y="56" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">Build</text>
  <rect x="24" y="66" width="124" height="44" rx="5" fill="#f4f8ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="86" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Your Java</text>
  <text x="86" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">handler + runtime</text>
  <line x1="148" y1="88" x2="166" y2="88" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="170" y="66" width="124" height="44" rx="5" fill="#f4f8ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="232" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Bytecode</text>
  <text x="232" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">javac</text>
  <line x1="294" y1="88" x2="312" y2="88" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="316" y="66" width="124" height="44" rx="5" fill="#f4f8ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="378" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">C sources</text>
  <text x="378" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">ParparVM</text>
  <line x1="440" y1="88" x2="458" y2="88" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="462" y="66" width="124" height="44" rx="5" fill="#f4f8ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="524" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Object code</text>
  <text x="524" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">clang -O3</text>
  <line x1="586" y1="88" x2="604" y2="88" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="608" y="66" width="124" height="44" rx="5" fill="#e8f5e9" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="670" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">One binary</text>
  <text x="670" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">no JVM</text>
  <text x="24" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">Runtime</text>
  <rect x="24" y="162" width="120" height="52" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.5"/>
  <text x="84" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Connection</text>
  <text x="84" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">accepted once</text>
  <line x1="148" y1="188" x2="196" y2="188" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="200" y="162" width="150" height="52" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.5"/>
  <text x="275" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Host thread</text>
  <text x="275" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">one per core, epoll</text>
  <line x1="354" y1="188" x2="402" y2="188" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="406" y="162" width="160" height="52" rx="5" fill="#fdf0f6" stroke="#bf3989" stroke-width="1.5"/>
  <text x="486" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Virtual thread</text>
  <text x="486" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">one per connection</text>
  <line x1="570" y1="188" x2="618" y2="188" stroke="#555555" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="622" y="162" width="124" height="52" rx="5" fill="#f4f8ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="684" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Your handler</text>
  <text x="684" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">plain Java</text>
  <path d="M 486 214 C 486 250 260 250 260 218" fill="none" stroke="#bf3989" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="373" y="262" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bf3989">parks on I/O; the host resumes it when the socket is ready</text>
  <text x="24" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">In the binary</text>
  <rect x="24" y="312" width="150" height="40" rx="5" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
  <text x="99" y="336" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">HTTP/1.1 + HTTP/2</text>
  <rect x="186" y="312" width="70" height="40" rx="5" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
  <text x="221" y="336" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">TLS</text>
  <rect x="268" y="312" width="210" height="40" rx="5" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
  <text x="373" y="336" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">SQLite / PostgreSQL / MySQL</text>
  <rect x="490" y="312" width="180" height="40" rx="5" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
  <text x="580" y="336" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">JSON, JWT, static files</text>
  <text x="24" y="380" font-family="Arial, sans-serif" font-size="11" fill="#555555">No JVM, no interpreter, no application server. The process is the binary, and the container can hold nothing else.</text>
  <text x="24" y="400" font-family="Arial, sans-serif" font-size="11" fill="#555555">Threads are cheap because a parked virtual thread is a stack and a register set, not an OS thread.</text>
</svg>
