<svg xmlns="http://www.w3.org/2000/svg" width="880" height="358" viewBox="0 0 880 358">
  <rect x="0" y="0" width="880" height="358" fill="#ffffff"/>
  <text x="440" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Why an empty health result never means the user said no</text>
  <text x="440" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">HealthKit does not disclose read authorization, and that is a privacy guarantee rather than a gap: an app that could</text>
  <text x="440" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">tell a refusal from an absence could infer that someone is hiding a pregnancy or a prescription.</text>
  <rect x="16" y="74" width="848" height="54" rx="4" fill="#fbf6f6" stroke="#a33a3a" stroke-width="1.5"/>
  <text x="440" y="96" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#a33a3a">You read a type and get nothing back</text>
  <text x="440" y="114" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8a4a4a">denied and no-such-data are the same answer, by design, and no call distinguishes them</text>
  <rect x="16" y="146" width="414" height="118" rx="4" fill="#ffffff" stroke="#a33a3a" stroke-width="1.5"/>
  <text x="30" y="168" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a33a3a">What will not tell you</text>
  <text x="30" y="184" font-family="Arial, sans-serif" font-size="9" fill="#888888">three consequences, all load-bearing</text>
  <text x="30" y="202" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">requestAuthorization resolving true means the user was</text>
  <text x="30" y="216" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">asked, not that anything was granted: the iOS sheet</text>
  <text x="30" y="230" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">completes the same either way. getReadAuthorizationStatus</text>
  <text x="30" y="244" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">answers UNKNOWN on iOS always. There is no</text>
  <text x="30" y="258" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">hasReadPermission, because on iOS it would be a lie.</text>
  <path d="M 223 128 L 223 146" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 218 140 L 223 146 L 228 140" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="450" y="146" width="414" height="118" rx="4" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="464" y="168" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#4a7a3d">What to do instead</text>
  <text x="464" y="184" font-family="Arial, sans-serif" font-size="9" fill="#888888">one honest probe, one honest message</text>
  <text x="464" y="202" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">hasAnyData is the only probe, and its name is exactly what</text>
  <text x="464" y="216" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">it measures -- on iOS your own writes stay readable to you,</text>
  <text x="464" y="230" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">so true does not prove you can see anyone else's.</text>
  <text x="464" y="244" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Say no data available, never you denied access, and offer</text>
  <text x="464" y="258" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">openHealthSettings.</text>
  <path d="M 657 128 L 657 146" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <path d="M 652 140 L 657 146 L 662 140" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
  <rect x="16" y="282" width="848" height="60" rx="4" fill="#f7f7f9" stroke="#cccccc" stroke-width="1"/>
  <text x="440" y="302" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">Android answers the status question, because its read permissions are ordinary runtime grants. The port does not</text>
  <text x="440" y="317" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">pretend the two platforms are the same, and neither should your interface.</text>
  <text x="440" y="334" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">Ask for the narrowest set of types you need, when you need them: one long sheet at first launch is why people decline.</text>
</svg>
