<svg xmlns="http://www.w3.org/2000/svg" width="870" height="420" viewBox="0 0 870 420">
  <rect x="0" y="0" width="870" height="420" fill="#ffffff"/>
  <text x="435" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Keynote on an iPhone simulator: Codename One relative to Compose Multiplatform</text>
  <text x="435" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">The dashed line is Compose Multiplatform (100%); a bar is Codename One as a share of it. Shorter is better on every row.</text>
  <text x="30" y="83" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Executable, stripped</text>
  <rect x="250" y="70" width="246.2" height="16" fill="#b5651d"/>
  <text x="594.0" y="82" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">73%   (16.8 MB vs 22.9 MB)</text>
  <text x="30" y="113" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">App bundle</text>
  <rect x="250" y="100" width="267.6" height="16" fill="#b5651d"/>
  <text x="594.0" y="112" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">80%   (18.3 MB vs 22.9 MB)</text>
  <text x="30" y="143" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Physical footprint</text>
  <rect x="250" y="130" width="343.0" height="16" fill="#b5651d"/>
  <text x="601.0" y="142" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">102%   (49.0 MB vs 48.0 MB)</text>
  <text x="30" y="173" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Cold start</text>
  <rect x="250" y="160" width="277.2" height="16" fill="#b5651d"/>
  <text x="594.0" y="172" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">82%   (905 ms vs 1097 ms)</text>
  <text x="30" y="203" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Warm start, median</text>
  <rect x="250" y="190" width="301.2" height="16" fill="#b5651d"/>
  <text x="594.0" y="202" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">90%   (572 ms vs 638 ms)</text>
  <text x="30" y="233" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Recomposition, median</text>
  <rect x="250" y="220" width="72.9" height="16" fill="#b5651d"/>
  <text x="594.0" y="232" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">22%   (4.2 ms vs 19 ms)</text>
  <text x="30" y="263" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Recomposition, p95</text>
  <rect x="250" y="250" width="74.6" height="16" fill="#b5651d"/>
  <text x="594.0" y="262" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">22%   (5.3 ms vs 24 ms)</text>
  <text x="30" y="293" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Scroll work per frame, median</text>
  <rect x="250" y="280" width="100.3" height="16" fill="#b5651d"/>
  <text x="594.0" y="292" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">30%   (5.1 ms vs 17 ms)</text>
  <text x="30" y="323" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Scroll work per frame, p95</text>
  <rect x="250" y="310" width="115.4" height="16" fill="#b5651d"/>
  <text x="594.0" y="322" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">34%   (6.3 ms vs 18 ms)</text>
  <text x="30" y="353" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Scroll frame interval, median</text>
  <rect x="250" y="340" width="350.1" height="16" fill="#b5651d"/>
  <text x="608.1" y="352" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">104%   (35 ms vs 33 ms)</text>
  <line x1="586.0" y1="62" x2="586.0" y2="362" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="586.0" y="378" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#4a6fa5">Compose Multiplatform = 100%</text>
</svg>
