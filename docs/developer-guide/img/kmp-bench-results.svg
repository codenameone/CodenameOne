  <text x="564.7" y="318" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">29%  (6.8 ms vs 23 ms)</text>
  <rect x="250" y="323" width="75.4" height="13" fill="#2e7d5b"/>
