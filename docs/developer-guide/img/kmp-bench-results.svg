<svg xmlns="http://www.w3.org/2000/svg" width="870" height="492" viewBox="0 0 870 492">
  <rect x="0" y="0" width="870" height="492" fill="#ffffff"/>
  <text x="435" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Keynote on an iPhone simulator, relative to Compose Multiplatform</text>
  <text x="435" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">The dashed line is Compose Multiplatform (100%); each bar is a share of it. Shorter is better on every row.</text>
  <rect x="30" y="56" width="12" height="12" fill="#b5651d"/>
  <text x="48" y="66" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Codename One, same Compose source</text>
  <rect x="309" y="56" width="12" height="12" fill="#2e7d5b"/>
  <text x="327" y="66" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Codename One, the same screens in Java</text>
  <text x="30" y="109" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Executable, stripped</text>
  <rect x="250" y="92" width="224.8" height="13" fill="#b5651d"/>
  <text x="564.7" y="102" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">73%  (16.8 MB vs 22.9 MB)</text>
  <rect x="250" y="107" width="118.9" height="13" fill="#2e7d5b"/>
  <text x="564.7" y="117" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">39%  (8.9 MB vs 22.9 MB)</text>
  <text x="30" y="145" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">App bundle</text>
  <rect x="250" y="128" width="244.2" height="13" fill="#b5651d"/>
  <text x="564.7" y="138" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">80%  (18.3 MB vs 22.9 MB)</text>
  <rect x="250" y="143" width="136.4" height="13" fill="#2e7d5b"/>
  <text x="564.7" y="153" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">44%  (10.2 MB vs 22.9 MB)</text>
  <text x="30" y="181" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Physical footprint</text>
  <rect x="250" y="164" width="300.4" height="13" fill="#b5651d"/>
  <text x="564.7" y="174" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">98%  (48.0 MB vs 49.0 MB)</text>
  <rect x="250" y="179" width="331.7" height="13" fill="#2e7d5b"/>
  <text x="589.7" y="189" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">108%  (53.0 MB vs 49.0 MB)</text>
  <text x="30" y="217" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Cold start</text>
  <rect x="250" y="200" width="231.7" height="13" fill="#b5651d"/>
  <text x="564.7" y="210" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">76%  (794 ms vs 1051 ms)</text>
  <rect x="250" y="215" width="220.0" height="13" fill="#2e7d5b"/>
  <text x="564.7" y="225" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">72%  (754 ms vs 1051 ms)</text>
  <text x="30" y="253" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Warm start, median</text>
  <rect x="250" y="236" width="285.1" height="13" fill="#b5651d"/>
  <text x="564.7" y="246" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">93%  (556 ms vs 598 ms)</text>
  <rect x="250" y="251" width="287.7" height="13" fill="#2e7d5b"/>
  <text x="564.7" y="261" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">94%  (560 ms vs 598 ms)</text>
  <text x="30" y="289" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Recomposition, median</text>
  <rect x="250" y="272" width="80.0" height="13" fill="#b5651d"/>
  <text x="564.7" y="282" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">26%  (5.3 ms vs 20 ms)</text>
