  <text x="440.0" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Keynote on an iPhone 17 Pro simulator: the same commonMain built both ways</text>
  <text x="440.0" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">Release builds, five runs; a start-up bar sits mid-range. Smaller is better. Start-up of an empty UIKit app is 640-750 ms on the</text>
  <text x="440.0" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">same simulator, so start-up is near the floor for both; memory is level; the executable is where the gap is.</text>
