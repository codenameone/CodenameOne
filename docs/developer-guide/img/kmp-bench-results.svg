  <text x="564.7" y="369" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">11%  (1.8 ms vs 17 ms)</text>
  <text x="30" y="397" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Scroll work per frame, p95</text>
  <rect x="250" y="380" width="131.4" height="13" fill="#b5651d"/>
  <text x="564.7" y="390" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">43%  (8.1 ms vs 19 ms)</text>
  <rect x="250" y="395" width="31.7" height="13" fill="#2e7d5b"/>
  <text x="564.7" y="405" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">10%  (1.9 ms vs 19 ms)</text>
  <text x="30" y="433" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#333333">Scroll frame interval, median</text>
  <rect x="250" y="416" width="363.6" height="13" fill="#b5651d"/>
  <text x="621.6" y="426" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">119%  (40 ms vs 33 ms)</text>
  <rect x="250" y="431" width="348.8" height="13" fill="#2e7d5b"/>
  <text x="606.8" y="441" font-family="Arial, sans-serif" font-size="9.5" fill="#333333">114%  (38 ms vs 33 ms)</text>
  <line x1="556.7" y1="86" x2="556.7" y2="446" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="556.7" y="462" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#4a6fa5">Compose Multiplatform = 100%</text>
</svg>
