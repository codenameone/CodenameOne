<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c8d5a"/></marker></defs>
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <text xml:space="preserve" x="440" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">How Bastion is put together</text>
  <text xml:space="preserve" x="440" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">One Maven project: the app in common, the server in backend, and the contracts both compile in shared.</text>
  <rect x="20" y="70" width="360" height="300" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text xml:space="preserve" x="30" y="88" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">common: the app (iOS, Android, desktop, browser)</text>
  <rect x="34" y="98" width="332" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="44" y="114" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">ui/</text>
  <text xml:space="preserve" x="190" y="114" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">every screen, Nav side menu, LockForm</text>
  <rect x="34" y="128" width="332" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="44" y="144" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">net/Guard</text>
  <text xml:space="preserve" x="190" y="144" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">no cleartext, host allow-list, pins</text>
  <rect x="34" y="158" width="332" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="44" y="174" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">net/Session</text>
  <text xml:space="preserve" x="190" y="174" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">password + code, PKCE, passkeys</text>
  <rect x="34" y="188" width="332" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="44" y="204" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">security/Keys</text>
  <text xml:space="preserve" x="190" y="204" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">app key: biometric, PIN vault</text>
  <rect x="34" y="218" width="332" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="44" y="234" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">security/DeviceKey</text>
  <text xml:space="preserve" x="190" y="234" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">P-256 pair, sealed under app key</text>
  <rect x="34" y="248" width="332" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="44" y="264" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">security/RequestSigner</text>
  <text xml:space="preserve" x="190" y="264" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">Bastion-Signature header</text>
  <rect x="34" y="278" width="332" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="44" y="294" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">security/Lock, Protect</text>
  <text xml:space="preserve" x="190" y="294" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">app lock, secure windows</text>
  <rect x="34" y="308" width="332" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="44" y="324" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">security/SecurityStatus</text>
  <text xml:space="preserve" x="190" y="324" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">what the Security Center shows</text>
  <rect x="400" y="150" width="90" height="120" rx="4" fill="#ffffff" stroke="#3c8d5a" stroke-width="1.5"/>
  <text xml:space="preserve" x="445" y="168" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#3c8d5a">shared</text>
  <text xml:space="preserve" x="445" y="184" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">@RestClient</text>
  <text xml:space="preserve" x="445" y="199" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">contracts,</text>
  <text xml:space="preserve" x="445" y="214" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">DTOs,</text>
  <text xml:space="preserve" x="445" y="229" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">SignedRequest</text>
  <rect x="510" y="70" width="350" height="300" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text xml:space="preserve" x="520" y="88" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">backend: the server (JVM or native binary)</text>
  <rect x="524" y="98" width="322" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="534" y="114" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">SecurityConfig</text>
  <text xml:space="preserve" x="680" y="114" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">authorization server, MFA, passkeys</text>
  <rect x="524" y="128" width="322" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="534" y="144" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">account/</text>
  <text xml:space="preserve" x="680" y="144" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">sign-up, lockout, grants, passkeys</text>
  <rect x="524" y="158" width="322" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="534" y="174" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">money/</text>
  <text xml:space="preserve" x="680" y="174" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">transfers, payees, cards, devices</text>
  <rect x="524" y="188" width="322" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="534" y="204" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">money/RequestSigning</text>
  <text xml:space="preserve" x="680" y="204" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">signature, nonce, timestamp</text>
  <rect x="524" y="218" width="322" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="534" y="234" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">exchange/</text>
  <text xml:space="preserve" x="680" y="234" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">order books, matching, allow-list</text>
  <rect x="524" y="248" width="322" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="534" y="264" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">ledger/Ledger</text>
  <text xml:space="preserve" x="680" y="264" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">the only writer of a balance</text>
  <rect x="524" y="278" width="322" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="534" y="294" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">audit/Audit</text>
  <text xml:space="preserve" x="680" y="294" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">hash-chained event log</text>
  <rect x="524" y="308" width="322" height="24" rx="4" fill="#eef3fa" stroke="#c5d2e6" stroke-width="1.5"/>
  <text xml:space="preserve" x="534" y="324" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a6fa5">admin/</text>
  <text xml:space="preserve" x="680" y="324" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#333333">ledger and audit verification</text>
  <line x1="380" y1="210" x2="398" y2="210" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="490" y1="210" x2="508" y2="210" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
  <text xml:space="preserve" x="445" y="296" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888888">HTTPS + JSON</text>
  <text xml:space="preserve" x="445" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888888">bearer token,</text>
  <text xml:space="preserve" x="445" y="324" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888888">signed money calls</text>
  <rect x="560" y="385" width="250" height="34" rx="4" fill="#f6f6f6" stroke="#888888" stroke-width="1.5"/>
  <text xml:space="preserve" x="685" y="403" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">SQLite, PostgreSQL, MySQL or MariaDB</text>
  <line x1="685" y1="370" x2="685" y2="384" stroke="#333333" stroke-width="1.3" marker-end="url(#a)"/>
</svg>
