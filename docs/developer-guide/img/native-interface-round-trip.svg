<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>

  <text x="380" y="26" font-family="Arial, sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#222222">Wrapping a third party native SDK</text>

  <rect x="30" y="50" width="200" height="230" rx="6" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="130" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="#4a6fa5">Portable Java</text>

  <rect x="50" y="88" width="160" height="52" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="130" y="108" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Your public API</text>
  <text x="130" y="126" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">app code calls this</text>

  <rect x="50" y="160" width="160" height="52" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="130" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">NativeInterface</text>
  <text x="130" y="196" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">primitives, String, primitive[]</text>
  <text x="130" y="208" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">and PeerComponent</text>

  <rect x="50" y="228" width="160" height="38" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <text x="130" y="252" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">static callback</text>

  <rect x="530" y="50" width="200" height="230" rx="6" fill="#f7f4fb" stroke="#7a5aa5" stroke-width="1.5"/>
  <text x="630" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="#7a5aa5">Per platform native</text>

  <rect x="550" y="88" width="160" height="52" rx="4" fill="#ffffff" stroke="#7a5aa5" stroke-width="1"/>
  <text x="630" y="108" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Impl class</text>
  <text x="630" y="126" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">Java/Kotlin, Obj-C/Swift</text>

  <rect x="550" y="160" width="160" height="52" rx="4" fill="#ffffff" stroke="#7a5aa5" stroke-width="1"/>
  <text x="630" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">Vendor SDK</text>
  <text x="630" y="198" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">aar / pod / framework</text>

  <line x1="210" y1="186" x2="548" y2="186" stroke="#4a6fa5" stroke-width="1.5"/>
  <polygon points="548,186 538,181 538,191" fill="#4a6fa5"/>
  <text x="379" y="178" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4a6fa5">call, marshalled by the translator</text>

  <line x1="548" y1="247" x2="212" y2="247" stroke="#7a5aa5" stroke-width="1.5"/>
  <polygon points="212,247 222,242 222,252" fill="#7a5aa5"/>
  <text x="380" y="240" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7a5aa5">result, through a static method</text>

  <text x="380" y="306" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">
    An asynchronous SDK cannot return a value, so the native side calls back into a static Java method
  </text>
</svg>
