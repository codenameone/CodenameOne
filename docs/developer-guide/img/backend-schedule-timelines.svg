  <rect x="16" y="346" width="848" height="48" rx="4" fill="#f7f7f9" stroke="#cccccc" stroke-width="1"/>
  <text x="440" y="365" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">A cron job is the same: the next fire time is computed from the schedule, and a fire that finds</text>
  <text x="440" y="380" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">the previous run still going counts as skipped in /manage/jobs and backend_jobs.</text>
