  <text x="440" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">fixedRate, fixedDelay and a run that overruns</text>
  <text x="440" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">Each bar is one run of the same job with a period of 10 seconds. A run never overlaps the previous</text>
  <text x="440" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">run of the same job: a start that finds it still going is skipped, never queued.</text>
