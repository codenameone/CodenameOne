<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452">
  <rect x="0" y="0" width="900" height="452" fill="#ffffff"/>
  <text x="450" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Device integrity: what the device can claim, and what your server can trust</text>
  <text x="450" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">The first two run the same root, jailbreak and Frida probes, on the device. Attestation does not run them at all: it</text>
  <text x="450" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">reports the platform's own signed verdict, which is why it is the only one of the three a server can act on.</text>
  <path d="M 540 72 L 540 408" fill="none" stroke="#a33a3a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="532" y="86" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="end" fill="#a33a3a">the device, which the attacker controls</text>
  <text x="548" y="86" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#4a7a3d">your server</text>
  <rect x="16" y="96" width="490" height="88" rx="4" fill="#ffffff" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="28" y="116" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a56a3a">Launch-time build hints</text>
  <text x="28" y="132" font-family="Arial, sans-serif" font-size="9" fill="#777777">android.rootCheck / android.fridaDetection / ios.detectJailbreak</text>
  <text x="28" y="152" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Exits the app before it starts. Zero code, and no callback the app can act on, so there is no</text>
  <text x="28" y="167" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">degraded mode -- though the guard does log the signals it fired on, and exits non-zero.</text>
  <path d="M 506 140 L 524 140" fill="none" stroke="#c8a0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 518 134 L 530 146 M 518 146 L 530 134" stroke="#a33a3a" stroke-width="1.5" fill="none"/>
  <rect x="16" y="196" width="490" height="88" rx="4" fill="#ffffff" stroke="#a56a3a" stroke-width="1.5"/>
  <text x="28" y="216" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#a56a3a">Runtime report</text>
  <text x="28" y="232" font-family="Arial, sans-serif" font-size="9" fill="#777777">DeviceIntegrity.isDeviceCompromised()</text>
  <text x="28" y="252" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Answers the same question without terminating, so you can warn, degrade, or ask for step-up</text>
  <text x="28" y="267" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">auth. It is still a boolean computed on the device. False in the simulator until you set a signal.</text>
  <path d="M 506 240 L 524 240" fill="none" stroke="#c8a0a0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 518 234 L 530 246 M 518 246 L 530 234" stroke="#a33a3a" stroke-width="1.5" fill="none"/>
  <rect x="16" y="296" width="490" height="88" rx="4" fill="#ffffff" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="28" y="316" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#4a7a3d">Platform attestation</text>
  <text x="28" y="332" font-family="Arial, sans-serif" font-size="9" fill="#777777">DeviceIntegrity.requestIntegrityToken(nonce)</text>
  <text x="28" y="352" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Play Integrity or App Attest reports its own hardware-backed verdict, signed and bound to a fresh</text>
  <text x="28" y="367" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">nonce your server issued. It does not wrap the checks above: what they see need not appear in it.</text>
  <path d="M 506 340 L 562 340" fill="none" stroke="#4a7a3d" stroke-width="1.5"/>
  <path d="M 557 336 L 562 340 L 557 344" fill="none" stroke="#4a7a3d" stroke-width="1.5"/>
  <rect x="562" y="96" width="322" height="188" rx="4" fill="#fbf6f6" stroke="#d8bcbc" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="723" y="130" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a">A compromised device can</text>
  <text x="723" y="145" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a">return whatever these two</text>
  <text x="723" y="160" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a">checks are asked to return,</text>
  <text x="723" y="175" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a">so a server that believes</text>
  <text x="723" y="190" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a">them has gained nothing.</text>
  <text x="723" y="205" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a"></text>
  <text x="723" y="220" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a">Useful for defence in depth</text>
  <text x="723" y="235" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a">and for user experience.</text>
  <text x="723" y="250" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#8a4a4a">Not useful as a gate.</text>
  <rect x="562" y="296" width="322" height="88" rx="4" fill="#f4f8f3" stroke="#4a7a3d" stroke-width="1.5"/>
  <text x="723" y="320" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#3d6633">Your server verifies the token</text>
  <text x="723" y="335" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#3d6633">with Google or Apple, then</text>
  <text x="723" y="350" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#3d6633">decides. This is the only place</text>
  <text x="723" y="365" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#3d6633">the decision belongs.</text>
  <rect x="16" y="418" width="868" height="26" rx="4" fill="#f7f7f9" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="435" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">App Shield is this same API with the verification, policy and key rotation already built.</text>
</svg>
