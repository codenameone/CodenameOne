<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580">
  <rect x="0" y="0" width="880" height="580" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker></defs>
  <text x="440" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">What each propagation does when a transaction is already open</text>
  <text x="440" y="43" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">Outer() is @Transactional and calls inner(). The bars are database connections; time runs left to right.</text>
  <text x="440" y="57" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#333333">A connection is borrowed, and BEGIN sent, only when the method first touches the database.</text>
  <text x="24" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">REQUIRED (default)</text>
  <line x1="24" y1="208" x2="856" y2="208" stroke="#e2e2e2" stroke-width="1"/>
  <text x="24" y="128" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">connection 1</text>
  <rect x="200" y="116" width="640" height="18" rx="2" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.3"/>
  <rect x="400" y="140" width="230" height="16" rx="2" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.3"/>
  <text x="515" y="152" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#4a7a3d">inner(): same connection, no BEGIN</text>
  <text x="206" y="129" font-family="Arial, sans-serif" font-size="9.5" fill="#4a6fa5">BEGIN</text>
  <text x="834" y="129" font-family="Arial, sans-serif" font-size="9.5" text-anchor="end" fill="#4a6fa5">COMMIT</text>
  <text x="24" y="180" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">inner() joins the outer transaction: one connection, one COMMIT.</text>
  <text x="24" y="196" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">If inner() fails and outer() catches it, the transaction is still rollback-only: outer() throws UnexpectedRollback.</text>
  <text x="24" y="248" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">REQUIRES_NEW</text>
  <line x1="24" y1="356" x2="856" y2="356" stroke="#e2e2e2" stroke-width="1"/>
  <text x="24" y="276" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">connection 1</text>
  <rect x="200" y="264" width="190" height="18" rx="2" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.3"/>
  <rect x="390" y="264" width="250" height="18" rx="2" fill="#f7f7f9" stroke="#888888" stroke-width="1.3"/>
  <rect x="640" y="264" width="200" height="18" rx="2" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.3"/>
  <text x="515" y="277" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#888888">suspended</text>
  <text x="24" y="304" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">connection 2</text>
  <rect x="400" y="292" width="230" height="18" rx="2" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.3"/>
  <text x="515" y="305" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#4a7a3d">inner(): BEGIN ... COMMIT</text>
  <text x="206" y="277" font-family="Arial, sans-serif" font-size="9.5" fill="#4a6fa5">BEGIN</text>
  <text x="834" y="277" font-family="Arial, sans-serif" font-size="9.5" text-anchor="end" fill="#4a6fa5">COMMIT</text>
  <text x="24" y="328" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">The outer transaction is suspended, inner() runs on a second connection</text>
  <text x="24" y="344" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">and commits or rolls back on its own. It needs a second connection from the pool.</text>
  <text x="24" y="396" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">NESTED</text>
  <line x1="24" y1="504" x2="856" y2="504" stroke="#e2e2e2" stroke-width="1"/>
  <text x="24" y="424" font-family="Arial, sans-serif" font-size="9.5" fill="#888888">connection 1</text>
  <rect x="200" y="412" width="640" height="18" rx="2" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="1.3"/>
  <rect x="400" y="436" width="230" height="16" rx="2" fill="#f3f8f1" stroke="#4a7a3d" stroke-width="1.3"/>
  <text x="515" y="448" font-family="Arial, sans-serif" font-size="9.5" text-anchor="middle" fill="#4a7a3d">SAVEPOINT cn1_sp_1 ... RELEASE</text>
  <text x="206" y="425" font-family="Arial, sans-serif" font-size="9.5" fill="#4a6fa5">BEGIN</text>
  <text x="834" y="425" font-family="Arial, sans-serif" font-size="9.5" text-anchor="end" fill="#4a6fa5">COMMIT</text>
  <text x="24" y="476" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">inner() runs inside the outer transaction, behind a savepoint. A failure</text>
  <text x="24" y="492" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">rolls back to the savepoint only, and outer() can still commit.</text>
  <rect x="16" y="522" width="848" height="44" rx="4" fill="#f7f7f9" stroke="#cccccc" stroke-width="1"/>
  <text x="440" y="541" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">SUPPORTS joins if one is open. MANDATORY refuses to run without one, NEVER refuses to run inside one,</text>
  <text x="440" y="556" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#222222">and NOT_SUPPORTED suspends the open one for the duration of the call.</text>
</svg>
