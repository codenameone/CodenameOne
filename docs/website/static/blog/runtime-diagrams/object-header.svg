<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Four-byte ParparVM object metadata</title><desc id="desc">A 16-bit class index refers to a shared class table. The mark epoch and heap state each use eight bits. Object fields follow, with alignment and allocator rounding additional.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d9e5ff"/></marker></defs><rect width="1000" height="490" rx="20" fill="#0b142a"/><g font-family="Arial, sans-serif" fill="#eef3ff"><text x="40" y="48" font-size="28" font-weight="bold">Four bytes of metadata per object</text><text x="40" y="80" font-size="19" fill="#b9cbe2">ParparVM release layout</text><rect x="40" y="112" width="400" height="104" rx="8" fill="#56d2d0"/><rect x="445" y="112" width="200" height="104" rx="8" fill="#9cafff"/><rect x="650" y="112" width="200" height="104" rx="8" fill="#f6ae55"/><g fill="#0b142a" text-anchor="middle" font-size="23" font-weight="bold"><text x="240" y="154">Class index</text><text x="545" y="154">Mark epoch</text><text x="750" y="154">Heap state</text></g><g fill="#0b142a" text-anchor="middle" font-size="20"><text x="240" y="188">16 bits · 2 bytes</text><text x="545" y="188">8 bits · 1 byte</text><text x="750" y="188">8 bits · 1 byte</text></g><text x="866" y="152" font-size="19">Then:</text><text x="866" y="179" font-size="19">fields</text><path d="M240,222 V280" stroke="#d9e5ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="292" width="440" height="90" rx="8" fill="#23344f"/><text x="62" y="329" font-size="23">Shared class table</text><text x="62" y="359" font-size="19">Class information stored once per class</text><text x="523" y="312" font-size="21">No class pointer in each object.</text><text x="523" y="346" font-size="19">GC state fits in the remaining two bytes.</text><text x="40" y="428" font-size="20">Fields, alignment, allocator rounding and optional side-table data are additional.</text><text x="40" y="461" font-size="19" fill="#b9cbe2">A four-byte header is not a four-byte object allocation.</text></g></svg>
