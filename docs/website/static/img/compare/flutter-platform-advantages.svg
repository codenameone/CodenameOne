<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">The performance advantage is not uniform across platforms</title><desc id="desc">Startup speedup relative to Flutter: Android 3.60, Windows 1.70, Linux 1.56, macOS 1.24. Idle RAM reduction: Android 42 percent, Windows 37 percent, Linux 63 percent, macOS 31 percent. iOS and web startup and memory are not measured.</desc><metadata>Source: https://github.com/codenameone/CodenameOne/blob/2c2beba40ce177e5e028f0e34961bfbf41c952b8/benchmarks/flutter.json; measured 2026-10-18; Flutter 3.35.4; CN1 d2d7ec3f25.</metadata><rect width="1000" height="500" rx="20" fill="#10182e"/><g font-family="system-ui, sans-serif">
