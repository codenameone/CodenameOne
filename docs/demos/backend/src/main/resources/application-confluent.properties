# Loaded only under the "confluent" profile: a Confluent Cloud broker with SASL.
# tag::backend-kafka-sasl[]
spring.kafka.bootstrap-servers=pkc-xxxxx.eu-west-1.aws.confluent.cloud:9092
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="<api key>" password="<api secret>";
# end::backend-kafka-sasl[]
