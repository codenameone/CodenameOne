# The Backend chapter's configuration example. Read by the guide through its
# tags, and by nothing else: this module compiles snippets, it does not run a
# server.
# tag::backend-config-base[]
cn1.datasource.url=${DATABASE_URL}
cn1.server.port=8080
# end::backend-config-base[]

# tag::backend-scale-out[]
# One Redis for the cache, sessions, rate limits and scheduler locks...
cn1.kv.url=${REDIS_URL}
cn1.session.store=kv
# ...and a broker for messages.
cn1.messaging.url=kafka://kafka-1:9092,kafka-2:9092
# end::backend-scale-out[]
