// Snippets of the Wayline chapters of the developer guide. Edit them here, not inline.

// tag::wayline-properties-deployment[]
cn1.datasource.url=${DATABASE_URL}
cn1.security.authorizationserver.issuer=https://rides.example.com
wayline.admin.email=owner@rides.example.com
wayline.admin.password=${WAYLINE_ADMIN_PASSWORD}
wayline.public.url=https://rides.example.com
// end::wayline-properties-deployment[]

// tag::wayline-properties-fares[]
wayline.currency=EUR
wayline.fare.baseCents=350
wayline.fare.perKmCents=180
wayline.fare.perMinuteCents=40
wayline.fare.minimumCents=700
wayline.fare.serviceFeePercent=0
wayline.fare.commissionPercent=0
// end::wayline-properties-fares[]

// tag::wayline-properties-matching[]
wayline.offer.seconds=30
wayline.search.seconds=300
// end::wayline-properties-matching[]

// tag::wayline-properties-stripe[]
wayline.payments.stripe.secret=${WAYLINE_PAYMENTS_STRIPE_SECRET}
wayline.public.url=https://rides.example.com
// end::wayline-properties-stripe[]

// tag::wayline-properties-geocoder[]
wayline.geocoder=photon
wayline.geocoder.url=https://photon.rides.example.com
// end::wayline-properties-geocoder[]

// tag::wayline-properties-dev-database[]
cn1.datasource.url=./target/app.db
// end::wayline-properties-dev-database[]

// tag::wayline-properties-native-maps[]
codename1.arg.ios.maps.provider=apple
codename1.arg.android.maps.provider=google
// end::wayline-properties-native-maps[]
