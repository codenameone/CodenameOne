// Generated from docs/developer-guide source blocks. Edit the guide snippets here, not inline.

// tag::backend-web-properties-001[]
cn1.cors.allowedOrigins=https://app.example.com
cn1.cors.allowCredentials=true
cn1.cors.exposedHeaders=X-Request-Id
// end::backend-web-properties-001[]

// tag::backend-database-tls-001[]
# PostgreSQL behind a private CA: the chain is verified, the host name is not
cn1.datasource.url=postgres://app:secret@db.internal:5432/app?sslmode=verify-ca&sslrootcert=/etc/ssl/db-ca.pem
# MySQL's own spellings work too: chain and host name both verified
cn1.datasource.url=mysql://app:secret@db.internal/app?ssl-mode=VERIFY_IDENTITY&ssl-ca=/etc/ssl/db-ca.pem
// end::backend-database-tls-001[]
