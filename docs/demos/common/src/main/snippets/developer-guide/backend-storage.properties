# tag::backend-storage-properties-001[]
# Amazon S3: explicit keys, else the standard AWS chain (environment,
# web identity, ECS, EC2 instance role)
cn1.storage.url=s3://eu-west-1

# Cloudflare R2: an R2 API token's S3 keys
cn1.storage.url=r2://${CF_ACCOUNT_ID}
cn1.storage.r2.access-key-id=${R2_KEY_ID}
cn1.storage.r2.secret-access-key=${R2_SECRET}

# Google Cloud Storage: a service account key file
# (GOOGLE_APPLICATION_CREDENTIALS), else the metadata server on GCE,
# Cloud Run and GKE
cn1.storage.url=gs://my-project

# Azure: a connection string or an account key, else the managed identity
cn1.storage.url=azblob://myaccount
cn1.storage.azure.account-key=${AZURE_STORAGE_KEY}
# end::backend-storage-properties-001[]

# tag::backend-storage-properties-002[]
# MinIO
cn1.storage.url=s3://us-east-1
cn1.storage.s3.endpoint=http://localhost:9000

# fake-gcs-server
cn1.storage.url=gs://demo
cn1.storage.gcs.emulator-host=http://localhost:4443

# Azurite
cn1.storage.url=azblob://
cn1.storage.azure.connection-string=UseDevelopmentStorage=true
# end::backend-storage-properties-002[]

