// Generated from docs/developer-guide source blocks. Edit the guide snippets here, not inline.

// tag::backend-security-properties-user[]
cn1.security.user.name=ada
cn1.security.user.password={noop}secret
cn1.security.user.roles=ADMIN,USER
// end::backend-security-properties-user[]

// tag::backend-security-properties-jwt[]
cn1.security.oauth2.resourceserver.jwt.issuer-uri=https://id.example.com
cn1.security.oauth2.resourceserver.jwt.audiences=orders-api
// end::backend-security-properties-jwt[]

// tag::backend-security-properties-proxy[]
cn1.server.forwardHeaders=true
cn1.server.trustedProxies=10.0.0.0/8,192.0.2.10
// end::backend-security-properties-proxy[]

// tag::backend-security-properties-oauth2[]
cn1.security.oauth2.client.registration.google.client-id=your-google-client-id
cn1.security.oauth2.client.registration.google.client-secret=your-google-client-secret

cn1.security.oauth2.client.registration.github.client-id=your-github-client-id
cn1.security.oauth2.client.registration.github.client-secret=your-github-client-secret

cn1.security.oauth2.client.registration.acme.client-id=web
cn1.security.oauth2.client.registration.acme.client-secret=your-acme-client-secret
cn1.security.oauth2.client.registration.acme.scope=openid,profile,email
cn1.security.oauth2.client.registration.acme.provider=acme-id
cn1.security.oauth2.client.provider.acme-id.issuer-uri=https://id.example.com
// end::backend-security-properties-oauth2[]

// tag::backend-security-properties-authserver[]
cn1.security.authorizationserver.issuer=https://id.example.com
cn1.security.authorizationserver.jwk.keys=/etc/acme/signing-new.pem,/etc/acme/signing-old.pem
// end::backend-security-properties-authserver[]

// tag::backend-security-properties-schema[]
cn1.security.schema.enabled=true
// end::backend-security-properties-schema[]

// tag::backend-security-properties-mfa[]
cn1.security.mfa.encryptionKey=replace-with-the-output-of-openssl-rand-base64-32
// end::backend-security-properties-mfa[]
