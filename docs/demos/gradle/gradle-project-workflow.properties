# Property snippets for the Gradle Project Workflow chapter of the developer guide.

# tag::gradle-properties[]
# Gradle caches the configuration of this build, which is what makes the second
# ./gradlew run start in about a second.
org.gradle.configuration-cache=true
org.gradle.caching=true
# end::gradle-properties[]

# tag::gradle-repository-override[]
# Resolve the plugin's framework artifacts from a mirror, or from a local
# directory holding a locally built Codename One, instead of repo.codenameone.com.
codename1.repository=/path/to/maven/repository
# end::gradle-repository-override[]
