# Native fidelity test specification.
#
# Each component below is rendered TWICE on device: once as the real native OS
# widget (UIKit on iOS, Material on Android) and once as the Codename One
# equivalent under the native theme (iOSModernTheme / AndroidMaterialTheme). The
# two renders are diffed to produce a per-(component,state,appearance) fidelity
# score; the goal is to drive every score toward 99-100%.
#
# This file is the trigger for the fidelity CI workflow: editing it re-runs the
# suite. It is parsed on-device by FidelitySpecParser, which understands a flat,
# 2-space-indented subset of YAML (maps + comma-separated scalar lists, "#"
# comments, optional quotes). Do NOT use anchors, flow style, or tabs.
#
# Per-component keys:
#   id              required; stable identifier, used in screenshot names.
#   cn1_uiid        CN1 UIID to apply to the CN1 render (defaults to id).
#   native          iOS native widget key (see NativeWidgetFactoryImpl .m switch).
#   native_android  Android native widget key (see NativeWidgetFactoryImpl.java).
#   native_win      Windows native widget key (WinUI 3; windows-native-ref/Program.cs).
#   native_mac      macOS native widget key (AppKit; macos-native-ref/NativeRef.swift).
#   native_gnome    GNOME native widget key (GTK4 + libadwaita; gnome-native-ref/native-ref.c).
#   text            label text for widgets that show text.
#   backdrop        tile background behind the widget (iOS only): a 6-hex colour
#                   (e.g. 808080) = solid fill; "gradient" = vertical blue->green
#                   ramp; "photo" = the shared glass-backdrop.png. Omit to use the
#                   default: material glass/lens tests default to "photo" (the
#                   Liquid Glass blend needs content behind it), everything else
#                   to none.
#   material        comparison intent: how the host comparator scores this test.
#                   "normal" (default) = whole-tile compare. Also used for the
#                   isolation tiles over a SOLID/gradient backdrop: both sides
#                   render the identical backdrop, so it self-cancels in a
#                   whole-tile compare and masking is unnecessary.
#                   "glass"  = the widget composites over the shared photo
#                   backdrop; the comparator masks the backdrop out and scores
#                   ONLY the widget, so the unchanged backdrop cannot inflate
#                   the score.
#                   "lens"   = selection-lens optics (the modern tab lens).
#                   Scored like "glass"; animation-frame captures are
#                   additionally validated against the motion model.
#                   The comparison mode is chosen from THIS field (test intent),
#                   not from corner/backdrop heuristics; material is resolved
#                   per platform (Android tiles never composite the shared
#                   backdrop, so glass/lens degrade to normal there).
#   states          comma-separated: normal, pressed, disabled, selected.
#   frames          comma-separated animation progress values (0..100). When set,
#                   the component is captured once per value with its animation
#                   FROZEN at exactly that progress (deterministic frames named
#                   "<id>_t<value>_<appearance>_cn1.png") instead of per-state.
#                   Frames have no native golden: they are regression-compared
#                   against committed CN1 frame goldens (goldens/<platform>-frames)
#                   and property-validated against the motion model on the host.
#   platforms       comma-separated allow-list (ios, android, windows, macos, gnome).
#                   Omit = every platform for which the row declares a native key. A row
#                   with no key for a platform never runs there, so the mobile rows below
#                   are excluded from the desktop ones by construction rather than by
#                   listing.
#   tile_width_mm   per-component width override (logical mm), MOBILE.
#   tile_height_mm  per-component height override (logical mm), MOBILE.
#   tile_width_px   per-component width override (logical px), DESKTOP.
#   tile_height_px  per-component height override (logical px), DESKTOP.
#
# Millimetres are right on a phone, where physical size is the design unit and a control
# has to occupy the same amount of thumb on every device. Desktop toolkits are specified
# the other way round -- WinUI in effective pixels at 96dpi, GTK in logical pixels, AppKit
# in points -- so a desktop tile sized in mm describes a control no desktop toolkit would
# ever draw. The two units coexist; each row uses the one for its platform.

defaults:
  tile_width_mm: 60
  tile_height_mm: 14
  tile_width_px: 240
  tile_height_px: 56
  bg: ffffff
  appearances: light,dark

components:
  # "pressed" references are captured as a REAL highlighted/pressed state on a
  # live control in the native-ref apps (isHighlighted / setPressed + ripple
  # hotspot in a real window) -- honest pressed visuals an off-screen
  # rasterizer cannot produce.
  - id: Button
    material: glass
    cn1_uiid: Button
    native: ios_uibutton_system
    native_android: material_button_filled
    text: Default
    states: normal,pressed,disabled

  - id: RaisedButton
    material: glass
    cn1_uiid: RaisedButton
    native: ios_uibutton_filled
    native_android: material_button_tonal
    text: Raised
    states: normal,pressed,disabled

  - id: FlatButton
    material: glass
    cn1_uiid: FlatButton
    native: ios_uibutton_plain
    native_android: material_button_outlined
    text: Flat
    states: normal,pressed

  - id: TextField
    material: normal
    cn1_uiid: TextField
    native: ios_uitextfield
    native_android: material_textinput
    text: Hello
    states: normal,disabled
    # The white grouped-cell field is invisible on a plain white tile; score it
    # over the grey grouped-form background (iOS only) where the cell contrasts.
    backdrop: grouped

  - id: CheckBox
    material: normal
    cn1_uiid: CheckBox
    native: ios_check_glyph
    native_android: material_checkbox
    text: Enabled
    states: normal,selected,disabled

  - id: RadioButton
    material: normal
    cn1_uiid: RadioButton
    native: ios_radio_glyph
    native_android: material_radio
    text: Option
    states: normal,selected,disabled

  - id: Switch
    material: normal
    cn1_uiid: Switch
    native: ios_uiswitch
    native_android: material_switch
    states: normal,selected,disabled

  # SwitchMorph: deterministic animation-frame validation of the liquid-glass
  # switch-thumb droplet (stretch along travel + vertical squash, peaking
  # mid-slide). Each frame renders the slide FROZEN at the given progress via
  # Switch.setMorphTestProgress; validated by MorphFrameValidator + frame
  # goldens, and pinned numerically in SwitchThumbDropletTest.
  - id: SwitchMorph
    material: normal
    cn1_uiid: Switch
    platforms: ios
    frames: 0,25,50,75,100
    states: normal

  - id: Slider
    material: normal
    cn1_uiid: Slider
    native: ios_uislider
    native_android: material_slider
    states: normal,disabled

  - id: ProgressBar
    material: normal
    cn1_uiid: ProgressBar
    native: ios_uiprogress
    native_android: material_progress_linear
    states: normal

  - id: Tabs
    material: glass
    cn1_uiid: Tabs
    native: ios_uitabbar
    native_android: material_tablayout
    tile_height_mm: 16
    states: normal

  - id: Toolbar
    material: glass
    cn1_uiid: Toolbar
    native: ios_uinavbar
    native_android: material_toolbar
    text: Title
    tile_height_mm: 16
    states: normal

  - id: Dialog
    material: normal
    cn1_uiid: Dialog
    native: ios_alert_view
    native_android: material_alert_view
    text: Message
    tile_width_mm: 60
    tile_height_mm: 40
    states: normal

  - id: FloatingActionButton
    material: normal
    cn1_uiid: FloatingActionButton
    native_android: material_fab
    platforms: android
    tile_width_mm: 20
    tile_height_mm: 20
    states: normal,pressed

  - id: Spinner
    material: normal
    cn1_uiid: Spinner
    native: ios_uipickerview
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 34
    states: normal

  # --- Isolation tests (iOS only) ---------------------------------------------
  # GlassPanel: a plain glass rectangle (no text/items) rendered over four
  # different backdrops, so the glass BLEND can be inspected independently of any
  # widget content. CN1 paints a GlassPanel-UIID container; native paints a
  # UIVisualEffectView (iOS 26 Liquid Glass when available).
  - id: GlassPanelGrey
    material: normal
    cn1_uiid: GlassPanel
    native: ios_glass_panel
    backdrop: 808080
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 14
    states: normal

  - id: GlassPanelRed
    material: normal
    cn1_uiid: GlassPanel
    native: ios_glass_panel
    backdrop: ff3b30
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 14
    states: normal

  - id: GlassPanelGrad
    material: normal
    cn1_uiid: GlassPanel
    native: ios_glass_panel
    backdrop: gradient
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 14
    states: normal

  - id: GlassPanelPhoto
    material: glass
    cn1_uiid: GlassPanel
    native: ios_glass_panel
    backdrop: photo
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 14
    states: normal

  # TabsGeom: the same tab bar as Tabs but over a SOLID grey backdrop. The glass
  # blurs a flat colour into a uniform tint, so only the tab GEOMETRY differs --
  # isolating layout fidelity from the glass blend.
  - id: TabsGeom
    material: normal
    cn1_uiid: Tabs
    native: ios_uitabbar
    backdrop: 808080
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 16
    states: normal

  # TabsMorph: deterministic animation-frame validation of the iOS-26 tab
  # selection morph (review point: static start/end screenshots cannot catch a
  # wrong motion path, overshoot, lens size or tint timing). The same tab bar as
  # TabsGeom morphs from tab 0 (Featured) to tab 2 (More); each frame renders
  # the morph FROZEN at the given progress via Tabs.setMorphTestState, so the
  # captures are stable across runs. The flat grey backdrop keeps the travelling
  # lens/tint measurable. Validated by MorphFrameValidator + frame goldens; the
  # same fixed progress points are pinned numerically in TabSelectionMorphTest.
  - id: TabsMorph
    material: lens
    cn1_uiid: Tabs
    backdrop: 808080
    platforms: ios
    golden_sets: ios-26-metal
    frames: 0,10,25,50,75,90,100
    tile_width_mm: 60
    tile_height_mm: 16
    states: normal

  # TabsGlassMotion: the iOS 27 selection motion, which is TIME based and measured
  # from UIKit (com.codename1.ui.TabGlassMotion). Each frame freezes the tab-0 ->
  # last-tab selection at value x 10 ms through Tabs.setGlassMotionTestTime:
  # dense over the lift and travel (0..200 ms), then the arrival squash and the
  # settle, up to 1 s. The motion is not a monotonic sweep -- the whole bar pulses
  # outward and back and the lens overshoots -- so only the distinct-frame and
  # did-it-move checks apply (motion_checks: distinct); the geometry itself is
  # pinned frame by frame against the native capture in TabGlassMotionTest.
  - id: TabsGlassMotion
    material: lens
    cn1_uiid: Tabs
    backdrop: 808080
    platforms: ios
    golden_sets: ios-27-metal
    motion_checks: distinct
    frames: 0,2,3,5,7,8,10,13,17,20,25,30,35,40,50,60,70,100
    tile_width_mm: 60
    tile_height_mm: 16
    states: normal

  # TabOne: the MINIMAL tab bar -- one title over flat grey. UIKit reserves an icon
  # slot even though its item image is nil; CN1 supplies a transparent icon of the
  # same size so the title and bar geometry remain comparable.
  - id: TabOne
    material: normal
    cn1_uiid: Tabs
    native: ios_uitabbar_one
    backdrop: 808080
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 16
    states: normal

  # Ladder rungs: a glass capsule + ONE element, identical authored geometry on
  # both sides over flat grey. GlassText isolates the centred text label; GlassIcon
  # isolates the icon glyph -- each on top of the matched glass capsule.
  - id: GlassText
    material: normal
    cn1_uiid: GlassText
    native: ios_glass_text
    backdrop: 808080
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 14
    states: normal

  - id: GlassIcon
    material: normal
    cn1_uiid: GlassText
    native: ios_glass_icon
    backdrop: 808080
    platforms: ios
    tile_width_mm: 60
    tile_height_mm: 14
    states: normal

  # --- Desktop ---------------------------------------------------------------
  # Windows 11 Fluent (WinUI 3), macOS (AppKit) and GNOME (GTK4 + libadwaita).
  #
  # These rows carry desktop native keys only, so appliesToPlatform excludes them from iOS
  # and Android, and excludes every mobile row above from the desktop platforms, without
  # either side needing a platforms: list.
  #
  # HOVER is the state mobile never had. It is most of what distinguishes a desktop design
  # language, and Codename One had no hover style at all until one was added for this work.
  # FOCUS is listed separately from selected because a desktop control can be focused
  # without being selected, which is the distinction a keyboard user navigates by.
  #
  # Text fields deliberately have no focused state here: a focused field blinks a caret, and
  # a blinking caret cannot be captured deterministically. Suppressing the caret to get a
  # stable frame would make the reference a lie about what a focused field looks like, so
  # the state is left out until it can be captured honestly.

  - id: DesktopButton
    cn1_uiid: Button
    native_win: winui_button
    native_mac: appkit_push_button
    native_gnome: adw_button
    text: Button
    states: normal,hover,pressed,disabled

  - id: DesktopAccentButton
    cn1_uiid: RaisedButton
    native_win: winui_button_accent
    native_mac: appkit_push_button_default
    native_gnome: adw_button_suggested
    text: Button
    states: normal,hover,pressed,disabled

  - id: DesktopTextField
    cn1_uiid: TextField
    native_win: winui_textbox
    native_mac: appkit_textfield
    native_gnome: gtk_entry
    text: Text
    states: normal,hover,disabled

  - id: DesktopCheckBox
    cn1_uiid: CheckBox
    native_win: winui_checkbox
    native_mac: appkit_checkbox
    native_gnome: gtk_check_button
    text: Check
    states: normal,selected,hover,disabled

  - id: DesktopRadioButton
    cn1_uiid: RadioButton
    native_win: winui_radiobutton
    native_mac: appkit_radio
    native_gnome: gtk_radio_button
    text: Radio
    states: normal,selected,hover,disabled

  - id: DesktopSwitch
    cn1_uiid: Switch
    native_win: winui_toggleswitch
    native_mac: appkit_switch
    native_gnome: gtk_switch
    states: normal,selected,hover,disabled

  - id: DesktopSlider
    cn1_uiid: Slider
    native_win: winui_slider
    native_mac: appkit_slider
    native_gnome: gtk_scale
    states: normal,hover,disabled

  - id: DesktopProgressBar
    cn1_uiid: ProgressBar
    native_win: winui_progressbar
    native_mac: appkit_progress
    native_gnome: gtk_progressbar
    states: normal

  - id: DesktopComboBox
    cn1_uiid: ComboBox
    native_win: winui_combobox
    native_mac: appkit_popupbutton
    native_gnome: gtk_dropdown
    text: Option
    states: normal,hover,disabled

  # --- Desktop, second wave -----------------------------------------------------
  # The chrome and the controls the first nine rows did not reach. Same 240x56 tile,
  # deliberately: a per-row tile size would have to be taught to three standalone capture
  # apps that each hard-code one, and nothing here needs a bigger canvas.
  #
  # Three rows carry a platforms: list rather than all three native keys, and the reason is
  # the same one that keeps Aqua vibrancy out of the suite: the reference has to be
  # RENDERABLE into a view. A macOS NSMenu and a GTK or AppKit tooltip are window-server
  # surfaces, invisible to NSView.cacheDisplay and to GtkWidgetPaintable, which are the
  # capture paths these apps use. A blank golden scores 0% forever and reads as a theme bug,
  # so the honest answer is to say where the reference exists and score it there.

  # Two rows, because the three platforms can express different amounts of one control and
  # every boundary below was MEASURED on a capture run rather than guessed.
  #
  # macOS cannot render a scrollbar into a view at all: an NSScroller reports
  # usableParts=allScrollerParts, knobProportion 0.4, isHidden=false and a 17x56 frame, and
  # renders NOTHING through NSView.cacheDisplay. Tried detached and inside a real NSScrollView,
  # in both .legacy and .overlay styles, with AppleShowScrollBars=Always already set by the
  # capture script; the tile comes back holding one colour, the backdrop, every time. Same
  # class of limitation as Aqua vibrancy, and cacheDisplay is the path that needs no Screen
  # Recording consent, which a hosted runner cannot grant.
  #
  # Windows renders the bar but cannot express its highlight: none of PointerOver,
  # UncheckedPointerOver, CheckedPointerOver or MouseOver is a visual state of a WinUI
  # ScrollBar, and neither is Pressed or Dragging. GTK can -- PRELIGHT and ACTIVE are what the
  # CSS pseudo-classes resolve from -- and its captured hover and pressed tiles are genuinely
  # different from normal, so the highlight is scored where the reference can state it.
  - id: DesktopScrollBar
    cn1_uiid: DesktopScrollThumb
    native_win: winui_scrollbar
    native_gnome: gtk_scrollbar
    platforms: windows,gnome
    states: normal

  - id: DesktopScrollBarHighlight
    cn1_uiid: DesktopScrollThumb
    native_gnome: gtk_scrollbar
    platforms: gnome
    states: normal,hover,pressed

  # The DesktopSeparator row below is captured and has goldens, but it is NOT SCORED, and
  # that is a measurement rather than an oversight. (An earlier revision of this file dropped
  # the row outright and this note said so; the row came back so the reference tiles exist to
  # look at, and the rest of the note is why no number comes with them.)
  #
  # A separator is a 1px hairline a few levels off the surface, on all three platforms. The
  # comparator's content mask measures distance from the backdrop, and that contrast does not
  # clear it: the captured tile is 98.2% backdrop and holds exactly TWO colours, with a
  # maximum deviation of 14 (Fluent), 23 (Aqua) and 29 (Adwaita) -- against 36 colours and a
  # deviation of 216 for a Button tile. So the mask comes back empty on both sides, geometry
  # reports {"empty": true}, and shape and size agreement come out at 1.0 because two empty
  # masks agree perfectly. Windows light scored 96.45% with both sub-scores at exactly 1.0.
  #
  # A row that reports a near-perfect number about something the metric never looked at is
  # worse than no row. FidelityGate already refuses to baseline it, which is the suite working
  # as designed. Lowering the content threshold would make it measurable and is not worth
  # doing for one row: that threshold is shared by every row on every platform, and dropping
  # it starts admitting anti-aliasing as content.
  #
  # The Separator component is still themed by all three desktop themes and is asserted by
  # DesktopNativeThemeContentTest; it is the overlay COMPARISON that cannot see it.

  - id: DesktopSeparator
    cn1_uiid: Separator
    # The thinnest row in the suite, and the one most worth measuring: a separator is
    # nothing but a colour and a thickness, so a theme that gets either wrong has no other
    # symptom.
    #
    # It keeps the default 240x56 tile even though a shorter one would put proportionally
    # more of the rule in frame. tile_height_px is documented as a per-component override
    # and the CN1 side honours it, but the three reference apps mirror only the DEFAULTS --
    # TILE_W and TILE_H are constants in each of them -- so a per-component override moves
    # one side of the comparison and not the other. No desktop row has ever used one. The
    # measured proof is this row's own first capture: the yaml asked for 24 and all three
    # references produced 240x56 regardless.
    native_win: winui_separator
    native_mac: appkit_box_separator
    native_gnome: gtk_separator
    states: normal

  - id: DesktopGroupBox
    cn1_uiid: GroupBox
    native_win: winui_groupbox
    native_mac: appkit_box_titled
    native_gnome: gtk_frame
    text: Group
    states: normal

  - id: DesktopStepper
    cn1_uiid: Stepper
    native_win: winui_numberbox
    native_mac: appkit_stepper
    native_gnome: gtk_spin_button
    states: normal,disabled

  - id: DesktopLinkButton
    cn1_uiid: Link
    native_win: winui_hyperlinkbutton
    native_mac: appkit_link_button
    native_gnome: gtk_link_button
    text: Link
    states: normal,hover,disabled

  - id: DesktopSearchField
    cn1_uiid: ToolbarSearch
    native_win: winui_autosuggestbox
    native_mac: appkit_searchfield
    native_gnome: gtk_search_entry
    text: Search
    states: normal,disabled

  - id: DesktopListRow
    cn1_uiid: ListRenderer
    native_win: winui_listviewitem
    native_mac: appkit_tableview_row
    native_gnome: gtk_listbox_row
    text: Row
    # No hover: a WinUI ListViewItem draws through ListViewItemPresenter, which paints its
    # own pointer-over chrome rather than exposing a visual state GoToState can reach --
    # measured, the capture blocked on it. Selected is a real property on all three.
    states: normal,selected

  - id: DesktopTabs
    cn1_uiid: Tabs
    native_win: winui_tabview
    native_mac: appkit_tabview
    native_gnome: gtk_notebook
    states: normal

  - id: DesktopToolbar
    cn1_uiid: Toolbar
    native_win: winui_commandbar
    native_mac: appkit_toolbar
    native_gnome: adw_header_bar
    states: normal

  - id: DesktopDisclosure
    cn1_uiid: AccordionHeader
    native_win: winui_expander
    native_mac: appkit_disclosure
    native_gnome: gtk_expander
    text: Details
    states: normal

  # Windows and GNOME only: AppKit's menu bar is an NSMenu owned by the window server.
  - id: DesktopMenuBar
    cn1_uiid: CommandList
    native_win: winui_menubar
    native_gnome: gtk_popover_menubar
    platforms: windows,gnome
    text: File
    states: normal

  - id: DesktopMenuItem
    cn1_uiid: Command
    native_win: winui_menuflyoutitem
    native_gnome: gtk_popover_menu_item
    platforms: windows,gnome
    text: Open
    states: normal,hover,disabled

  # Windows only: a WinUI ToolTip is an ordinary Control and renders into a view. The GTK
  # and AppKit tooltips are separate windows the capture path cannot see.
  - id: DesktopTooltip
    cn1_uiid: Tooltip
    native_win: winui_tooltip
    platforms: windows
    text: Tooltip
    states: normal
