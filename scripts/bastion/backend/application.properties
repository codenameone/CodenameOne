# The settings this server reads at start-up, and the layer with the lowest
# precedence. A system property of the same name wins over anything here, then
# the environment variable the key maps to (cn1.datasource.url is read from
# CN1_DATASOURCE_URL, and also from DATABASE_URL), then
# application-<profile>.properties, then this file. Choose a profile with
# CN1_PROFILE; `dev` needs nothing else:
#
#     CN1_PROFILE=dev mvn -pl backend -Dcodename1.platform=backend cn1:backend
#
# A real deployment sets, in its environment and never in this file:
#
#     cn1.datasource.url                          the database
#     cn1.security.authorizationserver.issuer     the public https address
#     cn1.security.authorizationserver.jwk.keys   the key tokens are signed with
#     bastion.admin.email, bastion.admin.password the first admin
cn1.datasource.url=${DATABASE_URL}

cn1.server.port=8080

# Creates the tables the accounts, the registered app, the tokens, the
# authenticator apps and the passkeys are kept in. Read by the build, so it has
# to be here and not in a profile's file.
cn1.security.schema.enabled=true
