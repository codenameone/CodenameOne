With\ usage\ statistics\ turned\ on,\ the\ app\ also\ counts\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ and\ reports\ that\ to\ Codename\ One's\ analytics\ service\ under\ a\ made-up\ id\ for\ this\ device.\ Your\ name,\ e-mail,\ phone\ number,\ places\ and\ card\ details\ are\ never\ part\ of\ it,\ and\ turning\ it\ off\ in\ Settings\ stops\ it.=Sind die Nutzungsstatistiken eingeschaltet, z\u00e4hlt die App au\u00dferdem, welche Bildschirme ge\u00f6ffnet und welche Funktionen genutzt werden, und meldet das unter einer f\u00fcr dieses Ger\u00e4t erfundenen Kennung an den Analysedienst von Codename One. Dein Name, deine E-Mail-Adresse, deine Telefonnummer, deine Orte und deine Kartendaten geh\u00f6ren nie dazu, und wenn du sie in den Einstellungen ausschaltest, h\u00f6rt es auf.
