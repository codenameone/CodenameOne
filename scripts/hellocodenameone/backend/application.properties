# The CI test server's settings. Compiled into the server, so the native binary
# runs with nothing beside it; scripts/lib/cn1ss.sh overrides the port and the
# screenshot directory through the environment when it needs to.

# The port every device leg dials: 10.0.2.2:8765 from the Android emulator,
# 127.0.0.1:8765 everywhere else. Loopback only: it is a test fixture.
cn1.server.port=8765
cn1.server.address=127.0.0.1

# Where Cn1ssEndpoint writes the screenshots, relative to the working directory.
cn1ss.out=cn1ss-out

# The browser leg's page is served from another port, so its requests are
# cross-origin.
cn1.cors.allowedOrigins=*
cn1.cors.exposedHeaders=X-Probe, ETag

# Large answers are gzipped for a client that asks, which the app's gzip tests
# read back.
cn1.server.compression.enabled=true
cn1.server.compression.minResponseSize=1024
