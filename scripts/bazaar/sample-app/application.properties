# Restock Alerts' settings, read as a file from the working directory (the
# module directory under `cn1:backend`). A system property or environment
# variable of the same name wins (RESTOCK_CLIENT_SECRET for the secret).
#
# Where Bazaar is, and where Bazaar reaches this app. Both must be public https
# addresses: Bazaar refuses to call a private network.
restock.bazaar-url=https://bazaar.example
restock.app-url=https://restock.example

# What Bazaar showed when the app was registered at /api/developer/apps.
# Keep the secret out of source control in a real deployment.
restock.client-id=
restock.client-secret=

