The\ address\ of\ the\ Bazaar\ server\ this\ app\ talks\ to.\ Changing\ it\ signs\ you\ out.=The address of the Bazaar server this app talks to. Changing it signs you out.
This\ is\ a\ development\ server,\ so\ no\ text\ was\ sent.\ Your\ code\ is\ {0}.=This is a development server, so no text was sent. Your code is {0}.
A\ flag\ marks\ the\ account\ for\ the\ admins\ and\ changes\ nothing\ for\ its\ owner.\ A\ block\ signs\ it\ out\ and\ refuses\ it\ until\ lifted.=A flag marks the account for the admins and changes nothing for its owner. A block signs it out and refuses it until lifted.
The\ payment\ provider's\ own\ page\ opens\ in\ your\ browser.\ Bazaar\ never\ sees\ the\ number.\ Come\ back\ here\ when\ you\ have\ finished.=The payment provider's own page opens in your browser. Bazaar never sees the number. Come back here when you have finished.
This\ server\ takes\ no\ real\ payments.\ Use\ the\ test\ card\ 4242\ 4242\ 4242\ 4242\ with\ any\ date\ ahead\ and\ any\ three\ digits.=This server takes no real payments. Use the test card 4242 4242 4242 4242 with any date ahead and any three digits.
{0}\ is\ signed\ out\ everywhere\ and\ cannot\ sign\ in\ again\ until\ the\ block\ is\ lifted.={0} is signed out everywhere and cannot sign in again until the block is lifted.
Share\ which\ screens\ and\ features\ are\ used.\ Never\ your\ name,\ places\ or\ payment\ details.=Share which screens and features are used. Never your name, places or payment details.
Bazaar\ can\ count\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ so\ that\ we\ can\ see\ what\ works\ and\ fix\ what\ does\ not.=Bazaar can count which screens are opened and which features are used, so that we can see what works and fix what does not.
With\ usage\ statistics\ turned\ on,\ the\ app\ also\ counts\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ and\ reports\ that\ to\ Codename\ One's\ analytics\ service\ under\ a\ made-up\ id\ for\ this\ device.\ Your\ name,\ e-mail,\ phone\ number,\ places\ and\ card\ details\ are\ never\ part\ of\ it,\ and\ turning\ it\ off\ in\ Settings\ stops\ it.=With usage statistics turned on, the app also counts which screens are opened and which features are used, and reports that to Codename One's analytics service under a made-up id for this device. Your name, e-mail, phone number, places and card details are never part of it, and turning it off in Settings stops it.
The\ server\ changed.\ Sign\ in\ again.=The server changed. Sign in again.
