<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!-- cn1:model posts java.util.List<com.codenameone.examples.bazaar.web.PostView> -->
<!-- cn1:model tag java.lang.String -->
<!-- cn1:model feedUrl java.lang.String -->
<!doctype html>
<html th:attr="lang=${page.lang},dir=${page.dir}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body th:class="${page.themeClass}" th:attr="data-accent=${page.accent}"><header th:replace="~{layout :: header}"></header>
<main class="wrap rich"><h1 th:text="${page.t['blog']}">Blog</h1><p class="muted" th:unless="${tag.empty}"><span th:text="${page.t['taggedPosts']}">Posts tagged</span> <strong th:text="${tag}">tag</strong></p><ul class="post-list"><li th:each="b : ${posts}"><h2><a th:href="${b.url}" th:text="${b.title}">Post</a></h2><p class="byline"><span th:text="${b.author}">Author</span> <time th:text="${b.date}">2026-01-01</time></p><p th:text="${b.excerpt}">Excerpt</p></li></ul><p class="empty-state" th:if="${posts.empty}" th:text="${page.t['noPosts']}">No posts yet.</p><p><a th:href="${feedUrl}" th:text="${page.t['subscribe']}">Subscribe (Atom)</a></p></main>
<footer th:replace="~{layout :: footer}"></footer></body></html>
