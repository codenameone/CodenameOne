<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${page.title}">Bazaar</title>
<meta name="description" th:attr="content=${page.description}">
<meta name="robots" content="noindex" th:if="${page.noindex}">
<meta property="og:type" th:attr="content=${page.type}">
<meta property="og:title" th:attr="content=${page.title}">
<meta property="og:description" th:attr="content=${page.description}">
<meta property="og:url" th:attr="content=${page.canonical}">
<meta property="og:site_name" th:attr="content=${page.brand}">
<meta property="og:image" th:unless="${page.image.empty}" th:attr="content=${page.image}">
<meta name="twitter:card" th:attr="content=${page.image.empty ? 'summary' : 'summary_large_image'}">
<meta name="twitter:title" th:attr="content=${page.title}">
<meta name="twitter:description" th:attr="content=${page.description}">
<meta name="twitter:image" th:unless="${page.image.empty}" th:attr="content=${page.image}">
<meta name="theme-color" th:attr="content=${page.accent}">
<style th:attr="nonce=${page.nonce}">:root{--accent:#4f46e5;--ink:#1f2328;--muted:#5f6670;--line:#e3e5e8;--bg:#fff;--soft:#f6f7f9}@media (prefers-color-scheme:dark){:root{--ink:#e8eaed;--muted:#a3a9b1;--line:#30353b;--bg:#15181c;--soft:#1d2126}}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}a{color:inherit}img,svg{display:block;width:100%;height:auto}.wrap{max-width:1120px;margin:0 auto;padding:0 16px}.bar{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:2}.bar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}</style>
<link rel="stylesheet" href="/static/shop.46baf561.css"><script src="/static/shop.c791daf1.js" defer th:attr="nonce=${page.nonce}"></script></head>
<body><header th:fragment="header" class="bar"><div class="bar-in"><a class="brand" th:href="${page.home}" th:text="${page.brand}">Bazaar</a>
<form class="search" method="get" role="search" th:unless="${page.searchUrl.empty}" th:action="${page.searchUrl}"><input type="search" name="q" placeholder="Search" aria-label="Search" th:value="${page.query}"></form>
<a class="cart-link" th:unless="${page.cartUrl.empty}" th:href="${page.cartUrl}">Cart</a></div>
<div id="structured-data" hidden th:unless="${page.jsonLd.empty}" th:attr="data-ld=${page.jsonLd}"></div></header>
<footer th:fragment="footer" class="foot"><div class="wrap"><a href="/">Bazaar</a> <span>Independent shops, one checkout.</span><a th:unless="${page.privacyUrl.empty}" th:href="${page.privacyUrl}">Privacy and cookies</a></div><div class="slots" hidden th:unless="${page.headSlots.empty and page.bodySlots.empty}"><th:block th:each="s : ${page.headSlots}"><span th:if="${s.script}" class="slot-script" th:attr="data-src=${s.src}, data-head=${s.head ? '1' : ''}"></span><iframe hidden th:if="${s.frame}" class="slot-frame" sandbox="allow-scripts" loading="lazy" referrerpolicy="no-referrer" th:src="${s.src}" th:attr="title=${s.title}, height=${s.height}"></iframe></th:block><th:block th:each="s : ${page.bodySlots}"><span th:if="${s.script}" class="slot-script" th:attr="data-src=${s.src}, data-head=${s.head ? '1' : ''}"></span><iframe th:if="${s.frame}" class="slot-frame" sandbox="allow-scripts" loading="lazy" referrerpolicy="no-referrer" th:src="${s.src}" th:attr="title=${s.title}, height=${s.height}"></iframe></th:block></div><aside class="consent" th:if="${page.consentAsk}" aria-labelledby="consent-t"><p id="consent-t">This shop would like to use optional cookies for analytics and marketing. Necessary ones always load. <a th:href="${page.privacyUrl}">Privacy and cookies</a></p><form method="post" action="/consent" data-consent><input type="hidden" name="back" th:value="${page.consentBack}"><button type="submit" name="choice" value="all">Accept all</button> <button type="submit" name="choice" value="none">Decline</button><details><summary>Choose</summary><label><input type="checkbox" name="analytics" value="1"> Analytics</label> <label><input type="checkbox" name="marketing" value="1"> Marketing</label> <button type="submit" name="choice" value="custom">Save choices</button></details></form></aside></footer>
<div th:fragment="price" class="slot-place" th:unless="${page.priceSlots.empty}"><th:block th:each="s : ${page.priceSlots}"><span th:if="${s.script}" class="slot-script" th:attr="data-src=${s.src}, data-head=${s.head ? '1' : ''}"></span><iframe th:if="${s.frame}" class="slot-frame" sandbox="allow-scripts" loading="lazy" referrerpolicy="no-referrer" th:src="${s.src}" th:attr="title=${s.title}, height=${s.height}"></iframe></th:block></div>
<div th:fragment="cart" class="slot-place" th:unless="${page.cartSlots.empty}"><th:block th:each="s : ${page.cartSlots}"><span th:if="${s.script}" class="slot-script" th:attr="data-src=${s.src}, data-head=${s.head ? '1' : ''}"></span><iframe th:if="${s.frame}" class="slot-frame" sandbox="allow-scripts" loading="lazy" referrerpolicy="no-referrer" th:src="${s.src}" th:attr="title=${s.title}, height=${s.height}"></iframe></th:block></div>
<div th:fragment="thanks" class="slot-place" th:unless="${page.thanksSlots.empty}"><th:block th:each="s : ${page.thanksSlots}"><span th:if="${s.script}" class="slot-script" th:attr="data-src=${s.src}, data-head=${s.head ? '1' : ''}"></span><iframe th:if="${s.frame}" class="slot-frame" sandbox="allow-scripts" loading="lazy" referrerpolicy="no-referrer" th:src="${s.src}" th:attr="title=${s.title}, height=${s.height}"></iframe></th:block></div></body></html>
