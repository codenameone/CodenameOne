<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!-- cn1:model product com.codenameone.examples.bazaar.web.ProductView -->
<!doctype html>
<html th:attr="lang=${page.lang},dir=${page.dir}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body th:class="${page.themeClass}" th:attr="data-accent=${page.accent}"><header th:replace="~{layout :: header}"></header>
<main class="wrap"><nav class="crumbs"><a th:href="${page.home}" th:text="${page.brand}">Store</a></nav>
<article class="product" itemscope itemtype="https://schema.org/Product"><meta itemprop="name" th:attr="content=${product.title}"><meta itemprop="url" th:attr="content=${page.canonical}"><meta itemprop="description" th:attr="content=${page.description}">
<div class="gallery"><figure th:each="g : ${product.gallery}" class="art"><img th:if="${g.photo}" th:src="${g.url}" th:attr="alt=${product.title}" itemprop="image"><svg th:unless="${g.photo}" viewBox="0 0 600 600" role="img" th:attr="aria-label=${product.title}"><defs><linearGradient x1="0" y1="0" x2="1" y2="1" th:attr="id=${g.gid}"><stop offset="0" th:attr="stop-color=${g.from}"></stop><stop offset="1" th:attr="stop-color=${g.to}"></stop></linearGradient></defs><rect width="600" height="600" th:attr="fill=${g.fill}"></rect><text x="300" y="340" text-anchor="middle" th:text="${g.initials}">P</text></svg></figure></div>
<div class="buy"><p class="vendor" th:unless="${product.vendor.empty}" th:text="${product.vendor}">Vendor</p><h1 th:text="${product.title}">Product</h1>
<p class="stars" th:if="${product.ratingCount > 0}" itemprop="aggregateRating" itemscope itemtype="https://schema.org/AggregateRating"><span th:text="${product.stars}">*****</span> <span itemprop="ratingValue" th:text="${product.rating}">4.5</span> <span th:text="${page.t['reviews.from']}">from</span> <span itemprop="reviewCount" th:text="${product.ratingCount}">3</span> <span th:text="${page.t['reviews']}">reviews</span></p>
<p class="price" itemprop="offers" itemscope itemtype="https://schema.org/Offer"><meta itemprop="price" th:attr="content=${product.amount}"><meta itemprop="priceCurrency" th:attr="content=${product.currency}"><link itemprop="availability" href="https://schema.org/InStock" th:if="${product.available}"><link itemprop="availability" href="https://schema.org/OutOfStock" th:unless="${product.available}"><span th:text="${product.price}">$1</span> <s th:unless="${product.compareAt.empty}" th:text="${product.compareAt}">$2</s></p><div th:replace="~{layout :: price}"></div><p class="muted" th:unless="${product.marketNote.empty}" th:text="${product.marketNote}">Charged in USD</p><form method="post" action="/market" class="muted geo" hx-boost="false" th:unless="${product.geoNote.empty}"><input type="hidden" name="back" th:value="${product.url}"><button type="submit" class="quiet" name="market" th:value="${product.geoUrl}" th:text="${product.geoNote}">See prices for your country</button></form>
<form class="variants" method="get" th:if="${product.hasVariants}" th:action="${product.url}"><label for="variant" th:text="${page.t['option']}">Option</label><select id="variant" name="variant"><option th:each="v : ${product.variants}" th:value="${v.id}" th:selected="${v.selected}" th:disabled="${!v.available}" th:text="${v.title + ' - ' + v.price}">Option</option></select><button class="quiet" type="submit" th:text="${page.t['choose']}">Choose</button></form>
<form class="add" method="post" th:action="${page.cartUrl + '/add'}"><input type="hidden" name="variantId" th:value="${product.variantId}"><label for="quantity" th:text="${page.t['quantity']}">Quantity</label><input id="quantity" name="quantity" type="number" min="1" max="99" value="1"><fieldset class="plans" th:unless="${product.plans.empty}"><legend th:text="${page.t['howToBuy']}">How to buy</legend><div class="choice"><input type="radio" name="plan" id="plan-once" value="" checked><label for="plan-once" th:text="${page.t['oneTime'] + ' - ' + product.price}">One-time purchase</label></div><div class="choice" th:each="pl : ${product.plans}"><input type="radio" name="plan" th:attr="id=${'plan-' + pl.id}" th:value="${pl.id}"><label th:attr="for=${'plan-' + pl.id}" th:text="${pl.title + ' - ' + pl.price}">Subscribe</label></div></fieldset><button class="button" type="submit" th:disabled="${!product.available}" th:text="${product.preorder ? page.t['preorder'] : product.available ? page.t['addToCart'] : page.t['soldOut']}">Add to cart</button></form>
<div class="description" th:text="${product.description}">Description</div><section class="includes" th:unless="${product.includes.empty}"><h2 th:text="${page.t['includes']}">Includes</h2><ul><li th:each="i : ${product.includes}" th:text="${i}">2 x Mug</li></ul></section><section class="specs" th:unless="${product.specs.empty}"><h2 th:text="${page.t['specs']}">Specifications</h2><dl><th:block th:each="s : ${product.specs}"><dt th:text="${s[0]}">Material</dt><dd th:text="${s[1]}">Oak</dd></th:block></dl></section></div></article>
<section class="reviews" th:unless="${product.reviews.empty}"><h2 th:text="${page.t['reviews.title']}">Reviews</h2><article class="review" th:each="r : ${product.reviews}"><p class="stars" th:text="${r.stars}">*****</p><h3 th:unless="${r.title.empty}" th:text="${r.title}">Title</h3><p th:text="${r.body}">Body</p><p class="meta"><span th:text="${r.author}">Name</span> <span th:text="${r.date}">date</span> <span th:if="${r.verified}" th:text="${page.t['verified']}">Verified purchase</span></p></article></section>
<section th:unless="${product.related.empty}"><h2 th:text="${page.t['related']}">You may also like</h2><ul class="grid"><li class="card" th:each="c : ${product.related}"><a th:href="${c.url}"><div class="art"><img th:if="${c.art.photo}" th:src="${c.art.url}" th:attr="alt=${c.title}" loading="lazy"><svg th:unless="${c.art.photo}" viewBox="0 0 400 400" role="img" th:attr="aria-label=${c.title}"><defs><linearGradient x1="0" y1="0" x2="1" y2="1" th:attr="id=${c.art.gid}"><stop offset="0" th:attr="stop-color=${c.art.from}"></stop><stop offset="1" th:attr="stop-color=${c.art.to}"></stop></linearGradient></defs><rect width="400" height="400" th:attr="fill=${c.art.fill}"></rect><text x="200" y="230" text-anchor="middle" th:text="${c.art.initials}">P</text></svg><span class="badge" th:if="${c.soldOut}" th:text="${page.t['soldOut']}">Sold out</span></div>
<h3 th:text="${c.title}">Product</h3><p class="price"><span th:text="${c.price}">$1</span> <s th:unless="${c.compareAt.empty}" th:text="${c.compareAt}">$2</s></p><p class="stars" th:if="${c.ratingCount > 0}"><span th:text="${c.rating}">4.5</span> <span th:text="${c.ratingCount}">3</span> <span th:text="${page.t['reviews']}">reviews</span></p></a></li></ul></section></main>
<footer th:replace="~{layout :: footer}"></footer></body></html>
