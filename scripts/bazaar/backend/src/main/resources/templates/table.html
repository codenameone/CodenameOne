<!-- cn1:model table com.codenameone.examples.bazaar.web.table.DataTable -->
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="grid" class="grid" th:attr="id=${'grid-' + table.id}">
<form class="toolbar" method="get" role="search" th:action="${table.base}" th:attr="hx-get=${table.base}, hx-target=${'#grid-' + table.id}" hx-select="section.grid" hx-swap="outerHTML" hx-push-url="true">
<label class="sr" th:attr="for=${'q-' + table.id}" th:text="${table.searchLabel}">Search</label><input type="search" name="q" th:attr="id=${'q-' + table.id}, placeholder=${table.searchLabel}" th:value="${table.q}">
<th:block th:each="f : ${table.filters}"><label class="sr" th:attr="for=${'f-' + f.name}" th:text="${f.label}">Filter</label><select th:attr="id=${'f-' + f.name}" th:name="${f.name}"><option th:each="o : ${f.options}" th:value="${o.value}" th:selected="${o.selected}" th:text="${o.label}">All</option></select></th:block>
<th:block th:each="k : ${table.keep}"><input th:if="${k.hidden}" type="hidden" th:name="${k.name}" th:value="${k.value}"></th:block>
<button class="quiet" type="submit">Apply</button><span class="grow"></span>
<details class="cols" th:attr="data-cols=${table.id}"><summary class="button quiet">Columns</summary><ul><li th:each="c : ${table.columns}"><label><input type="checkbox" th:value="${c.key}" checked> <span th:text="${c.label}">Column</span></label></li></ul></details>
<a class="button quiet" th:href="${table.csvUrl}" download>Export CSV</a></form>
<form method="post" th:action="${table.bulkUrl}" th:if="${table.selectable}" th:attr="id=${'bulk-' + table.id}" class="toolbar"><span class="muted">With selected:</span><button class="quiet" type="submit" name="action" th:each="a : ${table.actions}" th:value="${a.url}" th:text="${a.label}">Action</button></form>
<div class="table-wrap"><table class="data" th:attr="data-table=${table.id}"><caption class="sr" th:text="${table.searchLabel}">Table</caption><thead><tr><th th:if="${table.selectable}" scope="col"><input type="checkbox" data-all aria-label="Select all" th:attr="form=${'bulk-' + table.id}"></th>
<th scope="col" th:each="c : ${table.columns}" th:classappend="${c.num ? 'num' : ''}" th:attr="data-col=${c.key}, aria-sort=${c.sort}"><a th:if="${c.sortable}" th:href="${c.sortUrl}" th:attr="aria-sort=${c.sort}" th:text="${c.label}">Column</a><span th:unless="${c.sortable}" th:text="${c.label}">Column</span></th></tr></thead>
<tbody><tr th:each="r : ${table.rows}" th:attr="data-href=${r.href}"><td th:if="${table.selectable}"><input type="checkbox" name="ids" th:value="${r.id}" th:attr="form=${'bulk-' + table.id}" aria-label="Select row"></td>
<td th:each="c : ${r.cells}" th:classappend="${c.num ? 'num' : ''}" th:attr="data-col=${c.col}"><a th:if="${!c.href.empty and !c.edit}" th:href="${c.href}" th:text="${c.text}">Cell</a><span th:if="${c.href.empty and !c.edit and c.pill}" class="pill" th:classappend="${c.tone}" th:text="${c.text}">Status</span><span th:if="${c.href.empty and !c.edit and !c.pill}" th:text="${c.text}">Cell</span>
<form th:if="${c.edit}" method="post" class="inline" th:action="${c.editUrl}" th:attr="hx-post=${c.editUrl}, hx-target=${'#grid-' + table.id}" hx-select="section.grid" hx-swap="outerHTML"><input type="number" name="value" step="1" th:value="${c.text}" th:attr="aria-label=${c.editLabel}"><button class="quiet" type="submit">Save</button></form></td></tr></tbody></table>
<p class="muted" th:if="${table.rows.empty}" th:text="${table.empty}">Nothing here.</p>
<nav class="pager" aria-label="Pages"><span class="muted" th:text="${table.from + '-' + table.to + ' of ' + table.total}">1-25 of 100</span><a class="button quiet" th:unless="${table.prevUrl.empty}" th:href="${table.prevUrl}" rel="prev">Previous</a><a class="button quiet" th:unless="${table.nextUrl.empty}" th:href="${table.nextUrl}" rel="next">Next</a></nav></div></section></body></html>
