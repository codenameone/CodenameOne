<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!-- cn1:model view com.codenameone.examples.bazaar.web.ContentView -->
<!doctype html>
<html th:attr="lang=${page.lang},dir=${page.dir}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body th:class="${page.themeClass}" th:attr="data-accent=${page.accent}"><header th:replace="~{layout :: header}"></header>
<main class="wrap rich"><article><h1 th:text="${view.title}">Title</h1><p class="byline" th:if="${view.post}"><span th:unless="${view.author.empty}" th:text="${view.author}">Author</span> <time th:text="${view.date}">2026-01-01</time></p>
<th:block th:each="b : ${view.blocks}"><p th:if="${b.p}"><th:block th:each="r : ${b.runs}"><br th:if="${r.br}"><a th:if="${r.link}" th:href="${r.href}" th:class="${r.css}" rel="nofollow noopener" th:text="${r.text}">Link</a><span th:if="${r.plain}" th:class="${r.css}" th:text="${r.text}">Text</span></th:block></p><h2 th:if="${b.h2}"><th:block th:each="r : ${b.runs}"><br th:if="${r.br}"><a th:if="${r.link}" th:href="${r.href}" th:class="${r.css}" rel="nofollow noopener" th:text="${r.text}">Link</a><span th:if="${r.plain}" th:class="${r.css}" th:text="${r.text}">Text</span></th:block></h2><h3 th:if="${b.h3}"><th:block th:each="r : ${b.runs}"><br th:if="${r.br}"><a th:if="${r.link}" th:href="${r.href}" th:class="${r.css}" rel="nofollow noopener" th:text="${r.text}">Link</a><span th:if="${r.plain}" th:class="${r.css}" th:text="${r.text}">Text</span></th:block></h3><blockquote th:if="${b.quote}"><th:block th:each="r : ${b.runs}"><br th:if="${r.br}"><a th:if="${r.link}" th:href="${r.href}" th:class="${r.css}" rel="nofollow noopener" th:text="${r.text}">Link</a><span th:if="${r.plain}" th:class="${r.css}" th:text="${r.text}">Text</span></th:block></blockquote><ul th:if="${b.ul}"><li th:each="i : ${b.items}"><th:block th:each="r : ${i.runs}"><br th:if="${r.br}"><a th:if="${r.link}" th:href="${r.href}" th:class="${r.css}" rel="nofollow noopener" th:text="${r.text}">Link</a><span th:if="${r.plain}" th:class="${r.css}" th:text="${r.text}">Text</span></th:block></li></ul><ol th:if="${b.ol}"><li th:each="i : ${b.items}"><th:block th:each="r : ${i.runs}"><br th:if="${r.br}"><a th:if="${r.link}" th:href="${r.href}" th:class="${r.css}" rel="nofollow noopener" th:text="${r.text}">Link</a><span th:if="${r.plain}" th:class="${r.css}" th:text="${r.text}">Text</span></th:block></li></ol></th:block>
<p class="tags" th:unless="${view.tags.empty}"><a th:each="t : ${view.tags}" th:href="${t.url}" th:text="${t.label}">tag</a></p><p th:if="${view.post}"><a th:href="${view.blogUrl}" th:text="${page.t['allPosts']}">All posts</a></p></article></main>
<footer th:replace="~{layout :: footer}"></footer></body></html>
