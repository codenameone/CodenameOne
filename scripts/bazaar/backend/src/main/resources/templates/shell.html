<!-- cn1:model shell com.codenameone.examples.bazaar.web.Shell -->
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"attributesToSettle":["class","width","height"],"allowScriptTags":false,"historyCacheSize":0,"selfRequestsOnly":true}'>
<title th:text="${shell.title}">Bazaar</title>
<style th:attr="nonce=${shell.nonce}">:root{--bg:#f6f7f9;--fg:#15181d;--muted:#5b6472;--card:#fff;--line:#e3e6eb;--accent:#2f6f4f;--accent-fg:#fff;--danger:#b42318;--ok:#18794e;--r:10px;--side:15rem;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaee;--muted:#9aa3b2;--card:#171a20;--line:#2a2f38;--accent:#5fbf8f;--accent-fg:#0b0d10}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:9;background:var(--card);padding:8px}.top{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--card)}.frame{display:flex;min-height:calc(100vh - 52px)}.side{width:var(--side);flex:none;border-right:1px solid var(--line);padding:12px 8px}main{flex:1;min-width:0;padding:20px 24px;outline:none}@media (max-width:760px){.side{display:none}.side.open{display:block;position:fixed;inset:52px 0 0 0;z-index:5;background:var(--card);width:auto}main{padding:16px}}</style>
<link rel="stylesheet" href="/static/app.282457dd.css"><script src="/static/htmx.d6fdc75f.js" defer th:attr="nonce=${shell.nonce}"></script><script src="/static/rtc.1a1ec8dd.js" defer th:attr="nonce=${shell.nonce}"></script><script src="/static/app.3cd95e72.js" defer th:attr="nonce=${shell.nonce}"></script></head>
<body><header th:fragment="topbar" class="top"><a class="skip" href="#main" th:text="${shell.t['skip']}">Skip to content</a>
<button class="icon menu" type="button" aria-controls="side" aria-expanded="false" data-menu><span class="sr" th:text="${shell.t['menu.short']}">Menu</span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2"></path></svg></button>
<a class="brand" th:href="${shell.home}" th:text="${shell.brand}">Bazaar</a>
<details class="switch" th:unless="${shell.stores.empty}"><summary th:text="${shell.storeName}">Store</summary><ul><li th:each="s : ${shell.stores}"><a th:href="${s.url}" th:text="${s.label}" th:attr="aria-current=${s.current}">Store</a></li></ul></details>
<span class="grow"></span>
<button class="icon" type="button" data-shortcuts title="Keyboard shortcuts (?)"><span class="sr" th:text="${shell.t['bo.shortcuts']}">Keyboard shortcuts</span>?</button>
<a th:if="${shell.merchant and shell.area != 'admin'}" href="/admin" th:text="${shell.t['bo.backOffice']}">Back office</a>
<a th:if="${shell.admin and shell.area != 'platform'}" href="/platform" th:text="${shell.t['bo.platform']}">Platform</a>
<form method="post" action="/lang" class="inline langs" hx-boost="false" th:unless="${shell.langs.empty}"><input type="hidden" name="back" th:value="${shell.langBack}"><span class="sr" th:text="${shell.t['lang.pick']}">Language</span><button th:each="l : ${shell.langs}" class="quiet" type="submit" name="lang" th:value="${l.url}" th:text="${l.label}" th:attr="lang=${l.url},aria-pressed=${l.current}">English</button></form>
<a th:unless="${shell.area == 'account'}" href="/account" th:text="${shell.t['account']}">Account</a>
<form method="post" action="/auth/signout" class="inline"><button class="quiet" type="submit" th:text="${shell.t['signOut'] + ' ' + shell.user}">Sign out</button></form></header>
<nav th:fragment="sidebar" class="side" id="side" aria-label="Sections"><ul class="nav"><li th:each="n : ${shell.nav}"><a th:href="${n.url}" th:classappend="${n.active ? 'on' : ''}" th:attr="aria-current=${n.current}, data-key=${n.key}"><span th:text="${n.label}">Section</span><kbd th:unless="${n.key.empty}" th:text="${'g ' + n.key}">g o</kbd></a></li></ul></nav>
<div th:fragment="toasts" class="toasts" id="toasts" role="status" aria-live="polite"><p class="toast" th:unless="${shell.toast.empty}" th:text="${shell.toast}">Saved</p><p class="toast bad" role="alert" th:unless="${shell.error.empty}" th:text="${shell.error}">Error</p></div>
<div th:fragment="slots" class="slots" hidden><th:block th:each="s : ${shell.slots}"><span th:if="${s.script}" class="slot-script" th:attr="data-src=${s.src}"></span></th:block></div>
<dialog th:fragment="help" id="help" aria-labelledby="help-t"><h2 id="help-t" th:text="${shell.t['bo.shortcuts']}">Keyboard shortcuts</h2><dl class="keys"><dt><kbd>/</kbd></dt><dd>Search or filter</dd><dt><kbd>g</kbd> then a letter</dt><dd>Go to the section marked with it</dd><dt><kbd>j</kbd> <kbd>k</kbd></dt><dd>Next and previous row</dd><dt><kbd>Enter</kbd></dt><dd>Open the row</dd><dt><kbd>?</kbd></dt><dd>This list</dd><dt><kbd>Esc</kbd></dt><dd>Close</dd></dl><form method="dialog"><button type="submit" th:text="${shell.t['bo.close']}">Close</button></form></dialog>
</body></html>
