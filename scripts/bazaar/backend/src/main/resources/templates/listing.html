<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!-- cn1:model heading java.lang.String -->
<!-- cn1:model intro java.lang.String -->
<!-- cn1:model total java.lang.Integer -->
<!-- cn1:model sorts java.util.List<com.codenameone.examples.bazaar.web.LinkView> -->
<!-- cn1:model pager java.util.List<com.codenameone.examples.bazaar.web.LinkView> -->
<!-- cn1:model products java.util.List<com.codenameone.examples.bazaar.web.CardView> -->
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body th:class="${page.themeClass}" th:attr="data-accent=${page.accent}"><header th:replace="~{layout :: header}"></header>
<main class="wrap"><nav class="crumbs"><a th:href="${page.home}" th:text="${page.brand}">Store</a></nav><h1 th:text="${heading}">Collection</h1><p class="lede" th:unless="${intro.empty}" th:text="${intro}">Intro</p>
<div class="toolbar"><span><span th:text="${total}">0</span> products</span><nav class="sorts" aria-label="Sort"><a th:each="s : ${sorts}" th:href="${s.url}" th:text="${s.label}" th:classappend="${s.current ? 'current' : ''}">Sort</a></nav></div>
<ul class="grid"><li class="card" th:each="c : ${products}"><a th:href="${c.url}"><div class="art"><img th:if="${c.art.photo}" th:src="${c.art.url}" th:attr="alt=${c.title}" loading="lazy"><svg th:unless="${c.art.photo}" viewBox="0 0 400 400" role="img" th:attr="aria-label=${c.title}"><defs><linearGradient x1="0" y1="0" x2="1" y2="1" th:attr="id=${c.art.gid}"><stop offset="0" th:attr="stop-color=${c.art.from}"></stop><stop offset="1" th:attr="stop-color=${c.art.to}"></stop></linearGradient></defs><rect width="400" height="400" th:attr="fill=${c.art.fill}"></rect><text x="200" y="230" text-anchor="middle" th:text="${c.art.initials}">P</text></svg><span class="badge" th:if="${c.soldOut}">Sold out</span></div>
<h3 th:text="${c.title}">Product</h3><p class="price"><span th:text="${c.price}">$1</span> <s th:unless="${c.compareAt.empty}" th:text="${c.compareAt}">$2</s></p><p class="stars" th:if="${c.ratingCount > 0}"><span th:text="${c.rating}">4.5</span> <span th:text="${c.ratingCount}">3</span> reviews</p></a></li></ul><p class="empty-state" th:if="${products.empty}">Nothing matches.</p>
<nav class="pager" th:unless="${pager.empty}" aria-label="Pages"><a th:each="p : ${pager}" th:href="${p.url}" th:text="${p.label}" th:classappend="${p.current ? 'current' : ''}">1</a></nav></main>
<footer th:replace="~{layout :: footer}"></footer></body></html>
