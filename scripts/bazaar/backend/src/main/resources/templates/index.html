<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!-- cn1:model stores java.util.List<com.codenameone.examples.bazaar.web.StoreCard> -->
<!doctype html>
<html th:attr="lang=${page.lang},dir=${page.dir}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body th:class="${page.themeClass}" th:attr="data-accent=${page.accent}"><header th:replace="~{layout :: header}"></header>
<main id="main" tabindex="-1" class="wrap"><h1 th:text="${page.t['index.title']}">Independent shops</h1><p class="lede" th:text="${page.t['index.lede']}">Every store on Bazaar, in one place.</p>
<section class="app-card" aria-labelledby="app-card-t"><div class="app-card-text"><p class="kicker" th:text="${page.t['index.app.kicker']}">The Bazaar app</p><h2 id="app-card-t" th:text="${page.t['index.app.title']}">Shop, track and sell from one app</h2><p th:text="${page.t['index.app.lede']}">Every store, your orders and your own shop's back office, running right in your browser. Nothing to install.</p><a class="button app-card-go" th:href="${page.appUrl}" th:text="${page.t['app.open']}">Open the app</a></div><svg class="app-card-art" viewBox="0 0 200 160" aria-hidden="true"><rect class="d1" x="58" y="8" width="84" height="148" rx="16"></rect><rect class="d2" x="66" y="22" width="68" height="112" rx="6"></rect><rect class="d3" x="74" y="32" width="52" height="30" rx="4"></rect><rect class="d4" x="74" y="70" width="24" height="24" rx="4"></rect><rect class="d4" x="102" y="70" width="24" height="24" rx="4"></rect><rect class="d4" x="74" y="100" width="52" height="8" rx="4"></rect><rect class="d4" x="74" y="114" width="34" height="8" rx="4"></rect><circle class="d5" cx="100" cy="145" r="4"></circle></svg></section>
<ul class="grid"><li class="card" th:each="s : ${stores}"><a th:href="${s.url}"><div class="art"><img th:if="${s.art.photo}" th:src="${s.art.url}" th:attr="alt=${s.name}" loading="lazy"><svg th:unless="${s.art.photo}" viewBox="0 0 400 300" role="img" th:attr="aria-label=${s.name}"><defs><linearGradient x1="0" y1="0" x2="1" y2="1" th:attr="id=${s.art.gid}"><stop offset="0" th:attr="stop-color=${s.art.from}"></stop><stop offset="1" th:attr="stop-color=${s.art.to}"></stop></linearGradient></defs><rect width="400" height="300" th:attr="fill=${s.art.fill}"></rect><text x="200" y="180" text-anchor="middle" th:text="${s.art.initials}">B</text></svg></div>
<h2 th:text="${s.name}">Store</h2><p th:text="${s.tagline}">Tagline</p></a></li></ul>
<p class="empty-state" th:if="${stores.empty}" th:text="${page.t['index.none']}">No shops are open yet.</p></main>
<footer th:replace="~{layout :: footer}"></footer></body></html>
