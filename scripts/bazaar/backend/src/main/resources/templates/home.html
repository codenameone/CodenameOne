<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!-- cn1:model hero com.codenameone.examples.bazaar.web.Art -->
<!-- cn1:model tagline java.lang.String -->
<!-- cn1:model about java.lang.String -->
<!-- cn1:model collections java.util.List<com.codenameone.examples.bazaar.web.LinkView> -->
<!-- cn1:model products java.util.List<com.codenameone.examples.bazaar.web.CardView> -->
<!-- cn1:model posts java.util.List<com.codenameone.examples.bazaar.web.PostView> -->
<!doctype html>
<html th:attr="lang=${page.lang},dir=${page.dir}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body th:class="${page.themeClass}" th:attr="data-accent=${page.accent}"><header th:replace="~{layout :: header}"></header>
<main id="main" tabindex="-1" class="home"><th:block th:each="s : ${page.sections}"><section class="hero" th:if="${s == 'hero'}"><div class="art"><img th:if="${hero.photo}" th:src="${hero.url}" th:attr="alt=${page.brand}"><svg th:unless="${hero.photo}" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" th:attr="aria-label=${page.brand}"><defs><linearGradient x1="0" y1="0" x2="1" y2="1" th:attr="id=${hero.gid}"><stop offset="0" th:attr="stop-color=${hero.from}"></stop><stop offset="1" th:attr="stop-color=${hero.to}"></stop></linearGradient></defs><rect width="1200" height="400" th:attr="fill=${hero.fill}"></rect></svg></div>
<div class="wrap hero-text"><h1 th:text="${page.brand}">Store</h1><p th:text="${tagline}">Tagline</p></div></section>
<nav class="chips wrap" th:if="${s == 'collections' and !collections.empty}" th:attr="aria-label=${page.t['collections']}"><a th:each="l : ${collections}" th:href="${l.url}" th:text="${l.label}">Collection</a></nav>
<section class="featured wrap" th:if="${s == 'featured'}"><h2 th:text="${page.t['featured']}">Featured</h2><ul class="grid"><li class="card" th:each="c : ${products}"><a th:href="${c.url}"><div class="art"><img th:if="${c.art.photo}" th:src="${c.art.url}" th:attr="alt=${c.title}" loading="lazy"><svg th:unless="${c.art.photo}" viewBox="0 0 400 400" role="img" th:attr="aria-label=${c.title}"><defs><linearGradient x1="0" y1="0" x2="1" y2="1" th:attr="id=${c.art.gid}"><stop offset="0" th:attr="stop-color=${c.art.from}"></stop><stop offset="1" th:attr="stop-color=${c.art.to}"></stop></linearGradient></defs><rect width="400" height="400" th:attr="fill=${c.art.fill}"></rect><text x="200" y="230" text-anchor="middle" th:text="${c.art.initials}">P</text></svg><span class="badge" th:if="${c.soldOut}" th:text="${page.t['soldOut']}">Sold out</span></div>
<h3 th:text="${c.title}">Product</h3><p class="price"><span th:text="${c.price}">$1</span> <s th:unless="${c.compareAt.empty}" th:text="${c.compareAt}">$2</s> <span class="unit-price" th:unless="${c.unitPrice.empty}" th:text="${c.unitPrice}">$1 / 100 g</span></p><p class="stars" th:if="${c.ratingCount > 0}"><span th:text="${c.rating}">4.5</span> <span th:text="${c.ratingCount}">3</span> <span th:text="${page.t['reviews']}">reviews</span></p></a></li></ul><p class="empty-state" th:if="${products.empty}" th:text="${page.t['emptyShelves']}">Nothing on the shelves yet.</p>
</section>
<section class="home-blog wrap" th:if="${s == 'blog' and !posts.empty}"><h2 th:text="${page.t['fromBlog']}">From the blog</h2><ul class="post-list"><li th:each="b : ${posts}"><a th:href="${b.url}" th:text="${b.title}">Post</a> <span class="muted" th:text="${b.date}">2026-01-01</span><p th:text="${b.excerpt}">Excerpt</p></li></ul></section>
<section class="about wrap" th:if="${s == 'about' and !about.empty}"><h2 th:text="${page.t['about']}">About</h2><p th:text="${about}">About</p></section></th:block></main>
<footer th:replace="~{layout :: footer}"></footer></body></html>
