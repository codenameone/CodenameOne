<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!-- cn1:model hero com.codenameone.examples.bazaar.web.Art -->
<!-- cn1:model tagline java.lang.String -->
<!-- cn1:model about java.lang.String -->
<!-- cn1:model collections java.util.List<com.codenameone.examples.bazaar.web.LinkView> -->
<!-- cn1:model products java.util.List<com.codenameone.examples.bazaar.web.CardView> -->
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body th:attr="data-accent=${page.accent}"><header th:replace="~{layout :: header}"></header>
<section class="hero"><div class="art"><img th:if="${hero.photo}" th:src="${hero.url}" th:attr="alt=${page.brand}"><svg th:unless="${hero.photo}" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" th:attr="aria-label=${page.brand}"><defs><linearGradient x1="0" y1="0" x2="1" y2="1" th:attr="id=${hero.gid}"><stop offset="0" th:attr="stop-color=${hero.from}"></stop><stop offset="1" th:attr="stop-color=${hero.to}"></stop></linearGradient></defs><rect width="1200" height="400" th:attr="fill=${hero.fill}"></rect></svg></div>
<div class="wrap hero-text"><h1 th:text="${page.brand}">Store</h1><p th:text="${tagline}">Tagline</p></div></section>
<main class="wrap"><nav class="chips" th:unless="${collections.empty}" aria-label="Collections"><a th:each="l : ${collections}" th:href="${l.url}" th:text="${l.label}">Collection</a></nav>
<h2>Featured</h2><ul class="grid"><li class="card" th:each="c : ${products}"><a th:href="${c.url}"><div class="art"><img th:if="${c.art.photo}" th:src="${c.art.url}" th:attr="alt=${c.title}" loading="lazy"><svg th:unless="${c.art.photo}" viewBox="0 0 400 400" role="img" th:attr="aria-label=${c.title}"><defs><linearGradient x1="0" y1="0" x2="1" y2="1" th:attr="id=${c.art.gid}"><stop offset="0" th:attr="stop-color=${c.art.from}"></stop><stop offset="1" th:attr="stop-color=${c.art.to}"></stop></linearGradient></defs><rect width="400" height="400" th:attr="fill=${c.art.fill}"></rect><text x="200" y="230" text-anchor="middle" th:text="${c.art.initials}">P</text></svg><span class="badge" th:if="${c.soldOut}">Sold out</span></div>
<h3 th:text="${c.title}">Product</h3><p class="price"><span th:text="${c.price}">$1</span> <s th:unless="${c.compareAt.empty}" th:text="${c.compareAt}">$2</s></p><p class="stars" th:if="${c.ratingCount > 0}"><span th:text="${c.rating}">4.5</span> <span th:text="${c.ratingCount}">3</span> reviews</p></a></li></ul><p class="empty-state" th:if="${products.empty}">Nothing on the shelves yet.</p>
<section class="about" th:unless="${about.empty}"><h2>About</h2><p th:text="${about}">About</p></section></main>
<footer th:replace="~{layout :: footer}"></footer></body></html>
