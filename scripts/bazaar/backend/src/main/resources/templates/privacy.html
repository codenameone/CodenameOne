<!-- cn1:model page com.codenameone.examples.bazaar.web.PageMeta -->
<!-- cn1:model privacy com.codenameone.examples.bazaar.web.slots.PrivacyView -->
<!doctype html>
<html th:attr="lang=${page.lang},dir=${page.dir}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body th:class="${page.themeClass}" th:attr="data-accent=${page.accent}"><header th:replace="~{layout :: header}"></header>
<main id="main" tabindex="-1" class="wrap"><h1 th:text="${page.t['privacy']}">Privacy and cookies</h1><p class="policy" th:unless="${privacy.policies.empty}" th:text="${privacy.policies}">Policies</p>
<h2 th:text="${page.t['cookiesApps']}">Cookies and apps</h2><p th:text="${page.t['cookiesText']}">Necessary cookies keep your cart and checkout working and always load. Analytics and marketing apps load only if you accept them, and never at checkout.</p>
<p th:if="${privacy.apps.empty}" th:text="${page.t['noApps']}">This shop uses no third-party apps.</p><ul th:unless="${privacy.apps.empty}"><li th:each="a : ${privacy.apps}"><span th:text="${a.title}">App</span> (<span th:text="${a.kind}">analytics</span>)</li></ul>
<h2 th:text="${page.t['yourChoice']}">Your choice</h2><p th:text="${privacy.current}">You have not chosen yet.</p>
<form method="post" action="/consent"><input type="hidden" name="back" th:value="${page.consentBack}"><label><input type="checkbox" name="analytics" value="1" th:checked="${privacy.analytics}"> <span th:text="${page.t['consent.analytics']}">Analytics</span></label> <label><input type="checkbox" name="marketing" value="1" th:checked="${privacy.marketing}"> <span th:text="${page.t['consent.marketing']}">Marketing</span></label> <button type="submit" name="choice" value="custom" th:text="${page.t['consent.save']}">Save choices</button> <button type="submit" name="choice" value="none" th:text="${page.t['consent.declineAll']}">Decline all</button></form></main>
<footer th:replace="~{layout :: footer}"></footer></body></html>
