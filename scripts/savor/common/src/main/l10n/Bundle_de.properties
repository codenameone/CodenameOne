The\ address\ of\ the\ Savor\ server\ this\ app\ talks\ to.\ Changing\ it\ signs\ you\ out.=Die Adresse des Savor-Servers, mit dem diese App spricht. Eine \u00c4nderung meldet dich ab.
Savor\ is\ a\ sample.\ No\ real\ deliveries\ are\ booked,\ no\ real\ couriers\ are\ sent\ and\ no\ money\ changes\ hands.=Savor ist ein Beispiel. Es werden keine echten Lieferungen gebucht, keine echten Kuriere geschickt und es flie\u00dft kein Geld.
This\ is\ a\ development\ server,\ so\ no\ text\ was\ sent.\ Your\ code\ is\ {0}.=Dies ist ein Entwicklungsserver, daher wurde keine SMS gesendet. Dein Code ist {0}.
A\ flag\ marks\ the\ account\ for\ the\ admins\ and\ changes\ nothing\ for\ its\ owner.\ A\ block\ signs\ it\ out\ and\ refuses\ it\ until\ lifted.=Eine Markierung macht die Admins auf das Konto aufmerksam und \u00e4ndert f\u00fcr den Inhaber nichts. Eine Sperre meldet es ab und weist es ab, bis sie aufgehoben wird.
By\ submitting\ you\ confirm\ that\ all\ of\ this\ is\ true\ and\ that\ the\ documents\ are\ your\ own.=Mit dem Absenden best\u00e4tigst du, dass alles stimmt und die Dokumente deine eigenen sind.
The\ payment\ provider's\ own\ page\ opens\ in\ your\ browser.\ Savor\ never\ sees\ the\ number.\ Come\ back\ here\ when\ you\ have\ finished.=Die Seite des Zahlungsanbieters \u00f6ffnet sich im Browser. Savor sieht die Nummer nie. Komm hierher zur\u00fcck, wenn du fertig bist.
This\ server\ takes\ no\ real\ payments.\ Use\ the\ test\ card\ 4242\ 4242\ 4242\ 4242\ with\ any\ date\ ahead\ and\ any\ three\ digits.=Dieser Server nimmt keine echten Zahlungen an. Nutze die Testkarte 4242 4242 4242 4242 mit einem beliebigen k\u00fcnftigen Datum und drei beliebigen Ziffern.
Your\ sign-in,\ your\ profile,\ your\ saved\ cards\ and\ your\ settings\ are\ removed\ for\ good.\ Deliveries\ you\ took\ stay\ in\ the\ service's\ records\ without\ your\ name.=Deine Anmeldung, dein Profil, deine gespeicherten Karten und deine Einstellungen werden endg\u00fcltig entfernt. Lieferungen, die du \u00fcbernommen hast, bleiben ohne deinen Namen in den Aufzeichnungen des Dienstes.
{0}\ is\ signed\ out\ everywhere\ and\ cannot\ sign\ in\ again\ until\ the\ block\ is\ lifted.={0} wird \u00fcberall abgemeldet und kann sich erst wieder anmelden, wenn die Sperre aufgehoben ist.
Share\ which\ screens\ and\ features\ are\ used.\ Never\ your\ name,\ places\ or\ payment\ details.=Teile, welche Bildschirme und Funktionen genutzt werden. Niemals deinen Namen, deine Orte oder deine Zahlungsdaten.
Savor\ can\ count\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ so\ that\ we\ can\ see\ what\ works\ and\ fix\ what\ does\ not.=Savor kann z\u00e4hlen, welche Bildschirme ge\u00f6ffnet und welche Funktionen genutzt werden, damit wir sehen, was funktioniert, und beheben k\u00f6nnen, was nicht funktioniert.
With\ usage\ statistics\ turned\ on,\ the\ app\ also\ counts\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ and\ reports\ that\ to\ Codename\ One's\ analytics\ service\ under\ a\ made-up\ id\ for\ this\ device.\ Your\ name,\ e-mail,\ phone\ number,\ places\ and\ card\ details\ are\ never\ part\ of\ it,\ and\ turning\ it\ off\ in\ Settings\ stops\ it.=Sind die Nutzungsstatistiken eingeschaltet, z\u00e4hlt die App au\u00dferdem, welche Bildschirme ge\u00f6ffnet und welche Funktionen genutzt werden, und meldet das unter einer f\u00fcr dieses Ger\u00e4t erfundenen Kennung an den Analysedienst von Codename One. Dein Name, deine E-Mail-Adresse, deine Telefonnummer, deine Orte und deine Kartendaten geh\u00f6ren nie dazu, und wenn du sie in den Einstellungen ausschaltest, h\u00f6rt es auf.
Your\ position\ is\ sent\ only\ to\ the\ server\ you\ signed\ in\ to\:\ to\ show\ what\ delivers\ to\ you\ and,\ while\ you\ deliver,\ to\ offer\ you\ orders.\ Your\ settings\ are\ kept\ with\ your\ account\ on\ that\ server.=Dein Standort geht nur an den Server, bei dem du angemeldet bist: um zu zeigen, was zu dir liefert, und dir beim Ausliefern Bestellungen anzubieten. Deine Einstellungen werden mit deinem Konto auf diesem Server gespeichert.
Couriers\ apply\ after\ signing\ up\:\ a\ few\ details\ about\ you\ and\ your\ bike\ or\ scooter,\ and\ a\ few\ photos.\ You\ can\ order\ in\ the\ meantime.=Kuriere bewerben sich nach der Anmeldung: ein paar Angaben zu dir und deinem Fahrrad oder Roller und ein paar Fotos. In der Zwischenzeit kannst du bestellen.
Tell\ us\ about\ you\ and\ your\ vehicle,\ add\ five\ photos,\ and\ we\ take\ it\ from\ there.=Erz\u00e4hl uns von dir und deinem Fahrzeug, f\u00fcge f\u00fcnf Fotos hinzu, und wir k\u00fcmmern uns um den Rest.
The\ service\ fee\ is\ a\ share\ of\ the\ food,\ paid\ by\ the\ customer.\ The\ commission\ is\ kept\ from\ what\ the\ restaurant\ is\ paid.=Die Servicegeb\u00fchr ist ein Anteil am Essen und wird vom Kunden bezahlt. Die Provision wird von dem einbehalten, was das Restaurant erh\u00e4lt.
The\ customer,\ the\ kitchen\ and\ the\ courier\ are\ all\ told,\ and\ nobody\ is\ charged.=Kunde, K\u00fcche und Kurier werden benachrichtigt, und niemandem wird etwas berechnet.
Good\ food\ from\ places\ nearby,\ brought\ to\ your\ door.=Gutes Essen aus der Nachbarschaft, direkt an deine T\u00fcr.
