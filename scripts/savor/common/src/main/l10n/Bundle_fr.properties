The\ address\ of\ the\ Savor\ server\ this\ app\ talks\ to.\ Changing\ it\ signs\ you\ out.=L'adresse du serveur Savor utilis\u00e9 par cette application. La modifier vous d\u00e9connecte.
Savor\ is\ a\ sample.\ No\ real\ deliveries\ are\ booked,\ no\ real\ couriers\ are\ sent\ and\ no\ money\ changes\ hands.=Savor est un exemple. Aucune livraison r\u00e9elle n'est r\u00e9serv\u00e9e, aucun livreur r\u00e9el n'est envoy\u00e9 et aucun argent n'est \u00e9chang\u00e9.
This\ is\ a\ development\ server,\ so\ no\ text\ was\ sent.\ Your\ code\ is\ {0}.=Ceci est un serveur de d\u00e9veloppement, aucun SMS n'a donc \u00e9t\u00e9 envoy\u00e9. Votre code est {0}.
A\ flag\ marks\ the\ account\ for\ the\ admins\ and\ changes\ nothing\ for\ its\ owner.\ A\ block\ signs\ it\ out\ and\ refuses\ it\ until\ lifted.=Un signalement d\u00e9signe le compte aux administrateurs et ne change rien pour son titulaire. Un blocage le d\u00e9connecte et le refuse jusqu'\u00e0 sa lev\u00e9e.
By\ submitting\ you\ confirm\ that\ all\ of\ this\ is\ true\ and\ that\ the\ documents\ are\ your\ own.=En envoyant, vous confirmez que tout ceci est exact et que les documents sont les v\u00f4tres.
The\ payment\ provider's\ own\ page\ opens\ in\ your\ browser.\ Savor\ never\ sees\ the\ number.\ Come\ back\ here\ when\ you\ have\ finished.=La page du prestataire de paiement s'ouvre dans votre navigateur. Savor ne voit jamais le num\u00e9ro. Revenez ici une fois termin\u00e9.
This\ server\ takes\ no\ real\ payments.\ Use\ the\ test\ card\ 4242\ 4242\ 4242\ 4242\ with\ any\ date\ ahead\ and\ any\ three\ digits.=Ce serveur n'accepte aucun paiement r\u00e9el. Utilisez la carte de test 4242 4242 4242 4242 avec une date future et trois chiffres quelconques.
Your\ sign-in,\ your\ profile,\ your\ saved\ cards\ and\ your\ settings\ are\ removed\ for\ good.\ Deliveries\ you\ took\ stay\ in\ the\ service's\ records,\ under\ the\ email\ address\ you\ signed\ in\ with.=Votre connexion, votre profil, vos cartes enregistr\u00e9es et vos r\u00e9glages sont supprim\u00e9s d\u00e9finitivement. Vos livraisons restent dans les registres du service, sous l'adresse e-mail avec laquelle vous vous connectiez.
{0}\ is\ signed\ out\ everywhere\ and\ cannot\ sign\ in\ again\ until\ the\ block\ is\ lifted.={0} est d\u00e9connect\u00e9 partout et ne peut plus se connecter tant que le blocage n'est pas lev\u00e9.
Share\ which\ screens\ and\ features\ are\ used.\ Never\ your\ name,\ places\ or\ payment\ details.=Partagez quels \u00e9crans et quelles fonctions sont utilis\u00e9s. Jamais votre nom, vos lieux ni vos donn\u00e9es de paiement.
Savor\ can\ count\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ so\ that\ we\ can\ see\ what\ works\ and\ fix\ what\ does\ not.=Savor peut compter quels \u00e9crans sont ouverts et quelles fonctions sont utilis\u00e9es, pour que nous puissions voir ce qui marche et corriger ce qui ne marche pas.
With\ usage\ statistics\ turned\ on,\ the\ app\ also\ counts\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ and\ reports\ that\ to\ Codename\ One's\ analytics\ service\ under\ a\ made-up\ id\ for\ this\ device.\ Your\ name,\ e-mail,\ phone\ number,\ places\ and\ card\ details\ are\ never\ part\ of\ it,\ and\ turning\ it\ off\ in\ Settings\ stops\ it.=Lorsque les statistiques d'utilisation sont activ\u00e9es, l'application compte aussi quels \u00e9crans sont ouverts et quelles fonctions sont utilis\u00e9es, et le transmet au service d'analyse de Codename One sous un identifiant invent\u00e9 pour cet appareil. Votre nom, votre e-mail, votre num\u00e9ro de t\u00e9l\u00e9phone, vos lieux et les donn\u00e9es de votre carte n'en font jamais partie, et les d\u00e9sactiver dans R\u00e9glages y met fin.
Your\ position\ is\ sent\ to\ the\ server\ you\ signed\ in\ to\:\ to\ show\ what\ delivers\ to\ you\ and,\ while\ you\ deliver,\ to\ offer\ you\ orders.\ Two\ public\ map\ services\ see\ points\ too\:\ the\ app\ asks\ OSRM\ for\ the\ route\ between\ the\ two\ ends\ of\ a\ delivery,\ and\ the\ server\ asks\ Photon\ to\ find\ the\ addresses\ you\ search\ for\ and\ to\ name\ the\ place\ you\ are\ at.\ Your\ settings\ are\ kept\ with\ your\ account\ on\ that\ server.=Votre position est envoy\u00e9e au serveur auquel vous \u00eates connect\u00e9 : pour montrer ce qui vous livre et, quand vous livrez, vous proposer des commandes. Deux services de cartes publics voient aussi des points : l\u2019app demande \u00e0 OSRM l\u2019itin\u00e9raire entre les deux bouts d\u2019une livraison, et le serveur demande \u00e0 Photon les adresses que vous cherchez et le nom de l\u2019endroit o\u00f9 vous \u00eates. Vos r\u00e9glages sont conserv\u00e9s avec votre compte sur ce serveur.
Couriers\ apply\ after\ signing\ up\:\ a\ few\ details\ about\ you\ and\ your\ bike\ or\ scooter,\ and\ a\ few\ photos.\ You\ can\ order\ in\ the\ meantime.=Les livreurs postulent apr\u00e8s l\u2019inscription : quelques informations sur vous et votre v\u00e9lo ou scooter, et quelques photos. En attendant, vous pouvez commander.
Tell\ us\ about\ you\ and\ your\ vehicle,\ add\ five\ photos,\ and\ we\ take\ it\ from\ there.=Parlez-nous de vous et de votre v\u00e9hicule, ajoutez cinq photos, et nous nous occupons du reste.
The\ service\ fee\ is\ a\ share\ of\ the\ food,\ paid\ by\ the\ customer.\ The\ commission\ is\ kept\ from\ what\ the\ restaurant\ is\ paid.=Les frais de service sont une part du prix des plats, pay\u00e9e par le client. La commission est retenue sur ce que re\u00e7oit le restaurant.
The\ customer,\ the\ kitchen\ and\ the\ courier\ are\ all\ told,\ and\ nobody\ is\ charged.=Le client, la cuisine et le livreur sont tous pr\u00e9venus, et personne n\u2019est d\u00e9bit\u00e9.
Good\ food\ from\ places\ nearby,\ brought\ to\ your\ door.=De bons plats des adresses du quartier, livr\u00e9s \u00e0 votre porte.
