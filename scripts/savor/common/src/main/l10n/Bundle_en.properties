With\ usage\ statistics\ turned\ on,\ the\ app\ also\ counts\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ and\ reports\ that\ to\ Codename\ One's\ analytics\ service\ under\ a\ made-up\ id\ for\ this\ device.\ Your\ name,\ e-mail,\ phone\ number,\ places\ and\ card\ details\ are\ never\ part\ of\ it,\ and\ turning\ it\ off\ in\ Settings\ stops\ it.=With usage statistics turned on, the app also counts which screens are opened and which features are used, and reports that to Codename One's analytics service under a made-up id for this device. Your name, e-mail, phone number, places and card details are never part of it, and turning it off in Settings stops it.
Your\ position\ is\ sent\ to\ the\ server\ you\ signed\ in\ to\:\ to\ show\ what\ delivers\ to\ you\ and,\ while\ you\ deliver,\ to\ offer\ you\ orders.\ Two\ public\ map\ services\ see\ points\ too\:\ the\ app\ asks\ OSRM\ for\ the\ route\ between\ the\ two\ ends\ of\ a\ delivery,\ and\ the\ server\ asks\ Photon\ to\ find\ the\ addresses\ you\ search\ for\ and\ to\ name\ the\ place\ you\ are\ at.\ Your\ settings\ are\ kept\ with\ your\ account\ on\ that\ server.=Your position is sent to the server you signed in to: to show what delivers to you and, while you deliver, to offer you orders. Two public map services see points too: the app asks OSRM for the route between the two ends of a delivery, and the server asks Photon to find the addresses you search for and to name the place you are at. Your settings are kept with your account on that server.
