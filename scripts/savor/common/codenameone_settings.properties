codename1.arg.desktop.interactiveScrollbars=true
codename1.arg.desktop.titleBar=native
codename1.arg.ios.newStorageLocation=true
# What iOS shows when someone applying to drive photographs a document.
codename1.arg.ios.NSCameraUsageDescription=The camera photographs the documents of your application to drive.
# What iOS shows when they pick a picture of a document they already have.
codename1.arg.ios.NSPhotoLibraryUsageDescription=Your photo library is where you pick a picture of a document from.
# What iOS shows before Face ID unlocks the sign-in kept in secure storage.
codename1.arg.ios.NSFaceIDUsageDescription=Authenticate to securely access your account
# What iOS shows when the app first asks where the device is.
codename1.arg.ios.NSLocationWhenInUseUsageDescription=Your location is where a delivery picks you up, and where customers find you while you drive.
# While a courier is online the app keeps reporting where they are from the
# background: iOS needs the location background mode and the Always prompt's
# text, Android a foreground service of the location type.
codename1.arg.ios.background_modes=location
codename1.arg.ios.locationUsageDescription=Your location is where a delivery picks you up, and where customers find you while you drive.
codename1.arg.ios.NSLocationAlwaysAndWhenInUseUsageDescription=While you are online as a courier, Savor keeps sharing your location with customers and dispatch, even with the app in the background.
codename1.arg.android.foregroundServiceType=location
# Push notifications. With push included the build adds the
# remote-notification background mode and the push entitlement itself.
codename1.arg.ios.includePush=true
# Android push is off until the app has its Firebase file: a build that
# uses PushClient without google-services.json stops with an error. Once
# native/android/google-services.json is in place, delete this line.
codename1.arg.android.messagingService=none
# The delivery on the lock screen updates as the courier moves.
codename1.arg.ios.surfaces.frequentUpdates=true
