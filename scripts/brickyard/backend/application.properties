cn1.datasource.url=${DATABASE_URL}
cn1.server.port=8080
cn1.security.schema.enabled=true
# Behind a load balancer, believe X-Forwarded-For from it (the referral
# network check and rate limits key on the client address):
# cn1.server.forwardHeaders=true
# cn1.server.trustedProxies=10.0.0.0/8
# Store receipts (each also readable from the environment, e.g.
# BRICKYARD_IAP_APPLE_SHARED_SECRET): brickyard.iap.apple.shared-secret,
# brickyard.iap.apple.bundle-id, brickyard.iap.google.package-name,
# brickyard.iap.google.service-account-key, brickyard.iap.notification-secret
# Store refunds: point App Store Server Notifications V2 at
# https://<host>/api/store/notifications/apple and the Google Play Pub/Sub push
# subscription at https://<host>/api/store/notifications/google. Both are
# authenticated by the stores' signatures, not by a secret in the URL:
# - brickyard.iap.apple.root-ca: a path to Apple Root CA G3 (DER or PEM, from
#   apple.com/certificateauthority). Every signedPayload must chain to exactly
#   that certificate and name brickyard.iap.apple.bundle-id.
# - brickyard.iap.google.push-audience: the audience set on the push
#   subscription's authentication; its OIDC token is checked against Google's
#   keys. brickyard.iap.google.push-service-account (optional): the service
#   account the subscription pushes as.
# A store left unconfigured answers 503, except on a dev or test profile.
# The first administrator of a new deployment: e-mail addresses that register as
# ADMIN (comma separated). brickyard.bootstrap-admins=admin@example.com
