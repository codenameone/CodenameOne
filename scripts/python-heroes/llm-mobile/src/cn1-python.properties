# What this build leaves out of the packages it translates. Each of these
# functions runs Python source handed to it as text (a --functions argument,
# a sqlite-utils convert expression, a migrations file), which a translated
# program cannot do; the application never calls them. One that is called
# raises, naming itself.
remove=llm.cli._tools_from_code
remove=sqlite_utils.cli._load_migration_sets
remove=sqlite_utils.cli._register_functions
remove=sqlite_utils.cli._rows_from_code
remove=sqlite_utils.utils._compile_code
