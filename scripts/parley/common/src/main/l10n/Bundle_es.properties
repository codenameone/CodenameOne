Messages\ in\ these\ chats\ are\ not\ end-to-end\ encrypted.\ Bridges\ are\ off\ until\ the\ server\ is\ given\ a\ Telegram\ bot\ token\ or\ WhatsApp\ Cloud\ API\ credentials.=Los mensajes de estos chats no tienen cifrado de extremo a extremo. Los puentes est\u00e1n desactivados hasta que el servidor reciba un token de bot de Telegram o credenciales de la API de WhatsApp Cloud.
