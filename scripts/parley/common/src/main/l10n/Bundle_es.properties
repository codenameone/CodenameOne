Messages,\ photos,\ voice\ messages\ and\ calls\ are\ end-to-end\ encrypted\:\ they\ are\ encrypted\ on\ your\ device\ for\ each\ device\ of\ the\ people\ you\ talk\ to,\ and\ the\ server\ you\ signed\ in\ to\ stores\ only\ ciphertext\ until\ each\ device\ has\ fetched\ it.\ It\ does\ know\ who\ you\ talk\ to\ and\ when,\ your\ name,\ number\ and\ settings.\ Chats\ linked\ to\ Telegram\ or\ WhatsApp,\ and\ the\ demo\ bot,\ are\ not\ end-to-end\ encrypted,\ and\ say\ so.=Los mensajes, fotos, mensajes de voz y llamadas tienen cifrado de extremo a extremo: se cifran en tu dispositivo para cada dispositivo de las personas con las que hablas, y el servidor en el que iniciaste sesi\u00f3n solo guarda texto cifrado hasta que cada dispositivo lo recoge. S\u00ed sabe con qui\u00e9n hablas y cu\u00e1ndo, tu nombre, tu n\u00famero y tus ajustes. Los chats enlazados con Telegram o WhatsApp y el bot de demostraci\u00f3n no tienen cifrado de extremo a extremo, y lo indican.
