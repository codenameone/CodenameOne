Messages\ in\ a\ chat\ with\ a\ timer\ are\ deleted\ from\ every\ phone\ in\ it\ when\ the\ timer\ runs\ out,\ and\ from\ the\ server\ if\ nobody\ fetched\ them.=Nachrichten in einem Chat mit Timer werden nach Ablauf von allen Telefonen darin gel\u00f6scht, und vom Server, falls sie niemand abgerufen hat.
Messages\ in\ these\ chats\ are\ not\ end-to-end\ encrypted.\ Bridges\ are\ off\ until\ the\ server\ is\ given\ a\ Telegram\ bot\ token\ or\ WhatsApp\ Cloud\ API\ credentials.=Nachrichten in diesen Chats sind nicht Ende-zu-Ende-verschl\u00fcsselt. Br\u00fccken sind aus, bis der Server ein Telegram-Bot-Token oder WhatsApp-Cloud-API-Zugangsdaten erh\u00e4lt.
