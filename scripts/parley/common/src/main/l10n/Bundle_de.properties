Messages,\ photos,\ voice\ messages\ and\ calls\ are\ end-to-end\ encrypted\:\ they\ are\ encrypted\ on\ your\ device\ for\ each\ device\ of\ the\ people\ you\ talk\ to,\ and\ the\ server\ you\ signed\ in\ to\ stores\ only\ ciphertext\ until\ each\ device\ has\ fetched\ it.\ It\ does\ know\ who\ you\ talk\ to\ and\ when,\ your\ name,\ number\ and\ settings.\ Chats\ linked\ to\ Telegram\ or\ WhatsApp,\ and\ the\ demo\ bot,\ are\ not\ end-to-end\ encrypted,\ and\ say\ so.=Nachrichten, Fotos, Sprachnachrichten und Anrufe sind Ende-zu-Ende-verschl\u00fcsselt: Sie werden auf deinem Ger\u00e4t f\u00fcr jedes Ger\u00e4t deiner Gespr\u00e4chspartner verschl\u00fcsselt, und der Server, bei dem du angemeldet bist, speichert nur Chiffretext, bis jedes Ger\u00e4t ihn abgerufen hat. Er wei\u00df aber, mit wem du wann sprichst, sowie deinen Namen, deine Nummer und deine Einstellungen. Mit Telegram oder WhatsApp verbundene Chats und der Demo-Bot sind nicht Ende-zu-Ende-verschl\u00fcsselt und weisen darauf hin.
