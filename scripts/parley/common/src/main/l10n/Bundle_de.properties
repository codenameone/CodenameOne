Messages\ are\ encrypted\ for\ each\ of\ these\ separately.\ Sign\ in\ on\ a\ new\ phone\ or\ in\ a\ browser\ and\ it\ appears\ here;\ it\ sees\ what\ is\ sent\ from\ then\ on,\ not\ what\ came\ before.=Nachrichten werden f\u00fcr jedes dieser Ger\u00e4te separat verschl\u00fcsselt. Melde dich auf einem neuen Telefon oder in einem Browser an, und es erscheint hier; es sieht, was ab dann gesendet wird, nicht was davor war.
