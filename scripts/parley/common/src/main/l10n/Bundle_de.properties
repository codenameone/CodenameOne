With\ usage\ statistics\ turned\ on,\ the\ app\ also\ counts\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ and\ reports\ that\ to\ Codename\ One's\ analytics\ service\ under\ a\ made-up\ id\ for\ this\ device.\ Your\ name,\ e-mail,\ phone\ number,\ contacts\ and\ messages\ are\ never\ part\ of\ it,\ and\ turning\ it\ off\ in\ Settings\ stops\ it.=Bei aktivierten Nutzungsstatistiken z\u00e4hlt die App auch, welche Bildschirme ge\u00f6ffnet und welche Funktionen genutzt werden, und meldet das unter einer erfundenen ID f\u00fcr dieses Ger\u00e4t an den Analysedienst von Codename One. Dein Name, deine E-Mail, Telefonnummer, Kontakte und Nachrichten sind nie Teil davon, und das Abschalten in den Einstellungen stoppt es.
