Your\ name\ and\ photo\ are\ seen\ by\ the\ people\ you\ talk\ to.\ Who\ sees\ your\ photo\ and\ when\ you\ were\ last\ online\ is\ up\ to\ you,\ in\ Privacy.=Dein Name und dein Foto sind f\u00fcr deine Gespr\u00e4chspartner sichtbar. Wer dein Foto sieht und wann du zuletzt online warst, bestimmst du unter Datenschutz.
