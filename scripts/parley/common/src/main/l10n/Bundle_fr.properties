Messages\ in\ a\ chat\ with\ a\ timer\ are\ deleted\ from\ every\ phone\ in\ it\ when\ the\ timer\ runs\ out,\ and\ from\ the\ server\ if\ nobody\ fetched\ them.=Les messages d'une discussion avec minuteur sont supprim\u00e9s de tous les t\u00e9l\u00e9phones concern\u00e9s \u00e0 l'expiration du minuteur, et du serveur si personne ne les a r\u00e9cup\u00e9r\u00e9s.
Messages\ in\ these\ chats\ are\ not\ end-to-end\ encrypted.\ Bridges\ are\ off\ until\ the\ server\ is\ given\ a\ Telegram\ bot\ token\ or\ WhatsApp\ Cloud\ API\ credentials.=Les messages de ces discussions ne sont pas chiffr\u00e9s de bout en bout. Les passerelles sont d\u00e9sactiv\u00e9es tant que le serveur n'a pas re\u00e7u un jeton de bot Telegram ou des identifiants de l'API WhatsApp Cloud.
