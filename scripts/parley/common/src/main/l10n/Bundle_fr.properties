Messages,\ photos,\ voice\ messages\ and\ calls\ are\ end-to-end\ encrypted\:\ they\ are\ encrypted\ on\ your\ device\ for\ each\ device\ of\ the\ people\ you\ talk\ to,\ and\ the\ server\ you\ signed\ in\ to\ stores\ only\ ciphertext\ until\ each\ device\ has\ fetched\ it.\ It\ does\ know\ who\ you\ talk\ to\ and\ when,\ your\ name,\ number\ and\ settings.\ Chats\ linked\ to\ Telegram\ or\ WhatsApp,\ and\ the\ demo\ bot,\ are\ not\ end-to-end\ encrypted,\ and\ say\ so.=Les messages, photos, messages vocaux et appels sont chiffr\u00e9s de bout en bout : ils sont chiffr\u00e9s sur votre appareil pour chaque appareil de vos interlocuteurs, et le serveur auquel vous vous \u00eates connect\u00e9 ne conserve que du texte chiffr\u00e9 jusqu'\u00e0 ce que chaque appareil l'ait r\u00e9cup\u00e9r\u00e9. Il sait en revanche \u00e0 qui vous parlez et quand, votre nom, votre num\u00e9ro et vos r\u00e9glages. Les discussions reli\u00e9es \u00e0 Telegram ou WhatsApp, ainsi que le bot de d\u00e9monstration, ne sont pas chiffr\u00e9es de bout en bout, et l'indiquent.
