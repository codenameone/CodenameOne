Messages\ and\ calls\ are\ end-to-end\ encrypted.\ Nobody\ outside\ this\ chat,\ not\ even\ the\ server,\ can\ read\ them.=Les messages et les appels sont chiffr\u00e9s de bout en bout. Personne en dehors de cette discussion, pas m\u00eame le serveur, ne peut les lire.
Messages\ are\ encrypted\ for\ each\ of\ these\ separately.\ Sign\ in\ on\ a\ new\ phone\ or\ in\ a\ browser\ and\ it\ appears\ here;\ it\ sees\ what\ is\ sent\ from\ then\ on,\ not\ what\ came\ before.=Les messages sont chiffr\u00e9s s\u00e9par\u00e9ment pour chacun d'eux. Connectez-vous sur un nouveau t\u00e9l\u00e9phone ou dans un navigateur et il appara\u00eet ici ; il voit ce qui est envoy\u00e9 \u00e0 partir de ce moment, pas ce qui pr\u00e9c\u00e8de.
