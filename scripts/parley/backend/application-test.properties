# The test profile, chosen with CN1_PROFILE=test. It is what run-e2e.sh starts the
# server on for the app's end-to-end tests, and what @BackendTest runs the
# server's own tests on.
#
# Like `dev` -- an in-memory database, the demo accounts, text messages that are
# printed and not sent -- and one thing more: push notifications are recorded
# for the tests to read. No STUN server is offered, so a test run reaches
# nothing outside this machine.
cn1.datasource.url=:memory:

# The tests sign several accounts in from one address, one after another, which
# is exactly what the sign-in rate limit is there to stop.
parley.signin.per-minute=1000

# Codes printed on the console (and handed back to the test as demoCode): no
# test reaches an SMS provider.
parley.sms.provider=console

# Push notifications are kept for the tests to read, not sent.
parley.push.provider=recording

# Calls are relayed between the test's own clients; no STUN server is needed.
parley.ice.stun=

# Both bridges are configured, so the tests can drive their webhooks, and both
# point at a port nothing listens on: a message going out fails at once, on
# this machine, and is logged.
parley.telegram.token=test-token
parley.telegram.secret=test-telegram-secret-0123
parley.telegram.bot=ParleyTestBot
parley.telegram.api=http://127.0.0.1:9
parley.whatsapp.token=test-token
parley.whatsapp.phone=1000
parley.whatsapp.secret=test-whatsapp-app-secret
parley.whatsapp.verify=test-verify
parley.whatsapp.api=http://127.0.0.1:9
