# The settings this server reads at start-up, and the layer with the lowest
# precedence. A system property of the same name wins over anything here, then
# the environment variable the key maps to (cn1.datasource.url is read from
# CN1_DATASOURCE_URL, and also from DATABASE_URL, which is what a platform sets
# for you), then application-<profile>.properties, then this file.
#
# It sits in the module root on purpose. This runtime has no classpath to load a
# resource from, so Config opens application*.properties as FILES relative to the
# working directory: the module directory under `cn1:backend`, and wherever the
# binary is started once it is packaged.
#
# Choose a profile with CN1_PROFILE. The one beside this file is `dev`:
#
#     CN1_PROFILE=dev mvn -pl backend -Dcodename1.platform=backend cn1:backend
#
# A development profile (dev, test, local) needs nothing else: an in-memory
# database, a signing key made at start-up, text messages printed on the
# console, and a set of demo accounts that share a few groups, plus a bot that
# answers. A real deployment sets, here or in its environment:
#
#     cn1.datasource.url                          the database
#     cn1.security.authorizationserver.issuer     the public address of this server
#     cn1.security.authorizationserver.jwk.keys   the key tokens are signed with
#     parley.admin.email, parley.admin.password the first admin, who grants the rest
#     parley.sms.provider and its settings       below
#     parley.push.app, parley.push.key          push notifications, below
#     parley.ice.*                               the call servers, below
#
# and may link conversations to Telegram and WhatsApp (parley.telegram.*,
# parley.whatsapp.*, below).
#
# Text messages. parley.sms.provider names the provider verification codes are
# sent through:
#
#     twilio        parley.sms.twilio.sid, parley.sms.twilio.token,
#                   parley.sms.twilio.from
#     vonage        parley.sms.vonage.key, parley.sms.vonage.secret,
#                   parley.sms.vonage.from
#     messagebird   parley.sms.messagebird.key, parley.sms.messagebird.originator
#
# Secrets belong in the environment, not in this file: every key here is also
# read from the variable it maps to, upper case with dots as underscores --
#
#     PARLEY_SMS_TWILIO_TOKEN                    and so on
#
# Push notifications. parley.push.provider is cloud, console or recording;
# unset, it is console on a development profile and cloud on any other, which
# sends through Codename One's push servers and needs
#
#     parley.push.app     the app's push id
#     parley.push.key     a server key with the push scope; put it in the
#                          environment as PARLEY_PUSH_KEY, like the other secrets
#
# A push never carries a message: it only wakes the app, which fetches what
# is waiting over its own connection.
#
# Calls. The apps connect to each other directly when they can and through a
# TURN server when they cannot, which on mobile networks is often.
#
#     parley.ice.stun     STUN servers, comma separated; a public one by default
#     parley.ice.turn     TURN servers, comma separated (turn:host:3478,turns:host:5349)
#     parley.ice.secret   the secret shared with the TURN server: coturn's
#                          static-auth-secret, with use-auth-secret on
#     parley.ice.ttl      how long a TURN credential lasts, in seconds (86400)
#
# Bridges. A group or a channel can be linked to a Telegram group or a WhatsApp
# number; a bridged conversation is not end-to-end encrypted, and the app says
# so. Each bridge is off until it is configured.
#
#     parley.telegram.token    the bot's token, from BotFather
#     parley.telegram.secret   a random string of 16 or more characters, used
#                              as the webhook path and as setWebhook's
#                              secret_token: /bridge/telegram/<secret>
#     parley.telegram.bot      the bot's user name, which the app shows
#     parley.whatsapp.token    a Cloud API access token
#     parley.whatsapp.phone    the phone number id the messages go from
#     parley.whatsapp.secret   the Meta app's secret, which signs the webhook
#     parley.whatsapp.verify   the verify token given when subscribing
#                              /bridge/whatsapp

# ${DATABASE_URL} is resolved when the value is READ, so this line is fine in a
# checkout where that variable is unset: the dev profile overrides the key, and
# nothing reads this one. SQLite (a file path), postgres:// and mysql:// all work.
cn1.datasource.url=${DATABASE_URL}

# The port. A platform that sets PORT wins over this, which is what lets the same
# build deploy anywhere.
cn1.server.port=8080

# Creates the tables the accounts, the registered app and the tokens are kept in.
# Read by the build, so it has to be here and not in a profile's file.
cn1.security.schema.enabled=true
