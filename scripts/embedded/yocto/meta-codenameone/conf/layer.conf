# meta-codenameone: builds Codename One applications into a Yocto image.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "codenameone"
BBFILE_PATTERN_codenameone = "^${LAYERDIR}/"
BBFILE_PRIORITY_codenameone = "6"
LAYERDEPENDS_codenameone = "core"
LAYERSERIES_COMPAT_codenameone = "kirkstone scarthgap styhead walnascar"
