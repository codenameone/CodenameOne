[package]
name = "slintgauge"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "=1.8.0", default-features = false, features = ["compat-1-2", "std", "renderer-software", "software-renderer-systemfonts"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
