The\ address\ of\ the\ Pulse\ server\ this\ app\ talks\ to.\ Changing\ it\ signs\ you\ out.=Die Adresse des Pulse-Servers, mit dem diese App spricht. Eine \u00c4nderung meldet dich ab.
