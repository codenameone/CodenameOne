The\ address\ of\ the\ Pulse\ server\ this\ app\ talks\ to.\ Changing\ it\ signs\ you\ out.=La direcci\u00f3n del servidor Pulse que usa esta app. Cambiarla cierra tu sesi\u00f3n.
Pulse\ is\ a\ sample.\ No\ real\ deliveries\ are\ booked,\ no\ real\ couriers\ are\ sent\ and\ no\ money\ changes\ hands.=Pulse es un ejemplo. No se reservan entregas reales, no se env\u00edan repartidores reales y no se mueve dinero.
This\ is\ a\ development\ server,\ so\ no\ text\ was\ sent.\ Your\ code\ is\ {0}.=Este es un servidor de desarrollo, as\u00ed que no se envi\u00f3 ning\u00fan SMS. Tu c\u00f3digo es {0}.
A\ flag\ marks\ the\ account\ for\ the\ admins\ and\ changes\ nothing\ for\ its\ owner.\ A\ block\ signs\ it\ out\ and\ refuses\ it\ until\ lifted.=Una marca se\u00f1ala la cuenta a los administradores y no cambia nada para su due\u00f1o. Un bloqueo cierra su sesi\u00f3n y la rechaza hasta que se levante.
By\ submitting\ you\ confirm\ that\ all\ of\ this\ is\ true\ and\ that\ the\ documents\ are\ your\ own.=Al enviar confirmas que todo esto es cierto y que los documentos son tuyos.
The\ payment\ provider's\ own\ page\ opens\ in\ your\ browser.\ Pulse\ never\ sees\ the\ number.\ Come\ back\ here\ when\ you\ have\ finished.=La p\u00e1gina del proveedor de pagos se abre en tu navegador. Pulse nunca ve el n\u00famero. Vuelve aqu\u00ed cuando termines.
This\ server\ takes\ no\ real\ payments.\ Use\ the\ test\ card\ 4242\ 4242\ 4242\ 4242\ with\ any\ date\ ahead\ and\ any\ three\ digits.=Este servidor no acepta pagos reales. Usa la tarjeta de prueba 4242 4242 4242 4242 con cualquier fecha futura y tres d\u00edgitos cualesquiera.
Your\ sign-in,\ your\ profile,\ your\ saved\ cards\ and\ your\ settings\ are\ removed\ for\ good.\ Deliveries\ you\ took\ stay\ in\ the\ service's\ records,\ under\ the\ email\ address\ you\ signed\ in\ with.=Tu acceso, tu perfil, tus tarjetas guardadas y tus ajustes se eliminan para siempre. Las entregas que hiciste quedan en los registros del servicio, con el correo con el que iniciabas sesi\u00f3n.
{0}\ is\ signed\ out\ everywhere\ and\ cannot\ sign\ in\ again\ until\ the\ block\ is\ lifted.={0} queda sin sesi\u00f3n en todas partes y no puede volver a entrar hasta que se levante el bloqueo.
Share\ which\ screens\ and\ features\ are\ used.\ Never\ your\ name,\ places\ or\ payment\ details.=Comparte qu\u00e9 pantallas y funciones se usan. Nunca tu nombre, tus lugares ni tus datos de pago.
Pulse\ can\ count\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ so\ that\ we\ can\ see\ what\ works\ and\ fix\ what\ does\ not.=Pulse puede contar qu\u00e9 pantallas se abren y qu\u00e9 funciones se usan, para que podamos ver qu\u00e9 funciona y arreglar lo que no.
With\ usage\ statistics\ turned\ on,\ the\ app\ also\ counts\ which\ screens\ are\ opened\ and\ which\ features\ are\ used,\ and\ reports\ that\ to\ Codename\ One's\ analytics\ service\ under\ a\ made-up\ id\ for\ this\ device.\ Your\ name,\ e-mail,\ phone\ number,\ places\ and\ card\ details\ are\ never\ part\ of\ it,\ and\ turning\ it\ off\ in\ Settings\ stops\ it.=Con las estad\u00edsticas de uso activadas, la app tambi\u00e9n cuenta qu\u00e9 pantallas se abren y qu\u00e9 funciones se usan, y lo env\u00eda al servicio de anal\u00edtica de Codename One con un identificador inventado para este dispositivo. Tu nombre, correo electr\u00f3nico, n\u00famero de tel\u00e9fono, lugares y datos de tarjeta nunca forman parte de ello, y al desactivarlas en Ajustes deja de hacerlo.
Your\ position\ is\ sent\ to\ the\ server\ you\ signed\ in\ to\:\ to\ show\ what\ delivers\ to\ you\ and,\ while\ you\ deliver,\ to\ offer\ you\ orders.\ Two\ public\ map\ services\ see\ points\ too\:\ the\ app\ asks\ OSRM\ for\ the\ route\ between\ the\ two\ ends\ of\ a\ delivery,\ and\ the\ server\ asks\ Photon\ to\ find\ the\ addresses\ you\ search\ for\ and\ to\ name\ the\ place\ you\ are\ at.\ Your\ settings\ are\ kept\ with\ your\ account\ on\ that\ server.=Tu ubicaci\u00f3n se env\u00eda al servidor en el que iniciaste sesi\u00f3n: para mostrar qu\u00e9 te entrega y, mientras repartes, ofrecerte pedidos. Dos servicios de mapas p\u00fablicos tambi\u00e9n ven puntos: la app pide a OSRM la ruta entre los dos extremos de una entrega, y el servidor pide a Photon las direcciones que buscas y el nombre del lugar donde est\u00e1s. Tus ajustes se guardan con tu cuenta en ese servidor.
Couriers\ apply\ after\ signing\ up\:\ a\ few\ details\ about\ you\ and\ your\ bike\ or\ scooter,\ and\ a\ few\ photos.\ You\ can\ order\ in\ the\ meantime.=Los repartidores se postulan despu\u00e9s de registrarse: unos datos sobre ti y tu bici o moto, y unas fotos. Mientras tanto puedes pedir.
Tell\ us\ about\ you\ and\ your\ vehicle,\ add\ five\ photos,\ and\ we\ take\ it\ from\ there.=Cu\u00e9ntanos sobre ti y tu veh\u00edculo, a\u00f1ade cinco fotos y nosotros nos encargamos del resto.
The\ service\ fee\ is\ a\ share\ of\ the\ food,\ paid\ by\ the\ customer.\ The\ commission\ is\ kept\ from\ what\ the\ restaurant\ is\ paid.=La tarifa de servicio es una parte de la comida y la paga el cliente. La comisi\u00f3n se descuenta de lo que se paga al restaurante.
The\ customer,\ the\ kitchen\ and\ the\ courier\ are\ all\ told,\ and\ nobody\ is\ charged.=Se avisa al cliente, a la cocina y al repartidor, y no se cobra a nadie.
Good\ food\ from\ places\ nearby,\ brought\ to\ your\ door.=Buena comida de los sitios de tu zona, hasta tu puerta.
