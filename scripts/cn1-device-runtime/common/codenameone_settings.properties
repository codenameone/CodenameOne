# Shimming the whole Codename One API makes the build's bytecode scanner see
# every feature, so every credential-gated one has to be configured. A shipping
# device-runtime app supplies real values -- it wants those natives compiled in,
# because pushed code may use them. These placeholders exist so the sample app
# builds; nothing here calls Play billing or FCM at runtime.
codename1.arg.android.licenseKey=PLACEHOLDER_NOT_A_REAL_LVL_KEY
codename1.arg.android.messagingService=auto
codename1.arg.android.useAndroidX=true
codename1.arg.ios.interpHost=true
codename1.arg.ios.maps.provider=apple
codename1.arg.ios.newStorageLocation=true
codename1.arg.java.version=17
codename1.cssTheme=true
codename1.displayName=Codename One Instant
codename1.icon=icon.png
codename1.ios.appid=Q5GHSKAL2F.com.codenameone.devruntime
codename1.ios.certificate=
codename1.ios.certificatePassword=
codename1.ios.debug.certificate=
codename1.ios.debug.certificatePassword=
codename1.ios.debug.provision=
codename1.ios.provision=
codename1.ios.release.certificate=
codename1.ios.release.certificatePassword=
codename1.ios.release.provision=
codename1.j2me.nativeTheme=nbproject/nativej2me.res
# A pushed Kotlin class calls into the Kotlin stdlib on ordinary generated
# ops -- `Intrinsics.checkNotNullParameter` at every method entry -- and
# without the stdlib on the runtime app's classpath the first such call is
# a linkage error. Enable Kotlin so the plugin pulls the stdlib in, even
# though nothing in the runtime app is written in Kotlin.
codename1.kotlin=true
codename1.languageLevel=5
codename1.mainName=DeviceRuntimeApp
codename1.packageName=com.codenameone.devruntime
codename1.rim.certificatePassword=
codename1.rim.signtoolCsk=
codename1.rim.signtoolDb=
codename1.secondaryTitle=Java Playground
codename1.vendor=CodenameOne
codename1.version=1.0
# Android 8+. The default of 19 predates libraries the build injects, and a
# development tool has no reason to reach further back than the phones people
# actually debug on.
codename1.arg.android.min_sdk_version=26
codename1.arg.ios.featureScanExclude=com.codenameone.devruntime.gen
codename1.arg.ios.invite.appClip=false
