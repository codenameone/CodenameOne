# The settings this server reads at start-up, and the layer with the lowest
# precedence. A system property of the same name wins over anything here, then
# the environment variable the key maps to (cn1.datasource.url is read from
# CN1_DATASOURCE_URL, and also from DATABASE_URL, which is what a platform sets
# for you), then application-<profile>.properties, then this file.
#
# It sits in the module root on purpose. This runtime has no classpath to load a
# resource from, so Config opens application*.properties as FILES relative to the
# working directory: the module directory under `cn1:backend`, and wherever the
# binary is started once it is packaged.
#
# Choose a profile with CN1_PROFILE. The one beside this file is `dev`:
#
#     CN1_PROFILE=dev mvn -pl backend -Dcodename1.platform=backend cn1:backend
#
# A development profile (dev, test, local) needs nothing else: an in-memory
# database, a signing key made at start-up, text messages printed on the
# console, simulated cards, and a set of demo accounts with a fortnight of rides behind them. A real
# deployment sets, here or in its environment:
#
#     cn1.datasource.url                          the database
#     cn1.security.authorizationserver.issuer     the public address of this server
#     cn1.security.authorizationserver.jwk.keys   the key tokens are signed with
#     wayline.admin.email, wayline.admin.password the first admin, who grants the rest
#     wayline.sms.provider and its settings       below
#     wayline.payments.provider and its settings  below
#     wayline.push.app, wayline.push.key          push notifications, below
#
# and may change the fares (wayline.fare.*), the currency (wayline.currency) and
# the geocoder (wayline.geocoder.url).
#
# Text messages. wayline.sms.provider names the provider verification codes are
# sent through, and each needs its own settings:
#
#     twilio        wayline.sms.twilio.sid, wayline.sms.twilio.token,
#                   wayline.sms.twilio.from
#     vonage        wayline.sms.vonage.key, wayline.sms.vonage.secret,
#                   wayline.sms.vonage.from
#     messagebird   wayline.sms.messagebird.key, wayline.sms.messagebird.originator
#     console       prints the code; development profiles only
#
# Unset, it is console on a development profile and twilio on any other. A
# provider whose settings are missing is a configuration error: it is logged at
# start-up and on every send, naming the missing settings, and the app is told
# the code could not be sent. Nothing falls back to printing codes in
# production.
#
# Payments. wayline.payments.provider is simulated or stripe; unset, it is
# simulated on a development profile and stripe on any other. Simulated cards:
# 4242 4242 4242 4242 is accepted, 4000 0000 0000 0002 is declined, and nothing
# is charged. Stripe is an untested stub over Stripe's REST API, a starting
# point to try against a test-mode key: cards are added on Stripe's own page, so
# a card number never reaches the app or this server, and rides are charged
# when they complete. It needs the secret key, and without it every payment
# call fails with a configuration error in the log. Keep the key and the SMS
# credentials out of this file and out of the repository; set them in the
# environment of the deployment instead, where each setting is read in upper
# case with _ for every dot:
#
#     WAYLINE_PAYMENTS_STRIPE_SECRET              a restricted or secret key (sk_...)
#     WAYLINE_SMS_TWILIO_TOKEN                    and so on
#
# Stripe's page sends the browser back to /pay/return on this server when it is
# done, so the server has to know the address it is reached at from a phone. It
# uses cn1.security.authorizationserver.issuer, which a deployment sets anyway;
# wayline.public.url overrides that when the two differ.
#
# Push notifications. wayline.push.provider is cloud, console or recording;
# unset, it is recording on the test profile, console on the other development
# profiles and cloud on any other. cloud sends through the Codename One push
# service, which delivers to Firebase, Apple, Huawei and the browsers for you,
# and needs two settings from the Push section of the Codename One console:
#
#     wayline.push.app     the app's push id
#     wayline.push.key     a server key with the push scope; put it in the
#                          environment as WAYLINE_PUSH_KEY, like the other secrets
#
# Without them the server still starts and serves rides; the missing settings
# are logged at start-up and again for every notification that is not sent.
# wayline.push.activity.seconds (45) is how often, at most, a moving car
# updates the rider's Live Activity.
#
# The prices are settings only until an admin changes them in the app. From
# then on they are in the database (wayline.fare.* is the starting point, and
# wayline.fare.serviceFeePercent and wayline.fare.commissionPercent join it).

# ${DATABASE_URL} is resolved when the value is READ, so this line is fine in a
# checkout where that variable is unset: the dev profile overrides the key, and
# nothing reads this one. SQLite (a file path), postgres:// and mysql:// all work.
cn1.datasource.url=${DATABASE_URL}

# The port. A platform that sets PORT wins over this, which is what lets the same
# build deploy anywhere.
cn1.server.port=8080

# Creates the tables the accounts, the registered app and the tokens are kept in.
# Read by the build, so it has to be here and not in a profile's file.
cn1.security.schema.enabled=true
