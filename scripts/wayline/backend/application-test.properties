# The test profile, chosen with CN1_PROFILE=test. It is what run-e2e.sh starts the
# server on for the app's end-to-end tests, and what @BackendTest runs the
# server's own tests on.
#
# Like `dev` -- an in-memory database, the demo accounts, text messages that are
# logged and not sent -- and one thing more: places are looked up in a list of
# ten the server carries, so a test run asks no public geocoder for anything.
cn1.datasource.url=:memory:

# The tests sign several accounts in from one address, one after another, which
# is exactly what the sign-in rate limit is there to stop.
wayline.signin.per-minute=1000
