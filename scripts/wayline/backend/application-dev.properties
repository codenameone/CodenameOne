# The development profile, chosen with CN1_PROFILE=dev.
#
# An in-memory SQLite database, so the server starts with nothing installed: the
# migrations create the tables at start-up, and the demo accounts are added to
# them. Point this at a file to keep the data between runs:
#
#     cn1.datasource.url=./target/app.db
#
# Production points cn1.datasource.url at the real database instead -- a
# postgres:// or mysql:// URL -- and the same code runs against it.
cn1.datasource.url=:memory:

# On this profile the server also serves, without a token:
#
#     /manage/health, /manage/metrics, /manage/prometheus, /manage/jobs
#     /mcp  -- the development MCP tools, for an agent working on this backend
#
# Neither is served outside a development profile unless it is turned on and
# given a token (cn1.management.token, cn1.mcp.token).

# Text messages and push notifications are printed on the console and cards are
# simulated. All three are the defaults of a development profile anyway, and are
# spelled out to show where the choice is made. The console senders are refused
# outside a development profile. See application.properties for the real
# providers.
# tag::wayline-properties-dev-providers[]
wayline.sms.provider=console
wayline.payments.provider=simulated
wayline.push.provider=console
# end::wayline-properties-dev-providers[]
