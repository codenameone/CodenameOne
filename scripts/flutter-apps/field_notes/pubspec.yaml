name: field_notes
description: An ordinary Flutter app on device plugins -- location, camera, maps, sharing, notifications, Firebase sign-in -- used to check that Codename One imports such apps unmodified.
publish_to: none
version: 2.1.0+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  google_maps_flutter: ^2.9.0
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  app_links: ^6.3.2
  cross_file: ^0.3.4

flutter:
  uses-material-design: true
