# A server started on this machine is reached over plain HTTP, which Android
# refuses by default. Remove this once the game talks to a server with a
# certificate.
codename1.arg.android.xapplication_attr=android\:usesCleartextTraffic\="true"
# Push notifications: challenges, chest reminders, and flags for an admin.
codename1.arg.ios.includePush=true
# myappname://tour starts the self-driving walkthrough (see Tour.java).
codename1.arg.ios.urlScheme=<string>myappname</string>
codename1.arg.android.xintent_filter=<intent-filter><action android\:name\="android.intent.action.VIEW"/><category android\:name\="android.intent.category.DEFAULT"/><category android\:name\="android.intent.category.BROWSABLE"/><data android\:scheme\="myappname"/></intent-filter>
# Android push is off until the game has its Firebase file: a build that
# uses PushClient without google-services.json stops with an error. Once
# native/android/google-services.json is in place, delete this line.
codename1.arg.android.messagingService=none
# Battles are played in portrait.
codename1.arg.android.screenOrientation=portrait
codename1.arg.ios.interface_orientation=UIInterfaceOrientationPortrait
