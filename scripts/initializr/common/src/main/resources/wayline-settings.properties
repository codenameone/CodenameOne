# A server started on this machine is reached over plain HTTP, which Android
# refuses by default. Remove this once the app talks to a server with a
# certificate.
codename1.arg.android.xapplication_attr=android\:usesCleartextTraffic\="true"
# What iOS shows when someone applying to drive photographs a document.
codename1.arg.ios.NSCameraUsageDescription=The camera photographs the documents of your application to drive.
# What iOS shows when they pick a picture of a document they already have.
codename1.arg.ios.NSPhotoLibraryUsageDescription=Your photo library is where you pick a picture of a document from.
# What iOS shows before Face ID unlocks the sign-in kept in secure storage.
codename1.arg.ios.NSFaceIDUsageDescription=Authenticate to securely access your account
# What iOS shows when the app first asks where the device is.
codename1.arg.ios.NSLocationWhenInUseUsageDescription=Your location is where a ride picks you up, and where riders find you while you drive.
