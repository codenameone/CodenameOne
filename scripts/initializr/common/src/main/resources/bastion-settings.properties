# What iOS shows before Face ID unlocks the app and the keys it keeps.
codename1.arg.ios.NSFaceIDUsageDescription=Authenticate to unlock Bastion and the keys that sign your payments
# Renames classes, encrypts strings and flattens control flow:
# off, standard, aggressive or paranoid.
codename1.arg.cn1.hardenLevel=aggressive
# Exit on launch on a jailbroken iPhone. A bank refuses to run there at all;
# Android's rooted devices are reported to the server instead (DeviceIntegrity
# and the device registration's "rooted" flag), which refuses them money.
codename1.arg.ios.detectJailbreak=true
# The app switcher shows a blank card, not the last balance on screen.
codename1.arg.ios.blockScreenshotsOnEnterBackground=true
# Play Integrity tokens for the device registration. The server verifies them
# (money/IntegrityVerifier); until it has Google credentials it runs the
# simulated verifier, which trusts the flags the app reports.
codename1.arg.android.playIntegrity=true
