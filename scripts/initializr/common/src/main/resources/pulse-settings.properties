# A server started on this machine is reached over plain HTTP, which Android
# refuses by default. Remove this once the app talks to a server with a
# certificate.
codename1.arg.android.xapplication_attr=android\:usesCleartextTraffic\="true"
# What iOS shows when the front desk first scans a member's pass.
codename1.arg.ios.NSCameraUsageDescription=The camera scans members' passes at the front desk.
# What iOS shows before Face ID unlocks the sign-in kept in secure storage.
codename1.arg.ios.NSFaceIDUsageDescription=Authenticate to securely access your account
codename1.arg.ios.locationUsageDescription=Your location is where your order is delivered to, and, when you deliver, where the nearby orders are offered to you.
# Push notifications. With push included the build adds the
# remote-notification background mode and the push entitlement itself.
codename1.arg.ios.includePush=true
# Android push is off until the app has its Firebase file: a build that
# uses PushClient without google-services.json stops with an error. Once
# native/android/google-services.json is in place, delete this line.
codename1.arg.android.messagingService=none
codename1.watchMain=com.codenameone.examples.pulse.watch.PulseWatch
codename1.arg.ios.NSHealthShareUsageDescription=Pulse reads your recent workouts so your week at the studio includes them.
codename1.arg.ios.NSHealthUpdateUsageDescription=Pulse saves the classes you record as workouts.
codename1.arg.ios.NSBluetoothAlwaysUsageDescription=Pulse connects to your heart rate strap during a class.
codename1.arg.android.health.read=WORKOUT,HEART_RATE
codename1.arg.android.health.write=WORKOUT,HEART_RATE
codename1.arg.android.health.privacyPolicyUrl=https\://www.codenameone.com/privacy-policy.html
