---
name: Desktop theme fidelity

# Scores the desktop native themes -- Windows Fluent, macOS Aqua, GNOME Adwaita -- against the
# captured native references, the same way scripts-fidelity.yml does for iOS and Android.
#
# A SEPARATE workflow rather than three more jobs in scripts-fidelity.yml. That file's
# pull_request paths trigger the WHOLE workflow, so adding these there would run the Android
# emulator and the iOS simulator legs on every desktop CSS tweak, and would tie the desktop
# gate's timing to theirs. They share the comparator and the golden-set machinery, which is
# where sharing actually pays.
#
# Each theme is scored on ITS OWN runner. A Fluent theme measured on a Mac would be measured
# in the wrong system font, and text metrics are most of a fidelity score.
#
# Runs on master and on dispatch. NOT on pull_request, deliberately.
#
# It had a pull_request trigger for about an hour and that was a mistake: it put a
# three-platform, quarter-hour job onto every PR that happened to touch scripts/lib,
# scripts/common/java or a theme, none of which is those authors' concern. If this ever
# becomes a PR gate it should be after the themes have stopped moving and with the paths
# narrowed to the theme sources alone.
#
# Gating on master still catches a regression the same day it lands, which is what the
# ratchet is for. That split is the point: a leg with no golden set exits 24 on
# every run, and wiring it to a trigger would mean either a permanently red workflow, which
# teaches people to ignore it, or an unseeded run reported as a pass, which is a check
# satisfied by nothing having happened.
#
#   windows-11-fluent  seeded from run 34998745240, baselined, gating
#   gnome-adwaita      seeded from run 34990802562, baselined, gating
#   macos-aqua         NOT SEEDED -- the macOS runner queue has not yielded a slot; the
#                      capture app is verified and the set is one dispatch away
#
# Seeding macos-aqua is what promotes it: drop the platform out of the `if` below in the
# same commit that adds the goldens, and it gates like the other two.

'on':
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which themes to score'
        type: choice
        default: all
        options: [all, windows, macos, gnome]
  push:
    branches: [master]
    # Narrow ON PURPOSE: the theme sources, their compiled output, and the harness that is
    # specific to this suite. Nothing else.
    #
    # The list used to include scripts/lib/cn1ss.sh and scripts/common/java/**, which are
    # shared with the iOS and Android fidelity suites and with every screenshot runner in
    # the tree. Those ARE inputs to this score, so including them looks right -- and it
    # means a change to the shared comparator drags a three-platform, quarter-hour desktop
    # job behind it. That cost lands on whoever touched the shared file, which is not their
    # concern, and the same regression is caught by the next push that does touch a theme.
    #
    # A gate is worth what it catches minus what it costs everyone else.
    paths:
      - '.github/workflows/scripts-fidelity-desktop.yml'
      - 'scripts/run-desktop-fidelity-tests.sh'
      - 'scripts/fidelity-app/desktop-runner/**'
      - 'scripts/fidelity-app/goldens/windows-11-fluent/**'
      - 'scripts/fidelity-app/goldens/gnome-adwaita/**'
      - 'scripts/fidelity-app/goldens/macos-aqua/**'
      - 'scripts/fidelity-app/baseline/windows-11-fluent-*.json'
      - 'scripts/fidelity-app/baseline/gnome-adwaita-*.json'
      - 'scripts/fidelity-app/baseline/macos-aqua-*.json'
      - 'native-themes/windows-fluent/**'
      - 'native-themes/gnome-adwaita/**'
      - 'native-themes/macos-aqua/**'
      - 'Themes/WindowsFluentTheme.res'
      - 'Themes/GnomeAdwaitaTheme.res'
      - 'Themes/MacOSAquaTheme.res'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which legs run is decided HERE and emitted as the matrix, rather than with an `if` on
  # the scoring job. A job-level `if` cannot see the matrix context -- GitHub rejects the
  # whole file with "Unrecognized named-value: 'matrix'", and the only symptom is a run
  # that fails instantly with "this run likely failed because of a workflow file issue"
  # and no log at all. Building the matrix in a prior job keeps the decision in one place
  # and costs one ubuntu minute.
  select:
    name: select legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - id: pick
        shell: bash
        env:
          # On a dispatch, whatever was asked for. On a trigger, only the platforms whose
          # golden sets are committed -- macos is absent until its set lands.
          TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'gated' }}
        run: |
          set -eo pipefail
          case "$TARGETS" in
            gated)   legs='gnome windows' ;;
            all)     legs='gnome windows macos' ;;
            gnome|windows|macos) legs="$TARGETS" ;;
            *) echo "unknown targets '$TARGETS'" >&2; exit 2 ;;
          esac
          entries=''
          for leg in $legs; do
            case "$leg" in
              gnome)   runner=ubuntu-latest ;;
              windows) runner=windows-latest ;;
              macos)   runner=macos-15 ;;
            esac
            entries="$entries{\"platform\":\"$leg\",\"runner\":\"$runner\"},"
          done
          matrix="{\"include\":[${entries%,}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$entries" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "legs: $legs"

  fidelity-desktop:
    name: ${{ matrix.platform }}
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      CN1SS_FIDELITY_EPSILON: '2.0'
    steps:
      - uses: actions/checkout@v6

      # JDK 8 builds the framework; the simulator needs 11 or newer to run. Both are needed,
      # which is why two setup steps rather than one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - id: jdk21
        shell: bash
        run: echo "path=$JAVA_HOME" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # Needed by the BUILD as well as by the run. The fidelity app is a Codename One
      # application, so its build runs the cn1 css goal, which rasterizes through CEF and
      # needs a display -- it fails with "An error occurred while compiling the CSS files"
      # on a bare runner. Installed before the build for that reason, not only before the
      # simulator starts.
      - name: Install xvfb
        if: matrix.platform == 'gnome'
        run: bash scripts/ci/apt-get-install.sh xvfb

      - name: Build the core, the simulator and the fidelity app
        shell: bash
        env:
          JDK21: ${{ steps.jdk21.outputs.path }}
        run: |
          set -eo pipefail
          cd maven
          # ONE invocation with -am, not module builds in sequence. `-pl core` on its own
          # cannot resolve codenameone-factory, which is a sibling module rather than a
          # published artifact, so the first real run failed there before anything else
          # ran. -am builds each module's dependencies, which pulls in factory and
          # cn1-binaries.
          #
          # codenameone-maven-plugin is in the list because the fidelity app's own build
          # runs it, and nothing else installs it on a clean runner.
          mvn -B -q -DskipTests -Plocal-dev-javase \
              -pl javase,codenameone-maven-plugin -am install

          # The fidelity app targets 17 and JAVA_HOME is still the JDK 8 the framework
          # needs, so this half runs on the 21 installed first ("invalid target release:
          # 17" otherwise). Two JDKs in one job is the reason both setup-java steps exist.
          cd ../scripts/fidelity-app
          XVFB=()
          if [ "$(uname -s)" = "Linux" ]; then
            XVFB=(xvfb-run -a)
          fi
          JAVA_HOME="$JDK21" "${XVFB[@]}" ./mvnw -B -q -pl common,desktop-runner -DskipTests install

      - name: Score the theme against the native reference
        shell: bash
        env:
          # The simulator refuses to start on JDK 8, so the tiles are rendered with the 21
          # that was installed first. The build above still runs on 8.
          CN1SS_DESKTOP_JAVA: ${{ steps.jdk21.outputs.path }}/bin/java
        run: scripts/run-desktop-fidelity-tests.sh "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-fidelity-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}-fidelity/**
          if-no-files-found: warn
          retention-days: 14
