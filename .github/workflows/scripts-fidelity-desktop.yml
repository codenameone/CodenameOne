---
name: Desktop theme fidelity

# Scores the desktop native themes -- Windows Fluent, macOS Aqua, GNOME Adwaita -- against the
# captured native references, the same way scripts-fidelity.yml does for iOS and Android.
#
# A SEPARATE workflow rather than three more jobs in scripts-fidelity.yml. That file's
# pull_request paths trigger the WHOLE workflow, so adding these there would run the Android
# emulator and the iOS simulator legs on every desktop CSS tweak, and would tie the desktop
# gate's timing to theirs. They share the comparator and the golden-set machinery, which is
# where sharing actually pays.
#
# Each theme is scored on ITS OWN runner. A Fluent theme measured on a Mac would be measured
# in the wrong system font, and text metrics are most of a fidelity score.
#
# A PULL-REQUEST GATE for the two platforms whose goldens are committed, and dispatch only
# for the one whose are not. That split is the point: a leg with no golden set exits 24 on
# every run, and wiring it to a trigger would mean either a permanently red workflow, which
# teaches people to ignore it, or an unseeded run reported as a pass, which is a check
# satisfied by nothing having happened.
#
#   windows-11-fluent  seeded from run 34998745240, baselined, gating
#   gnome-adwaita      seeded from run 34990802562, baselined, gating
#   macos-aqua         NOT SEEDED -- the macOS runner queue has not yielded a slot; the
#                      capture app is verified and the set is one dispatch away
#
# Seeding macos-aqua is what promotes it: drop the platform out of the `if` below in the
# same commit that adds the goldens, and it gates like the other two.

'on':
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which themes to score'
        type: choice
        default: all
        options: [all, windows, macos, gnome]
  # The two path lists are written out twice rather than shared with a YAML anchor.
  # The anchor is valid YAML and GitHub Actions does not support it: the workflow
  # parses locally, and every run fails with "a workflow file issue" and no log.
  pull_request:
    paths:
      - '.github/workflows/scripts-fidelity-desktop.yml'
      - 'scripts/run-desktop-fidelity-tests.sh'
      - 'scripts/fidelity-app/common/**'
      - 'scripts/fidelity-app/desktop-runner/**'
      - 'scripts/fidelity-app/goldens/**'
      - 'scripts/fidelity-app/baseline/**'
      - 'scripts/lib/cn1ss.sh'
      - 'scripts/common/java/**'
      - 'native-themes/windows-fluent/**'
      - 'native-themes/gnome-adwaita/**'
      - 'native-themes/macos-aqua/**'
      - 'Themes/WindowsFluentTheme.res'
      - 'Themes/GnomeAdwaitaTheme.res'
      - 'Themes/MacOSAquaTheme.res'
  push:
    branches: [master]
    paths:
      - '.github/workflows/scripts-fidelity-desktop.yml'
      - 'scripts/run-desktop-fidelity-tests.sh'
      - 'scripts/fidelity-app/common/**'
      - 'scripts/fidelity-app/desktop-runner/**'
      - 'scripts/fidelity-app/goldens/**'
      - 'scripts/fidelity-app/baseline/**'
      - 'scripts/lib/cn1ss.sh'
      - 'scripts/common/java/**'
      - 'native-themes/windows-fluent/**'
      - 'native-themes/gnome-adwaita/**'
      - 'native-themes/macos-aqua/**'
      - 'Themes/WindowsFluentTheme.res'
      - 'Themes/GnomeAdwaitaTheme.res'
      - 'Themes/MacOSAquaTheme.res'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fidelity-desktop:
    name: ${{ matrix.platform }}
    # On a dispatch, whatever was asked for. On a trigger, only the platforms whose
    # golden sets are committed -- macos is absent from that list until its set lands.
    if: >-
      (github.event_name == 'workflow_dispatch'
        && (github.event.inputs.targets == 'all'
            || github.event.inputs.targets == matrix.platform))
      || (github.event_name != 'workflow_dispatch'
          && contains(fromJSON('["windows", "gnome"]'), matrix.platform))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: gnome
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-15
    env:
      CN1SS_FIDELITY_EPSILON: '2.0'
    steps:
      - uses: actions/checkout@v6

      # JDK 8 builds the framework; the simulator needs 11 or newer to run. Both are needed,
      # which is why two setup steps rather than one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - id: jdk21
        shell: bash
        run: echo "path=$JAVA_HOME" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build the core, the simulator and the fidelity app
        shell: bash
        run: |
          set -eo pipefail
          cd maven
          mvn -B -q -DskipTests -pl core install
          mvn -B -q -DskipTests -Plocal-dev-javase -pl javase install
          # codenameone-maven-plugin is what the fidelity app's own build runs, and
          # nothing above installs it, so the app build cannot resolve it on a clean
          # runner. -am brings javase with it, which needs the same profile.
          mvn -B -q -DskipTests -Plocal-dev-javase -pl codenameone-maven-plugin -am install
          cd ../scripts/fidelity-app
          ./mvnw -B -q -pl common,desktop-runner -DskipTests install

      # The simulator needs a display; the hosted Windows and macOS images have a
      # session, Linux does not.
      - name: Install xvfb
        if: matrix.platform == 'gnome'
        run: bash scripts/ci/apt-get-install.sh xvfb

      - name: Score the theme against the native reference
        shell: bash
        env:
          # The simulator refuses to start on JDK 8, so the tiles are rendered with the 21
          # that was installed first. The build above still runs on 8.
          CN1SS_DESKTOP_JAVA: ${{ steps.jdk21.outputs.path }}/bin/java
        run: scripts/run-desktop-fidelity-tests.sh "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-fidelity-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}-fidelity/**
          if-no-files-found: warn
          retention-days: 14
