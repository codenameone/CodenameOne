name: ParparVM Java Tests

on:
  pull_request:
    paths:
      - 'scripts/ci/retry.sh'
      - '.github/workflows/parparvm-tests.yml'
      - 'scripts/ci/retry.sh'
      - 'vm/**'
      - 'Ports/JavaScriptPort/**'
      - '!vm/**/README.md'
      - '!vm/**/readme.md'
      - '!vm/**/docs/**'
  push:
    branches: [ master, main ]
    paths:
      - 'scripts/ci/retry.sh'
      - '.github/workflows/parparvm-tests.yml'
      - 'scripts/ci/retry.sh'
      - 'vm/**'
      - 'Ports/JavaScriptPort/**'
      - '!vm/**/README.md'
      - '!vm/**/readme.md'
      - '!vm/**/docs/**'
  release:
    types:
      - published

concurrency:
  # Cancel superseded runs of this workflow for the same PR branch
  # (github.head_ref is set on pull_request events). On push to master
  # head_ref is empty, so the group falls back to the unique run_id and
  # every master commit is still tested in full -- no coverage lost.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Turn on the ParparVM native-signature check for every translation this
  # workflow forks (a forked process inherits the environment). Off by default in
  # the translator so a customer build that succeeds today keeps succeeding; see
  # NativeSignatureVerifier.
  CN1_NATIVE_VERIFY: strict

jobs:
  vm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install native build tools
        run: |
          bash scripts/ci/apt-get-update.sh
          sudo apt-get install -y clang

      # Install JDKs and export their paths
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Save JDK 8 Path
        run: echo "JDK_8_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Save JDK 11 Path
        run: echo "JDK_11_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Save JDK 17 Path
        run: echo "JDK_17_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Save JDK 21 Path
        run: echo "JDK_21_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Save JDK 25 Path
        run: echo "JDK_25_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # Restore JDK 8 as the main runner (cache is on the first setup-java JDK 8 above)
      - name: Restore JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run ParparVM JVM tests
        working-directory: vm
        # Maven Central intermittently serves 403/429 from the runner CDN edge
        # and Maven treats it as a permanent resolution failure (killed this job
        # at dependency download, before any test ran). See scripts/ci/retry.sh.
        #
        # Narrowed with RETRY_ONLY_MATCHING because the second command RUNS THE
        # TESTS: without it the wrapper retries every nonzero exit, so a test that
        # failed once and passed on the retry would take this gate green and hide
        # the race that produced it. The Windows counterpart restricts it for the
        # same reason.
        run: |
          retry() { bash ../scripts/ci/retry.sh "$@"; }
          retry mvn -B clean package -pl JavaAPI -am -DskipTests
          retry mvn -B test -pl tests -am -DexcludedGroups=benchmark
        env:
          RETRY_ONLY_MATCHING: transient
          JDK_8_HOME: ${{ env.JDK_8_HOME }}
          JDK_11_HOME: ${{ env.JDK_11_HOME }}
          JDK_17_HOME: ${{ env.JDK_17_HOME }}
          JDK_21_HOME: ${{ env.JDK_21_HOME }}
          JDK_25_HOME: ${{ env.JDK_25_HOME }}

      - name: Run ParparVM Benchmark
        working-directory: vm
        run: bash $GITHUB_WORKSPACE/scripts/ci/retry.sh mvn -B test -pl tests -am -Dgroups=benchmark -Djacoco.skip=true
        env:
          # Narrowed because this step RUNS TESTS: retry.sh retries every nonzero exit
          # without it, so a test that failed once and passed on a later attempt would take
          # this gate green and hide the race that produced it. The wrapper's own docs
          # require this filter for test-running commands.
          RETRY_ONLY_MATCHING: transient
          JDK_8_HOME: ${{ env.JDK_8_HOME }}
          JDK_11_HOME: ${{ env.JDK_11_HOME }}
          JDK_17_HOME: ${{ env.JDK_17_HOME }}
          JDK_21_HOME: ${{ env.JDK_21_HOME }}
          JDK_25_HOME: ${{ env.JDK_25_HOME }}

      - name: Publish ByteCodeTranslator quality previews
        if: ${{ always() && github.server_url == 'https://github.com' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        id: publish-bytecode-quality-previews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "${SERVER_URL}" != "https://github.com" ]; then
            echo "HTML previews are only published for github.com instances."
            exit 0
          fi

          coverage_dir="vm/tests/target/site/jacoco"
          if [ ! -f "${coverage_dir}/index.html" ]; then
            echo "No HTML outputs detected; skipping preview publishing."
            exit 0
          fi

          run_dir="runs/${RUN_ID}-${RUN_ATTEMPT}"
          tmp_dir=$(mktemp -d)
          dest_dir="${tmp_dir}/${run_dir}/coverage"
          mkdir -p "${dest_dir}"
          cp -R "${coverage_dir}/." "${dest_dir}/"

          printf '%s\n%s\n%s\n' \
            '# Quality report previews' \
            '' \
            'This branch is automatically managed by the PR CI workflow and may be force-pushed.' \
            > "${tmp_dir}/README.md"

          git -C "${tmp_dir}" init -b previews >/dev/null
          git -C "${tmp_dir}" config user.name "github-actions[bot]"
          git -C "${tmp_dir}" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "${tmp_dir}" add .
          git -C "${tmp_dir}" commit -m "Publish quality report previews for run ${RUN_ID} (attempt ${RUN_ATTEMPT})" >/dev/null

          remote_url="${SERVER_URL}/${REPOSITORY}.git"
          token_remote_url="${remote_url/https:\/\//https://x-access-token:${GITHUB_TOKEN}@}"
          for push_attempt in 1 2 3 4 5; do
            if git -C "${tmp_dir}" push --force "${token_remote_url}" previews:quality-report-previews >/dev/null; then
              break
            fi
            if [ "${push_attempt}" -eq 5 ]; then
              echo "Failed to publish quality report previews after ${push_attempt} attempts." >&2
              exit 1
            fi
            sleep $((push_attempt * 3))
          done

          commit_sha=$(git -C "${tmp_dir}" rev-parse HEAD)
          raw_base="https://raw.githubusercontent.com/${REPOSITORY}/${commit_sha}/${run_dir}"
          preview_base="https://htmlpreview.github.io/?${raw_base}"
          echo "jacoco_url=${preview_base}/coverage/index.html" >> "$GITHUB_OUTPUT"

      - name: Generate ByteCodeTranslator quality report
        if: ${{ always() }}
        env:
          QUALITY_REPORT_TARGET_DIRS: vm/tests/target
          QUALITY_REPORT_SERVER_URL: ${{ github.server_url }}
          QUALITY_REPORT_REPOSITORY: ${{ github.repository }}
          QUALITY_REPORT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_REPORT_TITLE: "✅ ByteCodeTranslator Quality Report"
          JACOCO_HTML_URL: ${{ steps.publish-bytecode-quality-previews.outputs.jacoco_url }}
        run: python3 .github/scripts/generate-quality-report.py

      - name: Publish ByteCodeTranslator quality comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { publishQualityComment } = require('./.github/scripts/publish-quality-comment.js');
            await publishQualityComment({
              github,
              context,
              core,
              marker: '<!-- bytecode-quality-report -->',
              reportPath: 'quality-report.md',
            });


  release-jars:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Build release jars
        # This job runs once per published release, so a transient Maven Central
        # 403/429 here silently ships a release without its ParparVM jars (that
        # is what happened to 7.0.264). Retry, as the vm-tests job already does.
        run: |
          bash scripts/ci/retry.sh mvn -B -f vm/JavaAPI/pom.xml package
          bash scripts/ci/retry.sh mvn -B -f vm/ByteCodeTranslator/pom.xml package

      - name: Verify release jars
        run: |
          test -f vm/JavaAPI/target/JavaAPI-1.0-SNAPSHOT.jar
          test -f vm/ByteCodeTranslator/target/ByteCodeTranslator-1.0-SNAPSHOT.jar

      - name: Attach JavaAPI and ByteCodeTranslator jars to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vm/JavaAPI/target/JavaAPI-1.0-SNAPSHOT.jar
            vm/ByteCodeTranslator/target/ByteCodeTranslator-1.0-SNAPSHOT.jar
