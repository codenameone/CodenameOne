name: ParparVM Java Tests

on:
  pull_request:
    paths:
      - 'scripts/ci/retry.sh'
      - '.github/workflows/parparvm-tests.yml'
      - 'vm/**'
      - 'Ports/JavaScriptPort/**'
      # The GENERATOR, because the translated backend tests run what it writes:
      # a change to the @Entity processor or BackendPackageMojo alone reaches
      # PostgreSQL and MySQL through the daos it generates, and this is the only
      # matrix that stands those servers up. maven/backend has no source of its
      # own -- it compiles vm/backend/src, which 'vm/**' already covers, plus the
      # shared core classes listed below -- but its pom decides what the install
      # step below produces.
      #
      # NOT maven/core: the contract compiles against it, so a core change can
      # break this matrix, but almost every PR touches core and this is a long
      # job. The translated tests in pr.yml catch a core break first.
      - 'maven/codenameone-maven-plugin/**'
      - 'maven/backend/**'
      # The core classes the backend compiles as its own (the ORM and the entity
      # annotations, marked @SharedWithBackend and listed by
      # vm/backend/shared-sources.sh). They have no copy under vm/ any more, so
      # 'vm/**' no longer sees a change to them. A path filter cannot read the
      # marker; a class marked outside these directories needs its path here.
      - 'CodenameOne/src/com/codename1/impl/SharedWithBackend.java'
      - 'CodenameOne/src/com/codename1/impl/orm/**'
      - 'CodenameOne/src/com/codename1/orm/session/**'
      - 'CodenameOne/src/com/codename1/annotations/db/**'
      - 'CodenameOne/src/com/codename1/annotations/Entity.java'
      - 'CodenameOne/src/com/codename1/annotations/Id.java'
      - 'CodenameOne/src/com/codename1/annotations/Column.java'
      - 'CodenameOne/src/com/codename1/annotations/DbTransient.java'
      - '!vm/**/README.md'
      - '!vm/**/readme.md'
      - '!vm/**/docs/**'
  push:
    branches: [ master, main ]
    paths:
      - 'scripts/ci/retry.sh'
      - '.github/workflows/parparvm-tests.yml'
      - 'vm/**'
      - 'Ports/JavaScriptPort/**'
      # The GENERATOR, because the translated backend tests run what it writes:
      # a change to the @Entity processor or BackendPackageMojo alone reaches
      # PostgreSQL and MySQL through the daos it generates, and this is the only
      # matrix that stands those servers up. maven/backend has no source of its
      # own -- it compiles vm/backend/src, which 'vm/**' already covers, plus the
      # shared core classes listed below -- but its pom decides what the install
      # step below produces.
      #
      # NOT maven/core: the contract compiles against it, so a core change can
      # break this matrix, but almost every PR touches core and this is a long
      # job. The translated tests in pr.yml catch a core break first.
      - 'maven/codenameone-maven-plugin/**'
      - 'maven/backend/**'
      # The core classes the backend compiles as its own (the ORM and the entity
      # annotations, marked @SharedWithBackend and listed by
      # vm/backend/shared-sources.sh). They have no copy under vm/ any more, so
      # 'vm/**' no longer sees a change to them. A path filter cannot read the
      # marker; a class marked outside these directories needs its path here.
      - 'CodenameOne/src/com/codename1/impl/SharedWithBackend.java'
      - 'CodenameOne/src/com/codename1/impl/orm/**'
      - 'CodenameOne/src/com/codename1/orm/session/**'
      - 'CodenameOne/src/com/codename1/annotations/db/**'
      - 'CodenameOne/src/com/codename1/annotations/Entity.java'
      - 'CodenameOne/src/com/codename1/annotations/Id.java'
      - 'CodenameOne/src/com/codename1/annotations/Column.java'
      - 'CodenameOne/src/com/codename1/annotations/DbTransient.java'
      - '!vm/**/README.md'
      - '!vm/**/readme.md'
      - '!vm/**/docs/**'
  release:
    types:
      - published

concurrency:
  # Cancel superseded runs of this workflow for the same PR branch
  # (github.head_ref is set on pull_request events). On push to master
  # head_ref is empty, so the group falls back to the unique run_id and
  # every master commit is still tested in full -- no coverage lost.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Turn on the ParparVM native-signature check for every translation this
  # workflow forks (a forked process inherits the environment). Off by default in
  # the translator so a customer build that succeeds today keeps succeeding; see
  # NativeSignatureVerifier.
  CN1_NATIVE_VERIFY: strict

jobs:
  vm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The two database engines the backend speaks a wire protocol to.
    #
    # BackendDatabaseTest and BackendOrmTest run one body of assertions against
    # SQLite, PostgreSQL and MySQL and require the same answers from all three --
    # that is the whole of the claim that a handler cannot tell which engine
    # answered it, and that one entity class is stored by any of them. SQLite
    # needs nothing installed, so without these two services the tests ran their
    # easiest arm and reported green: the engines with a wire protocol, a
    # different schema syntax and a different way of generating a key are exactly
    # the ones worth running.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cn1
          POSTGRES_PASSWORD: cn1secret
          POSTGRES_DB: cn1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cn1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        # The LTS, and the version that rejects MySQL's NO PAD collation -- which
        # is the whole reason this service is here. Its own is utf8mb4_nopad_bin,
        # which MySQL in turn does not have.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: cn1secret
          MARIADB_DATABASE: cn1
          MARIADB_USER: cn1
          MARIADB_PASSWORD: cn1secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      mysql:
        # 8.0 rather than 8, because 8.4 no longer LOADS mysql_native_password
        # and a service container cannot be given server flags to turn it back
        # on: GitHub's `services` supports image, env, ports and options, and
        # none of those appends a command. See the step below for why the plugin
        # has to be reachable at all.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cn1secret
          MYSQL_USER: cn1
          MYSQL_PASSWORD: cn1secret
          MYSQL_DATABASE: cn1
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ucn1 -pcn1secret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The backend's MySQL client REFUSES to complete caching_sha2_password's
      # full exchange on an unencrypted connection, because that exchange sends
      # the password itself. That refusal is the client behaving correctly, and
      # it means a freshly created service container -- whose password cache is
      # empty -- cannot be reached over plaintext loopback at all: the first
      # connection is exactly the one with nothing cached.
      #
      # The alternative to this step is TLS, and the container's auto-generated
      # certificate chains to nothing and carries no name the client could
      # verify, so `sslmode=require` fails for a different reason. Native
      # password authentication is what CI can actually offer, and the code path
      # under test -- the wire protocol, the schema, the generated keys -- is the
      # same either way.
      - name: Let the MySQL service authenticate our client
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pcn1secret -e \
            "ALTER USER 'cn1'@'%' IDENTIFIED WITH mysql_native_password BY 'cn1secret'; \
             FLUSH PRIVILEGES;"

      - name: Install native build tools
        run: |
          bash scripts/ci/apt-get-update.sh
          # clang alone is not enough to LINK a backend binary. vm/backend's
          # build.sh links -lcurl -lssl -lcrypto -lnghttp2 (outbound TLS is
          # libcurl's, the auth primitives are OpenSSL's, the HTTP/2 framing is
          # nghttp2's) and needs their headers to compile the natives that call
          # them. Without these, every test that builds a server binary --
          # BackendDatabaseTest, BackendOrmTest, BackendRuntimeSelfTest --
          # compiled, failed at the link, and SKIPPED, which this job reported
          # as green for as long as it has existed.
          sudo apt-get install -y clang libcurl4-openssl-dev libssl-dev libnghttp2-dev

      # Install JDKs and export their paths
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Save JDK 8 Path
        run: echo "JDK_8_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Save JDK 11 Path
        run: echo "JDK_11_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Save JDK 17 Path
        run: echo "JDK_17_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Save JDK 21 Path
        run: echo "JDK_21_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Save JDK 25 Path
        run: echo "JDK_25_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # Restore JDK 8 as the main runner (cache is on the first setup-java JDK 8 above)
      - name: Restore JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # WITHOUT THIS EVERY BACKEND TEST SKIPS. generate-contract.sh compiles the
      # shared @RestClient/@Entity contract against codenameone-core and runs the
      # Codename One maven plugin over it, so both have to be in the local repo
      # the backend scripts use -- and this job never built the maven modules, so
      # they never were. BackendDatabaseTest, BackendOrmTest,
      # BackendRuntimeSelfTest and BackendJavaSeRuntimeTest all reported
      # "codenameone-core:8.0-SNAPSHOT is not in .m2-repo" and skipped, which is
      # why CN1_BACKEND_REQUIRED below found four of them at once: the PostgreSQL
      # and MySQL services this job stands up were serving nobody.
      #
      # -Plocal-dev-javase and the repo-local .m2-repo are what the scripts
      # expect; the path is $GITHUB_WORKSPACE/.m2-repo because that is where
      # generate-contract.sh looks (CN1_M2 overrides it, and nothing sets one).
      #
      # The static-analysis gates are OFF here on purpose. This step exists to
      # put jars in a repo, and -am drags in every port because the maven plugin
      # depends on them -- so with them on, a SpotBugs finding in the Android
      # port fails THIS workflow, where nobody would look for it and where it
      # says nothing about ParparVM. pr.yml owns those gates and runs them over
      # the same modules.
      - name: Install core + maven plugin for the backend contract
        working-directory: maven
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" mvn -B -pl core,backend,codenameone-maven-plugin \
            -am install -DskipTests -Plocal-dev-javase \
            -Dspotbugs.skip=true -Dpmd.skip=true -Dcheckstyle.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
        env:
          JAVA_HOME: ${{ env.JDK_8_HOME }}
          JDK_8_HOME: ${{ env.JDK_8_HOME }}

      - name: Run ParparVM JVM tests
        working-directory: vm
        # Maven Central intermittently serves 403/429 from the runner CDN edge
        # and Maven treats it as a permanent resolution failure (killed this job
        # at dependency download, before any test ran). See scripts/ci/retry.sh.
        #
        # Narrowed with RETRY_ONLY_MATCHING because the second command RUNS THE
        # TESTS: without it the wrapper retries every nonzero exit, so a test that
        # failed once and passed on the retry would take this gate green and hide
        # the race that produced it. The Windows counterpart restricts it for the
        # same reason.
        run: |
          retry() { bash ../scripts/ci/retry.sh "$@"; }
          retry mvn -B clean package -pl JavaAPI -am -DskipTests
          retry mvn -B test -pl tests -am -DexcludedGroups=benchmark
        env:
          RETRY_ONLY_MATCHING: transient
          JDK_8_HOME: ${{ env.JDK_8_HOME }}
          JDK_11_HOME: ${{ env.JDK_11_HOME }}
          JDK_17_HOME: ${{ env.JDK_17_HOME }}
          JDK_21_HOME: ${{ env.JDK_21_HOME }}
          JDK_25_HOME: ${{ env.JDK_25_HOME }}
          # The services above. sslmode=disable because these are loopback
          # containers with no certificate: the default, prefer, would attempt
          # TLS and fail verification rather than quietly downgrading, which is
          # the behaviour the database layer is supposed to have.
          CN1_DBCHECK_POSTGRES: postgres://cn1:cn1secret@127.0.0.1:5432/cn1?sslmode=disable
          CN1_DBCHECK_MYSQL: mysql://cn1:cn1secret@127.0.0.1:3306/cn1?sslmode=disable
          # MARIADB REACHED THROUGH A mysql:// URL, deliberately: the dialect is
          # chosen from the server's handshake banner rather than from the
          # scheme, and this is the case that proves it. The two families have
          # no case-sensitive NO PAD collation in common, so picking the wrong
          # one is an unknown-collation error on every CREATE TABLE.
          CN1_DBCHECK_MARIADB: mysql://cn1:cn1secret@127.0.0.1:3307/cn1?sslmode=disable
          # WITHOUT THIS THE BACKEND TESTS CAN SKIP AND THE JOB STAYS GREEN.
          # BackendTestSupport.skipOrFail turns a backend build failure into a
          # JUnit assumption abort, because a developer machine with no C
          # toolchain must not fail the suite -- and a missing link library in CI
          # looks exactly the same from inside the test. This is the only job
          # that runs the whole tests module, so it is the one place that has to
          # say the backend is expected to build here: a compile, link or
          # toolchain regression fails the workflow rather than quietly
          # subtracting BackendDatabaseTest, BackendOrmTest and the rest from it.
          CN1_BACKEND_REQUIRED: 1

      - name: Run ParparVM Benchmark
        working-directory: vm
        run: bash $GITHUB_WORKSPACE/scripts/ci/retry.sh mvn -B test -pl tests -am -Dgroups=benchmark -Djacoco.skip=true
        env:
          # Narrowed because this step RUNS TESTS: retry.sh retries every nonzero exit
          # without it, so a test that failed once and passed on a later attempt would take
          # this gate green and hide the race that produced it. The wrapper's own docs
          # require this filter for test-running commands.
          RETRY_ONLY_MATCHING: transient
          JDK_8_HOME: ${{ env.JDK_8_HOME }}
          JDK_11_HOME: ${{ env.JDK_11_HOME }}
          JDK_17_HOME: ${{ env.JDK_17_HOME }}
          JDK_21_HOME: ${{ env.JDK_21_HOME }}
          JDK_25_HOME: ${{ env.JDK_25_HOME }}

      - name: Publish ByteCodeTranslator quality previews
        if: ${{ always() && github.server_url == 'https://github.com' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        id: publish-bytecode-quality-previews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "${SERVER_URL}" != "https://github.com" ]; then
            echo "HTML previews are only published for github.com instances."
            exit 0
          fi

          coverage_dir="vm/tests/target/site/jacoco"
          if [ ! -f "${coverage_dir}/index.html" ]; then
            echo "No HTML outputs detected; skipping preview publishing."
            exit 0
          fi

          run_dir="runs/${RUN_ID}-${RUN_ATTEMPT}"
          tmp_dir=$(mktemp -d)
          dest_dir="${tmp_dir}/${run_dir}/coverage"
          mkdir -p "${dest_dir}"
          cp -R "${coverage_dir}/." "${dest_dir}/"

          printf '%s\n%s\n%s\n' \
            '# Quality report previews' \
            '' \
            'This branch is automatically managed by the PR CI workflow and may be force-pushed.' \
            > "${tmp_dir}/README.md"

          git -C "${tmp_dir}" init -b previews >/dev/null
          git -C "${tmp_dir}" config user.name "github-actions[bot]"
          git -C "${tmp_dir}" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "${tmp_dir}" add .
          git -C "${tmp_dir}" commit -m "Publish quality report previews for run ${RUN_ID} (attempt ${RUN_ATTEMPT})" >/dev/null

          remote_url="${SERVER_URL}/${REPOSITORY}.git"
          token_remote_url="${remote_url/https:\/\//https://x-access-token:${GITHUB_TOKEN}@}"
          for push_attempt in 1 2 3 4 5; do
            if git -C "${tmp_dir}" push --force "${token_remote_url}" previews:quality-report-previews >/dev/null; then
              break
            fi
            if [ "${push_attempt}" -eq 5 ]; then
              echo "Failed to publish quality report previews after ${push_attempt} attempts." >&2
              exit 1
            fi
            sleep $((push_attempt * 3))
          done

          commit_sha=$(git -C "${tmp_dir}" rev-parse HEAD)
          raw_base="https://raw.githubusercontent.com/${REPOSITORY}/${commit_sha}/${run_dir}"
          preview_base="https://htmlpreview.github.io/?${raw_base}"
          echo "jacoco_url=${preview_base}/coverage/index.html" >> "$GITHUB_OUTPUT"

      - name: Generate ByteCodeTranslator quality report
        if: ${{ always() }}
        env:
          QUALITY_REPORT_TARGET_DIRS: vm/tests/target
          QUALITY_REPORT_SERVER_URL: ${{ github.server_url }}
          QUALITY_REPORT_REPOSITORY: ${{ github.repository }}
          QUALITY_REPORT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_REPORT_TITLE: "✅ ByteCodeTranslator Quality Report"
          JACOCO_HTML_URL: ${{ steps.publish-bytecode-quality-previews.outputs.jacoco_url }}
        run: python3 .github/scripts/generate-quality-report.py

      - name: Publish ByteCodeTranslator quality comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          # Retried rather than fatal on a transient 5xx. The publisher
          # already warns instead of throwing; this is the cheaper half of
          # the same fix, so the comment usually still lands. 4xx codes the
          # action treats as permanent are not retried.
          retries: 3
          script: |
            const { publishQualityComment } = require('./.github/scripts/publish-quality-comment.js');
            await publishQualityComment({
              github,
              context,
              core,
              marker: '<!-- bytecode-quality-report -->',
              reportPath: 'quality-report.md',
            });


  # The websocket frame parser, against the Autobahn|Testsuite.
  #
  # Its own job rather than a step inside vm-tests: that job already carries three
  # database service containers and a long budget, and a conformance failure
  # deserves its own red check instead of being buried behind a MySQL health
  # probe. Ubuntu because `--network host` means the host's network stack here,
  # which is what lets the container reach a server on 127.0.0.1.
  #
  # ~300 cases, almost all of them frames no conformant client would send. The
  # gate in vm/backend/conformance/check-autobahn.py has no per-case tolerance:
  # every case must be strictly green, NON-STRICT included, and the set that ran
  # has to match the committed manifest so the suite cannot quietly shrink to the
  # cases it happens to pass.
  backend-websocket-conformance:
    name: WebSocket conformance (Autobahn)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache the Autobahn image
        id: autobahn-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/autobahn-image.tar
          key: autobahn-testsuite-image-v1

      - name: Load or pull the Autobahn image
        run: |
          if [ -f "${{ runner.temp }}/autobahn-image.tar" ]; then
            docker load -i "${{ runner.temp }}/autobahn-image.tar"
          else
            docker pull crossbario/autobahn-testsuite
            docker save crossbario/autobahn-testsuite \
              -o "${{ runner.temp }}/autobahn-image.tar"
          fi

      - name: Run the Autobahn fuzzing client
        env:
          CN1_BACKEND_JAVA: ${{ env.JAVA_HOME }}
        run: vm/backend/ws-conformance.sh --arm javase

      - name: Upload the Autobahn report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobahn-report
          path: vm/backend/target/autobahn/**
          if-no-files-found: warn
          retention-days: 14


  release-jars:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Build release jars
        # This job runs once per published release, so a transient Maven Central
        # 403/429 here silently ships a release without its ParparVM jars (that
        # is what happened to 7.0.264). Retry, as the vm-tests job already does.
        run: |
          bash scripts/ci/retry.sh mvn -B -f vm/JavaAPI/pom.xml package
          bash scripts/ci/retry.sh mvn -B -f vm/ByteCodeTranslator/pom.xml package

      - name: Verify release jars
        run: |
          test -f vm/JavaAPI/target/JavaAPI-1.0-SNAPSHOT.jar
          test -f vm/ByteCodeTranslator/target/ByteCodeTranslator-1.0-SNAPSHOT.jar

      - name: Attach JavaAPI and ByteCodeTranslator jars to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vm/JavaAPI/target/JavaAPI-1.0-SNAPSHOT.jar
            vm/ByteCodeTranslator/target/ByteCodeTranslator-1.0-SNAPSHOT.jar
