name: Nightly watchdog

# The expensive suites -- the sample applications, the cn1libs, the device
# integrations, the benchmarks, the full Maven reactor -- run on a pull request
# only when their own tree changes, and on master once a night at 00:00 UTC
# (each carries `cron: '0 0 * * *'`). Shared code (core, ports, builders,
# backend) therefore reaches them only through that nightly run, so a failure
# there must not go unread the way a red master push did.
#
# This job reads the nightly set from the workflow files themselves -- every
# workflow whose schedule is exactly '0 0 * * *' -- so adding a suite to the
# nightly is one cron line, with no list here to keep in sync. It then finds
# that night's scheduled run of each on master and keeps ONE issue open,
# assigned to NIGHTLY_ALERT_ASSIGNEE, listing every suite that failed or never
# started. A night with everything green closes it.

on:
  schedule:
    # Late enough for the slowest suite (the iOS sample builds) to finish.
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: nightly-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Open, update, or close the nightly failure issue
        uses: actions/github-script@v8
        env:
          ALERT_ASSIGNEE: ${{ vars.NIGHTLY_ALERT_ASSIGNEE || 'shai-almog' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const title = 'Nightly CI failures';
            const marker = '<!-- nightly-watchdog -->';
            const NIGHTLY = /cron:\s*['"]0 0 \* \* \*['"]/;

            const dir = '.github/workflows';
            const nightly = fs.readdirSync(dir)
              .filter(f => /\.ya?ml$/.test(f) && f !== 'nightly-watchdog.yml')
              .filter(f => NIGHTLY.test(fs.readFileSync(path.join(dir, f), 'utf8')))
              .sort();
            if (nightly.length === 0) {
              core.setFailed(`No workflow in ${dir} is scheduled at '0 0 * * *'; the watchdog would report every night clean.`);
              return;
            }

            // Tonight's run started at 00:00 UTC; allow GitHub's schedule lag.
            const since = new Date();
            since.setUTCHours(0, 0, 0, 0);
            since.setUTCMinutes(-30);

            const problems = [];
            const running = [];
            for (const file of nightly) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: file, event: 'schedule', branch: 'master',
                per_page: 5, created: `>=${since.toISOString()}`,
              });
              const run = data.workflow_runs[0];
              if (!run) {
                problems.push(`- \`${file}\`: no scheduled run since ${since.toISOString()} (disabled, or the schedule did not fire)`);
              } else if (run.status !== 'completed') {
                running.push(`- [\`${file}\`](${run.html_url}): still ${run.status}`);
              } else if (!['success', 'skipped', 'neutral'].includes(run.conclusion)) {
                problems.push(`- [\`${file}\`](${run.html_url}): ${run.conclusion}`);
              }
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issue = open.find(i => !i.pull_request && i.title === title && (i.body || '').includes(marker));
            const now = new Date().toISOString();

            await core.summary
              .addHeading('Nightly watchdog')
              .addRaw(`${nightly.length} nightly workflows, ${problems.length} failing, ${running.length} still running.\n\n`)
              .addRaw([...problems, ...running].join('\n') || 'All green.')
              .write();

            if (problems.length === 0) {
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `Recovered: every nightly workflow passed on the run checked at ${now}.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed' });
              }
              return;
            }

            const body = [
              marker,
              `These nightly workflows failed on master (checked ${now}):`,
              '',
              ...problems,
              ...(running.length ? ['', 'Still running when checked (not counted as failures):', '', ...running] : []),
              '',
              'They run on a pull request only when their own tree changes, so a change to shared code (core, ports, builders, backend) first meets them here. This issue closes itself after a fully green night.',
            ].join('\n');

            const assignees = process.env.ALERT_ASSIGNEE ? [process.env.ALERT_ASSIGNEE] : undefined;
            if (!issue) {
              await github.rest.issues.create({ owner, repo, title, body, assignees });
            } else {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              // A comment, not only a body edit, so every failing night notifies.
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `@${process.env.ALERT_ASSIGNEE} still failing:\n\n${problems.join('\n')}` });
            }
