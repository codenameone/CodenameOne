name: Nightly watchdog

# The expensive suites -- the sample applications, the cn1libs, the device
# integrations, the benchmarks, the full Maven reactor -- run on a pull request
# only when their own tree changes, and on master once a night at 00:11 UTC
# (each carries `cron: '11 0 * * *'`, off the top of the hour, where GitHub
# delays and may drop scheduled runs). Shared code (core, ports, builders,
# backend) therefore reaches them only through that nightly run, so a failure
# there must not go unread the way a red master push did.
#
# This job reads the nightly set from the workflow files themselves -- every
# workflow with an uncommented `- cron: '11 0 * * *'` -- so adding a suite to the
# nightly is one cron line, with no list here to keep in sync. It then finds
# the newest scheduled run of each on master, re-runs the failed jobs of a
# suite's first failure once (see RETRY below), and keeps ONE issue open,
# assigned to NIGHTLY_ALERT_ASSIGNEE, listing every suite that failed or has
# not run in the last 30 hours -- except one that has never had a scheduled
# run and reached master inside that window, which is awaiting its first night.
# A run still going when checked is judged by
# the previous completed one, so a suite that fails after this job has looked
# is reported the next morning; and the issue closes only when every suite has
# finished green, never on one still running.

on:
  schedule:
    # GitHub starts the 00:11 crons late -- 2026-11-12 they started ~07:00 and
    # their macOS jobs queued until ~19:00 -- so one morning check judged most
    # suites by the night BEFORE. Three checks a day; only the first comment of
    # a given failure set pings (see the comment step below).
    - cron: '30 7 * * *'
    - cron: '30 13 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  # write: a first failure is re-run once before it is reported (see RETRY).
  actions: write
  contents: read
  issues: write

concurrency:
  group: nightly-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Open, update, or close the nightly failure issue
        uses: actions/github-script@v8
        env:
          ALERT_ASSIGNEE: ${{ vars.NIGHTLY_ALERT_ASSIGNEE || 'shai-almog' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const title = 'Nightly CI failures';
            const marker = '<!-- nightly-watchdog -->';
            const NIGHTLY = /^\s*-\s*cron:\s*['"]11 0 \* \* \*['"]/m;

            const dir = '.github/workflows';
            const nightly = fs.readdirSync(dir)
              .filter(f => /\.ya?ml$/.test(f) && f !== 'nightly-watchdog.yml')
              .filter(f => NIGHTLY.test(fs.readFileSync(path.join(dir, f), 'utf8')))
              .sort();
            if (nightly.length === 0) {
              core.setFailed(`No workflow in ${dir} is scheduled at '11 0 * * *'; the watchdog would report every night clean.`);
              return;
            }

            // No wall-clock window: a dispatch at any hour, or a delayed
            // schedule, judges the newest scheduled run, which only has to be
            // recent enough to prove the schedule still fires.
            const STALE_MS = 30 * 3600 * 1000;
            const GREEN = ['success', 'skipped', 'neutral'];

            // Which jobs, and which steps in them, failed: one workflow can
            // carry many suites (samples-ios-nightly.yml builds every sample in
            // its own step), so "failure" alone does not say what broke. A job
            // that ran no step never got a runner -- it sat in the macOS queue
            // until it was cancelled (timeout-minutes does not count queue
            // time) -- which is capacity, not code, and is said so.
            const STARVED = 'never got a runner; cancelled while queued';
            async function failedParts(run) {
              let jobs;
              try {
                jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
                });
              } catch (e) {
                return '';
              }
              const parts = [];
              for (const job of jobs) {
                if (GREEN.includes(job.conclusion)) continue;
                const ran = (job.steps || []).filter(s => s.conclusion && s.conclusion !== 'skipped');
                if (ran.length === 0) {
                  parts.push(`${job.name} (${STARVED})`);
                  continue;
                }
                const bad = ran.filter(s => !GREEN.includes(s.conclusion)).map(s => s.name);
                parts.push(bad.length ? `${job.name}: ${bad.join(', ')}` : `${job.name} (${job.conclusion})`);
              }
              return parts.length ? ` -- ${parts.join('; ')}` : '';
            }
            const problems = [];
            const running = [];
            const awaiting = [];
            const cancelled = [];
            const retries = [];
            let retried = 0;
            for (const file of nightly) {
              let runs;
              try {
                ({ data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: file, event: 'schedule', branch: 'master', per_page: 10,
                }));
              } catch (e) {
                // One unreadable suite must not stop the report on the others.
                problems.push(`- \`${file}\`: could not list its runs (${e.status || e.message})`);
                continue;
              }
              const newest = runs[0];
              if (!newest || Date.now() - new Date(newest.created_at).getTime() > STALE_MS) {
                // A suite that has never had a scheduled run, and whose file
                // reached master inside the window, joined the nightly after
                // the night's slot: it is awaiting its first run, not broken.
                // Only a suite with NO scheduled run at all qualifies -- one
                // that ran before and then went quiet is a schedule that
                // stopped, however recently its file was edited -- and only
                // for the window after its file's latest master commit, so a
                // cron that never fires is reported once the file has gone a
                // day unedited. It keeps the issue open like a running
                // suite, under its own heading.
                if (!newest) {
                  let changed = null;
                  try {
                    const { data: commits } = await github.rest.repos.listCommits({
                      owner, repo, sha: 'master', path: `${dir}/${file}`, per_page: 1,
                    });
                    changed = commits.length ? new Date(commits[0].commit.committer.date).getTime() : null;
                  } catch (e) {
                    changed = null;
                  }
                  if (changed !== null && Date.now() - changed <= STALE_MS) {
                    awaiting.push(`- \`${file}\`: no scheduled run yet; it reached master at ${new Date(changed).toISOString()}`);
                    continue;
                  }
                }
                problems.push(`- \`${file}\`: no scheduled run in the last 30 hours (workflow disabled, or the schedule did not fire)`);
                continue;
              }
              // A run past its first attempt has had its re-run, by this
              // script or by hand; it counts against RETRY_CAP below.
              if (newest.run_attempt > 1) retried++;
              const done = runs.find(r => r.status === 'completed');
              if (newest.status !== 'completed') {
                running.push(`- [\`${file}\`](${newest.html_url}): still ${newest.status}${newest.run_attempt > 1 ? ` (attempt ${newest.run_attempt}, re-run after a failure)` : ''}`);
                // A re-run in progress IS tonight's verdict, still pending. The
                // previous completed run is an older night, whose failure the
                // re-run exists to supersede; listing it would report the
                // suite failing and re-running at once.
                if (newest.run_attempt > 1) continue;
              }
              // A cancelled run (a maintainer, or a newer run in its group) is
              // listed but is not a failure -- unless a job in it never got a
              // runner: then the suite did not run that night, which is exactly
              // what this issue exists to say (parley's iOS job, 2026-11-12).
              const parts = done && !GREEN.includes(done.conclusion)
                  && Date.now() - new Date(done.created_at).getTime() <= 2 * STALE_MS
                ? await failedParts(done) : '';
              // RETRY: a suite's first failure after a green night is a
              // candidate for one re-run before it is reported; see where the
              // candidates are settled, below the loop. Only the newest run,
              // only its attempt 1, only when the night before was green -- a
              // suite red two nights running is reported at once. Never a cancelled run,
              // starved or not: that cannot be told from a maintainer
              // clearing the queue (2026-11-17, every queued nightly at once).
              const before = runs.find(r => r.id !== newest.id && r.status === 'completed');
              if (done && done.id === newest.id && done.run_attempt === 1
                  && !GREEN.includes(done.conclusion) && done.conclusion !== 'cancelled'
                  && before && GREEN.includes(before.conclusion)) {
                retries.push({ file, run: done, parts });
                continue;
              }
              if (done && done.conclusion === 'cancelled' && done.run_attempt > 1
                  && Date.now() - new Date(done.created_at).getTime() <= 2 * STALE_MS) {
                // A cancelled RE-RUN is a failure whose second attempt never
                // finished -- the next night's run cancels one still going,
                // they share a concurrency group. Its first attempt failed,
                // or there would have been nothing to re-run; filing it under
                // "cancelled" would lose that failure and close the issue.
                problems.push(`- [\`${file}\`](${done.html_url}): failed, and its re-run (attempt ${done.run_attempt}) was cancelled${parts}`);
              } else if (done && done.conclusion === 'cancelled' && !parts.includes(STARVED)) {
                cancelled.push(`- [\`${file}\`](${done.html_url}): cancelled`);
              } else if (done && !GREEN.includes(done.conclusion)
                  && Date.now() - new Date(done.created_at).getTime() <= 2 * STALE_MS) {
                problems.push(`- [\`${file}\`](${done.html_url}): ${done.conclusion}${parts}`);
              }
            }

            // Much of a red night is not code. On 2026-11-18 Maven Central
            // answered 429 through all of retry.sh's back-off (reel), and
            // purchase-e2e's macOS setup-workspace was cut off at its limit
            // because the cache it restores had been evicted. An alert that is
            // usually infrastructure is one nobody reads, so such a failure
            // gets its failed jobs run once more and is reported only if it
            // fails again. What that costs: a real failure is reported a check
            // or two later (the crons start hours late -- the nightlies near
            // 07:15 UTC, these checks near 17:00, 21:50 and 01:45), and a test
            // that fails once and passes on the re-run is NOT reported; the
            // run's attempt count is its only trace.
            //
            // Not above RETRY_CAP: that many suites failing together is
            // master or an outage, to be reported now, and re-running them
            // would put the whole night back on the runners in the middle of
            // the day's pull requests. The cap counts the night, not the
            // check: suites finish hours apart, so the runs already past
            // their first attempt are counted with this check's candidates. And only from the schedule -- a manual
            // run of this workflow refreshes the issue and starts nothing.
            const RETRY_CAP = 5;
            const retrying = [];
            const mayRetry = context.eventName === 'schedule' && retried + retries.length <= RETRY_CAP;
            for (const { file, run, parts } of retries) {
              if (mayRetry) {
                try {
                  await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
                  retrying.push(`- [\`${file}\`](${run.html_url}): first attempt ${run.conclusion}${parts}; its failed jobs are being re-run`);
                  continue;
                } catch (e) {
                  // Could not re-run (too old, or the API refused): report it.
                  core.warning(`could not re-run ${file} run ${run.id}: ${e.status || e.message}`);
                }
              }
              problems.push(`- [\`${file}\`](${run.html_url}): ${run.conclusion}${parts}`);
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issue = open.find(i => !i.pull_request && i.title === title && (i.body || '').includes(marker));
            const now = new Date().toISOString();

            await core.summary
              .addHeading('Nightly watchdog')
              .addRaw(`${nightly.length} nightly workflows, ${problems.length} failing, ${running.length} still running, ${retrying.length} being re-run, ${awaiting.length} awaiting a first run.\n\n`)
              .addRaw([...problems, ...retrying, ...running, ...awaiting].join('\n') || 'All green.')
              .write();

            if (problems.length === 0) {
              // Close only on a night where everything finished green.
              if (issue && running.length === 0 && awaiting.length === 0 && retrying.length === 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `Recovered: every nightly workflow passed on the run checked at ${now}.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed' });
              } else if (issue) {
                // Nothing to report any more, but not every suite has finished:
                // keep the issue open and stop it listing failures that are gone.
                // "Reported", not "no failures": a first failure being re-run
                // is a failure, listed here as one.
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, body: [
                  marker, `Nothing reported failing as of ${now}; the issue closes once these finish green:`, '', ...retrying, ...running, ...awaiting,
                ].join('\n') });
              }
              return;
            }

            const body = [
              marker,
              `These nightly workflows failed on master (checked ${now}):`,
              '',
              ...problems,
              ...(retrying.length ? ['', 'Failed once after a green night; being re-run before they are reported:', '', ...retrying] : []),
              ...(running.length ? ['', 'Still running when checked (a first attempt is judged by its previous completed run):', '', ...running] : []),
              ...(awaiting.length ? ['', 'Awaiting their first scheduled run (new to the nightly):', '', ...awaiting] : []),
              ...(cancelled.length ? ['', 'Cancelled (not counted as failures):', '', ...cancelled] : []),
              '',
              'They run on a pull request only when their own tree changes, so a change to shared code (core, ports, builders, backend) first meets them here. This issue closes itself after a fully green night.',
            ].join('\n');

            const assignees = process.env.ALERT_ASSIGNEE ? [process.env.ALERT_ASSIGNEE] : undefined;
            if (!issue) {
              await github.rest.issues.create({ owner, repo, title, body, assignees });
            } else {
              // A comment, not only a body edit, so a failing night notifies --
              // but only when the failure set changed since the last PING: three
              // checks a day must not ping three times for one night. Compared
              // with the last ping comment, not the body, because a manual
              // re-check rewrites the body without pinging and would otherwise
              // swallow the ping for a failure it saw first. With no ping yet,
              // the body the issue was opened with is what was announced.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const pings = comments.filter(c => c.user && c.user.type === 'Bot' && (c.body || '').includes('still failing:'));
              const announced = pings.length ? pings[pings.length - 1].body : (issue.body || '');
              const changed = problems.some(p => !announced.includes(p));
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              if (context.eventName === 'schedule' && changed) await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `@${process.env.ALERT_ASSIGNEE} still failing:\n\n${problems.join('\n')}` });
            }
