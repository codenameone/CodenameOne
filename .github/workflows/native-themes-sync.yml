name: Native Themes Sync

# After every push to master that touches the native-theme CSS sources,
# the CSS compiler, or the build script, regenerate the shipped
# `.res` files and commit them straight back to master (no PR). Every
# downstream pipeline (port builds, BuildDaemon, archetypes, website)
# just consumes the committed `.res` instead of rebuilding it, so this
# workflow is the single producer.
#
# Pushes made with GITHUB_TOKEN do not retrigger workflow runs, so the
# commit-back step cannot loop.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/ci/retry.sh'
      - 'native-themes/**'
      - 'maven/css-compiler/**'
      - 'scripts/build-native-themes.sh'
      - '.github/workflows/native-themes-sync.yml'

permissions:
  contents: write
  # The job runs inside the private ghcr.io/codenameone pr-ci-container
  # image; pulling it needs the GITHUB_TOKEN to carry packages:read.
  # Declaring any permissions block resets every unlisted scope to none,
  # so packages:read must be spelled out or the container pull is denied.
  packages: read

concurrency:
  group: native-themes-sync
  cancel-in-progress: false

jobs:
  rebuild-and-commit:
    runs-on: ubuntu-24.04
    container: ghcr.io/codenameone/codenameone/pr-ci-container:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use JDK 8
        run: |
          echo "JAVA_HOME=${JAVA_HOME_8}" >> $GITHUB_ENV
          echo "${JAVA_HOME_8}/bin" >> $GITHUB_PATH

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Build css-compiler
        run: |
          cd maven
          bash $GITHUB_WORKSPACE/scripts/ci/retry.sh mvn -B -pl css-compiler -am install -DskipTests -Dmaven.javadoc.skip=true -Plocal-dev-javase

      - name: Rebuild native themes
        env:
          # Makes the script record every file it wrote, so the commit step below stages
          # what this run actually produced instead of a list kept by hand.
          NATIVE_THEMES_MANIFEST: ${{ runner.temp }}/native-themes-written.txt
        run: ./scripts/build-native-themes.sh

      - name: Commit and push regenerated .res files
        run: |
          set -euo pipefail
          # This job runs inside the pr-ci-container, where the checked-out
          # tree is owned by a different UID than this shell step's user.
          # git's dubious-ownership guard then rejects every command with
          # "fatal: not in a git directory". actions/checkout writes a
          # safe.directory entry, but into the action's HOME, which this
          # bash step doesn't share -- so mark the workspace safe here too.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage what THIS RUN wrote, from the manifest the script emits, rather than
          # from a list kept here. The list used to be the two mobile themes and stayed
          # that way when three desktop themes and two committed port mirrors joined the
          # script: a desktop-only CSS change regenerated three .res files, staged none,
          # reported "nothing to commit" and left every downstream build on the previous
          # binary -- silently, because "nothing to commit" is what a no-op run says too.
          #
          # Untracked outputs are skipped deliberately. The script also mirrors into the
          # JavaScript port's asset directory, which does not commit these themes, and
          # staging blind there would start committing binaries nobody asked for.
          staged="${RUNNER_TEMP}/native-themes-staged.txt"
          : > "$staged"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              printf '%s\n' "$f" >> "$staged"
            else
              echo "not tracked, not staging: $f"
            fi
          done < "${RUNNER_TEMP}/native-themes-written.txt"
          if [ ! -s "$staged" ]; then
            echo "The theme build recorded no tracked outputs; refusing to report success." >&2
            exit 1
          fi
          echo "Staging:"; cat "$staged"
          git add --pathspec-from-file="$staged"
          if git diff --staged --quiet; then
            echo "No .res changes; nothing to commit."
            exit 0
          fi
          git commit -m "ci: auto-regenerate native theme .res files"
          git push
