    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.source-gates.result == 'success' && needs.check-workflows.result == 'success' && needs.select.outputs.scripts-javase == 'true' }}
    uses: ./.github/workflows/scripts-javase.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      packages: read

  linux-build-run:
    needs: [golden-plan, source-gates, check-workflows, select, unity-gallery]
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.source-gates.result == 'success' && needs.check-workflows.result == 'success' && needs.select.outputs.linux-build-run == 'true' && needs.unity-gallery.result == 'success' }}
