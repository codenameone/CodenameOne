      pull-requests: write
      issues: write
      actions: write
      packages: read

  scripts-android:
    needs: [golden-plan, source-gates, check-workflows, select, unity-gallery]
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.source-gates.result == 'success' && needs.check-workflows.result == 'success' && needs.select.outputs.scripts-android == 'true' && needs.unity-gallery.result == 'success' }}
    uses: ./.github/workflows/scripts-android.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      packages: read

  scripts-javascript:
