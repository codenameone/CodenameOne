    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.source-gates.result == 'success' && needs.check-workflows.result == 'success' && needs.select.outputs.parparvm-tests == 'true' }}
    uses: ./.github/workflows/parparvm-tests.yml
    secrets: inherit
