name: CI

# The one workflow a pull request or a master push starts (the sample
# applications, cn1libs and nightlies keep their own, path-scoped workflows).
#
#   precheck   golden-plan, source-gates and check-workflows, a few minutes on
#              Linux. A missing golden, a missing package-info.java, a bad
#              header, a broken workflow file: anything here fails the run
#              before a single build starts, and NOTHING below runs.
#   select     which member workflows the change touches, from each member's
#              old `paths` filter (.github/ci/ci-members.json,
#              scripts/ci/select-ci-members.py).
#   unity      the Unity gallery archive, once for the whole run.
#   members    the selected workflows, as reusable calls in this same run, so
#              they share its artifacts instead of each rebuilding them.
#
# Before this, every member triggered on its own: about ninety workflows each
# ran their own golden-plan copy and then their own builds, so one doomed
# change kept macOS, Windows and Linux runners busy for hours.
#
# A missing golden is not a failure of the change: golden-plan goes red here,
# and Golden capture (golden-capture.yml) records the goldens and pushes them,
# which starts this workflow again.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golden-plan:
    uses: ./.github/workflows/golden-plan.yml
    permissions:
      contents: read

  source-gates:
    uses: ./.github/workflows/source-gates.yml
    permissions:
      contents: read

  check-workflows:
    uses: ./.github/workflows/check-workflows.yml
    permissions:
      contents: read

  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      scripts-ios: ${{ steps.select.outputs.scripts-ios }}
      scripts-macos: ${{ steps.select.outputs.scripts-macos }}
      scripts-fidelity: ${{ steps.select.outputs.scripts-fidelity }}
      scripts-android: ${{ steps.select.outputs.scripts-android }}
      scripts-javascript: ${{ steps.select.outputs.scripts-javascript }}
      scripts-javase: ${{ steps.select.outputs.scripts-javase }}
      linux-build-run: ${{ steps.select.outputs.linux-build-run }}
      windows-cross-build-run: ${{ steps.select.outputs.windows-cross-build-run }}
      parparvm-tests: ${{ steps.select.outputs.parparvm-tests }}
      parparvm-tests-windows: ${{ steps.select.outputs.parparvm-tests-windows }}
      pr: ${{ steps.select.outputs.pr }}
      javadocs: ${{ steps.select.outputs.javadocs }}
      website-docs: ${{ steps.select.outputs.website-docs }}
      developer-guide-docs: ${{ steps.select.outputs.developer-guide-docs }}
      check-doc-snippets: ${{ steps.select.outputs.check-doc-snippets }}
      cn1playground-language: ${{ steps.select.outputs.cn1playground-language }}
      blog-prose: ${{ steps.select.outputs.blog-prose }}
      unity: ${{ steps.select.outputs.unity }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Commits and trees only: the selection reads names, never contents.
          fetch-depth: 0
          filter: blob:none
      - name: Use Google's copy of Maven Central first
        uses: ./.github/actions/maven-central-mirror
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/ci/select-ci-members.py --event "$EVENT" --base "$BASE" --head HEAD
          unity=false
          for m in linux-build-run parparvm-tests-windows scripts-android scripts-ios scripts-javascript scripts-macos windows-cross-build-run; do
            if grep -qx "$m=true" "$GITHUB_OUTPUT"; then unity=true; fi
          done
          echo "unity=$unity" >> "$GITHUB_OUTPUT"

  # Once per run: every member that builds the application downloads it. The
  # members still call unity-gallery-prebuilt.yml themselves (so each works
  # when dispatched alone); in this run those calls find the archive and
  # return at once.
  unity-gallery:
    needs: [golden-plan, source-gates, check-workflows, select]
    if: ${{ needs.golden-plan.outputs.run == 'true' && needs.source-gates.result == 'success' && needs.check-workflows.result == 'success' && needs.select.outputs.unity == 'true' }}
    uses: ./.github/workflows/unity-gallery-prebuilt.yml
    permissions:
      contents: read

  scripts-ios:
    needs: [golden-plan, source-gates, check-workflows, select, unity-gallery]
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.source-gates.result == 'success' && needs.check-workflows.result == 'success' && needs.select.outputs.scripts-ios == 'true' && needs.unity-gallery.result == 'success' }}
    uses: ./.github/workflows/scripts-ios.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      packages: read

  scripts-macos:
    needs: [golden-plan, source-gates, check-workflows, select, unity-gallery]
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.source-gates.result == 'success' && needs.check-workflows.result == 'success' && needs.select.outputs.scripts-macos == 'true' && needs.unity-gallery.result == 'success' }}
    uses: ./.github/workflows/scripts-macos.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      packages: read

  scripts-fidelity:
    needs: [golden-plan, source-gates, check-workflows, select]
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.source-gates.result == 'success' && needs.check-workflows.result == 'success' && needs.select.outputs.scripts-fidelity == 'true' }}
    uses: ./.github/workflows/scripts-fidelity.yml
    secrets: inherit
    permissions:
