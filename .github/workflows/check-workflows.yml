name: Check workflows

# A workflow file GitHub rejects is not a broken job, it is a broken BRANCH: an invalid
# file produces a failed check run on every push to every branch that contains it,
# regardless of that workflow's own triggers and regardless of what the push touched. The
# only symptom is "This run likely failed because of a workflow file issue" with no log,
# which reads like infrastructure noise rather than a file someone has to fix.
#
# That happened here. A job-level `if:` referencing the `matrix` context took two unrelated
# pull requests red for hours. Nothing local objected, because the file is valid YAML --
# yaml.safe_load parses it, an editor shows nothing, and the error exists only in GitHub's
# own expression parser. actionlint reimplements that parser.
#
# Runs on pull_request as well as push, because the point is to catch the file BEFORE it
# reaches a branch other people build on. It is cheap: one ubuntu minute, no build.

permissions:
  contents: read

on:
  workflow_dispatch:
  # Pull requests and master pushes run this as part of ci.yml's precheck,
  # which every other job of that run waits on.
  workflow_call:
concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: check-workflows-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Use Google's copy of Maven Central first
        uses: ./.github/actions/maven-central-mirror

      # Deliberately NOT filtered by paths. A workflow file is only one of the ways this
      # check goes stale: actionlint's own rules move, and a run over an unchanged tree
      # that starts failing is information rather than noise.
      - name: Validate every workflow file
        run: scripts/check-workflows.sh

      # Maven Central throttles the runners: every job with a full checkout has to
      # install the mirror settings, and the CI wrappers must start Maven from R2.
      - name: Check every job installs the Maven Central mirror
        run: python3 scripts/check-maven-central-mirror.py

      # Those wrappers download from repo.codenameone.com, so a Maven or wrapper version
      # bump fails here, in one place, until the "Seed Maven distributions to R2"
      # workflow has copied it there -- not in every job that starts Maven.
      - name: Check R2 serves every Maven distribution the tree names
        run: bash maven/scripts/r2/seed-maven-distributions.sh --verify

      - name: Check CI selection and obsolete-run cancellation
        run: |
          python3 scripts/ci/test_select_cn1lib_checks.py
          python3 scripts/ci/test_select_apple_checks.py
          python3 scripts/ci/test_select_ci_members.py
          python3 scripts/ci/test_cn1ss_golden_plan.py
          node --test scripts/ci/test-cancel-stale-pr-runs.js

      # Same reasoning one level up: fidelity-ios-metal-27 is a COPY of the job
      # beside it, and a copy nobody checks drifts. Both
      # legs of a pair stay green while diverging, because each passes on its own
      # terms and nothing compares them. Also unfiltered by paths -- a pair can
      # drift through an edit to either side.
      - name: Duplicated CI legs must stay identical
        run: scripts/check-duplicated-ci-legs.py

      # This workflow is unfiltered, so changes to the spec, its validator, or any
      # native reference table are checked before they reach master.
      - name: Validate fidelity spec and native reference tables
        run: |
          python3 scripts/test_check_fidelity_spec.py
          python3 scripts/check-fidelity-spec.py

      - name: Check desktop hover queues under saturation
        run: python3 scripts/test_native_hover_queue.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use Google's copy of Maven Central first
        uses: ./.github/actions/maven-central-mirror

      - name: Check fidelity baseline coverage enforcement
        run: |
          python3 scripts/test_fidelity_gate.py
          python3 scripts/test_fidelity_geometry.py
