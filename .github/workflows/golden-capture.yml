name: Golden capture

# A pull request that adds a hellocodenameone screenshot test, or deletes a
# golden, needs images on every platform that runs the test, and until now the
# only way to get them was a whole CI round per attempt, run for one image.
#
# This workflow reads the suite's source (scripts/ci/cn1ss-golden-plan.py) and
# checks every golden directory on its own: a screenshot test with no image in
# a directory whose port runs it is a gap, and so is a golden the PR's base has
# and the PR deleted. Which ports a test skips is declared
# in the test (`// cn1ss-skip: <ports>`) and held to the tree both ways, so
# the tree's goldens are complete and a gap is the whole signal: no marker, no
# diff. When there is any gap, it:
#   1. dispatches each screenshot workflow on the PR branch with
#      `cn1ss_capture`: the FULL suite runs (tests leak, so a subset could
#      render differently), non-screenshot jobs skip, and every image without
#      a golden is uploaded instead of gated (.github/actions/cn1ss-capture).
#      The PR's own runs are left alone: the screenshot workflows skip every
#      job by themselves (their first job, golden-plan.yml, runs the same
#      detector and fails naming the gaps), and every other check keeps
#      reporting on the code;
#   2. sets a pending "Golden capture" status on the PR's head, since GitHub
#      does not show workflow_dispatch runs on a PR;
#   3. exits. It does not wait: the slowest leg takes hours, often more while
#      macOS runners are queued, and a job that polled for that long held a
#      runner the whole time and lost everything that had arrived when it hit
#      its deadline. Each capture run's completion starts golden-harvest.yml,
#      and once the last one at this head has completed, that collects every
#      image without a golden, commits them and pushes with CN1SS_GH_TOKEN, so
#      the push starts the normal CI, where the detector now finds nothing.
#
# A gap still open after that push is golden-plan's to report: its leg failed,
# or the test captures nothing there and needs a cn1ss-skip declaration. What
# did arrive is still committed, so the next push captures only what is left.
# The harvest settles the status: success with the commit, or failure when a
# leg failed or nothing arrived.
#
# Pull requests from forks are skipped: the dispatches need the branch in this
# repository and the push needs a token a fork run does not get. Review the
# captured images in the commit like any other golden change.

on:
  # No paths filter: a deleted golden needs a capture as much as a new test,
  # and the detector costs seconds.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: golden-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.find.outputs.tests }}
    steps:
      # The merge commit, as golden-plan.yml sees it: its first parent is the
      # base, so a deleted golden is a gap as well.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
      - id: find
        run: |
          set -euo pipefail
          tests="$(python3 scripts/ci/cn1ss-golden-plan.py --verbose --from-git --base=HEAD^1)"
          echo "New tests to capture: ${tests:-none}"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  capture:
    needs: detect
    if: needs.detect.outputs.tests != ''
    runs-on: ubuntu-24.04
    # Dispatching only; golden-harvest.yml collects. golden-capture.sh waits
    # up to five minutes for each of seven runs to appear.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      TESTS: ${{ needs.detect.outputs.tests }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      RUNS: /tmp/golden-capture-runs.txt
    steps:
      # Before anything is dispatched: without the token the harvest cannot
      # push what the capture renders.
      - name: Check the push token
        env:
          CN1SS_GH_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
        run: |
          if [ -z "$CN1SS_GH_TOKEN" ]; then
            echo "::error::secrets.CN1SS_GH_TOKEN is not set; golden capture cannot push."
            exit 1
          fi
          # Set is not enough: an expired or narrowed token would pass the check
          # above and fail only at the push, hours of runners later.
          push="$(GH_TOKEN="$CN1SS_GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq .permissions.push 2>/dev/null || true)"
          if [ "$push" != true ]; then
            echo "::error::secrets.CN1SS_GH_TOKEN cannot push to $GITHUB_REPOSITORY (expired, revoked or lacking Contents: write); golden capture cannot push. Regenerate it (see the note in scripts-android.yml)."
            exit 1
          fi

      # Only for the scripts: the dispatched runs check out the branch themselves.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Dispatch the screenshot workflows in capture mode
        run: scripts/ci/golden-capture.sh dispatch "$HEAD_REF" "$TESTS" "$RUNS"

      # The capture's runs are workflow_dispatch runs, which GitHub does not
      # show on the PR; this status is the PR's view of them, and
      # golden-harvest.yml settles it once they have all completed.
      - name: Show the capture on the PR
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          n="$(wc -l < "$RUNS")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context="Golden capture" \
            -f description="Capturing goldens: $n screenshot workflows running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null \
            || echo "::warning::could not set the Golden capture status; the capture runs anyway"

      # Failed or cancelled (a new push replaced this job mid-dispatch):
      # nothing else stops the captures it did start, and a part capture
      # would never harvest.
      - name: Cancel the captures that did start
        if: failure() || cancelled()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f "$RUNS" ]; then
            while read -r wf id; do
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            done < "$RUNS"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=error -f context="Golden capture" \
            -f description="The capture did not start; re-run Golden capture" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null || true
