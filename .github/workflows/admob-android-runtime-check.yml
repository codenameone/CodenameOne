name: AdMob Android banner runtime check

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'maven/cn1-admob/**'
      - 'scripts/cn1lib-api-check/admob-runtime/**'
      - '.github/workflows/admob-android-runtime-check.yml'
  push:
    branches: [master]
    paths:
      - 'maven/cn1-admob/**'
      - 'scripts/cn1lib-api-check/admob-runtime/**'
      - '.github/workflows/admob-android-runtime-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  banner-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle -p scripts/cn1lib-api-check/admob-runtime connectedDebugAndroidTest
