name: Syndicate Blog Posts

on:
  schedule:
    # Daily at 13:17 UTC. GitHub warns that scheduled workflows at the start of
    # an hour can be delayed or dropped during periods of high Actions load.
    # Runs from the default branch only, per GitHub's cron rules.
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip API calls and only print what would happen.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blog-syndication
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Token with write scope so the post-run commit can push the state file.
          token: ${{ secrets.GITHUB_TOKEN }}
          # The state commit rebases onto the latest default-branch commit before
          # pushing. A complete history is required when master advanced after
          # this scheduled run was created.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run syndication regression tests
        run: |
          python3 scripts/website/test_syndicate_blog_posts.py
          python3 scripts/website/test_syndicate_foojay_posts.py
          python3 scripts/website/test_syndicate_browser_posts.py
          python3 scripts/website/test_queue_browser_syndication.py
          python3 scripts/website/test_queue_social_posts.py
          python3 scripts/website/test_syndication_health.py
          node scripts/website/test_syndication_schedule_sla.js

      - name: Run API syndication script
        id: syndicate_api
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/website/syndicate_blog_posts.py --dry-run
          else
            python3 scripts/website/syndicate_blog_posts.py
          fi

      - name: Install markdown package (for browser-extension queue HTML)
        run: |
          set -euo pipefail
          pip install markdown

      - name: Queue browser-extension syndication tasks (Medium)
        run: |
          set -euo pipefail
          python3 scripts/website/queue_browser_syndication.py --platforms medium

      # LinkedIn's weekly blog-post syndication is paused. Keep validating
      # existing artifacts so malformed inputs still fail CI, but do not add
      # them to the browser publisher queue. An explicitly approved post can
      # still be queued manually with queue_social_posts.py.
      - name: Validate LinkedIn posts without queueing
        run: |
          set -euo pipefail
          python3 scripts/website/queue_social_posts.py --validate-only

      # Run after queue creation so missing cross-repository credentials cannot
      # prevent the existing local publisher from receiving its Medium work.
      - name: Submit Foojay article for editorial review
        env:
          FOOJAY_GITHUB_TOKEN: ${{ secrets.FOOJAY_GITHUB_TOKEN }}
          FOOJAY_HEAD_REPO: ${{ vars.FOOJAY_HEAD_REPO }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/website/syndicate_foojay_posts.py --dry-run
          else
            python3 scripts/website/syndicate_foojay_posts.py --submit
          fi

      - name: Upload syndication screenshots on failure
        if: ${{ always() && hashFiles('docs/website/reports/syndication-screenshots/**/*.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: syndication-screenshots
          path: docs/website/reports/syndication-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated syndication state and queue
        # always() so a successful publish is committed even when a later step
        # (browser syndication, queueing) fails -- otherwise the recorded state is
        # discarded and the same post is re-selected and rejected on the next run.
        if: ${{ always() && inputs.dry_run != true }}
        run: bash scripts/website/commit_syndication_state.sh
