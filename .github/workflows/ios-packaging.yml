name: Test iOS packaging

# Automatic triggers and changed-file selection are owned by scripts-ios.yml.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      port_prepared:
        type: boolean
        default: false
      # True when the caller already ran unity-gallery-prebuilt.yml in this run:
      # its artifact has a fixed name and cannot be uploaded twice.
      unity_prepared:
        type: boolean
        default: false

concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: packaging-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The application has a Unity project in it. One Linux job compiles it and
  # hands the result to the job below as an artifact, unless the caller did.
  unity-gallery:
    if: ${{ !inputs.unity_prepared }}
    uses: ./.github/workflows/unity-gallery-prebuilt.yml

  build-port:
    if: ${{ !inputs.port_prepared }}
    uses: ./.github/workflows/_build-ios-port.yml
    with:
      test_server: true

  packaging:
    if: ${{ !cancelled() && (inputs.port_prepared || needs.build-port.result == 'success') && (inputs.unity_prepared || needs.unity-gallery.result == 'success') }}
    needs: [build-port, unity-gallery]
    permissions:
      contents: read
    runs-on: macos-15
    # This job runs device Release and simulator UI builds in sequence. The
    # numbers below are from when a third build, for the notification tests,
    # followed them; it is gone (see the end of the job) and the limit has been
    # left where it was. On a cold runner all tests passed after 119m44s, leaving
    # only 16s of the old two-hour budget for artifact upload and cache saves. Keep
    # the individual step limits below and allow 30m of finalization headroom.
    # The hello app now also translates the Android compatibility gallery, its runtime and the Kotlin stdlib; 150 no longer covered the three builds.
    timeout-minutes: 210
    # Exercises both CocoaPods and SPM in a single Xcode project. Catches
    # regressions in either dependency manager (each pathway runs end to end)
    # and additionally validates that they coexist correctly. Also turns on
    # Google sign-in so GoogleConnectImpl.m is compiled under Xcode -- catches
    # signature drift between hand-written iOS port .m files and the
    # ParparVM-generated `set_field_*` headers, which is otherwise invisible
    # until a customer enables Google sign-in.
    env:
      IOS_DEPENDENCY_ARGS: >-
        -Dcodename1.arg.ios.dependencyManager=both
        -Dcodename1.arg.ios.pods=AFNetworking
        -Dcodename1.arg.ios.spm.packages=swift-collections|https://github.com/apple/swift-collections.git|from:1.1.0
        -Dcodename1.arg.ios.spm.products.swift-collections=Collections
        -Dcodename1.arg.ios.gplus.clientId=000000000000-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.apps.googleusercontent.com

    steps:
      - uses: actions/checkout@v6

      - name: Cache CocoaPods and user gems
        uses: actions/cache@v5
        with:
          path: |
            ~/.gem
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-v1-${{ hashFiles('scripts/setup-workspace.sh') }}
          restore-keys: |
            ${{ runner.os }}-pods-v1-

      - name: Ensure CocoaPods tooling
        run: |
          mkdir -p ~/.codenameone
          cp maven/UpdateCodenameOne.jar ~/.codenameone/
          set -euo pipefail
          GEM_USER_DIR="$(ruby -e 'print Gem.user_dir')"
          export PATH="$GEM_USER_DIR/bin:$PATH"
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods xcodeproj --no-document --user-install
          fi
          pod --version

      - name: Compute setup-workspace hash
        id: setup_hash
        run: |
          set -euo pipefail
          echo "hash=$(shasum -a 256 scripts/setup-workspace.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Compute CN1 source hash
        id: src_hash
        run: |
          set -euo pipefail
          SRC_HASH=$(find CodenameOne/src Ports/iOSPort vm/JavaAPI vm/ByteCodeTranslator Themes native-themes \
              maven/codenameone-maven-plugin/src/main \
              maven/build-engine/src/main \
              maven/project-model/src/main \
              -type f \( -name '*.java' -o -name '*.m' -o -name '*.h' -o -name '*.xml' -o -name '*.properties' -o -name '*.css' \) 2>/dev/null \
              | sort | xargs shasum -a 256 | shasum -a 256 | awk '{print $1}')
          POM_HASH=$(find . -name 'pom.xml' -not -path './scripts/*' 2>/dev/null \
              | sort | xargs shasum -a 256 | shasum -a 256 | awk '{print $1}')
          # The build INVOCATION belongs in the key, not just the sources. Derived data
          # embeds the SDK, destination and per-target product layout an invocation
          # produced; restoring a tree built by a different one leaves Xcode's build
          # database claiming targets are up to date when their products are absent
          # ("Build input file cannot be found ... output of a script phase").
          SCRIPT_HASH=$(shasum -a 256 \
              scripts/setup-workspace.sh \
              scripts/build-ios-port.sh \
              scripts/build-native-themes.sh \
              scripts/build-ios-app.sh \
              scripts/run-ios-device-release-build.sh \
              scripts/run-ios-ui-tests.sh \
              scripts/lib/xcode.sh \
              .github/workflows/_build-ios-port.yml \
              | shasum -a 256 | awk '{print $1}')
          echo "hash=${SRC_HASH:0:16}-${POM_HASH:0:16}-${SCRIPT_HASH:0:16}" >> "$GITHUB_OUTPUT"

      - name: Set TMPDIR
        run: echo "TMPDIR=${{ runner.temp }}" >> $GITHUB_ENV

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Restore cn1-binaries cache
        uses: actions/cache@v5
        with:
          path: ../cn1-binaries
          key: cn1-binaries-${{ runner.os }}-${{ steps.setup_hash.outputs.hash }}
          restore-keys: |
            cn1-binaries-${{ runner.os }}-

      - name: Download built CN1 + iOS port bundle
        uses: actions/download-artifact@v4
        with:
          name: cn1-built-bundle
          path: ${{ runner.temp }}
      - name: Restore built CN1 + iOS port tree
        run: |
          set -euo pipefail
          # Replaces the evictable cn1-built cache restore with the artifact
          # build-port handed off (not LRU-evicted, survives --failed re-runs).
          tar -C / -xf "$RUNNER_TEMP/cn1-built-bundle.tar"
          # The test server build-port built for the whole run, when it did.
          # Without it the suite script builds its own, as it always has.
          if [ -f "$RUNNER_TEMP/cn1ss-server.tar" ]; then
            tar -C / -xf "$RUNNER_TEMP/cn1ss-server.tar"
          fi
          if [ -d "$RUNNER_TEMP/cn1ss-server/classes" ]; then
            echo "CN1SS_SERVER_DIST=$RUNNER_TEMP/cn1ss-server" >> "$GITHUB_ENV"
            echo "Using the prebuilt test server in $RUNNER_TEMP/cn1ss-server"
          else
            echo "No prebuilt test server in the bundle; the suite builds its own."
          fi

      # After everything that fills the local Maven repository and before the
      # application is built; this job has no .NET SDK (see the action).
      - name: Unpack the Unity gallery prebuilt
        uses: ./.github/actions/unity-gallery-prebuilt

      - name: Build sample iOS app
        id: build_ios_app
        run: ./scripts/build-ios-app.sh -q -DskipTests
        timeout-minutes: 30

      - name: Cache iOS device release derived data
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cn1-ios-device-release-derived
          key: ${{ runner.os }}-ios-device-release-derived-${{ steps.src_hash.outputs.hash }}
          # Deliberately no restore-keys prefix. A partial match here restores derived
          # data produced by a DIFFERENT build invocation, and a stale Xcode build
          # database is worse than a cold compile: it reports success for targets it
          # skipped. An exact hit or nothing.

      - name: Build Release iOS device app without signing
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/ios-device-release
          CN1_IOS_DEVICE_DERIVED_DATA: ${{ runner.temp }}/cn1-ios-device-release-derived
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACTS_DIR}"
          ./scripts/run-ios-device-release-build.sh \
            "${{ steps.build_ios_app.outputs.workspace }}" \
            "${{ steps.build_ios_app.outputs.scheme }}"
        # A cold Release compile of the hello app (now with the Android compatibility gallery, its runtime and the Kotlin stdlib) took 42.5 of 45 minutes.
        timeout-minutes: 70

      # The binary half of scripts-ios.yml's private-API gate. App Store Connect scans the
      # linked executable, so this reads what it would read: every import of the Release
      # device build and of every bundle nested in it, including what cn1libs, pods and
      # Swift brought in. Any SDK symbol no public header declares fails the job -- the
      # upload would have failed with "The app references non-public symbols" anyway.
      - name: Check the Release app imports no private Apple API
        env:
          CN1_IOS_DEVICE_DERIVED_DATA: ${{ runner.temp }}/cn1-ios-device-release-derived
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source scripts/lib/xcode.sh
          cn1_select_xcode || exit 1
          APP="$CN1_IOS_DEVICE_DERIVED_DATA/Build/Products/Release-iphoneos/${{ steps.build_ios_app.outputs.scheme }}.app"
          if [ ! -d "$APP" ]; then
            echo "No Release app at $APP; found:" >&2
            ls "$CN1_IOS_DEVICE_DERIVED_DATA/Build/Products/Release-iphoneos" >&2 || true
            exit 1
          fi
          scripts/check-ios-private-api.py --developer-dir "$DEVELOPER_DIR" --binary "$APP"
        timeout-minutes: 10

      - name: Cache iOS derived data
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cn1-ios-derived
          # Keyed on the CN1 source hash so a re-run of the same commit (and any unchanged-source
          # run) restores the compiled objects and builds incrementally; a source change misses
          # and does a full (headroom-covered) build.
          key: ${{ runner.os }}-ios-derived-${{ steps.src_hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-ios-derived-

      - name: Run iOS UI smoke
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/ios-packaging
          # The packaging smoke only needs the app to build, launch and screenshot -- it is not
          # the SIMD benchmark, so compile the translated C at -O1 instead of the default -O2.
          # That roughly halves the native compile time (the step's dominant cost), keeping it
          # within budget after the gaming runtime enlarged core. The benchmark/metal pipeline
          # keeps the -O2 default.
          CN1_TEST_OPT_LEVEL: "1"
          # Cached derived-data dir: a re-run restores these compiled objects instead of
          # recompiling the whole translated core.
          CN1_IOS_DERIVED_DATA: ${{ runner.temp }}/cn1-ios-derived
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACTS_DIR}"
          ./scripts/run-ios-ui-tests.sh \
            "${{ steps.build_ios_app.outputs.workspace }}" \
            "" \
            "${{ steps.build_ios_app.outputs.scheme }}"
        # run-ios-ui-tests.sh has a 12-minute no-progress watchdog and a
        # bounded 35-minute suite cap; include native build/cleanup headroom.
        # The cold -O1 compile alone reached 52 minutes once the hello app gained the Android compatibility gallery, its runtime and the Kotlin stdlib.
        timeout-minutes: 100

      # No XCTest run here. This job used to end with run-ios-native-tests.sh, the
      # same notification tests scripts-ios-native.yml runs, from the same script.
      # Measured over three runs it took 23.5, 25.3 and 38 minutes of this job, and
      # the tests in it take 0.17 seconds: the rest was the rebuild Xcode does after
      # the test target is injected into the project.
      #
      # scripts-ios-native.yml is the one that stays. Both are called from
      # scripts-ios.yml on the same events, and .github/ci/apple-checks.json selects
      # that suite for every path that selected this one for the tests' sake, plus
      # the core, the VM and the Maven modules, which this job is not selected for.
      # What is no longer covered anywhere: the tests built in THIS job's
      # configuration -- CocoaPods and SPM together, Google sign-in on, -O1. The
      # application itself still builds and runs that way in the smoke above.
      # A standalone dispatch of this workflow runs no XCTest; dispatch
      # scripts-ios-native.yml for that.

      - name: Upload packaging artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-packaging
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
