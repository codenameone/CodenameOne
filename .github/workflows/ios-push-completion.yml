name: iOS push completion contract

on:
  # Nightly at 00:11 UTC on master (nightly-watchdog.yml opens an issue when it
  # fails), and on a pull request only when this workflow's own tree changes.
  # Shared code (core, ports, builders, backend) reaches it through the nightly.
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/ios/push-completion-tests/**'
      - '.github/workflows/ios-push-completion.yml'
  schedule:
    - cron: '11 0 * * *'

permissions:
  contents: read

concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-contract:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compile, link, and exercise push completion with push enabled and disabled
        run: python3 scripts/ios/push-completion-tests/check.py
