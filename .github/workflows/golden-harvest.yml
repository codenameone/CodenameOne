name: Golden harvest

# Commits the goldens a normal screenshot run produced but the source could
# not predict: a new variant of an existing test, a platform's own image set.
# golden-plan.yml stops a run before it starts when it can see a golden is
# missing (a new test, a golden the PR deleted); what it cannot see, the run
# itself finds. Every screenshot job uploads the images it rendered that have
# no golden (`cn1ss-capture-<leg>`, .github/actions/cn1ss-capture) and still
# fails its gate on them. As screenshot runs at the PR's head complete, this
# commits any images they have already uploaded to the branch with
# CN1SS_GH_TOKEN, and
# the push starts CI again on a head that has them.
#
# It is also the second half of golden-capture.yml: that dispatches the
# screenshot workflows in capture mode (workflow_dispatch runs on the PR
# branch) and exits, and this collects them the same way after each one
# completes. It settles the "Golden capture" status after the final leg.
#
# workflow_run always runs the default branch's copy of this file, so the
# harvest does nothing for any PR until it is on master, including the PR
# that adds it.
#
# Only the default branch's scripts run here (workflow_run), and the PR's
# artifacts are data: only .png files under a golden directory, owned by a
# screenshot_mappings entry, absent from the branch, are taken. Review them in
# the commit like any other golden change. Forks are skipped: there is no
# branch here to push to.

on:
  workflow_run:
    workflows:
      - Test iOS UI build scripts
      - Test Android build scripts
      - Test JavaScript screenshot scripts
      - Linux native build + run (GTK3, x64 + arm64)
      - ParparVM Java Tests (Windows)
      - Windows cross-build + run (Linux build -> Windows run)
      - Test macOS UI build scripts
    types: [completed]
  # By hand, for a head whose capture completed without starting this (see
  # DISPATCH_TOKEN in golden-capture.yml): runs this file from master, like
  # workflow_run does.
  workflow_dispatch:
    inputs:
      head_ref:
        description: PR branch to harvest
        required: true
      head_sha:
        description: "Commit the screenshot runs rendered (default: the branch head)"
        required: false

permissions:
  contents: read

# One per branch: the last run to complete is the one that harvests, a second
# completion queued behind it finds the images already there, and harvests of
# two heads of one branch never push at once.
#
# The images were rendered from the pull_request merge commit and land on the
# head branch. That is the commit the next run compares on as well, so the
# golden matches what CI will render.
concurrency:
  group: golden-harvest-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || inputs.head_ref }}
  cancel-in-progress: false

jobs:
  harvest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      # The "Golden capture" status golden-capture.yml leaves pending.
      statuses: write
      # The Golden capture comment on the PR (github-actions[bot]).
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
      HEAD_REF: ${{ github.event.workflow_run.head_branch || inputs.head_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: trusted
      - name: List the screenshot runs at this head
        id: list
        run: |
          set -euo pipefail
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_REF" --jq .sha)"
            echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          fi
          # A PR's last runs often complete after it merged or closed, and
          # the branch is usually deleted by then: there is nothing to push
          # to, and goldens must never land on a merged branch either.
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json isCrossRepository,baseRefName --jq "[.[] | select(.isCrossRepository | not) | select(.baseRefName != \"$HEAD_REF\")] | length")"
          # Same-repo PRs only, and never a base branch: a hand dispatch names
          # the branch freely, and a fork PR can share a branch name.
          [ "$HEAD_REF" != "${{ github.event.repository.default_branch }}" ] || open=0
          if [ "$open" = 0 ]; then
            echo "No open pull request for $HEAD_REF (merged, closed or deleted); nothing to harvest."
            echo "ready=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          trusted/scripts/ci/golden-harvest.sh list "$HEAD_SHA" runs.txt
      # A capture leg cancelled after it started (a timeout, by hand) stops
      # counting as a capture run, so the listing above waits for it, and if
      # it was the last to complete nothing else would ever settle the status.
      # (A newer push cancelling an older capture lands on that older head.)
      - name: Settle a capture whose leg was cancelled
        if: >-
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.conclusion == 'cancelled'
        env:
          WF: ${{ github.event.workflow_run.name }}
        run: |
          trusted/scripts/ci/golden-harvest.sh status "$HEAD_SHA" failure "$WF capture was cancelled; re-run Golden capture"
      - name: Check the push token
        if: steps.list.outputs.runs != '0'
        env:
          CN1SS_GH_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
        run: |
          if [ -z "$CN1SS_GH_TOKEN" ]; then
            echo "::error::secrets.CN1SS_GH_TOKEN is not set; golden harvest cannot push."
            exit 1
          fi
          # Set is not enough: an expired or narrowed token would pass the check
          # above and fail only at the push, after the legs had all run.
          push="$(GH_TOKEN="$CN1SS_GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq .permissions.push 2>/dev/null || true)"
          if [ "$push" != true ]; then
            echo "::error::secrets.CN1SS_GH_TOKEN cannot push to $GITHUB_REPOSITORY (expired, revoked or lacking Contents: write); golden harvest cannot push. Regenerate it (see the note in scripts-android.yml)."
            exit 1
          fi
      - uses: actions/checkout@v6
        if: steps.list.outputs.runs != '0'
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.head_ref }}
          token: ${{ secrets.CN1SS_GH_TOKEN }}
          path: pr
      - name: Collect, commit and push the goldens
        id: collect
        if: steps.list.outputs.runs != '0'
        env:
          # The runs at this head are a capture's (golden-capture.yml), not
          # only the PR's own: whichever run completed last started this.
          CAPTURE: ${{ steps.list.outputs.capture }}
          # Re-runs a leg GitHub dropped; see redo-dropped in the script.
          CN1SS_GH_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
        run: |
          set -euo pipefail
          cd pr
          # The branch may have moved past HEAD_SHA. When the new head has
          # screenshot runs of its own, they render the current code and will
          # harvest; these images may be stale. When it has none (the paths
          # filters skipped them all), nobody else will, so collect onto the
          # head: nothing existing is overwritten.
          now="$(git rev-parse HEAD)"
          if [ "$now" != "$HEAD_SHA" ]; then
            if ! own="$(../trusted/scripts/ci/golden-harvest.sh count "$now")"; then
              echo "::error::could not list the screenshot runs at $now"
              exit 1
            fi
            if [ "$own" -gt 0 ]; then
              echo "The branch moved to $now, which has $own screenshot run(s) of its own; they harvest."
              exit 0
            fi
          fi
          # Again at collect time: a leg that completed after the listing
          # step queued a harvest this group may have replaced.
          # A leg restarted since the first listing is not done: the
          # harvest its completion starts takes over.
          rc=0
          ../trusted/scripts/ci/golden-harvest.sh list "$HEAD_SHA" ../runs.txt || rc=$?
          if [ "$rc" != 0 ]; then
            exit "$rc"
          fi
          # A leg GitHub never gave a runner is re-run, not reported as a
          # failed capture; its completion starts the harvest again. Do not
          # wait to collect artifacts from legs that already finished.
          if [ "$CAPTURE" = 1 ] && [ "${{ steps.list.outputs.ready }}" = 1 ]; then
            redone="$(RERUN_TOKEN="$CN1SS_GH_TOKEN" ../trusted/scripts/ci/golden-harvest.sh redo-dropped ../runs.txt)"
            if [ "$redone" -gt 0 ]; then
              ../trusted/scripts/ci/golden-harvest.sh status "$HEAD_SHA" pending \
                "GitHub dropped $redone capture leg(s) for lack of a runner; re-running them"
              echo "settled=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          ok=1
          ../trusted/scripts/ci/golden-harvest.sh collect ../runs.txt "$PWD" || ok=0
          git add -A -- scripts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Harvest goldens rendered at ${HEAD_SHA:0:12}" \
              -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git push origin "HEAD:$HEAD_REF"
            committed="$(git rev-parse HEAD)"
          fi
          if [ "$CAPTURE" = 1 ] && [ "${{ steps.list.outputs.ready }}" = 1 ]; then
            # A leg that failed still uploads what it rendered, so a commit
            # does not mean every leg came back. Settle only after every
            # requested run is complete.
            failed=""
            while read -r wf id; do
              c="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .conclusion)" || c=unknown
              [ "$c" = success ] || failed="$failed ${wf%.yml}"
            done < ../runs.txt
            [ -z "$failed" ] || ok=0
            if [ -n "${committed:-}" ] && [ "$ok" = 1 ]; then
              state=success desc="Goldens committed in ${committed:0:12}"
            elif [ -n "${committed:-}" ]; then
              state=failure desc="Committed what arrived (${committed:0:12}); failed:${failed:- collect}"
            else
              state=failure desc="No leg produced a golden; golden-plan names the gaps"
            fi
            ../trusted/scripts/ci/golden-harvest.sh status "$HEAD_SHA" "$state" "$desc"
            # The commit is the head the PR now shows, and its push runs
            # golden-capture.yml again, which captures (and sets this status
            # pending) only if goldens are still missing there. A failure
            # copied onto it stayed red on a PR that had every golden.
            if [ -n "${committed:-}" ]; then
              ../trusted/scripts/ci/golden-harvest.sh status "$committed" success \
                "Goldens committed here; Golden capture re-checks this head for gaps"
            fi
            echo "settled=1" >> "$GITHUB_OUTPUT"
          fi
          [ "$ok" = 1 ]

      # Anything above that failed before the status was settled (the token,
      # a push that lost a race, an API error) would leave the capture's
      # status pending for good.
      - name: Settle a capture that could not be harvested
        if: >-
          (failure() || cancelled()) && steps.collect.outputs.settled != '1' &&
          (steps.list.outputs.capture == '1' || github.event.workflow_run.event == 'workflow_dispatch')
        run: |
          trusted/scripts/ci/golden-harvest.sh status "$HEAD_SHA" error "The harvest failed; see the run, then re-run Golden capture"
