---
name: Native theme fidelity

# Measures how close Codename One's native themes render to the REAL native OS
# widgets. Runs the fidelity app on an Android emulator (Material 3) and an iOS
# simulator (Modern theme, Metal pipeline): each component is rendered as the CN1
# widget AND the native widget IN THE SAME ENVIRONMENT, and the two are diffed.
# Comparing same-environment renders makes the score robust to the subtle
# rendering differences between CI machines; the committed goldens + baselines
# are re-seedable drift artifacts (FIDELITY_UPDATE_GOLDENS / _BASELINE).

'on':
  # Keep manual dispatch available for deliberate fidelity runs outside the
  # native-theme CSS change workflow.
  workflow_dispatch:
  pull_request:
    paths:
      # The 26 row's trigger was CSS-only by design. The 27 row is not: it is the
      # only check on a theme generation nothing else exercises, and a renderer,
      # port, harness or workflow change reaches it without touching any CSS.
      # This PR proved the gap -- it edits the workflow, GlassRecipe, the gate and
      # the frame goldens, and neither fidelity row ran.
      - '.github/workflows/scripts-fidelity.yml'
      - 'scripts/build-fidelity-app.sh'
      - 'scripts/run-ios-fidelity-tests.sh'
      # The iOS legs boot their simulator through this helper and read its
      # `udid` output, so a change to it alone must exercise them.
      - 'scripts/ci/boot-ios-simulator.sh'
      - 'scripts/run-android-fidelity-tests.sh'
      - 'scripts/lib/cn1ss.sh'
      - 'scripts/common/java/**'
      - 'scripts/fidelity-app/**'
      - '!scripts/fidelity-app/*-native-ref/**'
      - 'CodenameOne/src/com/codename1/ui/plaf/**'
      # One entry per THEME, not per file: ios-modern is built from
      # common.css + gen26.css + gen27.css since the generation split, and this
      # list still named the theme.css that split removed -- so from that merge
      # until this fix, NO pull request could trigger the iOS fidelity suite at
      # all. It went unnoticed because the splitting PR itself matched: deleting
      # a path counts as touching it, so the last PR this gate ran on was the one
      # that broke it.
      #
      # Globbed by directory so the next part file is covered on the day it is
      # added rather than the day someone notices. native-themes/<theme>/target/
      # is the concatenated build input and is gitignored, so it never appears in
      # a pull request and cannot widen this.
      - 'native-themes/ios-modern/**'
      - 'native-themes/android-material/**'
      # The screenshot transport is now a Codename One backend application, so the
      # two files that are ONLY exercised here have to trigger this leg: the
      # server itself and the script that launches it.
      #
      # Deliberately NOT the rest of vm/backend. The websocket protocol code is
      # covered by maven/backend's unit tests, by vm/tests against the translated
      # binary, and by the Autobahn conformance job -- all of which already
      # trigger on vm/**. Fanning every backend change out to the macOS and
      # emulator legs as well would buy nothing and cost a great deal: a change to
      # the ORM, the database layer or the HTTP parser cannot reach this
      # transport.
      - 'vm/backend/demo/cn1ss/**'
      - 'scripts/lib/cn1ss.sh'
  push:
    branches: [master]
    paths:
      - '.github/workflows/scripts-fidelity.yml'
      - 'scripts/build-fidelity-app.sh'
      - 'scripts/run-android-fidelity-tests.sh'
      - 'scripts/run-ios-fidelity-tests.sh'
      # The iOS legs boot their simulator through this helper and read its
      # `udid` output, so a change to it alone must exercise them.
      - 'scripts/ci/boot-ios-simulator.sh'
      - 'scripts/lib/cn1ss.sh'
      - 'scripts/common/java/**'
      - 'scripts/fidelity-app/**'
      # The standalone native-reference apps are excluded on purpose. CI never runs
      # them -- references are captured off-CI and committed (see
      # scripts/fidelity-app/README.md) -- so a change to one cannot move an Android or
      # iOS fidelity score, and letting them through costs a 60 + 90 minute emulator and
      # simulator run per edit. That matters most for the desktop reference apps, which
      # are iterated against a manual dispatch workflow and would otherwise fire this one
      # on every push.
      - '!scripts/fidelity-app/*-native-ref/**'
      - 'native-themes/ios-modern/**'
      - 'native-themes/android-material/**'
      - 'CodenameOne/src/**'
      - 'Ports/Android/**'
      - 'Ports/iOSPort/**'
      - 'vm/**'
      - 'maven/**'
      - '!maven/core-unittests/**'
      # The screenshot transport is now a Codename One backend application, so the
      # two files that are ONLY exercised here have to trigger this leg: the
      # server itself and the script that launches it.
      #
      # Deliberately NOT the rest of vm/backend. The websocket protocol code is
      # covered by maven/backend's unit tests, by vm/tests against the translated
      # binary, and by the Autobahn conformance job -- all of which already
      # trigger on vm/**. Fanning every backend change out to the macOS and
      # emulator legs as well would buy nothing and cost a great deal: a change to
      # the ORM, the database layer or the HTTP parser cannot reach this
      # transport.
      - 'vm/backend/demo/cn1ss/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fidelity-android:
    name: Fidelity (Android, Material 3)
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
      CN1SS_FAIL_ON_MISMATCH: '1'
      CN1SS_FIDELITY_EPSILON: '2.0'
      # CI renders differ subtly from a developer machine, so the committed
      # goldens captured elsewhere will not match here. Re-seed goldens AND
      # baseline from this environment's own native renders, then the same-run
      # comparison + ratchet gate are evaluated against this environment.
      # Refresh the per-environment native goldens (drift artifact); the
      # ratchet gates the CN1-vs-native SCORE against the committed baseline,
      # which is portable across environments because both sides are rendered
      # here. A score gap beyond the epsilon fails loudly, surfacing a real
      # environment/theme difference to investigate (then reseed deliberately).
      FIDELITY_UPDATE_GOLDENS: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Set TMPDIR
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
      - name: Cache codenameone-tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/codenameone-tools
          key: ${{ runner.os }}-cn1-tools-${{ hashFiles('scripts/setup-workspace.sh') }}
          restore-keys: |
            ${{ runner.os }}-cn1-tools-
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-fidelity-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-fidelity-${{ hashFiles('scripts/fidelity-app/**/gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Setup workspace
        run: ./scripts/setup-workspace.sh -q -DskipTests
      - name: Build Android port
        run: ./scripts/build-android-port.sh -q -DskipTests
      - name: Regenerate native themes from CSS
        # The fidelity app bundles a committed .res; theme.css is the source of
        # truth. Recompile here so a stale committed copy can never silently
        # render an old theme (the cause of phantom "regressions").
        run: ./scripts/build-native-themes.sh
      - name: Build fidelity app (Android)
        id: build
        run: |
          mkdir -p ~/.codenameone
          cp maven/UpdateCodenameOne.jar ~/.codenameone/
          ./scripts/build-fidelity-app.sh android -q -DskipTests
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run fidelity suite (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The emulator profile is part of the android-m3 golden-set contract:
          # the committed native references (scripts/build-android-native-ref.sh)
          # are captured LOCALLY on the same API level AND the same 480x800 @
          # 160dpi screen, so CI never generates references -- it only renders
          # the CN1 side and diffs. The wm size/density override below is
          # load-bearing: the runner's default AVD screen (320x640) is narrower
          # than the 60mm tile (377px at 160dpi), which silently clamped every
          # CN1 tile to the 320px screen width and skewed all comparator scores.
          api-level: 36
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          # The committed baseline is the ratchet floor: the gate fails the job
          # on any regression. To re-anchor intentionally, run locally with
          # FIDELITY_UPDATE_BASELINE=1 and commit the updated baseline JSON.
          script: adb shell wm size 480x800 && adb shell wm density 160 && ./scripts/run-android-fidelity-tests.sh "${{ steps.build.outputs.gradle_project_dir }}"
      - name: Upload fidelity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-fidelity
          path: |
            artifacts/android-fidelity/**
            scripts/fidelity-app/baseline/android-m3-fidelity-baseline.json
          if-no-files-found: warn
          retention-days: 14

  fidelity-ios-metal:
    name: Fidelity (iOS Modern, Metal)
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
      CN1SS_FAIL_ON_MISMATCH: '1'
      CN1SS_FIDELITY_EPSILON: '2.0'
      # iOS native references are COMMITTED goldens generated offline by
      # scripts/build-ios-native-ref.sh (a real-UIWindow native app); they are not
      # regenerated here, so no FIDELITY_UPDATE_GOLDENS.
    steps:
      - uses: actions/checkout@v6
      - name: Set TMPDIR
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
      - name: Cache codenameone-tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/codenameone-tools
          key: ${{ runner.os }}-cn1-tools-${{ hashFiles('scripts/setup-workspace.sh') }}
          restore-keys: |
            ${{ runner.os }}-cn1-tools-
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-fidelity-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Setup workspace
        run: ./scripts/setup-workspace.sh -q -DskipTests
      - name: Build iOS port
        run: ./scripts/build-ios-port.sh -q -DskipTests
      - name: Regenerate native themes from CSS
        # The fidelity app bundles a committed .res; theme.css is the source of
        # truth. Recompile here so a stale committed copy can never silently
        # render an old theme (the cause of phantom "regressions").
        run: ./scripts/build-native-themes.sh
      - name: Install Metal toolchain
        run: |
          # Into the SAME Xcode build-ios-app.sh and the simulator build use.
          # Downloading the toolchain for the runner's ambient Xcode installs it
          # where the pinned one will not look.
          # shellcheck source=/dev/null
          source scripts/lib/xcode.sh
          cn1_select_xcode || exit 1
          xcodebuild -downloadComponent MetalToolchain || true
      - name: Build fidelity app (iOS, Metal)
        id: build
        run: |
          mkdir -p ~/.codenameone
          cp maven/UpdateCodenameOne.jar ~/.codenameone/
          ./scripts/build-fidelity-app.sh ios -q -DskipTests
      - name: Build simulator app
        id: simapp
        run: |
          set -euo pipefail
          # build-fidelity-app.sh -> build-ios-app.sh is pinned by
          # scripts/lib/xcode.sh; this step used to compile that project with the
          # runner's ambient xcodebuild instead, so the project was GENERATED by
          # one Xcode and BUILT by another. Pin both ends to the same one.
          # shellcheck source=/dev/null
          source scripts/lib/xcode.sh
          cn1_select_xcode || exit 1
          WS="$(find scripts/fidelity-app/ios/target -name '*.xcworkspace' -maxdepth 3 | head -n1)"
          PROJ_DIR="$(dirname "$WS")"
          SCHEME="$(xcodebuild -workspace "$WS" -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
          DD="$PROJ_DIR/dd"
          # arm64-only: the macos-15 runner is Apple Silicon and the x86_64
          # simulator slice fails to build the ParparVM SIMD code (clang
          # '_Builtin_intrinsics.arm.neon requires feature neon' module error).
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -sdk iphonesimulator \
            -configuration Debug -derivedDataPath "$DD" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES VALID_ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$DD/Build/Products" -maxdepth 2 -name '*.app' -type d | head -n1)"
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
      - name: Boot simulator (runtime matching the golden set)
        id: sim
        # The golden set names the OS design generation it was captured on
        # (ios-26-metal). The suite MUST run on a matching runtime: a different
        # iOS generation renders different SF fonts/glyphs and produces phantom
        # regressions. The helper fails loudly (78) if the runner lacks the
        # runtime -- the fix is pinning a runner image/Xcode that ships it,
        # never regenerating references on whatever the runner happens to have.
        #
        # It also puts every simctl call on a deadline. Inline, these four calls
        # twice hung with no output at all and burned the job's entire 90-minute
        # budget, ending as "cancelled" rather than as a failure; the script's
        # header records the runs and why the one retry it does is allowed.
        run: ./scripts/ci/boot-ios-simulator.sh 'iOS-26[0-9-]*' 'iPhone 16' iPhone16-fidelity
      - name: Run fidelity suite (simulator, Metal)
        # The committed baseline is the ratchet floor: the gate fails the job
        # on any regression. To re-anchor intentionally, run locally with
        # FIDELITY_UPDATE_BASELINE=1 and commit the updated baseline JSON.
        run: ./scripts/run-ios-fidelity-tests.sh "${{ steps.simapp.outputs.app_path }}" "${{ steps.sim.outputs.udid }}"
      - name: Upload fidelity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-fidelity
          path: |
            artifacts/ios-fidelity/**
            scripts/fidelity-app/baseline/ios-26-metal-fidelity-baseline.json
          if-no-files-found: warn
          retention-days: 14

  # The SAME suite as fidelity-ios-metal, scored against the iOS 27 golden set on
  # the Xcode 27 / iOS 27 image. A copy rather than a move: the 26 row keeps
  # gating the generation applications get by default (ios.themeGeneration
  # defaults to 26), and this row is what keeps the 27 theme honest.
  #
  # Identical to fidelity-ios-metal except the runner, the toolchain pin, the
  # golden set, the simulator runtime and the artifact/baseline names --
  # scripts/check-duplicated-ci-legs.py holds it to that.
  fidelity-ios-metal-27:
    name: Fidelity (iOS Modern 27, Metal)
    # A real gate, like the iOS 26 row: the committed ios-27-metal baseline is
    # its ratchet. It was the last row to get one because iOS 27's dark glass
    # panel over a flat backdrop drew no silhouette of its own -- what makes the
    # native one visible is a thin dark outline iOS 27 adds around the sides of
    # its glass, which the optics now reproduce (GlassRecipe.getOutline).
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.CN1SS_GH_TOKEN }}
      CN1SS_FAIL_ON_MISMATCH: '1'
      CN1SS_FIDELITY_EPSILON: '2.0'
      # Drives the capture, the app build and the comparison from ONE variable:
      # build-ios-native-ref.sh, build-fidelity-app.sh (which turns it into
      # ios.themeGeneration=27) and run-ios-fidelity-tests.sh all read it, so the
      # theme the app ships and the goldens it is scored against cannot disagree.
      CN1SS_FIDELITY_GOLDEN_SET: 'ios-27-metal'
      # scripts/lib/xcode.sh resolves this; left at 26 on an image that ships only
      # Xcode 27 it fails resolution rather than quietly using the wrong one.
      CN1_XCODE_MAJOR: '27'
      # iOS native references are COMMITTED goldens generated offline by
      # scripts/build-ios-native-ref.sh (a real-UIWindow native app); they are not
      # regenerated here, so no FIDELITY_UPDATE_GOLDENS.
    steps:
      - uses: actions/checkout@v6
      - name: Set TMPDIR
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
      - name: Cache codenameone-tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/codenameone-tools
          key: ${{ runner.os }}-cn1-tools-${{ hashFiles('scripts/setup-workspace.sh') }}
          restore-keys: |
            ${{ runner.os }}-cn1-tools-
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-fidelity-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Setup workspace
        run: ./scripts/setup-workspace.sh -q -DskipTests
      - name: Build iOS port
        run: ./scripts/build-ios-port.sh -q -DskipTests
      - name: Regenerate native themes from CSS
        # The fidelity app bundles a committed .res; theme.css is the source of
        # truth. Recompile here so a stale committed copy can never silently
        # render an old theme (the cause of phantom "regressions").
        run: ./scripts/build-native-themes.sh
      - name: Install Metal toolchain
        run: |
          # Into the SAME Xcode build-ios-app.sh and the simulator build use.
          # Downloading the toolchain for the runner's ambient Xcode installs it
          # where the pinned one will not look.
          # shellcheck source=/dev/null
          source scripts/lib/xcode.sh
          cn1_select_xcode || exit 1
          xcodebuild -downloadComponent MetalToolchain || true
      - name: Build fidelity app (iOS, Metal)
        id: build
        run: |
          mkdir -p ~/.codenameone
          cp maven/UpdateCodenameOne.jar ~/.codenameone/
          ./scripts/build-fidelity-app.sh ios -q -DskipTests
      - name: Build simulator app
        id: simapp
        run: |
          set -euo pipefail
          # build-fidelity-app.sh -> build-ios-app.sh is pinned by
          # scripts/lib/xcode.sh; this step used to compile that project with the
          # runner's ambient xcodebuild instead, so the project was GENERATED by
          # one Xcode and BUILT by another. Pin both ends to the same one.
          # shellcheck source=/dev/null
          source scripts/lib/xcode.sh
          cn1_select_xcode || exit 1
          WS="$(find scripts/fidelity-app/ios/target -name '*.xcworkspace' -maxdepth 3 | head -n1)"
          PROJ_DIR="$(dirname "$WS")"
          SCHEME="$(xcodebuild -workspace "$WS" -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
          DD="$PROJ_DIR/dd"
          # arm64-only: the macos-15 runner is Apple Silicon and the x86_64
          # simulator slice fails to build the ParparVM SIMD code (clang
          # '_Builtin_intrinsics.arm.neon requires feature neon' module error).
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -sdk iphonesimulator \
            -configuration Debug -derivedDataPath "$DD" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES VALID_ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$DD/Build/Products" -maxdepth 2 -name '*.app' -type d | head -n1)"
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
      - name: Boot simulator (runtime matching the golden set)
        id: sim
        # The golden set names the OS design generation it was captured on
        # (ios-26-metal). The suite MUST run on a matching runtime: a different
        # iOS generation renders different SF fonts/glyphs and produces phantom
        # regressions. The helper fails loudly (78) if the runner lacks the
        # runtime -- the fix is pinning a runner image/Xcode that ships it,
        # never regenerating references on whatever the runner happens to have.
        #
        # It also puts every simctl call on a deadline. Inline, these four calls
        # twice hung with no output at all and burned the job's entire 90-minute
        # budget, ending as "cancelled" rather than as a failure; the script's
        # header records the runs and why the one retry it does is allowed.
        run: ./scripts/ci/boot-ios-simulator.sh 'iOS-27[0-9-]*' 'iPhone 16' iPhone16-fidelity27
      - name: Run fidelity suite (simulator, Metal)
        # The committed baseline is the ratchet floor: the gate fails the job
        # on any regression. To re-anchor intentionally, run locally with
        # FIDELITY_UPDATE_BASELINE=1 and commit the updated baseline JSON.
        run: ./scripts/run-ios-fidelity-tests.sh "${{ steps.simapp.outputs.app_path }}" "${{ steps.sim.outputs.udid }}"
      - name: Upload fidelity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-fidelity-27
          path: |
            artifacts/ios-fidelity/**
            scripts/fidelity-app/baseline/ios-27-metal-fidelity-baseline.json
          if-no-files-found: warn
          retention-days: 14
