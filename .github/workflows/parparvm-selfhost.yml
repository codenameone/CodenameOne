name: ParparVM Self-Hosting

# Translates the ByteCodeTranslator with itself and compares the result against
# the same translation run on a JVM.
#
# What this buys that the existing suites do not: ByteCodeTranslator is a 37.6k
# line real program that hammers collections, strings, exceptions, file I/O and
# the GC at a scale no unit test reaches, and the emitted C is a byte-exact
# expected value that costs nothing to maintain -- it is whatever the JVM
# produced from the same inputs. A VM defect that changes behaviour rather than
# crashing (a wrong hash order, a dropped write barrier, a mis-mangled symbol)
# shows up as a diff instead of passing silently.
#
# Gates, cheapest first:
#   D  native vs native, two fresh processes, same input. If the native side is
#      not self-consistent nothing else means anything, so it runs first.
#   A  JVM vs native over the same corpus. The headline.
#   Negative control: after a green comparison one emitted byte is flipped and
#      the comparator MUST report exactly that file. A comparator nobody has
#      watched fail is not a comparator.
#
# Not on the PR leg by default: a full run builds the translator twice and
# translates a large corpus several times. It runs nightly, on demand, and on a
# PR that opts in with the `selfhost` label.

on:
  schedule:
    # 04:20 UTC daily, off the hour to avoid the runner rush.
    - cron: '20 4 * * *'
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    paths:
      - 'vm/**'
      - '.github/workflows/parparvm-selfhost.yml'
      - '!vm/**/README.md'
      - '!vm/**/docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CN1_NATIVE_VERIFY: strict

jobs:
  selfhost:
    # On a pull_request only when the author asked for it; the schedule and
    # workflow_dispatch legs always run.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'selfhost')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install native build tools
        run: |
          bash scripts/ci/apt-get-update.sh
          # `time` is GNU time, which is what bench-selfhost.sh's Linux peak-memory
          # probe reads ("Maximum resident set size"). The shell builtin is not it.
          sudo apt-get install -y clang time

      # THE PERFORMANCE STEP NEEDS A JDK 25 AND THERE WAS NONE.
      # bench-selfhost.sh compares against $JDK_25_HOME/bin/java and then
      # $JDK_8_HOME/bin/java. With only a JDK 8 on the runner BOTH arms resolved to it,
      # the arm labeller de-duplicated them to `jdk8` and `jdk8#2`, and the `vs jdk25:`
      # line perf-guard.sh reads was never printed -- so the ratchet failed every run
      # on a missing line rather than on a regression. Set up 25 FIRST so the JDK 8
      # below is the one left on PATH for the maven build.
      - name: Set up JDK 25 (the performance reference)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Save JDK 25 path
        run: echo "JDK_25_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Save JDK 8 path
        run: echo "JDK_8_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # The translator has to exist as classes before it can translate itself.
      - name: Build the translator
        run: >-
          "$GITHUB_WORKSPACE/scripts/ci/retry.sh" mvn -q -B
          -pl ByteCodeTranslator -am package -DskipTests
        working-directory: vm

      - name: Resolve the ASM classpath
        run: >-
          "$GITHUB_WORKSPACE/scripts/ci/retry.sh" mvn -q -B -pl ByteCodeTranslator
          dependency:build-classpath
          -Dmdep.outputFile=target/selfhost-asm-classpath.txt
        working-directory: vm

      # -O1: the diff gates care about the EMITTED C, not about how well clang
      # optimised the binary that emitted it, and -O1 links several times faster.
      #
      # NO -DCN1_GC_MARK_THREADS HERE ANY MORE. This step used to pin 4 markers
      # because "the source default resolves to a single marker and makes a large
      # corpus take hours" -- both halves of that are now false: the default is
      # CPU-derived (capped at 4) on POSIX. Pinning it would leave the one workflow
      # that actually self-hosts unable to notice a regression in the very default
      # it exists to exercise, which is how the single-marker default survived in
      # the first place. Build what ships.
      - name: Build the self-hosted translator
        run: vm/selfhost/build-selfhost.sh

      # The corpus is the translator's OWN classes plus ASM. verify-selfhost.sh
      # prepends vm/selfhost/target/javaapi-classes itself, so it is not repeated
      # here. Absolute paths: the script runs both sides under `env -i` into one
      # fixed output directory, so a relative path would not survive.
      - name: Gate D and Gate A, with the negative control
        run: |
          vm/selfhost/verify-selfhost.sh \
            "$PWD/vm/selfhost/target/asm-classes;$PWD/vm/selfhost/target/classes" \
            com_codename1_tools_translator_ByteCodeTranslator \
            com.codename1.tools.translator

      # THE PERFORMANCE ARM IS BUILT AT -O3, SEPARATELY FROM THE DIFF GATES.
      # The gates above are built -O1 on purpose (they care about the emitted C, and
      # -O1 links several times faster). A RATIO from an -O1 binary is not the ratio
      # anything ships, so measuring the gate binary would gate a number nobody has.
      # -O3 implies ThinLTO here, which is the documented release shape and the one
      # the Xcode templates use (LLVM_LTO = YES_THIN).
      - name: Build the self-hosted translator at -O3 for measurement
        run: vm/selfhost/build-selfhost.sh -O3

      # PERFORMANCE, REPORTED EVERY RUN AND -- FOR NOW -- NOT GATED.
      #
      # The two defaults behind the current numbers (marker count and mark-worklist
      # size) were each set by a measurement that a later configuration change
      # invalidated, and NEITHER regression would fail a functional test. Something has
      # to look at the numbers, so this step exists to PRINT them every night.
      #
      # THE CEILINGS ARE DELIBERATELY UNREACHABLE AND MUST STAY THAT WAY UNTIL THERE IS
      # RUNNER DATA. Every figure this repo has is from a developer Mac: 1.33-1.35x time
      # and 1.59-1.80x memory quiet, 1.60x time for the same binary under load. A shared
      # runner is not quiet, it is a different CPU, and on Linux the memory metric is not
      # even the same quantity (peak RSS, not phys_footprint -- see bench-selfhost.sh).
      # Picking a threshold from the Mac numbers would be guessing, and a guessed
      # threshold is how a gate becomes flaky and then gets ignored. So: let several
      # nightlies print their spread, then set both ceilings from THAT data in a
      # follow-up, and only then is this a ratchet.
      #
      # A failure here today therefore means the harness broke, not that performance
      # regressed: no ratio line at all (the arms did not emit identical C, which is a
      # CORRECTNESS failure), or no memory reading.
      #
      # Redirected rather than piped: `perf-guard.sh | tee` reports tee's exit status,
      # which would turn a real regression into a green step.
      - name: Performance report
        run: |
          set -o pipefail
          CN1_PERF_MAX_TIME=99 CN1_PERF_MAX_MEM=99 \
            vm/selfhost/perf-guard.sh 3 > perf-guard.log 2>&1 || rc=$?
          cat perf-guard.log
          exit "${rc:-0}"

      # Both trees, so a divergence can be inspected rather than guessed at from
      # a one-line summary.
      - name: Upload the compared trees on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-trees
          path: |
            vm/selfhost/target/verify/jvm-tree
            vm/selfhost/target/verify/parpar1-tree
            vm/selfhost/target/verify/parpar2-tree
            vm/selfhost/target/verify/*.txt
            vm/selfhost/target/verify/*.log
          retention-days: 7
          if-no-files-found: ignore
