name: Cancel obsolete PR checks

# No path filters: a force-push can remove all paths that started an old run.
# Closed includes merged PRs. This works for forks using trusted base code only.
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: cancel-obsolete-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Never run code from the PR with an actions:write token.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci/cancel-stale-pr-runs.js
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v8
        with:
          script: |
            const {cancelStale} = require('./scripts/ci/cancel-stale-pr-runs.js');
            await cancelStale({github, context, core});
