name: Check since tags

# Fails the build if Java sources under CodenameOne/src, or the backend runtime
# under vm/backend, carry @since tags or Markdown/Javadoc "Since" sections.
# Generated documentation changes have repeatedly guessed versions, which is worse
# than omitting the metadata. Both are published API references.

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'CodenameOne/src/**/*.java'
      - 'vm/backend/src/**/*.java'
      - 'vm/backend/impl/**/*.java'
      - 'scripts/check-since-tags.sh'
      - '.github/workflows/check-since-tags.yml'
  push:
    branches:
      - master
    paths:
      - 'CodenameOne/src/**/*.java'
      - 'vm/backend/src/**/*.java'
      - 'vm/backend/impl/**/*.java'
      - 'scripts/check-since-tags.sh'
      - '.github/workflows/check-since-tags.yml'

concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-since-tags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Reject since markers in API docs
        shell: bash
        run: scripts/check-since-tags.sh

      - name: Reject since markers in the backend API docs
        shell: bash
        run: |
          scripts/check-since-tags.sh vm/backend/src
          scripts/check-since-tags.sh vm/backend/impl
