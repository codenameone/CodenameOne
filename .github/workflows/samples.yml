  client-e2e:
    name: The app's tests, and the server driven over HTTP (JVM and compiled)
    runs-on: ubuntu-24.04
    needs:
    - golden-plan
    - select
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.select.outputs.client-e2e == 'true' }}
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v6
    - name: Use Google's copy of Maven Central first
      uses: ./.github/actions/maven-central-mirror
    - name: Install native build tools
      run: |
        bash scripts/ci/apt-get-update.sh
        sudo apt-get install -y clang zlib1g-dev libcurl4-openssl-dev libssl-dev libnghttp2-dev
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '8'
        cache: maven
    - name: Save JDK 8 Path
      run: echo "JDK_8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Save JDK 17 Path
      run: echo "JDK_17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Install Codename One artifacts (core / javase / css-compiler / plugin / backend)
      env:
        RETRY_ONLY_MATCHING: transient
        RETRY_ATTEMPTS: '5'
        RETRY_DELAY_SECONDS: '60'
      run: |
        export JAVA_HOME="${JAVA_HOME_8}"
        export PATH="${JAVA_HOME_8}/bin:$PATH"
        cd maven
        bash ../scripts/ci/retry.sh mvn -B \
            -pl core,javase,css-compiler,codenameone-maven-plugin,backend,backend-test,cn1-app-kit,cn1-app-kit/backend,cn1-app-kit/common,cn1-app-kit/lib -am install \
            -Plocal-dev-javase -DskipTests -Dmaven.javadoc.skip=true \
            -Dspotbugs.skip=true -Dpmd.skip=true -Dcheckstyle.skip=true
    - name: Ensure a virtual display (xvfb) for the simulator
      run: |
        if ! command -v xvfb-run >/dev/null 2>&1; then
          (timeout 300 apt-get update && timeout 300 apt-get install -y xvfb) || true
        fi
    - name: 'bastion: Build a project generated from the Initializr template'
      run: scripts/bastion/check-template.sh "$RUNNER_TEMP/bastion-template"
      env:
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
        JAVA_HOME: ${{ env.JDK_17_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
    - name: 'bastion: Build the app and run its tests'
      working-directory: scripts/bastion
      run: mvn -B -Dcodename1.platform=javase -Djava.awt.headless=true package
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
    - name: 'bastion: Drive the JVM server over HTTP'
      run: scripts/bastion/run-e2e.sh
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
    - name: 'bastion: Drive the compiled server over HTTP'
      run: |
        BASTION_SERVER_LOG="$GITHUB_WORKSPACE/scripts/bastion/target/e2e-server-native.log" \
          scripts/bastion/run-e2e.sh --native
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
    - name: 'bastion: Upload the server logs'
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') && (!cancelled()) }}
      uses: actions/upload-artifact@v7
