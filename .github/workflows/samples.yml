# Every sample application under scripts/ (the full-stack samples and the
# games), in ONE workflow: one job per kind of check, and each sample a step of
# it. These used to be fourteen workflows of eight to ten jobs each, so a change
# to the shared app kit queued well over a hundred jobs.
#
#   select            which samples the change touches, from each sample's old
#                     `paths` filter (PATHS below); every sample on the nightly
#                     and on a manual run, and when this file itself changes.
#   one job per kind  template sync, the server tests (JVM and compiled, and on
#                     each database), the client end to end run, the browser,
#                     Android and iOS. The framework is installed once per job,
#                     then each selected sample runs as steps named
#                     "<sample>: ...". A failed sample does not stop the next:
#                     every step runs unless the run was cancelled, and the job
#                     fails at the end if any step did.
#
# iOS builds the port once (build-ios-port) and splits the samples over two
# macOS jobs; on the nightly, samples-ios-nightly.yml builds them instead.

name: Samples (full-stack and game)
on:
  pull_request:
    paths:
    - .github/workflows/samples.yml
    - maven/cn1-app-kit/**
    - scripts/bastion/**
    - scripts/bazaar/**
    - scripts/brickyard/**
    - scripts/ci/reset-*.sh
    - scripts/ci/sample-server-tests-on-database.sh
    - scripts/ci/start-test-database.sh
    - scripts/dash/**
    - scripts/fieldline/**
    - scripts/papercut/**
    - scripts/parley/**
    - scripts/pulse/**
    - scripts/reel/**
    - scripts/savor/**
    - scripts/skirmish/**
    - scripts/slate/**
    - scripts/splat/**
    - scripts/wayline/**
  workflow_dispatch:
  schedule:
  - cron: 11 0 * * *
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  golden-plan:
    uses: ./.github/workflows/golden-plan.yml
    permissions:
      contents: read
  select:
    needs: golden-plan
    if: needs.golden-plan.outputs.run == 'true'
    name: Select the samples this change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      samples: ${{ steps.select.outputs.samples }}
      template-sync: ${{ steps.select.outputs.template-sync }}
      backend: ${{ steps.select.outputs.backend }}
      chain: ${{ steps.select.outputs.chain }}
      backend-database: ${{ steps.select.outputs.backend-database }}
      client-e2e: ${{ steps.select.outputs.client-e2e }}
      web: ${{ steps.select.outputs.web }}
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
      app: ${{ steps.select.outputs.app }}
      rules: ${{ steps.select.outputs.rules }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - id: select
      name: Select
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || '' }}
        PATHS: '{"bastion": ["scripts/bastion/**", "maven/cn1-app-kit/**"], "bazaar": ["scripts/bazaar/**", "maven/cn1-app-kit/**"], "brickyard": ["scripts/brickyard/**"], "dash": ["scripts/dash/**", "maven/cn1-app-kit/**"], "fieldline": ["scripts/fieldline/**", "maven/cn1-app-kit/**"], "papercut": ["scripts/papercut/**"], "parley": ["scripts/parley/**", "maven/cn1-app-kit/**"], "pulse": ["scripts/pulse/**", "maven/cn1-app-kit/**"], "reel": ["scripts/reel/**", "maven/cn1-app-kit/**"], "savor": ["scripts/savor/**", "scripts/ci/sample-server-tests-on-database.sh", "scripts/ci/start-test-database.sh", "scripts/ci/reset-*.sh", "maven/cn1-app-kit/**"], "skirmish": ["scripts/skirmish/**", "maven/cn1-app-kit/**"], "slate": ["scripts/slate/**", "maven/cn1-app-kit/**"], "splat": ["scripts/splat/**"], "wayline": ["scripts/wayline/**", "scripts/ci/sample-server-tests-on-database.sh", "scripts/ci/start-test-database.sh", "scripts/ci/reset-*.sh", "maven/cn1-app-kit/**"]}'
        KINDS: '{"android": ["bastion", "bazaar", "dash", "fieldline", "papercut", "parley", "pulse", "reel", "savor", "skirmish", "slate", "splat", "wayline"], "app": ["brickyard"], "backend": ["bastion", "bazaar", "brickyard", "dash", "fieldline", "papercut", "parley", "pulse", "reel", "savor", "skirmish", "slate", "splat", "wayline"], "backend-database": ["bastion", "bazaar", "brickyard", "dash", "fieldline", "papercut", "parley", "pulse", "reel", "savor", "skirmish", "slate", "splat", "wayline"], "chain": ["bastion"], "client-e2e": ["bastion", "bazaar", "dash", "fieldline", "papercut", "parley", "pulse", "reel", "savor", "skirmish", "slate", "splat", "wayline"], "ios": ["bastion", "bazaar", "dash", "fieldline", "papercut", "parley", "pulse", "reel", "savor", "skirmish", "slate", "splat", "wayline"], "rules": ["dash", "skirmish", "splat"], "template-sync": ["bastion", "bazaar", "dash", "fieldline", "papercut", "parley", "pulse", "reel", "savor", "skirmish", "slate", "splat", "wayline"],
          "web": ["bastion", "bazaar", "fieldline", "parley", "pulse", "reel", "savor", "slate", "wayline"]}'
      run: |
        python3 - <<'EOF'
        import fnmatch, json, os, subprocess
        paths = json.loads(os.environ["PATHS"])
        kinds = json.loads(os.environ["KINDS"])
        everything = sorted(paths)
        if os.environ["EVENT"] == "pull_request" and os.environ["BASE"]:
            changed = subprocess.check_output(
                ["git", "diff", "--name-only", os.environ["BASE"] + "...HEAD"], text=True).split()
            if ".github/workflows/samples.yml" in changed:
                chosen = everything
            else:
                def hit(p):
                    # GitHub's paths filter: ** crosses directories, * does not.
                    rx = "^" + "".join(".*" if a == "**" else "[^/]*" if a == "*" else
                                       __import__("re").escape(a) for a in __import__("re").split(r"(\*\*|\*)", p)) + "$"
                    return any(__import__("re").match(rx, f) for f in changed)
                chosen = [s for s in everything if any(hit(p) for p in paths[s])]
        else:
            chosen = everything
        print("selected:", " ".join(chosen) or "(none)")
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write("samples= " + " ".join(chosen) + " \n")
            for k, members in kinds.items():
                out.write(k + "=" + ("true" if set(members) & set(chosen) else "false") + "\n")
        EOF
  template-sync:
    name: Initializr template matches the sample
    runs-on: ubuntu-24.04
    needs:
    - golden-plan
    - select
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.select.outputs.template-sync == 'true' }}
    timeout-minutes: 130
    steps:
    - uses: actions/checkout@v6
    - name: Use Google's copy of Maven Central first
      uses: ./.github/actions/maven-central-mirror
    - name: 'bastion: Compare the template with scripts/bastion'
      run: python3 scripts/sync-initializr-template.py bastion
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
    - name: 'bazaar: Compare the template with scripts/bazaar'
      run: python3 scripts/sync-initializr-template.py bazaar
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bazaar ') }}
    - name: 'dash: Compare the template with scripts/dash'
      run: |
        python3 scripts/sync-initializr-template.py dash
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' dash ') }}
    - name: 'fieldline: Compare the template with scripts/fieldline'
      run: python3 scripts/sync-initializr-template.py fieldline
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' fieldline ') }}
    - name: 'papercut: Compare the template with scripts/papercut'
      run: |
        python3 scripts/sync-initializr-template.py papercut
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' papercut ') }}
    - name: 'parley: Compare the template with scripts/parley'
      run: python3 scripts/sync-initializr-template.py parley
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' parley ') }}
    - name: 'pulse: Compare the template with scripts/pulse'
      run: python3 scripts/sync-initializr-template.py pulse
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' pulse ') }}
    - name: 'reel: Compare the template with scripts/reel'
      run: python3 scripts/sync-initializr-template.py reel
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' reel ') }}
    - name: 'savor: Compare the template with scripts/savor'
      run: python3 scripts/sync-initializr-template.py savor
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' savor ') }}
    - name: 'skirmish: Compare the template with scripts/skirmish'
      run: |
        python3 scripts/sync-initializr-template.py skirmish
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' skirmish ') }}
    - name: 'slate: Compare the template with scripts/slate'
      run: python3 scripts/sync-initializr-template.py slate
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' slate ') }}
    - name: 'splat: Compare the template with scripts/splat'
      run: |
        python3 scripts/sync-initializr-template.py splat
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' splat ') }}
    - name: 'wayline: Compare the template with scripts/wayline'
      run: python3 scripts/sync-initializr-template.py wayline
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' wayline ') }}
  backend:
    name: Server tests (JVM and compiled)
    runs-on: ubuntu-24.04
    needs:
    - golden-plan
    - select
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.select.outputs.backend == 'true' }}
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v6
    - name: Use Google's copy of Maven Central first
      uses: ./.github/actions/maven-central-mirror
    - name: Install native build tools
      run: |
        bash scripts/ci/apt-get-update.sh
        # A server binary links libcurl, OpenSSL and nghttp2; clang alone
        # compiles the tests and then fails at the link.
        sudo apt-get install -y clang zlib1g-dev libcurl4-openssl-dev libssl-dev libnghttp2-dev
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '8'
        cache: maven
    - name: Save JDK 8 Path
      run: echo "JDK_8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Save JDK 17 Path
      run: echo "JDK_17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Install the framework, the backend runtime and the plugin
      working-directory: maven
      run: |
        bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" mvn -B -pl core,backend,backend-test,codenameone-maven-plugin,cn1-app-kit,cn1-app-kit/common,cn1-app-kit/backend,cn1-app-kit/lib \
          -am install -DskipTests -Plocal-dev-javase \
          -Dspotbugs.skip=true -Dpmd.skip=true -Dcheckstyle.skip=true \
          -Dmaven.javadoc.skip=true \
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_8_HOME }}
        RETRY_ONLY_MATCHING: transient
    - name: 'bastion: Run the server tests on the JVM and compiled'
      working-directory: scripts/bastion
      run: |
        mvn -B -Dcodename1.platform=backend -pl shared,backend test \
          -Dcn1.backend.compiledTests=true \
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
    - name: 'bastion: Check that both runners reported'
      working-directory: scripts/bastion/backend/target/surefire-reports
      run: |
        jvm=$(find . -maxdepth 1 -name 'TEST-*.xml' ! -name '*-compiled.xml' | wc -l)
        compiled=$(find . -maxdepth 1 -name 'TEST-*-compiled.xml' | wc -l)
        echo "JVM reports: $jvm, compiled reports: $compiled"
        if [ "$jvm" -eq 0 ] || [ "$compiled" -eq 0 ]; then
          echo "::error::a runner produced no test reports"
          exit 1
        fi
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
    - name: 'bastion: Upload the test reports'
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') && (!cancelled()) }}
      uses: actions/upload-artifact@v7
      with:
        name: bastion-backend-tests
        path: scripts/bastion/backend/target/surefire-reports/**
        if-no-files-found: warn
        retention-days: 14
    - name: 'bazaar: Run the server tests on the JVM and compiled'
      working-directory: scripts/bazaar
      run: |
        # sample-app is the third-party app sample; its own tests run on the
        # JVM, and RestockAppE2ETest in backend drives it end to end.
        mvn -B -Dcodename1.platform=backend -pl shared,backend,sample-app test \
          -Dcn1.backend.compiledTests=true \
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bazaar ') }}
    - name: 'bazaar: Check that both runners reported'
      working-directory: scripts/bazaar/backend/target/surefire-reports
      run: |
        jvm=$(find . -maxdepth 1 -name 'TEST-*.xml' ! -name '*-compiled.xml' | wc -l)
        compiled=$(find . -maxdepth 1 -name 'TEST-*-compiled.xml' | wc -l)
        echo "JVM reports: $jvm, compiled reports: $compiled"
        if [ "$jvm" -eq 0 ] || [ "$compiled" -eq 0 ]; then
