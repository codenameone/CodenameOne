      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Save JDK 17 Path
      run: echo "JDK_17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Install the framework and the plugin
      working-directory: maven
      run: |
        bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" mvn -B -pl core,backend,codenameone-maven-plugin,cn1-app-kit,cn1-app-kit/common,cn1-app-kit/backend,cn1-app-kit/lib \
          -am install -DskipTests -Plocal-dev-javase \
          -Dspotbugs.skip=true -Dpmd.skip=true -Dcheckstyle.skip=true \
          -Dmaven.javadoc.skip=true \
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_8_HOME }}
        RETRY_ONLY_MATCHING: transient
    - name: 'dash: Run the simulation tests'
      working-directory: scripts/dash
      run: mvn -B -pl shared test -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' dash ') }}
    - name: 'dash: Upload the test reports'
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' dash ') && (!cancelled()) }}
      uses: actions/upload-artifact@v7
      with:
        name: dash-simulation-tests
        path: scripts/dash/shared/target/surefire-reports/**
        if-no-files-found: warn
        retention-days: 14
    - name: 'skirmish: Run the simulation tests'
      working-directory: scripts/skirmish
      run: mvn -B -pl shared test -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' skirmish ') }}
    - name: 'skirmish: Upload the test reports'
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' skirmish ') && (!cancelled()) }}
      uses: actions/upload-artifact@v7
      with:
        name: skirmish-simulation-tests
        path: scripts/skirmish/shared/target/surefire-reports/**
        if-no-files-found: warn
        retention-days: 14
    - name: 'splat: Run the simulation tests'
      working-directory: scripts/splat
      run: mvn -B -pl shared test -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' splat ') }}
    - name: 'splat: Upload the test reports'
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' splat ') && (!cancelled()) }}
      uses: actions/upload-artifact@v7
      with:
        name: splat-simulation-tests
        path: scripts/splat/shared/target/surefire-reports/**
        if-no-files-found: warn
        retention-days: 14
