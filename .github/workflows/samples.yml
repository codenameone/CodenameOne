  build-ios-port:
    needs:
    - golden-plan
    - select
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.select.outputs.ios == 'true' && github.event_name != 'schedule' }}
    uses: ./.github/workflows/_build-ios-port.yml
  ios-a:
    name: iOS build (simulator) (a)
    runs-on: xcode-27
    needs:
    - golden-plan
    - select
    - build-ios-port
    if: ${{ !cancelled() && needs.build-ios-port.result == 'success' }}
    timeout-minutes: 350
    steps:
    - uses: actions/checkout@v6
    - name: Use Google's copy of Maven Central first
      uses: ./.github/actions/maven-central-mirror
    - name: Cache CocoaPods and user gems
      uses: actions/cache@v5
      with:
        path: |
          ~/.gem
          ~/Library/Caches/CocoaPods
          ~/.cocoapods/repos
        key: ${{ runner.os }}-pods-v1-${{ hashFiles('scripts/setup-workspace.sh') }}
        restore-keys: |
          ${{ runner.os }}-pods-v1-
    - name: Ensure CocoaPods tooling
      run: |
        mkdir -p ~/.codenameone
        cp maven/UpdateCodenameOne.jar ~/.codenameone/
        set -euo pipefail
        GEM_USER_DIR="$(ruby -e 'print Gem.user_dir')"
        export PATH="$GEM_USER_DIR/bin:$PATH"
        if ! command -v pod >/dev/null 2>&1; then
          gem install cocoapods xcodeproj --no-document --user-install
        fi
        pod --version
    - name: Compute setup-workspace hash
      id: setup_hash
      run: echo "hash=$(shasum -a 256 scripts/setup-workspace.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"
    - name: Set TMPDIR
      run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
    - name: Cache codenameone-tools
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/codenameone-tools
        key: ${{ runner.os }}-cn1-tools-${{ steps.setup_hash.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-cn1-tools-
    - name: Cache Maven repository
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-
    - name: Restore cn1-binaries cache
      uses: actions/cache@v5
      with:
        path: ../cn1-binaries
        key: cn1-binaries-${{ runner.os }}-${{ steps.setup_hash.outputs.hash }}
        restore-keys: |
          cn1-binaries-${{ runner.os }}-
    - name: Download built CN1 + iOS port bundle
      uses: actions/download-artifact@v4
      with:
        name: cn1-built-bundle
        path: ${{ runner.temp }}
    - name: Restore built CN1 + iOS port tree
      run: |
        set -euo pipefail
        tar -C / -xf "$RUNNER_TEMP/cn1-built-bundle.tar"
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: 'bastion: Generate the Xcode project'
      id: build-ios-app-bastion
      run: ./scripts/build-ios-app.sh -q -DskipTests
      timeout-minutes: 25
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
      env:
        CN1_APP_DIR: scripts/bastion
    - name: 'bastion: Build the application for the simulator'
      run: |
        set -euo pipefail
        WORKSPACE='${{ steps.build-ios-app-bastion.outputs.workspace }}'
        SCHEME='${{ steps.build-ios-app-bastion.outputs.scheme }}'
        DERIVED_DATA="${{ runner.temp }}/bastion-dd"
        rm -rf "$DERIVED_DATA"
        # One architecture, the host's: the port's SIMD natives are NEON
        # under __aarch64__, and a universal simulator build compiles an
        # x86_64 slice that has no use here.
        HOST_ARCH="$(uname -m)"
        case "$HOST_ARCH" in
          arm64|x86_64) BUILD_ARCH="$HOST_ARCH" ;;
          *) BUILD_ARCH=arm64 ;;
        esac
        XCB_CONTAINER_FLAG="-workspace"
        if [[ "$WORKSPACE" != *.xcworkspace ]]; then
          XCB_CONTAINER_FLAG="-project"
        fi
        xcodebuild "$XCB_CONTAINER_FLAG" "$WORKSPACE" -scheme "$SCHEME" \
          -sdk iphonesimulator \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$DERIVED_DATA" \
          ARCHS="$BUILD_ARCH" ONLY_ACTIVE_ARCH=YES \
          EXCLUDED_ARCHS="armv7 armv7s" \
          CODE_SIGNING_ALLOWED=NO build
        APP_BUNDLE="$(find "$DERIVED_DATA/Build/Products" -maxdepth 3 -type d -name "${SCHEME}.app" | head -n 1)"
        if [ -z "$APP_BUNDLE" ]; then
          echo "::error::no .app bundle under $DERIVED_DATA"
          exit 1
        fi
      timeout-minutes: 20
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
      env:
        CN1_APP_DIR: scripts/bastion
    - name: 'dash: Generate the Xcode project'
      id: build-ios-app-dash
