  chain:
    name: Ether on a development chain
    runs-on: ubuntu-24.04
    needs:
    - golden-plan
    - select
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.select.outputs.chain == 'true' }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '8'
        cache: maven
    - name: Use Google's copy of Maven Central first
      uses: ./.github/actions/maven-central-mirror
    - name: Save JDK 8 Path
      run: echo "JDK_8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Save JDK 17 Path
      run: echo "JDK_17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Install the framework, the backend runtime and the plugin
      working-directory: maven
      run: |
        bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" mvn -B -pl core,backend,backend-test,codenameone-maven-plugin,cn1-app-kit/backend \
          -am install -DskipTests -Plocal-dev-javase \
          -Dspotbugs.skip=true -Dpmd.skip=true -Dcheckstyle.skip=true \
          -Dmaven.javadoc.skip=true \
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_8_HOME }}
        RETRY_ONLY_MATCHING: transient
    - name: 'bastion: Deposit, sweep and withdraw on a geth development node'
      run: scripts/bastion/run-chain-test.sh
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2-repo
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
    - name: 'bastion: Check that the chain test ran'
      working-directory: scripts/bastion/backend/target/surefire-reports
      run: |
        f=TEST-com.codenameone.examples.bastion.chain.ChainIntegrationTest.xml
        grep -o 'tests="[0-9]*"[^>]*skipped="[0-9]*"' "$f"
        if ! grep -q 'skipped="0"' "$f" || grep -q 'tests="0"' "$f"; then
          echo "::error::ChainIntegrationTest did not run"
          exit 1
        fi
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bastion ') }}
  backend-database:
    name: Server tests on ${{ matrix.database }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cn1
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: cn1
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U cn1" --health-interval 5s --health-timeout 5s --health-retries 20
    needs:
    - golden-plan
    - select
    if: ${{ !cancelled() && needs.golden-plan.outputs.run == 'true' && needs.select.outputs.backend-database == 'true' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        database:
        - postgresql
        - mysql
        - sqlserver
        - oracle
    steps:
    - uses: actions/checkout@v6
    - name: Use Google's copy of Maven Central first
      uses: ./.github/actions/maven-central-mirror
    - name: Start MySQL
      if: matrix.database == 'mysql'
      run: |
        sudo systemctl start mysql.service
        sudo mysql -uroot -proot -e "CREATE USER 'cn1'@'%' IDENTIFIED WITH mysql_native_password BY 'secret'; GRANT ALL ON *.* TO 'cn1'@'%'; CREATE DATABASE cn1;"
        # The ledger reads what the writer before it committed, which
        # REPEATABLE READ (MySQL's default) does not answer; the server
        # refuses to start without this (IsolationCheck).
        sudo mysql -uroot -proot -e "SET GLOBAL transaction_isolation = 'READ-COMMITTED';"
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '8'
        cache: maven
    - name: Save JDK 8 Path
