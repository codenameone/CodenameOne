          exit 1
        fi
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bazaar ') }}
    - name: 'bazaar: Upload the test reports'
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' bazaar ') && (!cancelled()) }}
      uses: actions/upload-artifact@v7
      with:
        name: bazaar-backend-tests
        path: |
          scripts/bazaar/backend/target/surefire-reports/**
          scripts/bazaar/sample-app/target/surefire-reports/**
        if-no-files-found: warn
        retention-days: 14
    - name: 'brickyard: Run the server tests on the JVM and compiled'
      working-directory: scripts/brickyard
      run: |
        mvn -B -Dcodename1.platform=backend -pl shared,backend test \
          -Dcn1.backend.compiledTests=true \
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2-repo"
      env:
        JAVA_HOME: ${{ env.JDK_17_HOME }}
        JDK_8_HOME: ${{ env.JDK_8_HOME }}
      if: ${{ !cancelled() && contains(needs.select.outputs.samples, ' brickyard ') }}
