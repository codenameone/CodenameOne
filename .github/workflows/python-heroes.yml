name: Python hero ports

# llm and MarkItDown, unmodified from PyPI, transpiled and measured against
# CPython running the same pins (scripts/python-heroes/bench/run_heroes.py).
# Each workload resolves its requirements with the build's own resolver, so
# this also proves both packages still build from PyPI as an application
# would build them. Both projects' own test suites, at the tags the
# requirements pin, then run transpiled and under CPython's pytest, and the
# job fails unless the transpiled side passes as many tests and fails none.

on:
  # Nightly at 00:11 UTC on master (nightly-watchdog.yml opens an issue when it
  # fails), and on a pull request only when this workflow's own tree changes.
  # Runtime and transpiler changes reach it through the nightly.
  pull_request:
    paths:
      - 'scripts/python-heroes/**'
      # run_heroes.py imports run_bench.py's timing helpers.
      - 'scripts/python-bench/run_bench.py'
      - '.github/workflows/python-heroes.yml'
  schedule:
    - cron: '11 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CPYTHON_VERSION: '3.14'
  # The upstream checkouts whose tests run, at the releases requirements.txt
  # pins. MarkItDown's test documents are also the conversion workload's input.
  LLM_REF: '0.37.1'
  MARKITDOWN_REF: 'v0.1.9'

jobs:
  framework:
    name: framework
    runs-on: ubuntu-latest
    container: ghcr.io/codenameone/codenameone/pr-ci-container:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Link cn1-binaries
        run: ln -s /opt/cn1-binaries ../cn1-binaries

      - name: Build the core, the transpiler and the build engine on JDK 8
        run: |
          cd maven
          JAVA_HOME="$JAVA_HOME_8" bash ../scripts/ci/retry.sh mvn -B -q install -DskipTests \
              -Dmaven.javadoc.skip=true -Dmaven.source.skip=true \
              -Dmaven.repo.local="$GITHUB_WORKSPACE/m2" \
              -pl core,python-transpiler,compat-testing,backend,build-engine -am

      # The JVM hooks a workload runs behind (file system, SQLite, HTTP) are
      # the transpiler's test classes, so they are compiled and carried over.
      - name: Build the runtime and the transpiler's test classes on JDK 17
        run: |
          cd maven
          JAVA_HOME="$JAVA_HOME_17" bash ../scripts/ci/retry.sh mvn -B -q install -DskipTests \
              -Dmaven.javadoc.skip=true -Dmaven.source.skip=true \
              -Dmaven.repo.local="$GITHUB_WORKSPACE/m2" \
              -pl python-runtime
          JAVA_HOME="$JAVA_HOME_17" bash ../scripts/ci/retry.sh mvn -B -q test-compile \
              -Dmaven.repo.local="$GITHUB_WORKSPACE/m2" -pl python-transpiler
          JAVA_HOME="$JAVA_HOME_17" bash ../scripts/ci/retry.sh mvn -B -q dependency:build-classpath \
              -Dmaven.repo.local="$GITHUB_WORKSPACE/m2" -pl build-engine \
              -Dmdep.outputFile="$GITHUB_WORKSPACE/build-engine.cp"
          JAVA_HOME="$JAVA_HOME_17" bash ../scripts/ci/retry.sh mvn -B -q dependency:build-classpath \
              -Dmaven.repo.local="$GITHUB_WORKSPACE/m2" -pl python-transpiler -Dmdep.includeScope=test \
              -Dmdep.outputFile="$GITHUB_WORKSPACE/transpiler-test.cp"

      - name: Pack the repository
        run: |
          tar -C "$GITHUB_WORKSPACE" -czf framework-m2.tgz m2 build-engine.cp transpiler-test.cp \
              maven/python-transpiler/target/test-classes

      - name: Upload the repository
        uses: actions/upload-artifact@v4
        with:
          name: python-heroes-framework
          path: framework-m2.tgz
          retention-days: 1

  measure:
    name: jvm
    needs: framework
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CPYTHON_VERSION }}

      - name: Download the framework
        uses: actions/download-artifact@v4
        with:
          name: python-heroes-framework

      # The class paths were written inside the container, whose workspace is
      # mounted at a different path; they are rewritten to this runner's.
      - name: Unpack the framework
        run: |
          tar -xzf framework-m2.tgz
          sed -i "s#/__w/[^/]*/[^/]*/m2#$GITHUB_WORKSPACE/m2#g" build-engine.cp transpiler-test.cp

      - name: Fetch the upstream test suites
        run: |
          git clone --depth 1 --branch "$LLM_REF" https://github.com/simonw/llm.git "$RUNNER_TEMP/llm"
          git clone --depth 1 --branch "$MARKITDOWN_REF" https://github.com/microsoft/markitdown.git \
              "$RUNNER_TEMP/markitdown"

      - name: Measure and run the upstream suites
        run: |
          repo="$GITHUB_WORKSPACE/m2/com/codenameone"
          v=$(cd "$repo/codenameone-python-runtime" && ls -d */ | head -1 | tr -d /)
          python3 scripts/python-heroes/bench/run_heroes.py \
              --java-home "$JAVA_HOME" \
              --build-cp "$repo/codenameone-build-engine/$v/codenameone-build-engine-$v.jar:$(cat build-engine.cp)" \
              --runtime-jar "$repo/codenameone-python-runtime/$v/codenameone-python-runtime-$v.jar" \
              --core-jar "$repo/codenameone-core/$v/codenameone-core-$v.jar" \
              --run-cp "maven/python-transpiler/target/test-classes:$repo/codenameone-compat-testing/$v/codenameone-compat-testing-$v.jar:$(cat transpiler-test.cp)" \
              --markitdown-tests "$RUNNER_TEMP/markitdown/packages/markitdown/tests" \
              --llm-tests "$RUNNER_TEMP/llm/tests" \
              --python python3 --json python-heroes.json --check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-heroes-report
          path: python-heroes.json
