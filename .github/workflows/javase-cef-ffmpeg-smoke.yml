name: JavaSE CEF/FFmpeg Smoke

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/javase-cef-ffmpeg-smoke.yml'
      - 'Ports/JavaSE/**'
      - 'maven/javase/**'
      - 'maven/cn1-binaries/**'
      - 'maven/codenameone-maven-plugin/**'
      - 'maven/tests/javase-cef-ffmpeg-smoke/**'
      - 'maven/pom.xml'
      - 'scripts/run-javase-cef-ffmpeg-smoke.py'
      - 'scripts/javase-cef-ffmpeg-smoke/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/javase-cef-ffmpeg-smoke.yml'
      - 'Ports/JavaSE/**'
      - 'maven/javase/**'
      - 'maven/cn1-binaries/**'
      - 'maven/codenameone-maven-plugin/**'
      - 'maven/tests/javase-cef-ffmpeg-smoke/**'
      - 'maven/pom.xml'
      - 'scripts/run-javase-cef-ffmpeg-smoke.py'
      - 'scripts/javase-cef-ffmpeg-smoke/**'

jobs:
  javase-smoke:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            .m2/repository
            ~/.codenameone/jcef
          key: ${{ runner.os }}-javase-smoke-m2-${{ hashFiles('maven/**/*.xml', 'maven/**/*.pom', 'maven/tests/javase-cef-ffmpeg-smoke/**') }}
          restore-keys: |
            ${{ runner.os }}-javase-smoke-m2-

      - name: Install ffmpeg and display deps on Linux
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt-get-update.sh
          sudo apt-get install -y ffmpeg xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64

      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # The community.chocolatey.org feed has failed mid-run more than once
      # ("Failed to fetch results from V2 feed ... Chocolatey installed 0/0
      # packages"), and choco exits 0 on that, so the failure only surfaced far
      # downstream as a FileNotFoundError from the smoke script hunting for a
      # binary that was never installed. Retry the transient outage, and if it
      # really cannot be installed, fail here where the reason is legible.
      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
              Write-Host "ffmpeg is installed."
              exit 0
            }
            Write-Host "ffmpeg not on PATH after attempt $attempt; retrying..."
            Start-Sleep -Seconds (15 * $attempt)
          }
          Write-Error "ffmpeg could not be installed from chocolatey after three attempts."
          exit 1

      - name: Run JavaSE CEF/FFmpeg smoke test
        env:
          MAVEN_REPO_LOCAL: ${{ github.workspace }}/.m2/repository
        run: python scripts/run-javase-cef-ffmpeg-smoke.py

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javase-cef-ffmpeg-smoke-${{ runner.os }}
          path: artifacts/javase-cef-ffmpeg-smoke
          if-no-files-found: warn
