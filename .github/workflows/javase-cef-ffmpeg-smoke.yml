name: JavaSE CEF/FFmpeg Smoke

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/javase-cef-ffmpeg-smoke.yml'
      - 'Ports/JavaSE/**'
      - 'maven/javase/**'
      - 'maven/cn1-binaries/**'
      - 'maven/codenameone-maven-plugin/**'
      - 'maven/tests/javase-cef-ffmpeg-smoke/**'
      - 'maven/pom.xml'
      - 'scripts/run-javase-cef-ffmpeg-smoke.py'
      - 'scripts/javase-cef-ffmpeg-smoke/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/javase-cef-ffmpeg-smoke.yml'
      - 'Ports/JavaSE/**'
      - 'maven/javase/**'
      - 'maven/cn1-binaries/**'
      - 'maven/codenameone-maven-plugin/**'
      - 'maven/tests/javase-cef-ffmpeg-smoke/**'
      - 'maven/pom.xml'
      - 'scripts/run-javase-cef-ffmpeg-smoke.py'
      - 'scripts/javase-cef-ffmpeg-smoke/**'

jobs:
  javase-smoke:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            .m2/repository
            ~/.codenameone/jcef
          key: ${{ runner.os }}-javase-smoke-m2-${{ hashFiles('maven/**/*.xml', 'maven/**/*.pom', 'maven/tests/javase-cef-ffmpeg-smoke/**') }}
          restore-keys: |
            ${{ runner.os }}-javase-smoke-m2-

      - name: Install ffmpeg and display deps on Linux
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/apt-get-update.sh
          sudo apt-get install -y ffmpeg xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64

      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Retried, and then VERIFIED. The community feed answers 504 often enough to
          # matter, and chocolatey can report success after failing to fetch -- so the
          # first sign of trouble was the smoke test dying three steps later with
          # "FileNotFoundError: [WinError 2] The system cannot find the file specified",
          # which names neither ffmpeg nor the feed. An install step that does not
          # confirm the tool it installed is how a transient upstream outage becomes an
          # unreadable failure in somebody else's test.
          $ok = $false
          foreach ($delay in 0, 30, 90, 180, 300) {
            if ($delay -gt 0) {
              Write-Host "choco install ffmpeg failed; retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { $ok = $true; break }
          }
          if (-not $ok) {
            throw "ffmpeg is not on PATH after installing it. The chocolatey feed is the usual reason -- look for a 504 above."
          }
          ffmpeg -version

      - name: Run JavaSE CEF/FFmpeg smoke test
        env:
          MAVEN_REPO_LOCAL: ${{ github.workspace }}/.m2/repository
        run: python scripts/run-javase-cef-ffmpeg-smoke.py

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javase-cef-ffmpeg-smoke-${{ runner.os }}
          path: artifacts/javase-cef-ffmpeg-smoke
          if-no-files-found: warn
