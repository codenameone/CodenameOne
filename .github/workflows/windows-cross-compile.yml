# Cross-compiles the native Windows port to a Windows x64 .exe on a *Linux*
# runner, using clang-cl + lld-link + llvm-rc against a Windows SDK laid out by
# xwin. clang is a cross-compiler, so the PE it emits for x86_64-pc-windows-msvc
# is the same one a Windows host would produce -- this is a fast, Windows-free
# pre-check that the port + a real Form app translate and *link* into a Windows
# binary. It is compile-and-link only (Direct2D/DirectWrite need a real Windows
# GPU stack to run), so there is no run/screenshot step; the authoritative
# run/render gate stays on the Windows runners (parparvm-tests-windows.yml).
name: Windows cross-compile (Linux)

on:
  pull_request:
    paths:
      - '.github/workflows/windows-cross-compile.yml'
      - 'vm/**'
      - 'Ports/WindowsPort/**'
      - 'maven/windows/**'
      - 'scripts/gen-windows-uwp-stubs.py'
      - 'maven/build-engine/src/main/java/com/codename1/builders/WindowsNativeBuilder.java'
      - 'maven/build-engine/src/main/java/com/codename1/builders/WindowsEmbeddedProfile.java'
      - 'maven/build-engine/src/test/java/com/codename1/builders/WindowsNativeBuilderArchTest.java'
      - 'maven/build-engine/src/test/resources/com/codename1/builders/xbox-smoke-AppxManifest.xml'
      - '!vm/**/README.md'
      - '!vm/**/readme.md'
      - '!vm/**/docs/**'
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/windows-cross-compile.yml'
      - 'vm/**'
      - 'Ports/WindowsPort/**'
      - 'maven/windows/**'
      - 'scripts/gen-windows-uwp-stubs.py'
      - 'maven/build-engine/src/main/java/com/codename1/builders/WindowsNativeBuilder.java'
      - 'maven/build-engine/src/main/java/com/codename1/builders/WindowsEmbeddedProfile.java'
      - 'maven/build-engine/src/test/java/com/codename1/builders/WindowsNativeBuilderArchTest.java'
      - 'maven/build-engine/src/test/resources/com/codename1/builders/xbox-smoke-AppxManifest.xml'

concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile:
    name: cross-compile (x64 PE on Linux)
    runs-on: ubuntu-24.04
    # A ceiling, because there was not one: this job hung in apt and ran for six
    # hours before GitHub's own limit stopped it. The work takes well under an
    # hour, so anything past that is stuck rather than slow.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LLVM cross toolchain + CMake/Ninja
        run: |
          bash scripts/ci/apt-get-update.sh
          sudo apt-get install -y clang lld llvm cmake ninja-build

      # Ubuntu ships some LLVM driver names versioned; expose the unversioned
      # clang-cl / lld-link / llvm-rc the harness expects on PATH.
      - name: Resolve LLVM tool names
        run: |
          set -e
          LLVMBIN=$(dirname "$(readlink -f "$(command -v clang)")")
          echo "LLVM bin dir: $LLVMBIN"
          for t in clang-cl lld-link llvm-rc; do
            if command -v "$t" >/dev/null 2>&1; then continue; fi
            cand=""
            [ -x "$LLVMBIN/$t" ] && cand="$LLVMBIN/$t"
            [ -z "$cand" ] && cand=$(ls /usr/bin/${t}-* /usr/lib/llvm-*/bin/$t 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$cand" ]; then sudo ln -sf "$cand" /usr/local/bin/$t; echo "linked $t -> $cand"; fi
          done
          clang-cl --version
          command -v lld-link
          llvm-rc --version 2>&1 | head -1 || true

      # JDK matrix the translator harness auto-discovers (JDK_*_HOME). JDK 8 is
      # restored last so it is the active JAVA_HOME (it builds codename1-core and
      # is what CompilerHelper translates with).
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '8' }
      - run: echo "JDK_8_HOME=$JAVA_HOME" >> $GITHUB_ENV
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '11' }
      - run: echo "JDK_11_HOME=$JAVA_HOME" >> $GITHUB_ENV
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - run: echo "JDK_17_HOME=$JAVA_HOME" >> $GITHUB_ENV
      - name: Restore JDK 8 as the active JDK
        uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '8' }

      - name: Install xwin + lay out the Windows SDK (x64 + arm64)
        env:
          # Harden against transient crates.io / download flakes ("curl [16]
          # HTTP2 framing layer", "[55] OpenSSL SSL_read unexpected eof"):
          # force HTTP/1.1 and let cargo retry.
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -e
          n=0
          until [ "$n" -ge 3 ]; do
            cargo install xwin --version 0.9.0 --locked \
              && xwin --accept-license --arch x86_64,aarch64 splat --output "$RUNNER_TEMP/xwin-sdk" \
              && break
            n=$((n+1))
            echo "xwin install/splat attempt $n failed; retrying after backoff..."
            rm -rf "$RUNNER_TEMP/xwin-sdk"
            sleep $((n*15))
          done
          echo "Sysroot:"; ls "$RUNNER_TEMP/xwin-sdk"
          test -d "$RUNNER_TEMP/xwin-sdk/crt/include"
          test -f "$RUNNER_TEMP/xwin-sdk/sdk/include/um/d2d1.h"

      - name: Build codename1-core + the Windows port (JDK 8)
        run: |
          cd maven
          # Maven Central intermittently resets the connection or throttles the runner,
          # and Maven treats that as a permanent resolution failure -- observed killing
          # this job while resolving a build extension, before any project code compiled.
          # The backoff grows because a flat retry lands inside the same window a 429 is
          # still rate limiting in. A genuine build failure fails identically every time.
          # Retried ONLY for that failure shape. A blanket loop lets an intermittent
          # compiler, generator or packaging regression pass on a later attempt and turn
          # a blocking gate green, which is worse than the flake it hides -- and the
          # retries reuse the previous attempt's target directories, so a partial output
          # can decide the result. Matching the output keeps a real failure terminal on
          # its first occurrence, and the retry starts from clean.
          resolution='status: (403|429|50[0-9])|Could not transfer artifact|Failed to read artifact descriptor|Unresolveable build extension|Non-resolvable import POM|Could not resolve dependencies|UnknownHostException|Could not resolve host|Temporary failure in name resolution'
          goal=install
          for delay in 30 120 300 0; do
            # PIPESTATUS, not the pipeline's status: tee succeeds even when mvn does not,
            # and this step does not set pipefail. Reading the wrong one would make every
            # attempt look successful, which is the opposite failure to the one being
            # fixed and would hide everything.
            # Recheck missing releases after a transient repository error instead of
            # replaying Maven's cached resolution failure on every retry.
            JAVA_HOME="$JDK_8_HOME" mvn -B -U -pl windows -am -DskipTests \
                 '-Dmaven.javadoc.skip=true' '-Plocal-dev-javase' $goal 2>&1 \
                 | tee /tmp/windows-cross-build.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              break
            fi
            if ! grep -Eq "$resolution" /tmp/windows-cross-build.log; then
              echo "core + Windows port build failed for a reason that is not a transient"
              echo "dependency-resolution error; not retrying"
              exit 1
            fi
            if [ "$delay" = "0" ]; then
              echo "core + Windows port build failed after all retries"
              exit 1
            fi
            echo "Maven Central looks flaky; retrying in ${delay}s from clean"
            goal="clean install"
            sleep "$delay"
          done
          test -f core/target/classes/com/codename1/ui/Form.class
          test -f windows/target/classes/com/codename1/impl/windows/WindowsImplementation.class

      # A UWP (Xbox Developer Mode) build compiles the desktop-only natives
      # out and links generated stubs in their place; a native added to one of
      # those files without regenerating would fail only the UWP link below.
      - name: UWP stubs are current
        run: python3 scripts/gen-windows-uwp-stubs.py --check

      # Builds the desktop exe and the UWP one (app partition, WindowsApp.lib
      # only, /APPCONTAINER): the UWP link is the gate that every Win32 call the
      # port makes in that build exists inside the app container.
      - name: Cross-compile the native Windows .exe (clang-cl + xwin)
        env:
          CN1_XWIN_SYSROOT: ${{ runner.temp }}/xwin-sdk
          CN1_CLANG_CL: clang-cl
          CN1_LLVM_RC: llvm-rc
          CN1_UWP_EXE_OUT: ${{ github.workspace }}/uwp-smoke/app.exe
          CN1_KIOSK_EXE_OUT: ${{ github.workspace }}/kiosk-smoke/app.exe
        run: |
          cd vm
          JAVA_HOME="$JDK_8_HOME" mvn -B -pl tests -am test \
            '-Dtest=CleanTargetIntegrationTest#crossCompilesWindowsExeWithXwin' \
            '-Dsurefire.failIfNoSpecifiedTests=false'
          test -f "$CN1_UWP_EXE_OUT"
          test -f "$CN1_KIOSK_EXE_OUT"

      # The development certificate windows.xbox builds create, made by the
      # builder's own openssl commands; the Windows job signs with it, so a
      # certificate Windows refuses fails there.
      - name: Create the Xbox development certificate (WindowsNativeBuilder)
        env:
          CN1_XBOX_DEVCERT_OUT: ${{ github.workspace }}/uwp-smoke/devcert
          RETRY_ONLY_MATCHING: transient
          RETRY_ATTEMPTS: '3'
          RETRY_DELAY_SECONDS: '60'
        run: |
          set -euo pipefail
          mkdir -p ~/.codenameone
          cp maven/UpdateCodenameOne.jar ~/.codenameone/
          cd maven
          JAVA_HOME="$JDK_8_HOME" bash ../scripts/ci/retry.sh mvn -B -pl build-engine -am install \
            -DskipTests -Dmaven.javadoc.skip=true -Plocal-dev-javase
          JAVA_HOME="$JDK_8_HOME" mvn -B -pl build-engine test -Plocal-dev-javase \
            '-Dtest=WindowsNativeBuilderArchTest' -Dsurefire.failIfNoSpecifiedTests=false
          test -s "$CN1_XBOX_DEVCERT_OUT/dev.pfx"
          test -s "$CN1_XBOX_DEVCERT_OUT/dev.cer"

      # The manifest is pinned to WindowsNativeBuilder.buildXboxAppxManifest by
      # WindowsNativeBuilderArchTest, so the run below installs what windows.xbox
      # builds ship.
      - name: Upload the kiosk smoke app
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-smoke
          path: kiosk-smoke/app.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload the UWP smoke app
        uses: actions/upload-artifact@v4
        with:
          name: uwp-smoke
          path: |
            uwp-smoke/app.exe
            uwp-smoke/devcert/dev.pfx
            uwp-smoke/devcert/dev.cer
            maven/build-engine/src/test/resources/com/codename1/builders/xbox-smoke-AppxManifest.xml
          if-no-files-found: error
          retention-days: 3

  # Phase 1's proof without a console: the cross-built UWP app is packed, signed,
  # installed and launched as a real UWP activation (app container, CoreWindow,
  # swap chain) on a Windows runner. The app writes a marker into its package
  # LocalState once its first form has painted; no marker fails the job.
  uwp-run:
    name: install + launch the UWP package (Windows x64)
    needs: cross-compile
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download the UWP smoke app
        uses: actions/download-artifact@v4
        with:
          name: uwp-smoke
          path: uwp-smoke

      - name: Pack, sign and install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Resolve-Path uwp-smoke
          $layout = Join-Path $env:RUNNER_TEMP 'uwp-layout'
          New-Item -ItemType Directory -Force (Join-Path $layout 'Assets') | Out-Null
          Copy-Item (Join-Path $root 'uwp-smoke/app.exe') (Join-Path $layout 'app.exe')
          $manifest = Get-ChildItem -Recurse $root -Filter 'xbox-smoke-AppxManifest.xml' | Select-Object -First 1
          Copy-Item $manifest.FullName (Join-Path $layout 'AppxManifest.xml')
          Add-Type -AssemblyName System.Drawing
          foreach ($logo in 'StoreLogo','Square150x150Logo','Square44x44Logo','SplashScreen') {
            $bmp = New-Object System.Drawing.Bitmap 150,150
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.Clear([System.Drawing.Color]::SteelBlue); $g.Dispose()
            $bmp.Save((Join-Path $layout "Assets/$logo.png"), [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          }
          $kit = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/makeappx.exe' |
                 Sort-Object FullName -Descending | Select-Object -First 1
          $bin = $kit.DirectoryName
          $msix = Join-Path $env:RUNNER_TEMP 'UwpSmoke.msix'
          & "$bin/makeappx.exe" pack /o /d $layout /p $msix
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          # Signed with the certificate WindowsNativeBuilder created (subject
          # CN=UwpSmoke, the manifest Publisher; empty PKCS#12 password).
          $pfx = Join-Path $root 'uwp-smoke/devcert/dev.pfx'
          $cer = Join-Path $root 'uwp-smoke/devcert/dev.cer'
          & "$bin/signtool.exe" sign /fd SHA256 /f $pfx $msix
          if ($LASTEXITCODE -ne 0) { throw "signtool rejected the builder's development certificate" }
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:/LocalMachine/TrustedPeople' | Out-Null
          $unlock = 'HKLM:/SOFTWARE/Microsoft/Windows/CurrentVersion/AppModelUnlock'
          New-Item -Force $unlock | Out-Null
          Set-ItemProperty $unlock AllowAllTrustedApps 1 -Type DWord
          Set-ItemProperty $unlock AllowDevelopmentWithoutDevLicense 1 -Type DWord
          Add-AppxPackage -Path $msix
          Get-AppxPackage com.codename1.uwpsmoke | Format-List Name,PackageFamilyName,InstallLocation,SignatureKind

      - name: Launch and wait for the first frame
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-AppxPackage com.codename1.uwpsmoke
          $pfn = $pkg.PackageFamilyName
          $state = Join-Path $env:LOCALAPPDATA "Packages/$pfn/LocalState"
          Start-Process "shell:AppsFolder\$pfn!App"
          $marker = $null
          for ($i = 0; $i -lt 90 -and -not $marker; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $state) {
              $marker = Get-ChildItem -Recurse $state -Filter 'uwp-smoke.txt' -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $g.Dispose()
          New-Item -ItemType Directory -Force uwp-run | Out-Null
          $bmp.Save('uwp-run/desktop.png', [System.Drawing.Imaging.ImageFormat]::Png)
          Get-Process app -ErrorAction SilentlyContinue | Format-Table Id,ProcessName,StartTime
          if (-not $marker) {
            Get-WinEvent -LogName 'Microsoft-Windows-AppModel-Runtime/Admin' -MaxEvents 20 -ErrorAction SilentlyContinue |
              Format-List TimeCreated,Id,Message
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001} -MaxEvents 5 -ErrorAction SilentlyContinue |
              Format-List TimeCreated,Message
            if (Test-Path $state) { Get-ChildItem -Recurse $state | Format-Table FullName,Length }
            throw "the UWP app wrote no marker in 90s: it did not reach its first frame"
          }
          $text = Get-Content $marker.FullName -Raw
          Write-Host "marker: $text"
          if ($text -notmatch '^CN1-UWP-STARTED [1-9][0-9]*x[1-9][0-9]*') { throw "unexpected marker: $text" }
          Get-Process app -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload the desktop capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwp-run-capture
          path: uwp-run/
          if-no-files-found: ignore
          retention-days: 7

  # The windows.embedded=true build on a real desktop: the window must cover the
  # primary monitor with no frame, stay topmost, and survive the shortcuts the
  # kiosk hook blocks. Shell Launcher itself needs IoT Enterprise, which no
  # runner has; the deploy script is unit-tested in build-engine instead.
  kiosk-run:
    name: launch the kiosk build (Windows x64)
    needs: cross-compile
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download the kiosk smoke app
        uses: actions/download-artifact@v4
        with:
          name: kiosk-smoke
          path: kiosk-smoke

      - name: Launch, check the window, send the blocked shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class K {
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
              [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr h, int i);
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
              [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
              public static void Chord(byte mod, byte key) {
                  keybd_event(mod, 0, 0, UIntPtr.Zero); keybd_event(key, 0, 0, UIntPtr.Zero);
                  keybd_event(key, 0, 2, UIntPtr.Zero); keybd_event(mod, 0, 2, UIntPtr.Zero);
              }
          }
          '@
          New-Item -ItemType Directory -Force kiosk-run | Out-Null
          $log = Join-Path (Resolve-Path kiosk-run) 'app.log'
          $env:CN1_LOG_FILE = $log
          $p = Start-Process -FilePath (Resolve-Path kiosk-smoke/app.exe) -PassThru
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 60 -and $h -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { throw "the kiosk app exited with $($p.ExitCode) before showing a window" }
            $p.Refresh(); $h = $p.MainWindowHandle
          }
          if ($h -eq [IntPtr]::Zero) { throw "the kiosk app showed no window in 60s" }
          Start-Sleep -Seconds 3
          $style = [K]::GetWindowLong($h, -16); $ex = [K]::GetWindowLong($h, -20)
          $r = New-Object K+RECT; [void][K]::GetWindowRect($h, [ref]$r)
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host ("style=0x{0:X8} ex=0x{1:X8} rect={2},{3},{4},{5} screen={6}" -f $style, $ex, $r.L, $r.T, $r.R, $r.B, $b)
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $g.Dispose()
          $bmp.Save('kiosk-run/screen.png', [System.Drawing.Imaging.ImageFormat]::Png)
          if (($style -band 0x80000000) -eq 0) { throw "the kiosk window is not WS_POPUP" }
          if (($style -band 0x00C00000) -ne 0) { throw "the kiosk window has a caption" }
          if (($ex -band 0x8) -eq 0) { throw "the kiosk window is not topmost" }
          if ($r.L -ne $b.Left -or $r.T -ne $b.Top -or $r.R -ne $b.Right -or $r.B -ne $b.Bottom) {
            throw "the kiosk window does not cover the primary monitor"
          }
          # Alt+F4 would close an ordinary window; the kiosk hook swallows it.
          # The hook filters only while the kiosk window is in front, so the
          # check means nothing unless it is: a refused SetForegroundWindow
          # would send the chord to another window and pass vacuously. A lone
          # Alt tap releases the foreground lock for this process.
          for ($i = 0; $i -lt 10 -and [K]::GetForegroundWindow() -ne $h; $i++) {
            [K]::keybd_event(0x12, 0, 0, [UIntPtr]::Zero); [K]::keybd_event(0x12, 0, 2, [UIntPtr]::Zero)
            [void][K]::SetForegroundWindow($h)
            Start-Sleep -Milliseconds 300
          }
          if ([K]::GetForegroundWindow() -ne $h) { throw "the kiosk window never became the foreground window" }
          [K]::Chord(0x12, 0x73)
          [K]::Chord(0x12, 0x09)
          Start-Sleep -Seconds 3
          if ($p.HasExited) { throw "Alt+F4 reached the kiosk window and closed it" }
          if (-not (Test-Path $log)) { throw "CN1_LOG_FILE was not created" }
          if ([K]::GetForegroundWindow() -ne $h) { throw "Alt+Tab moved the foreground away from the kiosk window" }
          # Control: the same window does close when asked directly, so its
          # surviving Alt+F4 above was the hook, not an app that ignores closing.
          [void][K]::PostMessage($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)
          if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; throw "WM_CLOSE did not close the kiosk app" }

      - name: Upload the kiosk capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-run-capture
          path: kiosk-run/
          if-no-files-found: ignore
          retention-days: 7
