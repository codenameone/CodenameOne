name: Codename One Designer CI

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/ci/apt-get-install.sh'
      - 'scripts/ci/retry.sh'
      - 'CodenameOneDesigner/**'
      - 'maven/css-compiler/**'
      - 'maven/css-cli/**'
      - 'maven/designer/**'
      - '.github/workflows/designer.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'scripts/ci/apt-get-install.sh'
      - 'scripts/ci/retry.sh'
      - 'CodenameOneDesigner/**'
      - 'maven/css-compiler/**'
      - 'maven/css-cli/**'
      - 'maven/designer/**'
      - '.github/workflows/designer.yml'

concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-designer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install build dependencies
        run: bash scripts/ci/apt-get-install.sh unzip

      - name: Cache cn1-binaries
        uses: actions/cache@v5
        with:
          path: ../cn1-binaries
          key: cn1-binaries-${{ runner.os }}-designer
          restore-keys: |
            cn1-binaries-${{ runner.os }}-

      - name: Fetch cn1 binaries
        run: |
          if [ ! -d ../cn1-binaries ] || [ -z "$(ls -A ../cn1-binaries 2>/dev/null)" ]; then
            wget -q https://github.com/codenameone/cn1-binaries/archive/refs/heads/master.zip
            unzip -q master.zip -d ..
            rm -rf ../cn1-binaries
            mv ../cn1-binaries-master ../cn1-binaries
          fi
          mkdir -p maven/target
          rm -rf maven/target/cn1-binaries
          cp -R ../cn1-binaries maven/target/cn1-binaries

      - name: Build Designer (pulls in codenameone-css-compiler and codenameone-css-cli as deps)
        env:
          CN1_BINARIES: ${{ github.workspace }}/maven/target/cn1-binaries
        run: |
          cd maven
          bash $GITHUB_WORKSPACE/scripts/ci/retry.sh mvn -B -pl designer -am -DskipTests -Plocal-dev-javase \
              -Dmaven.javadoc.skip=true -Dcn1.binaries="${CN1_BINARIES}" install

      - name: Run designer XML parser unit tests (Maven)
        env:
          CN1_BINARIES: ${{ github.workspace }}/maven/target/cn1-binaries
          # Narrowed because this step RUNS TESTS: retry.sh retries every nonzero exit
          # without it, so a test that failed once and passed on a later attempt would take
          # this gate green and hide the race that produced it. The wrapper's own docs
          # require this filter for test-running commands.
          RETRY_ONLY_MATCHING: transient
        run: |
          cd maven
          bash $GITHUB_WORKSPACE/scripts/ci/retry.sh mvn -B -pl designer -am -DunitTests=true -Dcodename1.platform=javase \
              -Plocal-dev-javase -Dmaven.javadoc.skip=true -Dmaven.antrun.skip=true \
              -Dcn1.binaries="${CN1_BINARIES}" \
              -Dtest=SimpleXmlParserTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify CSS CLI compilation
        run: |
          # CN1CSSCLI lives in the thin codenameone-css-cli module and is launched
          # on a resolved classpath (see AbstractCN1Mojo.getCssCliClasspath and the
          # simulator's CSSWatcher), not as a shaded `java -jar`. Exercise it the
          # same way here, with java.awt.headless set and DISPLAY cleared: the
          # compiler opens no window and must keep working where there is none.
          cd maven
          bash $GITHUB_WORKSPACE/scripts/ci/retry.sh mvn -B -q -pl css-cli -Plocal-dev-javase \
              -Dmdep.outputFile="$PWD/css-cli-cp.txt" dependency:build-classpath
          cd ..
          cp="maven/css-cli/target/classes:$(cat maven/css-cli-cp.txt)"
          tmp_dir="$(mktemp -d)"
          css_file="$tmp_dir/test.css"
          l10n_dir="$tmp_dir/localization"
          output_file="$tmp_dir/output.res"
          mkdir -p "$l10n_dir"
          cat <<'EOF' > "$css_file"
          Label {
              color: rgb(255, 0, 0);
          }
          EOF
          cat <<'EOF' > "$l10n_dir/Strings.properties"
          greeting=Hello from CLI
          EOF
          env -u DISPLAY -u WAYLAND_DISPLAY java -Djava.awt.headless=true -cp "$cp" com.codename1.designer.css.CN1CSSCLI \
            -input "$css_file" -output "$output_file" -localization "$l10n_dir"
          test -s "$output_file"

      - name: Verify native-themes build
        run: |
          cd maven
          bash $GITHUB_WORKSPACE/scripts/ci/retry.sh mvn -B -pl css-cli -am install -DskipTests -Dmaven.javadoc.skip=true -Plocal-dev-javase
          cd ..
          ./scripts/build-native-themes.sh
          test -f Themes/iOSModernTheme.res || { echo "missing Themes/iOSModernTheme.res"; exit 1; }
          test -f Themes/AndroidMaterialTheme.res || { echo "missing Themes/AndroidMaterialTheme.res"; exit 1; }

      - name: Upload designer jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: designer-jar
          path: maven/designer/target/codenameone-designer-*-jar-with-dependencies.jar
