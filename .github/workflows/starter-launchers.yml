name: Starter launchers
on:
  # Nightly at 00:11 UTC on master (nightly-watchdog.yml opens an issue when it
  # fails), and on a pull request only when this workflow's own tree changes.
  # Shared code (core, ports, builders, backend) reaches it through the nightly.
  pull_request:
    paths:
      - 'scripts/test-starter-launchers.py'
      - 'scripts/sync-initializr-launchers.py'
      - '.github/workflows/starter-launchers.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 0 * * *'

permissions:
  contents: read
concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  launchers:
    strategy:
      matrix:
        # macOS: its bash 3.2 and BSD tools run build.sh too.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS runners take ~37 s per generated download, and there are past
    # thirty of them now: twenty minutes cancelled a run that was passing.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute actual launchers and wrapper
        run: python scripts/test-starter-launchers.py maven/cn1app-archetype/src/main/resources/archetype-resources
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check embedded Initializr launcher parity
        run: python scripts/sync-initializr-launchers.py
      - name: Generate, extract and execute real Initializr downloads
        run: python scripts/tests/generate-initializr-fixtures.py "${{ runner.temp }}/initializr-fixtures"
