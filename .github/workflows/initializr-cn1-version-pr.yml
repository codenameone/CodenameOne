name: Website CN1 Version PR

on:
  # Trigger only on release publication. The developer-guide.pdf is
  # attached to the release by developer-guide-docs.yml a few minutes
  # after the release is published, and the PR opened here triggers
  # website-docs which depends on that asset. Firing on tag-push as
  # well would create the PR before the asset exists. We still wait
  # below to cover the gap between release publish and asset upload.
  release:
    types:
      - published

permissions:
  contents: write
  pull-requests: write

jobs:
  update-website-cn1-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The Create-pull-request step below authenticates with a PAT
          # (CN1SS_GH_TOKEN) that differs from the GITHUB_TOKEN checkout
          # would otherwise persist as an http.extraheader. Two different
          # credentials on the same remote make git emit two Authorization
          # headers, which GitHub rejects with "Duplicate header:
          # Authorization" / HTTP 400. Not persisting the checkout
          # credential leaves only the PAT, so the push succeeds.
          persist-credentials: false

      - name: Wait for developer-guide.pdf on the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The website-docs workflow triggered by this PR resolves the
          # developer-guide.pdf URL from the latest release. That asset is
          # uploaded by developer-guide-docs.yml a few minutes after the
          # release is published, so wait for it before creating the PR.
          set +e
          for i in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name' 2>/dev/null \
                | grep -Fxq 'developer-guide.pdf'; then
              echo "developer-guide.pdf is attached to release $RELEASE_TAG"
              exit 0
            fi
            echo "[$i/60] Waiting for developer-guide.pdf on release $RELEASE_TAG"
            sleep 30
          done
          echo "developer-guide.pdf did not appear on release $RELEASE_TAG within 30 minutes"
          exit 1

      - name: Wait for the release to be published
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          R2_BASE_URL: https://repo.codenameone.com/maven2
        run: |
          # PR-triggered workflows like cn1playground-language and archetype-smoke
          # resolve com.codenameone:codenameone-maven-plugin at the new version as soon
          # as the PR opens, so this waits for the release to exist before creating it.
          #
          # This polled Maven Central, which releases no longer go to: it waited the
          # full 30 minutes for an artifact that is never coming and failed every
          # release. Releases are published to the Codename One repository now.
          #
          # It waits on the release COMPLETION MARKER, not just the plugin pom. The
          # marker is written only once the core reactor and all four editors are
          # uploaded and verified, so it means "this release is whole" -- something
          # Central never offered, where an artifact could be visible while the rest of
          # the release was still uploading. The pom is checked too, since that is what
          # the downstream jobs actually resolve.
          #
          # The wait is still generous. There is no propagation delay any more, but the
          # release workflow runs on the tag push while this one runs on the release
          # event, so this can start while the release is still uploading.
          #
          # Cache-busted: Cloudflare caches 404s on the custom domain, so a poll that
          # starts a moment too early would otherwise keep seeing its own cached miss.
          set +e
          version="${RELEASE_TAG#v}"
          marker="${R2_BASE_URL}/com/codenameone/_cn1-releases/${version}/complete"
          pom="${R2_BASE_URL}/com/codenameone/codenameone-maven-plugin/${version}/codenameone-maven-plugin-${version}.pom"
          for i in $(seq 1 90); do
            cb="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}"
            marker_code=$(curl -s -o /dev/null -w "%{http_code}" "${marker}?cb=${cb}")
            pom_code=$(curl -s -o /dev/null -w "%{http_code}" "${pom}?cb=${cb}")
            if [ "$marker_code" = "200" ] && [ "$pom_code" = "200" ]; then
              echo "Release ${version} is complete and codenameone-maven-plugin is published"
              exit 0
            fi
            echo "[$i/90] Waiting for release ${version} (marker=$marker_code, plugin=$pom_code)"
            sleep 20
          done
          echo "Release ${version} was not complete within 30 minutes." >&2
          echo "Check the Release workflow for this tag: a missing marker means it did not finish." >&2
          exit 1

      - name: Update Initializr Codename One versions
        run: ./scripts/initializr/update-cn1-version.sh "${{ github.event.release.tag_name || github.ref_name }}"

      # The Playground is intentionally NOT bumped here: it is pinned to the
      # in-repo 8.0-SNAPSHOT so it previews the current framework + native
      # themes (its bundled Themes/*.res use resource-format features released
      # runtimes cannot read). update-cn1-version.sh also refuses to change a
      # SNAPSHOT pin as a second line of defense.

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # PRs created with the default GITHUB_TOKEN do not trigger pull_request
          # workflows (GitHub's anti-recursion rule), so the bump PR ships with no
          # CI coverage. Authenticate as a real user so workflows like
          # cn1playground-language and website-docs run as they would on a manual PR.
          # CN1SS_GH_TOKEN is the same fine-grained PAT used by the screenshot
          # workflows (see scripts-android.yml header for rotation instructions).
          token: ${{ secrets.CN1SS_GH_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          commit-message: "scripts/website: bump Codename One versions to ${{ github.event.release.tag_name || github.ref_name }}"
          title: "scripts/website: bump Codename One versions to ${{ github.event.release.tag_name || github.ref_name }}"
          body: |
            Automated update of website Codename One versions after release `${{ github.event.release.tag_name || github.ref_name }}`.

            Updated:
            - All `scripts/initializr/**/pom.xml` files containing `cn1.plugin.version`
            - `scripts/initializr/common/src/main/java/com/codename1/initializr/model/GeneratorModel.java`
            - `scripts/initializr/common/src/test/java/com/codename1/initializr/model/GeneratorModelMatrixTest.java`
            - Embedded root `pom.xml` in `scripts/initializr/common/src/main/resources/common.zip`
          branch: automation/website-cn1-version-${{ github.event.release.tag_name || github.ref_name }}
          delete-branch: true
          labels: |
            automation
            initializr
            website
          add-paths: |
            scripts/initializr
