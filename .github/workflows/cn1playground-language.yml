name: CN1 Playground Language Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/cn1playground/**'
      # Playground code is compiled by the in-tree compiler and, in the browser,
      # translated by ParparVM and loaded into the running VM.
      - 'vm/JavaCompiler/**'
      - 'maven/javac/**'
      - 'vm/ByteCodeTranslator/src/javascript/**'
      - 'vm/ByteCodeTranslator/src/com/codename1/tools/translator/Javascript*.java'
      - 'Ports/JavaScriptPort/**'
      - 'CodenameOne/src/com/codename1/gpu/**'
      - 'CodenameOne/src/com/codename1/camera/**'
      - 'CodenameOne/src/com/codename1/ui/**'
      - '.github/workflows/cn1playground-language.yml'
  push:
    branches: [main, master]
    paths:
      - 'scripts/cn1playground/**'
      # Playground code is compiled by the in-tree compiler and, in the browser,
      # translated by ParparVM and loaded into the running VM.
      - 'vm/JavaCompiler/**'
      - 'maven/javac/**'
      - 'vm/ByteCodeTranslator/src/javascript/**'
      - 'vm/ByteCodeTranslator/src/com/codename1/tools/translator/Javascript*.java'
      - 'Ports/JavaScriptPort/**'
      - 'CodenameOne/src/com/codename1/gpu/**'
      - 'CodenameOne/src/com/codename1/camera/**'
      - 'CodenameOne/src/com/codename1/ui/**'
      - '.github/workflows/cn1playground-language.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  language-smoke:
    name: Playground language smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ensure Xvfb is available
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            bash scripts/ci/apt-get-update.sh
            sudo apt-get install -y xvfb
          fi

      # The playground is pinned to the in-repo 8.0-SNAPSHOT (it previews the
      # current framework + native themes), so the snapshot artifacts must be
      # installed into the local Maven repo before the smoke build resolves
      # them. Mirrors the website build's bootstrap.
      - name: Bootstrap local Codename One snapshots
        run: SKIP_CN1_ARCHETYPES=1 ./scripts/setup-workspace.sh -q -DskipTests

      - name: Run playground language smoke tests
        run: |
          set -euo pipefail
          cd scripts/cn1playground
          xvfb-run -a bash tools/run-playground-smoke-tests.sh

  browser-e2e:
    name: Playground in the browser
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Ensure Xvfb is available
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            bash scripts/ci/apt-get-update.sh
            sudo apt-get install -y xvfb
          fi

      - name: Bootstrap local Codename One snapshots
        run: SKIP_CN1_ARCHETYPES=1 ./scripts/setup-workspace.sh -q -DskipTests

      - name: Install Playwright Chromium and Firefox
        run: |
          set -euo pipefail
          cd scripts
          npm ci
          bash "$GITHUB_WORKSPACE/scripts/ci/apt-get-update.sh"
          npx playwright install-deps chromium firefox
          npx playwright install chromium firefox

      # Builds the open-world JavaScript bundle, then compiles, translates and runs
      # samples/editor in Chromium and demo behavior in Chromium and Firefox.
      - name: Run playground browser tests
        env:
          # Hosted Linux runners have no hardware GPU. Local runs use browser defaults.
          PLAYGROUND_SOFTWARE_GL: "1"
          PLAYGROUND_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/playground-browser
        run: |
          set -euo pipefail
          mkdir -p "$PLAYGROUND_BROWSER_ARTIFACT_DIR"
          cd scripts/cn1playground
          # The build compiles the theme CSS through the JavaSE port, which needs a
          # display, as the language-smoke job's harnesses do.
          xvfb-run -a bash tools/run-playground-browser-tests.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-browser-screenshots
          path: ${{ runner.temp }}/playground-browser
          if-no-files-found: ignore
