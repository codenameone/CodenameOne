name: CN1 Playground Language Tests

on:
  # Nightly at 00:11 UTC on master (nightly-watchdog.yml opens an issue when it
  # fails), and on a pull request only when this workflow's own tree changes.
  # Shared code (core, ports, builders, backend) reaches it through the nightly.
  workflow_dispatch:
  schedule:
    - cron: '11 0 * * *'

  # Pull requests and master pushes reach this workflow through ci.yml,
  # after its precheck; the paths that used to trigger it are in
  # .github/ci/ci-members.json.
  workflow_call:
permissions:
  contents: read

concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: cn1playground-language-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  language-smoke:
    name: Playground language smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Use Google's copy of Maven Central first
        uses: ./.github/actions/maven-central-mirror

      - name: Ensure Xvfb is available
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            bash scripts/ci/apt-get-update.sh
            sudo apt-get install -y xvfb
          fi

      # The playground is pinned to the in-repo 8.0-SNAPSHOT (it previews the
      # current framework + native themes), so the snapshot artifacts must be
      # installed into the local Maven repo before the smoke build resolves
      # them. Mirrors the website build's bootstrap.
      - name: Bootstrap local Codename One snapshots
        # -e: the 2026-11-25 nightly died four times on "Could not acquire
        # lock(s)" and -q left nothing naming the artifact or module that held
        # it; it did not reproduce on a dispatched run. -e keeps the log quiet
        # and makes the next occurrence print the stack trace that does.
        run: SKIP_CN1_ARCHETYPES=1 ./scripts/setup-workspace.sh -q -e -DskipTests

      - name: Run playground language smoke tests
        run: |
          set -euo pipefail
          cd scripts/cn1playground
          xvfb-run -a bash tools/run-playground-smoke-tests.sh

  browser-e2e:
    name: Playground in the browser
    # The job has taken 24-58 minutes; see the browser step for why it has a limit.
    timeout-minutes: 90
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Use Google's copy of Maven Central first
        uses: ./.github/actions/maven-central-mirror

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Ensure Xvfb is available
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            bash scripts/ci/apt-get-update.sh
            sudo apt-get install -y xvfb
          fi

      - name: Bootstrap local Codename One snapshots
        run: SKIP_CN1_ARCHETYPES=1 ./scripts/setup-workspace.sh -q -DskipTests

      - name: Install Playwright Chromium and Firefox
        run: |
          set -euo pipefail
          cd scripts
          npm ci
          bash "$GITHUB_WORKSPACE/scripts/ci/apt-get-update.sh"
          npx playwright install-deps chromium firefox
          npx playwright install chromium firefox

      # Builds the open-world JavaScript bundle, then compiles, translates and runs
      # samples/editor in Chromium and demo behavior in Chromium and Firefox.
      - name: Run playground browser tests
        # This step takes 16-28 minutes. With no limit, the 2026-11-18
        # nightly sat in it for 81 minutes until the runner lost contact
        # with GitHub, which also lost the log; the same commit passed when
        # re-run. On the step, so the upload below still runs when it is
        # hit. The runner enforces a step limit, so one that is frozen
        # rather than busy is stopped by the job's limit instead.
        timeout-minutes: 60
        env:
          # Hosted Linux runners have no hardware GPU. Local runs use browser defaults.
          PLAYGROUND_SOFTWARE_GL: "1"
          PLAYGROUND_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/playground-browser
        run: |
          set -euo pipefail
          mkdir -p "$PLAYGROUND_BROWSER_ARTIFACT_DIR"
          cd scripts/cn1playground
          # The build compiles the theme CSS through the JavaSE port, which needs a
          # display, as the language-smoke job's harnesses do.
          xvfb-run -a bash tools/run-playground-browser-tests.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-browser-screenshots
          path: ${{ runner.temp }}/playground-browser
          if-no-files-found: ignore
