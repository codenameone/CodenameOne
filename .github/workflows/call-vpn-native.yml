# Clang syntax check for the call and VPN iOS natives.
#
# It lives in its own workflow rather than beside the identity clang step it
# was cloned from, because a workflow only runs when its own path filter
# matches: parked inside identity-stack.yml, a PR that touched nothing but
# CN1Call.m skipped the one check written for CN1Call.m.
name: Call and VPN natives

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ master ]
    paths:
      - 'Ports/iOSPort/nativeSources/CN1Call.*'
      - 'Ports/iOSPort/nativeSources/CN1Vpn.*'
      - 'Ports/iOSPort/nativeSources/CodenameOne_GLViewController.h'
      - 'Ports/iOSPort/nativeSources/CodenameOne_GLAppDelegate.m'
      - '.github/workflows/call-vpn-native.yml'
  push:
    branches: [ master ]
    paths:
      - 'Ports/iOSPort/nativeSources/CN1Call.*'
      - 'Ports/iOSPort/nativeSources/CN1Vpn.*'
      - 'Ports/iOSPort/nativeSources/CodenameOne_GLViewController.h'
      - 'Ports/iOSPort/nativeSources/CodenameOne_GLAppDelegate.m'
      - '.github/workflows/call-vpn-native.yml'

permissions:
  contents: read

concurrency:
  group: call-vpn-native-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  macos-clang:
    name: Clang syntax check for the call and VPN natives
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Clang -fsyntax-only on the call and VPN native impls
        run: |
          set -euo pipefail
          cd Ports/iOSPort/nativeSources
          SDK="$(xcrun --show-sdk-path --sdk iphoneos)"
          # A separate step from the one above because these files need two
          # more things in the shim: getThreadLocalData(), and the generated
          # IOSCallCallbacks header they call up through. Both exist in the
          # real ParparVM pipeline and neither is in this checkout.
          #
          # This step exists at all because CN1Call.m is the one file in the
          # tree whose correctness cannot be checked any other way. It is
          # ~1500 lines of Objective-C, no Java test can reach it, and the
          # only other gate -- check-native-signatures.sh -- reads names and
          # not bodies.
          STUB="$(mktemp -d)"
          cat > "$STUB/xmlvm.h" <<'EOF'
          struct ThreadLocalData;
          typedef void* JAVA_OBJECT;
          typedef int   JAVA_BOOLEAN;
          typedef int   JAVA_INT;
          typedef long long JAVA_LONG;
          typedef void  JAVA_VOID;
          #define JAVA_TRUE  1
          #define JAVA_FALSE 0
          #define JAVA_NULL  0
          #define POOL_BEGIN()
          #define POOL_END()
          // Matches vm/ByteCodeTranslator/src/cn1_globals.h: the macro is a
          // full parameter declaration INCLUDING the name, which is why every
          // native body can refer to threadStateData.
          #define CODENAME_ONE_THREAD_STATE struct ThreadLocalData* threadStateData
          extern struct ThreadLocalData* getThreadLocalData(void);
          #define CN1_THREAD_STATE_SINGLE_ARG
          #define CN1_THREAD_STATE_MULTI_ARG struct ThreadLocalData* threadStateData,
          #define CN1_THREAD_STATE_PASS_ARG threadStateData,
          #define CN1_THREAD_STATE_PASS_SINGLE_ARG threadStateData
          #define CN1_THREAD_GET_STATE_PASS_ARG threadStateData,
          #define CN1_THREAD_GET_STATE_PASS_SINGLE_ARG threadStateData
          EOF
          cat > "$STUB/java_lang_String.h" <<'EOF'
          #import "xmlvm.h"
          EOF
          # The generated upcall header, spelled out rather than derived.
          # A generator would be one more thing to be wrong about, and a
          # mismatch between these prototypes and the real ones is caught by
          # check-native-signatures.sh, not by clang.
          cat > "$STUB/com_codename1_impl_ios_IOSCallCallbacks.h" <<'EOF'
          #import "xmlvm.h"
          extern void com_codename1_impl_ios_IOSCallCallbacks_ack___int_boolean_int_java_lang_String(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_BOOLEAN, JAVA_INT, JAVA_OBJECT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_permissionResult___int_int(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_INT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_answerRequested___java_lang_String_long(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_LONG);
          extern void com_codename1_impl_ios_IOSCallCallbacks_endRequested___java_lang_String_long(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_LONG);
          extern void com_codename1_impl_ios_IOSCallCallbacks_holdRequested___java_lang_String_boolean_long(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_BOOLEAN, JAVA_LONG);
          extern void com_codename1_impl_ios_IOSCallCallbacks_muteRequested___java_lang_String_boolean_long(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_BOOLEAN, JAVA_LONG);
          extern void com_codename1_impl_ios_IOSCallCallbacks_dtmfRequested___java_lang_String_java_lang_String_long(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_OBJECT, JAVA_LONG);
          extern void com_codename1_impl_ios_IOSCallCallbacks_startCallRequested___java_lang_String_java_lang_String_boolean_long(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_OBJECT, JAVA_BOOLEAN, JAVA_LONG);
          extern void com_codename1_impl_ios_IOSCallCallbacks_audioActivated___java_lang_String_int(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_INT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_audioDeactivated___java_lang_String(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_callEnded___java_lang_String_int(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_INT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_providerReset__(CODENAME_ONE_THREAD_STATE);
          extern void com_codename1_impl_ios_IOSCallCallbacks_pushedCall___java_lang_String_java_lang_String_java_lang_String_boolean_boolean_boolean_java_lang_String_long(CODENAME_ONE_THREAD_STATE, JAVA_OBJECT, JAVA_OBJECT, JAVA_OBJECT, JAVA_BOOLEAN, JAVA_BOOLEAN, JAVA_BOOLEAN, JAVA_OBJECT, JAVA_LONG);
          extern void com_codename1_impl_ios_IOSCallCallbacks_pendingCallsDrained___int_int(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_INT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_voipToken___int_java_lang_String(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_OBJECT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_voipRegistrationFailed___int_int_java_lang_String(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_INT, JAVA_OBJECT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_directoryStatus___int_java_lang_String(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_OBJECT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_vpnAck___int_boolean_int_java_lang_String(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_BOOLEAN, JAVA_INT, JAVA_OBJECT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_vpnProfile___int_java_lang_String(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_OBJECT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_vpnProfileFailed___int_int_java_lang_String(CODENAME_ONE_THREAD_STATE, JAVA_INT, JAVA_INT, JAVA_OBJECT);
          extern void com_codename1_impl_ios_IOSCallCallbacks_vpnStatusChanged___int(CODENAME_ONE_THREAD_STATE, JAVA_INT);
          EOF
          # Both configurations: the halves an app that never referenced the
          # packages links, and the halves one that did links.
          for label in off on; do
            extra=""
            if [ "$label" = on ]; then
              extra="-DCN1_INCLUDE_CALL -DCN1_CALL_VOIP -DCN1_CALL_DIRECTORY -DCN1_INCLUDE_VPN"
            fi
            echo "::group::clang call/vpn $label"
            xcrun --sdk iphoneos clang \
                -fsyntax-only \
                -arch arm64 \
                -fobjc-arc \
                -Werror=incompatible-pointer-types \
                -Werror=objc-method-access \
                -Wno-unused-parameter \
                -Wno-deprecated-declarations \
                -Wno-macro-redefined \
                -I"$STUB" \
                -DNEW_CODENAME_ONE_VM=1 \
                $extra \
                CN1Call.m \
                CN1Vpn.m
            echo "::endgroup::"
          done
