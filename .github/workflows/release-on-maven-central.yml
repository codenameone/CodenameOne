# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Release
on:
  push:
    tags: '*'

# The R2 metadata regeneration is a read-modify-write over the bucket listing, so two
# releases must never overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Cloudflare R2, the repository Codename One is migrating to. These are deliberately
      # not the CLOUDFLARE_* secrets -- those belong to the Pages website deploy.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_BASE_URL: https://repo.codenameone.com/maven2

    steps:
      - uses: actions/checkout@v6
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set up Git Config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions@codenameone.com"

      - name: Check Maven Version
        run: mvn -v

      - name: Deploy Maven artifacts (core + archetypes)
        id: deploy
        continue-on-error: true
        run: |
          cat $HOME/.m2/settings.xml
          cd maven
          bash update-version.sh "$GITHUB_REF_NAME"
          export GPG_TTY=$(tty)
          # The cn1{app,lib}-archetype modules are part of the main reactor
          # since the in-tree migration, so a single mvn deploy publishes
          # everything (core + maven plugin + both archetypes).
          # -Darchetype.test.skip=true: the archetypes' ITs generate a
          # project pinned to the current cn1Version and invoke the
          # codenameone-maven-plugin against it; that plugin is being
          # published in this same reactor so it's not yet on Central
          # when the ITs run. -DskipTests covers the matching surefire pass.
          xvfb-run -a mvn deploy -Psign-artifacts -Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE -Plocal-dev-javase -Darchetype.test.skip=true -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # --- Cloudflare R2 -------------------------------------------------------
      # central-publishing-maven-plugin stages every module into
      # maven/target/central-staging (standard Maven layout, all four checksums,
      # .asc signatures) BEFORE it uploads to Central, so this runs even when the
      # Central step failed -- R2 is strictly more reliable than Central here.
      - name: Publish core reactor to R2
        id: r2_core
        # Non-fatal so a Cloudflare outage cannot skip the Central steps that follow;
        # the final gate below turns any R2 failure into a red job.
        continue-on-error: true
        if: always()
        run: |
          staging=maven/target/central-staging
          if [ ! -d "$staging" ]; then
            echo "No staging tree at $staging -- the build failed before packaging." >&2
            exit 1
          fi
          bash maven/scripts/r2/publish-staging-to-r2.sh "$staging"

      - name: Confirm artifacts on Maven Central (only after deploy failure)
        id: confirm
        if: steps.deploy.outcome == 'failure' && vars.CN1_DUAL_PUBLISH == 'true'
        continue-on-error: true
        run: |
          # central-publishing-maven-plugin occasionally reports
          # "Deployment failed while publishing" even when the bundle was
          # actually accepted and published. As a safety net for that
          # false-positive case, poll Maven Central for the key artifacts:
          # the codenameone-maven-plugin (proxy for the core release), its
          # platform-feature-catalog dependency, and both archetypes. The
          # catalog is a separate reactor artifact used by the local builders
          # for built-in platform dependency selection, so confirming only the
          # plugin could leave a released plugin with an unavailable runtime
          # dependency. Skipped when the deploy already reported success (the
          # artifacts may still be propagating from Sonatype Central to repo1;
          # that propagation can take 30+ minutes and isn't worth blocking on).
          set +e
          for i in $(seq 1 90); do
            plugin_code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/com/codenameone/codenameone-maven-plugin/${GITHUB_REF_NAME}/codenameone-maven-plugin-${GITHUB_REF_NAME}.pom")
            catalog_code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/com/codenameone/codenameone-platform-feature-catalog/${GITHUB_REF_NAME}/codenameone-platform-feature-catalog-${GITHUB_REF_NAME}.pom")
            app_code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/com/codenameone/cn1app-archetype/${GITHUB_REF_NAME}/cn1app-archetype-${GITHUB_REF_NAME}.pom")
            lib_code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/com/codenameone/cn1lib-archetype/${GITHUB_REF_NAME}/cn1lib-archetype-${GITHUB_REF_NAME}.pom")
            if [ "$plugin_code" = "200" ] && [ "$catalog_code" = "200" ] && \
               [ "$app_code" = "200" ] && [ "$lib_code" = "200" ]; then
              echo "Confirmed plugin + platform-feature-catalog + cn1{app,lib}-archetype ${GITHUB_REF_NAME} on Maven Central"
              exit 0
            fi
            echo "[$i/90] Waiting on Maven Central (plugin=$plugin_code, catalog=$catalog_code, cn1app=$app_code, cn1lib=$lib_code)"
            sleep 20
          done
          echo "Artifacts ${GITHUB_REF_NAME} did not appear on Maven Central within 30 minutes"
          exit 1

      - name: Fail when release did not complete
        if: steps.deploy.outcome != 'success' && steps.confirm.outcome != 'success'
        run: |
          echo "Release failed: deploy reported failure and the artifacts never appeared on Maven Central."
          exit 1

      - name: Regenerate R2 metadata and archetype catalog
        id: r2_core_metadata
        continue-on-error: true
        if: always() && steps.r2_core.outcome == 'success'
        run: python3 maven/scripts/r2/regen-maven-metadata.py

      - name: Confirm artifacts on R2
        id: r2_core_confirm
        continue-on-error: true
        if: always() && steps.r2_core.outcome == 'success'
        run: |
          # Cache-busting query parameter is deliberate: Cloudflare caches 404s on the R2
          # custom domain, so a poll that runs a moment too early would cache the negative
          # and keep seeing it. A Cache Rule sets Status Code TTL 400-599 to no-store, but
          # this keeps the release green even if that rule is ever removed.
          set -e
          for artifact in codenameone-core codenameone-maven-plugin codenameone-platform-feature-catalog \
                          cn1app-archetype cn1lib-archetype; do
            url="${R2_BASE_URL}/com/codenameone/${artifact}/${GITHUB_REF_NAME}/${artifact}-${GITHUB_REF_NAME}.pom?cb=${GITHUB_RUN_ID}"
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" != "200" ]; then
              echo "MISSING on R2: $artifact ${GITHUB_REF_NAME} (HTTP $code)" >&2
              exit 1
            fi
            echo "ok: $artifact ${GITHUB_REF_NAME}"
          done
          meta="${R2_BASE_URL}/com/codenameone/codenameone-core/maven-metadata.xml?cb=${GITHUB_RUN_ID}"
          if ! curl -s "$meta" | grep -q "<release>${GITHUB_REF_NAME}</release>"; then
            echo "maven-metadata.xml does not list ${GITHUB_REF_NAME} as <release>" >&2
            curl -s "$meta" >&2
            exit 1
          fi
          echo "ok: maven-metadata.xml <release> is ${GITHUB_REF_NAME}"

      # --- Game Builder editor -------------------------------------------------
      # The cn1:gamebuilder goal resolves
      # com.codenameone:codenameone-gamebuilder:<version> and its runtime
      # dependencies from Maven Central. That editor lives outside the maven/ reactor
      # (scripts/gamebuilder), compiles at Java 17, and depends on the
      # core/javase/plugin published above, so it is built and deployed in a
      # second pass here. These steps run only when the core release succeeded;
      # update-version.sh already synced the gamebuilder poms to GITHUB_REF_NAME.
      # Deliberately does NOT import the GPG key: it was already imported by the
      # Java 8 "Set up Maven Central Repository" step above and persists in the
      # runner keyring (gpg signing in the editor deploy below uses it fine). If
      # both setup-java steps import the key, both of their cleanup post-steps
      # try to delete it; the second deletion fails ("gpg ... exit code 2") and
      # marks the whole release red even though every artifact published.
      - name: Set up JDK 17 for the Game Builder editor
        if: steps.deploy.outcome == 'success' || steps.confirm.outcome == 'success'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Deploy Game Builder editor to Maven Central
        id: deploy_gamebuilder
        continue-on-error: true
        if: always() && (steps.deploy.outcome == 'success' || steps.confirm.outcome == 'success')
        run: |
          export GPG_TTY=$(tty)
          cd scripts/gamebuilder
          # The core/javase/plugin just released are already in the local repo
          # from the deploy above (install runs before the Central upload).
          # -Dcn1.version/-Dcn1.plugin.version pin the build to that version.
          # -Dmaven.test.skip=true also skips test *compilation* (the editor's
          # JUnit test deps are irrelevant to the published jar). -Pgamebuilder-
          # central adds the sources/javadoc jars, GPG signatures and the
          # central-publishing bundle; -Pexecutable-jar builds the desktop
          # launcher jar and copies runtime dependencies for local runs.
          # -Dcodename1.platform=javase is REQUIRED: it activates the parent's
          # `javase` profile (which contributes the editor module) by property.
          # That profile is activeByDefault, but any explicit -P activation
          # suppresses activeByDefault, so without this property the editor
          # (codenameone-gamebuilder) silently drops out of the reactor and only
          # the parent + common modules would be published.
          xvfb-run -a mvn -Pexecutable-jar -Pgamebuilder-central deploy \
            -Dcodename1.platform=javase \
            -Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE \
            -Dcn1.version=$GITHUB_REF_NAME -Dcn1.plugin.version=$GITHUB_REF_NAME \
            -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish Game Builder editor to R2
        id: r2_gamebuilder
        # Non-fatal for the same reason as the core upload: one editor's R2 failure
        # must not skip the remaining editors' Central deploys.
        continue-on-error: true
        # always(): central-publishing stages before it uploads, so the tree exists
        # even when the Central deploy above failed -- which is precisely the case
        # R2 is here to survive. Metadata is regenerated once, after all three.
        if: always() && steps.deploy_gamebuilder.conclusion != 'skipped'
        run: |
          # Each editor is its own reactor, so it stages into its own target dir.
          bash maven/scripts/r2/publish-staging-to-r2.sh scripts/gamebuilder/target/central-staging
          url="${R2_BASE_URL}/com/codenameone/codenameone-gamebuilder/${GITHUB_REF_NAME}/codenameone-gamebuilder-${GITHUB_REF_NAME}.pom?cb=${GITHUB_RUN_ID}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          [ "$code" = "200" ] || { echo "MISSING on R2: codenameone-gamebuilder (HTTP $code)" >&2; exit 1; }
          echo "ok: codenameone-gamebuilder ${GITHUB_REF_NAME} on R2"

      - name: Confirm Game Builder editor on Maven Central
        if: >-
          vars.CN1_DUAL_PUBLISH == 'true' &&
          (steps.deploy.outcome == 'success' || steps.confirm.outcome == 'success')
        continue-on-error: true
        run: |
          # Informational only: the editor bundle was accepted by Sonatype
          # Central in the step above (which would have failed otherwise).
          # Propagation to repo1 can take 30+ minutes, so this is a best-effort
          # sanity poll, not a gate.
          set +e
          url="https://repo1.maven.org/maven2/com/codenameone/codenameone-gamebuilder/${GITHUB_REF_NAME}/codenameone-gamebuilder-${GITHUB_REF_NAME}.jar"
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" = "200" ]; then
              echo "Confirmed codenameone-gamebuilder ${GITHUB_REF_NAME} on Maven Central"
              exit 0
            fi
            echo "[$i/15] Waiting on Maven Central for codenameone-gamebuilder (code=$code)"
            sleep 20
          done
          echo "codenameone-gamebuilder ${GITHUB_REF_NAME} not visible on repo1 yet; it may still be propagating from Sonatype Central."

      # --- Signing Wizard editor ---------------------------------------------
      # The cn1:certificatewizard goal resolves
      # com.codenameone:codenameone-certificatewizard:<version> and its runtime
      # dependencies from Maven Central. The editor is a Java-17 Codename One desktop app in
      # scripts/certificatewizard and uses the generated OpenAPI client for the
      # Apple signing service.
      - name: Deploy Signing Wizard editor to Maven Central
        id: deploy_certificatewizard
        continue-on-error: true
        if: always() && (steps.deploy.outcome == 'success' || steps.confirm.outcome == 'success')
        run: |
          export GPG_TTY=$(tty)
          cd scripts/certificatewizard
          xvfb-run -a mvn -Pexecutable-jar -Pcertificatewizard-central deploy \
            -Dcodename1.platform=javase \
            -Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE \
            -Dcn1.version=$GITHUB_REF_NAME -Dcn1.plugin.version=$GITHUB_REF_NAME \
            -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish Signing Wizard editor to R2
        id: r2_certificatewizard
        # Non-fatal for the same reason as the core upload: one editor's R2 failure
        # must not skip the remaining editors' Central deploys.
        continue-on-error: true
        # always(): central-publishing stages before it uploads, so the tree exists
        # even when the Central deploy above failed -- which is precisely the case
        # R2 is here to survive. Metadata is regenerated once, after all three.
        if: always() && steps.deploy_certificatewizard.conclusion != 'skipped'
        run: |
          # Each editor is its own reactor, so it stages into its own target dir.
          bash maven/scripts/r2/publish-staging-to-r2.sh scripts/certificatewizard/target/central-staging
          url="${R2_BASE_URL}/com/codenameone/codenameone-certificatewizard/${GITHUB_REF_NAME}/codenameone-certificatewizard-${GITHUB_REF_NAME}.pom?cb=${GITHUB_RUN_ID}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          [ "$code" = "200" ] || { echo "MISSING on R2: codenameone-certificatewizard (HTTP $code)" >&2; exit 1; }
          echo "ok: codenameone-certificatewizard ${GITHUB_REF_NAME} on R2"

      - name: Confirm Signing Wizard editor on Maven Central
        if: >-
          vars.CN1_DUAL_PUBLISH == 'true' &&
          (steps.deploy.outcome == 'success' || steps.confirm.outcome == 'success')
        continue-on-error: true
        run: |
          set +e
          url="https://repo1.maven.org/maven2/com/codenameone/codenameone-certificatewizard/${GITHUB_REF_NAME}/codenameone-certificatewizard-${GITHUB_REF_NAME}.jar"
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" = "200" ]; then
              echo "Confirmed codenameone-certificatewizard ${GITHUB_REF_NAME} on Maven Central"
              exit 0
            fi
            echo "[$i/15] Waiting on Maven Central for codenameone-certificatewizard (code=$code)"
            sleep 20
          done
          echo "codenameone-certificatewizard ${GITHUB_REF_NAME} not visible on repo1 yet; it may still be propagating from Sonatype Central."

      # --- Settings editor ----------------------------------------------------
      # The cn1:settings goal resolves the standalone Java-17 Settings editor
      # and its runtime dependencies from Maven Central.
      - name: Deploy Settings editor to Maven Central
        id: deploy_settings
        continue-on-error: true
        if: always() && (steps.deploy.outcome == 'success' || steps.confirm.outcome == 'success')
        run: |
          export GPG_TTY=$(tty)
          cd scripts/settings
          xvfb-run -a mvn -Pexecutable-jar -Psettings-central deploy \
            -Dcodename1.platform=javase \
            -Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE \
            -Dcn1.version=$GITHUB_REF_NAME -Dcn1.plugin.version=$GITHUB_REF_NAME \
            -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish Settings editor to R2
        id: r2_settings
        # Non-fatal for the same reason as the core upload: one editor's R2 failure
        # must not skip the remaining editors' Central deploys.
        continue-on-error: true
        # always(): central-publishing stages before it uploads, so the tree exists
        # even when the Central deploy above failed -- which is precisely the case
        # R2 is here to survive. Metadata is regenerated once, after all three.
        if: always() && steps.deploy_settings.conclusion != 'skipped'
        run: |
          # Each editor is its own reactor, so it stages into its own target dir.
          bash maven/scripts/r2/publish-staging-to-r2.sh scripts/settings/target/central-staging
          url="${R2_BASE_URL}/com/codenameone/codenameone-settings/${GITHUB_REF_NAME}/codenameone-settings-${GITHUB_REF_NAME}.pom?cb=${GITHUB_RUN_ID}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          [ "$code" = "200" ] || { echo "MISSING on R2: codenameone-settings (HTTP $code)" >&2; exit 1; }
          echo "ok: codenameone-settings ${GITHUB_REF_NAME} on R2"

      - name: Confirm Settings editor on Maven Central
        if: >-
          vars.CN1_DUAL_PUBLISH == 'true' &&
          (steps.deploy.outcome == 'success' || steps.confirm.outcome == 'success')
        continue-on-error: true
        run: |
          set +e
          url="https://repo1.maven.org/maven2/com/codenameone/codenameone-settings/${GITHUB_REF_NAME}/codenameone-settings-${GITHUB_REF_NAME}.jar"
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" = "200" ]; then
              echo "Confirmed codenameone-settings ${GITHUB_REF_NAME} on Maven Central"
              exit 0
            fi
            echo "[$i/15] Waiting on Maven Central for codenameone-settings (code=$code)"
            sleep 20
          done
          echo "codenameone-settings ${GITHUB_REF_NAME} not visible on repo1 yet; it may still be propagating from Sonatype Central."

      - name: Regenerate R2 metadata for the editors
        id: r2_editor_metadata
        continue-on-error: true
        if: always() && steps.r2_core.outcome == 'success'
        run: python3 maven/scripts/r2/regen-maven-metadata.py

      - name: Fail when any publication did not complete
        # Every publish step runs with continue-on-error so that one destination
        # failing cannot skip the others -- a Central outage must not cost us the R2
        # upload, and an R2 outage must not leave a partial Central editor release.
        # That means the job's real verdict is decided here, once, at the end.
        if: always()
        run: |
          status=0
          fail() { echo "  FAILED: $1"; status=1; }
          echo "Publication outcomes:"
          [ "${{ steps.r2_core.outcome }}" = "failure" ] && fail "core reactor -> R2"
          [ "${{ steps.r2_core_metadata.outcome }}" = "failure" ] && fail "R2 metadata regeneration"
          [ "${{ steps.r2_core_confirm.outcome }}" = "failure" ] && fail "core artifacts missing on R2"
          [ "${{ steps.r2_gamebuilder.outcome }}" = "failure" ] && fail "Game Builder -> R2"
          [ "${{ steps.r2_certificatewizard.outcome }}" = "failure" ] && fail "Signing Wizard -> R2"
          [ "${{ steps.r2_settings.outcome }}" = "failure" ] && fail "Settings -> R2"
          [ "${{ steps.r2_editor_metadata.outcome }}" = "failure" ] && fail "R2 metadata regeneration (editors)"
          if [ "${{ vars.CN1_DUAL_PUBLISH }}" = "true" ]; then
            [ "${{ steps.deploy_gamebuilder.outcome }}" = "failure" ] && fail "Game Builder -> Maven Central"
            [ "${{ steps.deploy_certificatewizard.outcome }}" = "failure" ] && fail "Signing Wizard -> Maven Central"
            [ "${{ steps.deploy_settings.outcome }}" = "failure" ] && fail "Settings -> Maven Central"
          fi
          [ "$status" = "0" ] && echo "  all publications succeeded"
          exit $status
