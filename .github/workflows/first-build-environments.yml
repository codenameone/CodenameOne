name: First build environments
# A real Initializr download's first cloud build, with real Maven and the real
# build client, in the environments that most often break a first build. Each
# case must either get through to sign-in (CI has no account, so that is where
# a healthy build stops) or stop earlier with the reason the launcher reports
# for it. See scripts/tests/first-build-environment.py.
on:
  pull_request:
    paths: ['scripts/initializr/common/src/main/**', 'scripts/tests/first-build-environment.py',
            'scripts/tests/generate-initializr-fixtures.py', 'maven/cn1app-archetype/src/main/resources/archetype-resources/**',
            '.github/workflows/first-build-environments.yml']
  schedule:
    # Nightly: a new JDK, Maven or runner image can break a first build with no
    # change on our side.
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate real Initializr downloads
        run: python scripts/tests/generate-initializr-fixtures.py "${{ runner.temp }}/initializr-fixtures"
      - uses: actions/upload-artifact@v4
        with:
          name: initializr-download
          path: ${{ runner.temp }}/initializr-fixtures/INTELLIJ-JAVA_17.zip

  environment:
    needs: download
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, case: baseline, java: '17', package: jdk}
          - {os: ubuntu-24.04, case: non_ascii, java: '17', package: jdk}
          - {os: ubuntu-24.04, case: jre, java: '17', package: jre}
          - {os: ubuntu-24.04, case: old_jdk, java: '11', package: jdk}
          - {os: ubuntu-24.04, case: mirror, java: '17', package: jdk}
          - {os: windows-latest, case: baseline, java: '17', package: jdk}
          - {os: windows-latest, case: non_ascii, java: '17', package: jdk}
          - {os: windows-latest, case: old_jdk, java: '11', package: jdk}
          - {os: macos-latest, case: baseline, java: '17', package: jdk}
          - {os: macos-latest, case: non_ascii, java: '17', package: jdk}
    name: ${{ matrix.case }} (${{ matrix.os }}, ${{ matrix.package }} ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          java-package: ${{ matrix.package }}
      - uses: actions/download-artifact@v4
        with:
          name: initializr-download
          path: ${{ runner.temp }}/download
      - name: First build in this environment
        env:
          PYTHONUTF8: '1'
        run: python scripts/tests/first-build-environment.py "${{ runner.temp }}/download/INTELLIJ-JAVA_17.zip" ${{ matrix.case }}
