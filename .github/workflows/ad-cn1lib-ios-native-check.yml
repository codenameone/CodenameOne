name: Ad cn1lib iOS native check

# The Objective-C in an ad cn1lib is shipped as source: our builds never
# compile it, the customer's Xcode is the first compiler that ever sees it, and
# the pod it is written against keeps moving underneath it. That is how
# cn1-admob reached users referencing GADSimulatorID, which the Google Mobile
# Ads SDK removed in version 12, and BRIDGE_RETAINED, which has never existed
# anywhere in the port. Both surfaced as a failed app build.
#
# So the native sources are compiled here against the very pod the library
# pins, in a throwaway static-library target. A static library archives .o
# files without linking, so the externs the real build supplies (the translated
# AdMobCallback entry point) do not have to resolve.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'maven/cn1-admob/**'
      - 'maven/cn1-applovin/**'
      - 'maven/cn1-unity-levelplay/**'
      - 'vm/ByteCodeTranslator/src/cn1_globals.h'
      - '.github/workflows/ad-cn1lib-ios-native-check.yml'
  push:
    branches: [master]
    paths:
      - 'maven/cn1-admob/**'
      - 'maven/cn1-applovin/**'
      - 'maven/cn1-unity-levelplay/**'
      - '.github/workflows/ad-cn1lib-ios-native-check.yml'

jobs:
  compile-native-sources:
    name: clang ${{ matrix.lib }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        lib: [cn1-admob, cn1-applovin, cn1-unity-levelplay]
    steps:
      - uses: actions/checkout@v6

      - name: Resolve the pod this library pins
        id: pod
        # Read it out of codenameone_library_required.properties rather than
        # repeating it here, so the version the check compiles against is the
        # version apps build against, by construction.
        run: |
          set -euo pipefail
          props="maven/${{ matrix.lib }}/common/codenameone_library_required.properties"
          line="$(sed -n 's/^codename1\.arg\.ios\.pods=//p' "$props" | head -1)"
          if [ -z "$line" ]; then
              echo "::error::No codename1.arg.ios.pods in $props"; exit 1
          fi
          name="${line%% *}"
          version=""
          if [ "$name" != "$line" ]; then
              version="${line#* }"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pod: $name ${version:-(unpinned)}"

      - name: Stage the probe sources
        run: |
          set -euxo pipefail
          PROBE=/tmp/probe-${{ matrix.lib }}
          mkdir -p "$PROBE/CN1AdProbe"
          cp maven/${{ matrix.lib }}/ios/src/main/objectivec/*.h "$PROBE/CN1AdProbe/" 2>/dev/null || true
          cp maven/${{ matrix.lib }}/ios/src/main/objectivec/*.m "$PROBE/CN1AdProbe/"

          # These sources call back into Java through the generated entry point
          # and use JAVA_INT / JAVA_OBJECT / fromNSString without importing
          # anything: in a real build the translator's <app>-Prefix.pch pulls in
          # cn1_globals.h for them. Reproduce that here, using the port's own
          # header so a change to those macros is caught too.
          cp vm/ByteCodeTranslator/src/cn1_globals.h "$PROBE/"
          # Generated per translation from the app's class list; nothing in the
          # ad bridges reads it, so an empty stand-in is enough to let
          # cn1_globals.h parse on its own.
          printf '#pragma once\n' > "$PROBE/cn1_class_method_index.h"
          cat > "$PROBE/CN1AdProbe-Prefix.pch" <<'PCH'
          #ifdef __OBJC__
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #endif
          #include "cn1_globals.h"
          PCH
          ls -la "$PROBE" "$PROBE/CN1AdProbe"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Synthesise the Xcode project
        run: |
          set -euxo pipefail
          PROBE=/tmp/probe-${{ matrix.lib }}
          cat > "$PROBE/project.yml" <<'YML'
          name: CN1AdProbe
          options:
            bundleIdPrefix: com.codenameone.cn1ads
            deploymentTarget:
              iOS: "15.0"
          targets:
            CN1AdProbe:
              type: library.static
              platform: iOS
              sources:
                - path: CN1AdProbe
              settings:
                base:
                  CLANG_ENABLE_MODULES: YES
                  CLANG_ENABLE_OBJC_ARC: YES
                  CODE_SIGNING_ALLOWED: NO
                  GCC_PREFIX_HEADER: CN1AdProbe-Prefix.pch
                  GCC_PRECOMPILE_PREFIX_HEADER: NO
                  HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)
          YML
          cd "$PROBE"
          xcodegen generate --spec project.yml

      - name: pod install
        run: |
          set -euxo pipefail
          PROBE=/tmp/probe-${{ matrix.lib }}
          cd "$PROBE"
          {
            echo "platform :ios, '15.0'"
            echo "target 'CN1AdProbe' do"
            echo "  use_frameworks!"
            if [ -n "${{ steps.pod.outputs.version }}" ]; then
              echo "  pod '${{ steps.pod.outputs.name }}', '${{ steps.pod.outputs.version }}'"
            else
              echo "  pod '${{ steps.pod.outputs.name }}'"
            fi
            echo "end"
          } > Podfile
          cat Podfile
          pod install --repo-update

      - name: xcodebuild
        run: |
          set -euxo pipefail
          PROBE=/tmp/probe-${{ matrix.lib }}
          cd "$PROBE"
          xcodebuild -workspace CN1AdProbe.xcworkspace \
                     -scheme CN1AdProbe \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     CODE_SIGNING_ALLOWED=NO \
                     build
