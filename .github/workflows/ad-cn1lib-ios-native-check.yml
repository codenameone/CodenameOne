name: Ad cn1lib iOS native check

# The Objective-C in an ad cn1lib is shipped as source: our builds never
# compile it, the customer's Xcode is the first compiler that ever sees it, and
# the pod it is written against keeps moving underneath it. That is how
# cn1-admob reached users referencing GADSimulatorID, which the Google Mobile
# Ads SDK removed in version 12, and BRIDGE_RETAINED, which has never existed
# anywhere in the port. Both surfaced as a failed app build.
#
# So the native sources are compiled here against the very pod the library
# pins, in a throwaway static-library target. A static library archives .o
# files without linking, so the externs the real build supplies (the translated
# AdMobCallback entry point) do not have to resolve.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'maven/cn1-admob/**'
      - 'maven/cn1-applovin/**'
      - 'maven/cn1-unity-levelplay/**'
      - 'scripts/check-admob-ios-link.sh'
      - 'vm/ByteCodeTranslator/**'
      - 'vm/pom.xml'
      - '.github/workflows/ad-cn1lib-ios-native-check.yml'
      - 'scripts/ci/select-cn1lib-checks.py'
      - 'scripts/ci/check-ios-cn1lib.py'
  push:
    branches: [master]
    paths:
      - 'maven/cn1-admob/**'
      - 'maven/cn1-applovin/**'
      - 'maven/cn1-unity-levelplay/**'
      - 'scripts/check-admob-ios-link.sh'
      - 'vm/ByteCodeTranslator/**'
      - 'vm/pom.xml'
      - '.github/workflows/ad-cn1lib-ios-native-check.yml'
      - 'scripts/ci/select-cn1lib-checks.py'
      - 'scripts/ci/check-ios-cn1lib.py'

concurrency:
  # Only the latest revision needs validation. PR numbers keep forks isolated;
  # event names keep a manual/scheduled run from cancelling a push or PR run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      libraries: ${{ steps.plan.outputs.ios_ads }}
      link: ${{ steps.plan.outputs.admob_link }}
    steps:
      - uses: actions/checkout@v6
      - name: Select impacted libraries before allocating a Mac
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/select-cn1lib-checks.py

  native-checks:
    # One runner, one checkout/tool installation, and one pod resolution per
    # library. Keep both ARC modes and both AdMob link destinations.
    needs: select
    if: ${{ needs.select.outputs.libraries != '' || needs.select.outputs.link == 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        if: needs.select.outputs.link == 'true'
        with:
          distribution: zulu
          java-version: '8'
      - name: Install xcodegen once
        if: needs.select.outputs.libraries != ''
        run: command -v xcodegen || brew install xcodegen
      - name: Compile cn1-admob (MRR and ARC)
        if: ${{ !cancelled() && contains(needs.select.outputs.libraries, 'cn1-admob') }}
        run: python3 scripts/ci/check-ios-cn1lib.py cn1-admob
      - name: Compile cn1-applovin (MRR and ARC)
        if: ${{ !cancelled() && contains(needs.select.outputs.libraries, 'cn1-applovin') }}
        run: python3 scripts/ci/check-ios-cn1lib.py cn1-applovin
      - name: Compile cn1-unity-levelplay (MRR and ARC)
        if: ${{ !cancelled() && contains(needs.select.outputs.libraries, 'cn1-unity-levelplay') }}
        run: python3 scripts/ci/check-ios-cn1lib.py cn1-unity-levelplay
      - name: Link AdMob app (iphoneos)
        if: ${{ !cancelled() && needs.select.outputs.link == 'true' }}
        run: scripts/check-admob-ios-link.sh "$RUNNER_TEMP/admob-link-iphoneos" "iphoneos"
      - name: Link AdMob app (iphonesimulator)
        if: ${{ !cancelled() && needs.select.outputs.link == 'true' }}
        run: scripts/check-admob-ios-link.sh "$RUNNER_TEMP/admob-link-iphonesimulator" "iphonesimulator"
