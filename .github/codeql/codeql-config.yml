name: "Codename One CodeQL configuration"

# Excludes from analysis. We do NOT use queries-disable here -- everything
# else CodeQL would flag is still in scope. The exclusions below are limited
# to large vendored trees whose findings are upstream's, not ours.
paths-ignore:
  # Vendored SQLite engine (SQLite3 Multiple Ciphers), 13MB of upstream C carried
  # verbatim. Analysing it reports upstream's findings as ours, and its sheer size
  # pushes CodeQL off incremental analysis so it re-reports pre-existing alerts
  # across unrelated files. Provenance and update instructions are in
  # vm/ByteCodeTranslator/src/cn1_sqlite3_README.md.
  - 'vm/ByteCodeTranslator/src/cn1_sqlite3_amalgamation.h'
  - 'vm/ByteCodeTranslator/src/cn1_sqlite3.h'
  # Test programs for the in-tree Java compiler. They exercise the language's
  # corner cases on purpose -- narrowing compound assignments, overflow, odd
  # casts -- so every program there must compile and behave exactly as javac's
  # output does; "fixing" what CodeQL flags would remove the case under test.
  - 'vm/JavaCompiler/tests/**'
  # The device class library's own java.security.SecureRandom. CodeQL runs
  # without a build here (build-mode: none), so it resolves `SecureRandom`
  # everywhere -- the JDK-compiled backend included -- to this source file
  # rather than to the JDK's class, sees `extends java.util.Random`, and
  # reports every key the backend draws from the JDK's SecureRandom as
  # "insecure randomness". The class itself delegates every byte to the
  # platform's secure generator (JdkHost.randomBytes) and is not what the
  # backend runs.
  - 'vm/JavaAPI/src/java/security/SecureRandom.java'
  - 'Ports/CLDC11/src/java/security/SecureRandom.java'
  # The JavaScript target's numeric differential fixture, for the same reason:
  # it compares narrowing compound assignments, saturating casts and overflow
  # against the JVM, and writing the casts out would change the bytecode shape
  # (the DUP2 of a compound array store) that the comparison is there to cover.
  - 'vm/tests/src/test/resources/com/codename1/tools/translator/JsNumericDifferentialApp.java'
  # The AES of the android-compat tests' headless Codename One implementation,
  # a test double that hands the IV the code under test chose straight to the
  # JDK. Those IVs are random (com.codename1.security.SecureRandom, filled by
  # the JDK's SecureRandom.nextBytes here, or the tests' own nextBytes), but
  # CodeQL treats a `new byte[n]` filled in another method as a static IV and
  # reports this sink for each of them.
  - 'maven/android-compat/src/test/java/com/codename1/androidcompat/testing/HeadlessAes.java'
