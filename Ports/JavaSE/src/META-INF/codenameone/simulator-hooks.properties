# Simulator hooks of the JavaSE port's simulated subsystems.
# Loaded by com.codename1.impl.javase.simulator.SimulatorHookLoader; the
# labeled items surface as simulator menus, and every item -- labeled or
# not -- is callable cross-platform via CN.execute("<namespace>:itemN").
#
# A classpath entry can only carry one copy of this resource, so the
# subsystems are declared as prefixed groups rather than as separate files.
groups=bluetooth,health,call,vpn

bluetooth.name=Bluetooth
bluetooth.namespace=bluetooth

bluetooth.item1=com.codename1.impl.javase.BluetoothSimulatorHooks#toggleAdapter
bluetooth.label1=Toggle Adapter

bluetooth.item2=com.codename1.impl.javase.BluetoothSimulatorHooks#addDemoPeripheral
bluetooth.label2=Add Demo Peripheral

bluetooth.item3=com.codename1.impl.javase.BluetoothSimulatorHooks#pushDemoNotification
bluetooth.label3=Push Demo Notification

bluetooth.item4=com.codename1.impl.javase.BluetoothSimulatorHooks#disconnectAll
bluetooth.label4=Disconnect All

bluetooth.item5=com.codename1.impl.javase.BluetoothSimulatorHooks#clearPeripherals
bluetooth.label5=Clear Peripherals

bluetooth.item6=com.codename1.impl.javase.BluetoothSimulatorHooks#switchToSimulatorBackend
bluetooth.label6=Use Simulator Backend

bluetooth.item7=com.codename1.impl.javase.BluetoothSimulatorHooks#switchToNativeBackend
bluetooth.label7=Use Native Backend

# API-only (no label): arms the next GATT read to fail. For tests/scripts:
# CN.execute("bluetooth:item8")
bluetooth.item8=com.codename1.impl.javase.BluetoothSimulatorHooks#primeReadFailure

health.name=Health
health.namespace=health

health.item1=com.codename1.impl.javase.HealthSimulatorHooks#grantAllPermissions
health.label1=Grant All Permissions

health.item2=com.codename1.impl.javase.HealthSimulatorHooks#denyAllPermissions
health.label2=Deny All Permissions

# The trap worth clicking before shipping: authorization appears to
# succeed, the status reads UNKNOWN, and every query comes back empty with
# no error -- exactly what HealthKit does when a user declines a read.
health.item3=com.codename1.impl.javase.HealthSimulatorHooks#grantWriteDenyReadSilently
health.label3=Grant Write, Deny Read Without Error

health.item4=com.codename1.impl.javase.HealthSimulatorHooks#loadDemoDataset
health.label4=Load Demo Dataset (7 days)

health.item5=com.codename1.impl.javase.HealthSimulatorHooks#clearAllData
health.label5=Clear All Health Data

health.item6=com.codename1.impl.javase.HealthSimulatorHooks#useIosPermissionBehaviour
health.label6=Emulate HealthKit Permissions

health.item7=com.codename1.impl.javase.HealthSimulatorHooks#useAndroidPermissionBehaviour
health.label7=Emulate Health Connect Permissions

health.item8=com.codename1.impl.javase.HealthSimulatorHooks#setHealthUnavailable
health.label8=Make Health Unavailable

# API-only items below (no label): for tests and scripts.
health.item9=com.codename1.impl.javase.HealthSimulatorHooks#setHealthAvailable
health.item10=com.codename1.impl.javase.HealthSimulatorHooks#primeQueryFailure
health.item11=com.codename1.impl.javase.HealthSimulatorHooks#primeSaveFailure
health.item12=com.codename1.impl.javase.HealthSimulatorHooks#resetScripts

call.name=Calls
call.namespace=call

# Ring a call the app did not report, the way the system does when a VoIP
# push arrives. The app should find a session it never created.
call.item1=com.codename1.impl.javase.CallSimulatorHooks#ringIncomingCall
call.label1=Ring An Incoming Call

call.item2=com.codename1.impl.javase.CallSimulatorHooks#answerCurrentCall
call.label2=Answer From The System UI

call.item3=com.codename1.impl.javase.CallSimulatorHooks#endCurrentCall
call.label3=Hang Up From The System UI

call.item4=com.codename1.impl.javase.CallSimulatorHooks#remoteEndCurrentCall
call.label4=Far End Hangs Up

# The trap worth clicking before shipping: a second call arrives while one
# is already up, which is where a single-call app's state machine breaks.
call.item5=com.codename1.impl.javase.CallSimulatorHooks#ringSecondCall
call.label5=Ring A Second Call While Busy

# The other trap: the system refuses to ring at all, which an app that
# assumes reportIncoming always succeeds never handles.
call.item6=com.codename1.impl.javase.CallSimulatorHooks#refuseNextCall
call.label6=Refuse The Next Call (Emergency In Progress)

# Audio that never arrives. An app that starts media on the answer instead
# of on the audio session sounds fine here and is silent on a device; this
# makes the opposite mistake visible instead.
call.item7=com.codename1.impl.javase.CallSimulatorHooks#withholdAudioSession
call.label7=Never Activate The Audio Session

call.item8=com.codename1.impl.javase.CallSimulatorHooks#resetProvider
call.label8=Reset The Call Provider

# A call that rang while the app was not listening, then ended before it
# got there. Must be logged as missed, never answered.
call.item9=com.codename1.impl.javase.CallSimulatorHooks#queueStalePushedCall
call.label9=Queue A Call That Already Ended

call.item10=com.codename1.impl.javase.CallSimulatorHooks#queuePushedCall
call.label10=Queue A Pushed Call (Cold Start)

call.item11=com.codename1.impl.javase.CallSimulatorHooks#routeToSpeaker
call.label11=Route Audio To Speaker

call.item12=com.codename1.impl.javase.CallSimulatorHooks#makeCallsUnsupported
call.label12=Make Calls Unsupported

# API-only items below (no label): for tests and scripts.
call.item13=com.codename1.impl.javase.CallSimulatorHooks#makeCallsSupported
call.item14=com.codename1.impl.javase.CallSimulatorHooks#allowNextCall
call.item15=com.codename1.impl.javase.CallSimulatorHooks#restoreAudioSession
call.item16=com.codename1.impl.javase.CallSimulatorHooks#sendDtmfDigit

vpn.name=VPN
vpn.namespace=vpn

vpn.item1=com.codename1.impl.javase.VpnSimulatorHooks#declineNextInstall
vpn.label1=Decline The Next Install Prompt

vpn.item2=com.codename1.impl.javase.VpnSimulatorHooks#acceptInstalls
vpn.label2=Accept Install Prompts

# Credentials that are refused after the profile installed cleanly. The
# install and the connection fail in different places for different
# reasons, and apps routinely handle only the first.
vpn.item3=com.codename1.impl.javase.VpnSimulatorHooks#refuseCredentials
vpn.label3=Refuse The Credentials On Connect

vpn.item4=com.codename1.impl.javase.VpnSimulatorHooks#acceptCredentials
vpn.label4=Accept The Credentials

vpn.item5=com.codename1.impl.javase.VpnSimulatorHooks#dropTheTunnel
vpn.label5=Drop The Tunnel

vpn.item6=com.codename1.impl.javase.VpnSimulatorHooks#makeVpnUnsupported
vpn.label6=Make VPN Unsupported

# API-only items below (no label): for tests and scripts.
vpn.item7=com.codename1.impl.javase.VpnSimulatorHooks#makeVpnSupported
